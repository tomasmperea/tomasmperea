function renderTypeSelector(trip, list){
  $hdr.innerHTML = packingHeader(trip, null, {info:false});
  bindPackingHeader(trip);

  const items = Store.itemsOf(trip.id);
  const ctx = PackingEngine.tripContext(trip, items, {});
  const suggested = ctx.tripType;
  const chosen = PK.selectedType || (list ? list.tipoViaje : suggested);

  const [, toCode] = routeCodes(trip, items);
  const chips = [
    toCode ? `<span class="chip accent">${esc(toCode)}</span>` : "",
    `<span class="chip">${esc(fmtRange(trip.startDate, trip.endDate))}</span>`,
    `<span class="chip">${ctx.days} ${ctx.days===1?"día":"días"}</span>`,
    trip.travelers ? `<span class="chip">${esc(trip.travelers)}</span>` : ""
  ].filter(Boolean).join("");

  const counts = PK.typeCounts || {};
  const rows = PackingEngine.TRIP_TYPES.map(t=>{
    const n = counts[t.key];
    const pressed = chosen === t.key;
    return `<button type="button" aria-pressed="${pressed}" class="${n?"used":""}" data-t="${t.key}">
      ${svg(I[TYPE_ICON[t.key]])} ${esc(t.label)} <span class="n">${n?`${n} ${n===1?"viaje":"viajes"}`:"—"}</span></button>`;
  }).join("");

  const suggestedLabel = TYPE_LABEL[suggested] || suggested;
  const hint = chosen === suggested
    ? `Te propongo <b>${esc(suggestedLabel)}</b>: ${esc(ctx.tripTypeReason || "por el destino y las fechas del viaje.")}${counts[suggested] ? ` Ya usaste ese tipo en ${counts[suggested]} ${counts[suggested]===1?"viaje":"viajes"} anteriores.` : ""}`
    : "";
  const warnBlock = (chosen !== suggested) ? `<div class="notice warn">
      ${svg(I.info)}
      <span class="bd">Con <b>${esc(TYPE_LABEL[chosen])}</b> ${counts[chosen] ? `tengo ${counts[chosen]} ${counts[chosen]===1?"viaje":"viajes"} tuyos de ese tipo` : "arranco casi de cero"}. En <b>${esc(suggestedLabel)}</b> ${counts[suggested] ? `ya tengo ${counts[suggested]}` : "no tengo ninguno"}: ${esc(ctx.tripTypeReason)}
        <button class="act" id="pk-usesugg">Usar ${esc(suggestedLabel)}</button></span>
    </div>` : "";

  $main.innerHTML = `
    <div class="pk-inputs">${chips}</div>
    ${!list ? `<div class="empty" style="padding:24px 20px">
      <h3>Todavía no armaste la valija</h3>
      <p>Te propongo qué llevar según el destino, las fechas, los días que te quedás y lo que agregaste a mano en viajes del mismo tipo. Todo lo que sugiera lo podés sacar.</p>
    </div>` : ""}
    <div class="f">
      <label>Tipo de viaje</label>
      <div class="tp tp3" id="pk-tp">${rows}</div>
      ${hint ? `<span class="hint">${hint}</span>` : ""}
    </div>
    ${warnBlock}
  `;

  $fab.innerHTML = typeSelectorFab(trip, list);

  document.querySelectorAll("#pk-tp [data-t]").forEach(b=>{
    b.onclick = ()=>{ PK.selectedType = b.dataset.t; render(); };
  });
  const useSugg = document.getElementById("pk-usesugg");
  if(useSugg) useSugg.onclick = ()=>{ PK.selectedType = suggested; render(); };

  if(!list){
    const build = document.getElementById("pk-build");
    if(build && Store.canWrite){
      build.onclick = ()=>{ const t = chosen; PK.selectedType = null; runGenerate(trip, t, null); };
    }
  } else {
    const cancel = document.getElementById("pk-canceltype");
    const confirm = document.getElementById("pk-confirmtype");
    if(cancel) cancel.onclick = ()=>{ PK.pickingType = false; PK.selectedType = null; render(); };
    if(confirm && Store.canWrite){
      confirm.onclick = ()=>{ const t = chosen; PK.pickingType = false; PK.selectedType = null; runGenerate(trip, t, list); };
    }
  }

  if(!PK.typeCounts){
    Store.packingHistory(trip.id).then(hist=>{
      const c = {};
      hist.forEach(l=>{ if(l && l.tipoViaje) c[l.tipoViaje] = (c[l.tipoViaje]||0)+1; });
      PK.typeCounts = c;
      if(PK.tripId===trip.id) render();
    });
  }
}

/* ---------- 04/06/07/08/09/10: la lista, en todos sus estados ---------- */
function renderPackingBoard(trip, list){
  const canWrite = Store.canWrite;
  const generating = PK.generating;
  const cap = list.capaInteligente || {};

  const degradedChip = (!generating && (cap.estado==="no-disponible" || cap.estado==="error"))
    ? `<span class="chip">sin ajuste por destino</span>` : "";
  const readonlyChip = !canWrite ? `<span class="chip soon">sólo lectura</span>` : "";

  $hdr.innerHTML = packingHeader(trip, list) + `<div class="hdr-sub">${pkProgHtml(list)}${degradedChip}${readonlyChip}</div>`;
  bindPackingHeader(trip, ()=> sheetPackingInfo(trip, list));

  const destino = trip.destination || "tu destino";

  // 15/16 · el plan pendiente. Si resolvió con la pantalla ya abierta entra por
  // abajo (dock) y no corre la lista bajo el pulgar; si no, arriba de la lista.
  const planPend = canWrite ? planOfrecible(trip.id) : planDe(trip.id);
  const planDock = (canWrite && planPend && App.planDock) ? planPend : null;
  const planArriba = planDock ? null : planPend;

  // 25 · un solo aviso arriba de la lista, siempre. La regla vive en una sola
  // función para que no se rompa sola cuando aparezca el sexto aviso.
  const notices = generating
    ? `<div class="notice"><span class="spin"></span><span class="bd">Buscando lo específico de ${esc(destino)}…</span></div>`
    : packingNotice(trip, list, planArriba);

  const grouped = PackingEngine.groupByCategory(list, {includeDismissed:true});
  const groups = grouped.map(g=> pkCategoryHtml(g, trip, canWrite));
  const destGroupExists = grouped.some(g=>g.key==="destino");

  const skeletonCat = (generating && !destGroupExists) ? `
    <div class="pk-cat" data-open="true">
      <div class="pk-cat-hd">
        <span class="pk-cat-ico">${svg(I.globe)}</span>
        <span class="nm">Específicos de ${esc(destino)}</span>
        <span class="cnt sk" style="width:38px;height:12px;border-radius:5px;display:inline-block"></span>
        ${svg(I.chevd,"chev")}
      </div>
      <div class="pk-body-wrap">
        <div class="pk-row loading"><span class="sk" style="width:52%"></span><span class="sk" style="width:74%"></span></div>
        <div class="pk-row loading"><span class="sk" style="width:41%"></span><span class="sk" style="width:66%"></span></div>
        <div class="pk-row loading"><span class="sk" style="width:58%"></span><span class="sk" style="width:47%"></span></div>
      </div>
    </div>` : "";

  $main.innerHTML = notices + groups.join("") + skeletonCat;

  if(canWrite && !generating){
    $fab.innerHTML = `<div class="fab"><button class="btn primary block" id="pk-additem">${svg(I.plus)} Agregar ítem</button></div>`;
    document.getElementById("pk-additem").onclick = ()=> sheetAddPackingItem(trip, list);
  } else {
    $fab.innerHTML = "";
  }

  pkRenderDock(trip, planDock);

  bindPackingRows($main, trip, list, canWrite);
  bindPackingNotice($main, trip, list);
  bindPackingNotice($pkdock, trip, list);
  pkObserveNew($main);

  const closeFresh = document.getElementById("pk-closefresh");
  if(closeFresh) closeFresh.onclick = ()=>{ PK.justEnriched = false; render(); };
  const retry = document.getElementById("pk-retry");
  if(retry) retry.onclick = ()=> runGenerate(trip, list.tipoViaje, list);
}

/* ---------- 25 · UN SOLO AVISO ARRIBA DE LA LISTA ----------
   Devuelve el HTML del PRIMER aviso que aplique, en este orden:
     1 · la lista quedó vieja (15/24) o el acuse de aplazada (19)
     2 · sin ajuste por destino (08)
     3 · sumé N cosas (18)                — confirmación de lo recién aplicado
     3b· ajusté la lista al destino (07)  — la misma familia que el 3
     4 · hay N que capaz no necesitás (20)
     5 · valija lista (09)
     6 · sólo lectura, cuando no queda nada más que decir

   El plan va PRIMERO, invirtiendo el orden de la tabla del diseño. El motivo:
   `capaInteligente.estado` vive en el documento guardado, así que el aviso
   degradado no se va nunca hasta que se regenere la lista. Siendo permanente
   y estático, bloquearía para siempre a un aviso puntual y accionable. Entre
   "no pude ajustar la lista al destino" —una advertencia sobre la calidad de
   algo que ya está— y "el viaje cambió y tengo tres cosas para sumarte" —una
   acción concreta con fecha— gana la segunda. El costo, asumido: "Probar de
   nuevo" queda un toque más lejos mientras haya un plan sin resolver, y
   vuelve apenas se aplica o se toca "Ahora no", que además es persistente.

   Lo que no se muestra no se pierde: la hoja 12 lista siempre todo lo
   pendiente, y las marcas en las filas son independientes del aviso. */
function packingNotice(trip, list, plan){
  const canWrite = Store.canWrite;
  const cap = list.capaInteligente || {};
  const c = PackingEngine.packingProgress(list);
  const destino = trip.destination || "tu destino";
  const quitar = pkPropuestasQuitar(list);
  const nq = quitar.length;
  const verQuitarSec = nq
    ? `<button class="act sec" data-pk="verquitar">Y hay <b class="n">${nq}</b> que capaz no necesitás. Verlas</button>`
    : "";

  // 1 · la lista quedó vieja (15), o su variante sin acciones (24)
  if(plan){
    const n = plan.nuevos.length;
    if(!canWrite){
      return `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Quedó vieja: el viaje cambió después de que se armó, y hay <b class="n">${n}</b> ${n===1?"cosa":"cosas"} sin sumar. Las puede sumar quien tenga permiso de edición.</span></div>`;
    }
    return `<div class="notice">${svg(I.spark)}<span class="bd">${planAvisoTexto(plan)}
      <span class="acts">
        <button class="act" data-pk="verplan">Ver qué agrego</button>
        <button class="act sec" data-pk="ahorano">Ahora no</button>
      </span></span></div>`;
  }

  // 19 · acuse de "Ahora no", de una sola visita. No queda badge ni insistencia.
  // Ocupa el mismo lugar que el aviso que reemplaza: es la respuesta al gesto
  // que la persona acaba de hacer.
  if(PK.avisoAplazado && canWrite){
    const p = PK.avisoAplazado;
    const n = p.nuevos.length;
    const r = planReserva(p);
    return `<div class="notice">${svg(I.info)}<span class="bd">Listo, no toco nada. ${n===1?`La <b class="n">una</b> cosa`:`Las <b class="n">${n}</b> cosas`}${r?` ${esc(pkDeReserva(r))}`:""} quedan guardadas en <b>De dónde sale esta lista</b>, arriba a la derecha, por si después las querés.
      <span class="acts"><button class="act" data-pk="verplan">Verlas igual</button></span></span></div>`;
  }

  // 2 · sin ajuste por destino
  if(cap.estado==="no-disponible" || cap.estado==="error"){
    return `<div class="notice warn">${svg(I.info)}<span class="bd">Armé la lista con las reglas de siempre. No pude ajustarla a ${esc(destino)}, así que puede faltarte algo del lugar.
      ${canWrite?`<button class="act" id="pk-retry">Probar de nuevo</button>`:""}</span></div>`;
  }

  // 3 · sumé N cosas (18). Cerrar la confirmación ES confirmar (§ 4.3).
  if(PK.applied && canWrite && pkItemsNuevos(list).length){
    const n = PK.appliedN;
    return `<div class="notice ok">${svg(I.check2)}<span class="bd">Sumé <b class="n">${n}</b> ${n===1?"cosa":"cosas"}${PK.appliedReserva?` por <b>${esc(PK.appliedReserva)}</b>`:""}. Quedan marcadas hasta que las mires.
      <span class="acts"><button class="act sec" data-pk="vistas">Listo, ya las vi</button>${verQuitarSec}</span></span>
      <button class="x" aria-label="Cerrar" data-pk="vistas">${svg(I.x)}</button></div>`;
  }

  // 3b · ajusté la lista al destino (07). Único texto existente que cambia:
  // cuando la misma pasada además propuso sacar, suma la segunda acción.
  if(PK.justEnriched && cap.estado==="ok"){
    return `<div class="notice ok">${svg(I.spark)}<span class="bd">${esc(cap.nota||"Ajusté la lista al destino.")}
      ${verQuitarSec?`<span class="acts">${verQuitarSec}</span>`:""}</span>
      <button class="x" aria-label="Cerrar" id="pk-closefresh">${svg(I.x)}</button></div>`;
  }

  // 4 · hay N que capaz no necesitás (20). Se cierra por visita, no para
  // siempre: es un localizador, y las marcas siguen en las filas.
  if(nq && !PK.hideRemovals){
    return `<div class="notice warn">${svg(I.ban)}<span class="bd">Hay <b class="n">${nq}</b> ${nq===1?"cosa":"cosas"} de la lista que capaz no necesitás en ${esc(destino)}.
      <button class="act" data-pk="verquitar">Ver ${nq===1?"cuál":"cuáles"}</button></span>
      <button class="x" aria-label="Cerrar" data-pk="cerrarquitar">${svg(I.x)}</button></div>`;
  }

  // 5 · valija lista (09)
  if(c.total>0 && c.pendientes===0){
    const typeLbl = (TYPE_LABEL[list.tipoViaje]||"").toLowerCase();
    return `<div class="notice ok">${svg(I.check2)}<span class="bd">Valija lista.${c.descartados?` Los ${c.descartados} que descartaste ya quedaron anotados para tu próximo viaje${typeLbl?` de ${typeLbl}`:""}.`:""}</span></div>`;
  }

  // 6 · sólo lectura
  if(!canWrite){
    return `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Para marcar lo tuyo necesitás permiso de edición.</span></div>`;
  }
  return "";
}

/* ---------- 16 · el aviso anclado al pie ----------
   Sólo se reescribe cuando cambia de verdad: #pkdock es la región viva y
   volver a pintarla en cada render la haría anunciarse una y otra vez. */
function pkRenderDock(trip, plan){
  const firma = plan ? `${trip.id}|${planFirma(plan)}` : "";
  if($pkdock.dataset.firma === firma) return;
  $pkdock.dataset.firma = firma;
  $pkdock.innerHTML = plan ? `<div class="pk-dock"><div class="notice">${svg(I.spark)}<span class="bd">${planAvisoTexto(plan)}
    <span class="acts">
      <button class="act" data-pk="verplan">Ver qué agrego</button>
      <button class="act sec" data-pk="ahorano">Ahora no</button>
    </span></span></div></div>` : "";
}

/* ---------- las acciones de los avisos, en cualquiera de sus dos anclajes ---------- */
function bindPackingNotice(root, trip, list){
  if(!root) return;
  root.querySelectorAll("[data-pk]").forEach(b=> b.onclick = ()=>{
    const a = b.dataset.pk;
    const plan = planDe(trip.id) || PK.avisoAplazado;
    if(a==="verplan"){ if(plan) sheetPackingPlan(trip, plan); return; }
    if(a==="ahorano"){ if(plan) aplazarPlan(trip, plan); return; }
    if(a==="vistas"){ pkDarPorVistas(trip); return; }
    if(a==="verquitar"){ sheetPackingRemovals(trip); return; }
    if(a==="cerrarquitar"){ PK.hideRemovals = true; render(); return; }
  });
}

/* ---------- despachador de estados ---------- */
function renderPacking(trip){
  resetPKIfNeeded(trip.id);
  const list = Store.packingOf(trip.id);
  const hasDates = !!(trip.startDate && trip.endDate);

  if(!list && !hasDates && !PK.pickingType){ pkRenderDock(trip, null); renderPackingBlocked(trip); return; }
  if((!list && hasDates) || PK.pickingType){ pkRenderDock(trip, null); renderTypeSelector(trip, list); return; }
  // Acá ya hay viaje y hay lista: es el único punto donde se puede saber si la
  // lista quedó vieja sin datos a medio llegar. El propio recálculo se cuida de
  // correr una sola vez por viaje y por sesión.
  recalcularPlanAlEntrar(trip.id);
  renderPackingBoard(trip, list);
}

const $modal = document.getElementById("modal");
function closeSheet(){ $modal.innerHTML = ""; }
function openSheet(title, bodyHtml, footHtml){
  $modal.innerHTML = `
    <div class="scrim" id="scrim">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="sheet-hd">
          <h2>${esc(title)}</h2>
          <button class="iconbtn" id="closeSheet" aria-label="Cerrar">${svg(I.x)}</button>
        </div>
        <div class="sheet-bd">${bodyHtml}</div>
        ${footHtml?`<div class="sheet-ft">${footHtml}</div>`:""}
      </div>
    </div>`;
  document.getElementById("closeSheet").onclick = closeSheet;
  document.getElementById("scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeSheet(); });
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

function toast(msg, err){
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="toast ${err?"err":""}">${esc(msg)}</div>`;
  setTimeout(()=>{ t.innerHTML=""; }, err?4200:2600);
}
const val = id => (document.getElementById(id)?.value || "").trim();

/* ---------- viaje ---------- */
function sheetTrip(trip){
  const t = trip || {id:uid(), hue: Math.floor(Math.random()*360)};
  openSheet(trip?"Editar viaje":"Nuevo viaje", `
    <div class="f req"><label for="t_name">Nombre del viaje</label>
      <input id="t_name" value="${esc(t.name||"")}" placeholder="Vacaciones en el sur" autocomplete="off"></div>
    <div class="f"><label for="t_dest">Destino principal</label>
      <input id="t_dest" value="${esc(t.destination||"")}" placeholder="Bariloche" autocomplete="off">
      <span class="hint">Se usa en la etiqueta de la valija y en el PDF.</span></div>
    <div class="f2">
      <div class="f"><label for="t_from">Salida</label><input id="t_from" type="date" value="${esc(dayKey(t.startDate))}"></div>
      <div class="f"><label for="t_to">Regreso</label><input id="t_to" type="date" value="${esc(dayKey(t.endDate))}"
        ${t.startDate?`min="${esc(addDays(t.startDate,1))}"`:""}></div>
    </div>
    <div class="f"><label for="t_people">Quiénes viajan</label>
      <input id="t_people" value="${esc(t.travelers||"")}" placeholder="Tomás, Ana y Juli" autocomplete="off"></div>
    <div class="f"><label for="t_notes">Notas</label>
      <textarea id="t_notes" placeholder="Presupuesto, ideas, links sueltos...">${esc(t.notes||"")}</textarea></div>
    ${trip?`<hr class="hr"><button class="btn danger block" id="deltrip">${svg(I.trash)} Eliminar este viaje</button>`:""}
  `, `
    <button class="btn ghost" id="cancel">Cancelar</button>
    <button class="btn primary" id="save">Guardar</button>
  `);

  document.getElementById("cancel").onclick = closeSheet;
  // Elegir la salida limita el calendario de regreso ahí mismo: es mejor que el
  // día inválido no se pueda elegir, a explicar después por qué no sirve.
  const fIni = document.getElementById("t_from"), fFin = document.getElementById("t_to");
  if(fIni && fFin) fIni.onchange = ()=>{
    if(!fIni.value){ fFin.removeAttribute("min"); return; }
    fFin.min = addDays(fIni.value, 1);
    if(fFin.value && fFin.value <= fIni.value) fFin.value = "";
  };
  document.getElementById("save").onclick = async ()=>{
    const name = val("t_name");
    if(!name){ toast("Poné un nombre al viaje", true); return; }
    const from = val("t_from"), to = val("t_to");
    if(from && to && to <= from){ toast("El regreso tiene que ser después de la salida", true); return; }
    try{
      await Store.saveTrip({...t, name, destination:val("t_dest"),
        startDate:from, endDate:to, travelers:val("t_people"), notes:val("t_notes"), sample:t.sample||false});
      closeSheet();
      if(!trip) go(`#/trip/${t.id}`);
      toast(trip?"Viaje actualizado":"Viaje creado");
    }catch(e){ toast(writeErr(e), true); }
  };
  const dl = document.getElementById("deltrip");
  if(dl) dl.onclick = async ()=>{
    dl.disabled = true;
    try{ await Store.delTrip(t.id); closeSheet(); go(""); toast("Viaje eliminado"); }
    catch(e){ dl.disabled = false; toast(writeErr(e), true); }
  };
}

function writeErr(e){
  if(e && e.code === "invalid_argument") return "Tenés acceso de sólo lectura a esta valija";
  if(e && e.code === "quota_exceeded") return "La valija llegó a su límite de reservas";
  // Quedó guardado en este teléfono aunque no haya podido sincronizar: decirlo
  // evita que la persona cargue todo de nuevo pensando que se perdió.
  return "Guardado en este dispositivo. No se pudo sincronizar todavía";
}

  const collect = ()=>{
    const g = id => document.getElementById(id)?.value?.trim();
    const up = id => (g(id)||"").toUpperCase();
    if(document.getElementById("i_title")!==null){
      it.title = g("i_title"); it.start = g("i_start"); it.end = g("i_end");

  if(di) di.onclick = async ()=>{
    di.disabled = true;
    try{
      await Store.delItem(trip.id, it.id); closeSheet(); toast("Reserva eliminada");
      checkPackingPlan(trip);
    }
    catch(e){ di.disabled = false; toast(writeErr(e), true); }
  };
}

const MAX_FILE_MB = 15;
const MAX_FILE_BYTES = MAX_FILE_MB*1024*1024;

function fmtSize(bytes){
  if(bytes==null) return "";
  if(bytes < 1024*1024) return `${Math.round(bytes/1024)} KB`;
  return `${(bytes/1024/1024).toFixed(1).replace(".",",")} MB`;
}
function kindIcon(kind){ return kind==="img" ? "img" : "doc"; }
function kindThumbCls(kind){ return kind==="pdf" ? "pdf" : (kind==="img" ? "img" : ""); }

/** Prompt para el camino legado de texto pegado (el <details> del estado 01).
    ImportEngine sólo interpreta imágenes/PDF; el texto se resuelve acá mismo,
    reusando parseImportResponse/friendlyModelError para quedar consistente. */
function buildTextImportPrompt(trip, text){
  const hoy = new Date().toISOString().slice(0,10);
  return [
    "Extraés datos de reservas de viaje a partir de un texto y devolvés SOLO JSON, sin texto alrededor.",
    "",
    "Texto de la confirmación:",
    '"""', String(text).slice(0,12000), '"""',
    "",
    `Contexto: el viaje se llama "${trip.name||""}"${trip.destination?`, destino ${trip.destination}`:""}${trip.startDate?`, entre ${trip.startDate} y ${trip.endDate||"?"}`:""}. Hoy es ${hoy}.`,
    "",
    "Devolvé este JSON exacto:",
    '{"items":[{',
    '"type":"flight|stay|car|transfer|act|note",',
    '"title":"texto corto y humano, ej: Buenos Aires → Madrid",',
    '"start":"YYYY-MM-DDTHH:mm o vacío",',
    '"end":"YYYY-MM-DDTHH:mm o vacío",',
    '"from":"IATA de 3 letras si es vuelo, si no ciudad o lugar",',
    '"to":"idem",',
    '"provider":"aerolínea, hotel, plataforma o rentadora",',
    '"flightNumber":"","confirmation":"","seat":"","terminal":"","gate":"",',
    '"boardingTime":"HH:mm o vacío",',
    '"address":"","phone":"","cost":"","currency":"","notes":""',
    "}]}",
    "",
    "Reglas: un objeto por reserva; ida y vuelta son DOS vuelos separados. Usá 24 horas. Si un dato no aparece, dejá \"\" (nunca inventes códigos ni horarios). Para alojamiento, start es el check-in y end el check-out. Si el año no figura, deducilo del contexto del viaje."
  ].join("\n");
}
function interpretPastedText(text, name, opts){
  if(typeof opts.callModel !== "function"){
    return Promise.resolve({archivo:name, estado:"error", reservas:[],
      error:{codigo:"ia-no-disponible", mensaje:"La lectura automática no está disponible ahora mismo."}, paginas:null});
  }
  const prompt = buildTextImportPrompt(opts.trip||{}, text);
  return Promise.resolve()
    .then(()=> opts.callModel(prompt, {}))
    .then(raw=>{
      const reservas = ImportEngine.parseImportResponse(raw).map(r=> Object.assign({}, r, {archivo:name}));
      return {archivo:name, estado: reservas.length?"ok":"vacio", reservas, error:null, paginas:null};
    })
    .catch(e=> ({archivo:name, estado:"error", reservas:[], error:ImportEngine.friendlyModelError(e), paginas:null}));
}

      Quien mira este viaje sin permiso de edición no puede importar reservas. Pedile a quien te compartió el link que te dé permiso para cargar.</span></div>`,
    `<button class="btn block" id="im-close">Cerrar</button>`);

async function sheetImport(trip){
  if(!Store.canWrite){ renderImportReadOnly(); return; }

  let sample = null;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  const callModel = sample ? (prompt, opts) => sample.json(prompt, {...(opts||{}), modelTier:"complex"}) : null;
  if(!callModel){ renderImportNoAi(); return; }

  /* ---------- qué puede ESTA vista, ANTES de dibujar la pantalla ----------
     El 11/09 el PM subió tres archivos desde su teléfono y los tres fallaron
     con "Esta vista no acepta imágenes": subió, esperó, y recién ahí se
     enteró. `sample.limits()` lo dice de antemano, es local y no gasta nada
     (contrato 0.2.41), así que se pregunta UNA vez al abrir la hoja y la
     pantalla se dibuja ofreciendo sólo lo que puede funcionar.

     La misma función memoizada se le inyecta después al motor: una sola
     llamada real por apertura de la hoja, aunque se suban seis archivos.

     Si la plataforma no expone `limits` no se inyecta nada: el motor
     responde `certeza:"desconocida"` y se ofrece todo como antes del
     cambio. No sabemos, y no se inventa. */
  let limitsOnce = null;
  const viewLimits = (sample && typeof sample.limits === "function")
    ? () => (limitsOnce || (limitsOnce = Promise.resolve().then(()=> sample.limits())))
    : null;
  const caps = await ImportEngine.getViewCapabilities(viewLimits);   // nunca rechaza
  const sinImagenes = caps.certeza === "no";   // "desconocida" NO cambia nada

  // Estado de la hoja: nada de esto toca `Store` hasta el guardado final
  // (el botón "Guardar" de la pantalla de revisión). Eso incluye las
  // decisiones de completar un vuelo (`pendingMatches`): se acumulan acá
  // mientras se resuelve la cola de coincidencias, y recién se escriben
  // junto con el resto del lote. Cancelar en cualquier punto —incluso
  // después de haber elegido "Completar vuelo" para alguna tarjeta de
  // embarque— no deja nada escrito, porque hasta ese momento todo vive
  // sólo en este objeto.
  const st = {
    queue:[], pastedText:"", sources:[],
    archivos:[], reviewList:[], matchQueue:[], pendingMatches:[],
    matchDone:0, savedTotal:0, acceptPartial:null
  };
  const tripCtx = ()=> ({name:trip.name, destination:trip.destination, startDate:trip.startDate, endDate:trip.endDate});
  // Marca viva: mientras exista en el DOM, esta hoja sigue siendo la que se
  // ve. Si el visitante cerró/navegó a otro lado, una promesa que resuelve
  // tarde no debe reabrir ni pisar un modal ajeno.
  const alive = ()=> !!document.getElementById("imp-live");
  const marker = `<span id="imp-live" hidden></span>`;

  function makeCard(reserva, chip, meta){ return {id:uid(), reserva, chip, meta:meta||{}}; }

  function runOne(source){
    /* Las cuatro funciones que el motor v2 necesita. El motor nunca llama a
       `claude.use` ni importa pdf.js: las recibe de acá.
         · extractPdfText    — el camino bueno: un PDF con capa de texto se
                               interpreta SIN imágenes y sin mirar limits().
         · renderPdfToImages — el último recurso, sólo si la vista acepta.
         · limits            — para que el motor sepa si puede. `null` si la
                               plataforma no lo expone: degrada a "no sé". */
    const opts = {
      callModel,
      limits: viewLimits,
      extractPdfText: b=>ImportEngine.extractPdfText(b),
      renderPdfToImages: b=>ImportEngine.renderPdfPagesToImages(b),
      trip:tripCtx()
    };
    const p = source.kind==="texto"
      ? interpretPastedText(source.text, source.name, opts)
      : ImportEngine.interpretFile({name:source.name, blob:source.blob, mimeType:source.mimeType}, opts);
    return p.then(result=>{
      result.kind = source.kind;
      const idx = st.archivos.findIndex(a=>a.archivo===result.archivo);
      if(idx>=0) st.archivos[idx] = result; else st.archivos.push(result);
      return result;
    });
  }

  function classifyAndQueue(reservas, ctx){
    const existentes = Store.itemsOf(trip.id);
    const assignPage = ctx && ctx.kind==="pdf" && ctx.paginas>1 && reservas.length===ctx.paginas;
    reservas.forEach((r,i)=>{
      const meta = { archivo:r.archivo||(ctx&&ctx.archivo)||"", kind:(ctx&&ctx.kind)||"img", page:assignPage?(i+1):null };
      if(r.type==="flight"){
        const m = ImportEngine.matchAgainstExisting(r, existentes);
        if(m.resultado==="nuevo") st.reviewList.push(makeCard(r,"Vuelo",meta));
        else st.matchQueue.push({reserva:r, match:m, meta});
      } else {
        st.reviewList.push(makeCard(r, TYPES[r.type]?.label || "Nota", meta));
      }
    });
  }

  /* Si el selector no se abre, la persona se queda sin saber qué pasó y el
     botón parece roto. No lo podemos preguntar: lo medimos. Abrir el selector
     le saca el foco a la página en todos los navegadores; si después de tocar
     el foco nunca se fue y tampoco llegó ningún archivo, no se abrió nada.
     Entonces lo decimos y ofrecemos la vía que sí funciona siempre. */
  function avisarSelectorMudo(){
    const caja = document.getElementById("im-nopick");
    if(!caja || !caja.hidden) return;
    caja.hidden = false;
    caja.innerHTML = `<div class="notice warn">${svg(I.info)}<span class="bd">No se abrió el selector de archivos. Es un problema del navegador, no tuyo, y quiero saberlo: contámelo. Mientras tanto, pegá abajo el texto de la confirmación y lo interpreto igual.</span></div>`;
    const det = document.querySelector(".imp-more");
    if(det) det.open = true;
  }

  function wireFileInput(id, forcedKind){
    const input = document.getElementById(id);
    if(!input) return;
    const boton = document.querySelector(`[data-pick="${id}"]`);
    if(boton) boton.onclick = ()=>{
      let seFue = false;
      const salio = ()=>{ seFue = true; };
      window.addEventListener("blur", salio, {once:true});
      document.addEventListener("visibilitychange", salio, {once:true});
      input.click();
      setTimeout(()=>{
        window.removeEventListener("blur", salio);
        document.removeEventListener("visibilitychange", salio);
        if(!seFue && !(input.files && input.files.length) && alive()) avisarSelectorMudo();
      }, 1500);
    };
    input.onchange = ()=>{
      Array.from(input.files||[]).forEach(file=>{
        const engineKind = ImportEngine.fileKind({name:file.name, mimeType:file.type});
        const kind = forcedKind || (engineKind==="pdf" ? "pdf" : "img");
        const invalid = !forcedKind && engineKind==="desconocido";
        const big = file.size > MAX_FILE_BYTES;
        // El `accept` del input es una sugerencia que varios selectores
        // ignoran: si igual entró una imagen en una vista que no las lee, se
        // dice acá, en la cola, antes de subir nada.
        const noLeible = sinImagenes && (engineKind==="imagen" || kind==="img");
        st.queue.push({id:uid(), name:file.name, mimeType:file.type, blob:file, size:file.size, kind, big, invalid, noLeible});
      });
      input.value = "";
      renderElegir();
    };
  }
  function queueRowHtml(f){
    const cls = kindThumbCls(f.kind), icon = kindIcon(f.kind);
    let meta;
    if(f.big) meta = `<span class="meta err">Pesa ${fmtSize(f.size)}, más de lo que puedo leer (máx. ${MAX_FILE_MB} MB). Elegí otro archivo o sacá la foto de nuevo con menos calidad.</span>`;
    else if(f.invalid) meta = `<span class="meta err">No reconozco este tipo de archivo. Subí una foto (PNG o JPG) o un PDF.</span>`;
    else if(f.noLeible) meta = `<span class="meta err">Acá no se pueden leer imágenes. Subí el PDF del comprobante, o pegá abajo el texto del correo.</span>`;
    else meta = `<span class="meta">${fmtSize(f.size)}</span>`;
    return `<div class="imp-file ${(f.big||f.invalid||f.noLeible)?"err":""}">
      <span class="imp-thumb ${cls}">${svg(I[icon])}</span>
      <span class="bd"><span class="nm">${esc(f.name)}</span>${meta}</span>
      <button class="rm" aria-label="Sacar ${esc(f.name)}" data-rmq="${f.id}">${svg(I.x)}</button>
    </div>`;
  }
  /* ---------- 01/02: elegir de dónde sale el documento ----------
     Dos pantallas, no una. Cuál se dibuja lo decide `caps`, que ya se
     preguntó antes de abrir la hoja:

       · certeza "si" o "desconocida" → todo como siempre: cámara, galería
         y archivo. "No sé" nunca saca nada de la pantalla.
       · certeza "no" → la cámara y la galería no se ofrecen, porque acá no
         funcionan. En su lugar queda, dicho de entrada y no después de
         subir y esperar, lo que sí funciona: el PDF del comprobante (se lee
         su texto) y pegar el texto del correo, que nunca dependió de
         imágenes. */
  function pickerHtml(){
    if(sinImagenes) return `
      <div class="f">
        <label>Cómo lo cargás</label>
        <div class="tp imp-pick">
          <button type="button" class="tpbtn" data-pick="im_doc">${svg(I.doc)} Subir el PDF <span class="n">del comprobante</span></button>
          <input id="im_doc" type="file" accept="${esc(caps.accept)}" multiple>
        </div>
        <span class="hint">Podés subir varios PDF a la vez. Un PDF escaneado —el que por dentro es una foto— tampoco se puede leer acá: esa reserva cargala a mano desde <b>Agregar</b>.</span>
        <div id="im-nopick" hidden></div>
      </div>`;
    return `
      <div class="f">
        <label>Cómo lo cargás</label>
        <div class="tp tp3 imp-pick">
          <button type="button" class="tpbtn" data-pick="im_cam">${svg(I.cam)} Sacar foto <span class="n">con la cámara</span></button>
          <button type="button" class="tpbtn" data-pick="im_gal">${svg(I.gallery)} Galería <span class="n">fotos y capturas</span></button>
          <button type="button" class="tpbtn" data-pick="im_doc">${svg(I.doc)} Archivo <span class="n">PDF o imagen</span></button>
          <input id="im_cam" type="file" accept="image/*" capture="environment">
          <input id="im_gal" type="file" accept="image/*" multiple>
          <input id="im_doc" type="file" accept="${esc(caps.accept)}" multiple>
        </div>
        <span class="hint">Podés elegir varios a la vez, y combinar fotos con PDF en la misma carga.</span>
        <div id="im-nopick" hidden></div>
      </div>`;
  }
  /* El aviso de arriba. `caps.nota` viene del motor (una sola fuente de
     verdad para el texto de la restricción) y acá se le agrega la segunda
     salida, que es de la pantalla: pegar el texto. */
  function avisoCapsHtml(){
    if(sinImagenes) return `
      <div class="notice warn" id="im-caps">${svg(I.info)}
        <span class="bd">${esc(caps.nota)} Una foto o una captura no se pueden interpretar en esta vista, así que te lo digo antes de que subas nada. Si no tenés el PDF, pegá el texto del correo acá abajo: eso funciona siempre.</span>
      </div>`;
    return `
      <div class="notice" id="im-caps">${svg(I.spark)}
        <span class="bd">Sacale una foto al voucher, subí la captura del mail o el PDF del pasaje. Te muestro lo que encuentro antes de guardar nada.</span>
      </div>`;
  }
  function renderElegir(){
    const validCount = st.queue.filter(f=>!f.big && !f.invalid && !f.noLeible).length;
    const body = `${marker}
      ${avisoCapsHtml()}
      ${pickerHtml()}
      ${st.queue.length ? `
      <div class="f">
        <label>Vas a interpretar</label>
        <div class="imp-files">${st.queue.map(queueRowHtml).join("")}</div>
      </div>` : ""}
      <details class="imp-more" ${(st.pastedText||sinImagenes)?"open":""}>
        <summary>${sinImagenes?"Pegar el texto del correo":"Pegar el texto en cambio"}</summary>
        <div class="f">
          <label for="im_text">Texto de la confirmación</label>
          <textarea id="im_text" class="mono" placeholder="Tu reserva está confirmada&#10;Vuelo G3 1234 · EZE → GIG&#10;20 de septiembre, 06:40&#10;Código: K7QXPL">${esc(st.pastedText)}</textarea>
          <span class="hint">Podés pegar varias reservas juntas. Las separo yo.</span>
        </div>
      </details>`;
    const canInterpret = validCount>0 || st.pastedText.trim().length>0;
    const footer = `<button class="btn ghost" id="im-cancel">Cancelar</button>
      <button class="btn primary" id="im-run" ${canInterpret?"":"disabled"}>${svg(I.spark)} ${validCount?`Interpretar ${validCount} ${validCount===1?"archivo":"archivos"}`:"Interpretar"}</button>`;
    openSheet("Importar reservas", body, footer);
    document.getElementById("im-cancel").onclick = closeSheet;
    wireFileInput("im_cam","img"); wireFileInput("im_gal","img"); wireFileInput("im_doc",null);
    document.querySelectorAll("[data-rmq]").forEach(b=>{
      b.onclick = ()=>{ st.queue = st.queue.filter(f=>f.id!==b.dataset.rmq); renderElegir(); };
    });
    const ta = document.getElementById("im_text");
    ta.oninput = ()=>{
      st.pastedText = ta.value;
      const btn = document.getElementById("im-run");
      if(btn) btn.disabled = !(validCount>0 || ta.value.trim());
    };
    document.getElementById("im-run").onclick = startInterpret;
  }
  function startInterpret(){
    const fileSources = st.queue.filter(f=>!f.big && !f.invalid && !f.noLeible)
      .map(f=>({name:f.name, mimeType:f.mimeType, blob:f.blob, kind:f.kind}));
    const sources = fileSources.slice();
    if(st.pastedText && st.pastedText.trim()) sources.push({name:"Texto pegado", kind:"texto", text:st.pastedText.trim()});
    if(!sources.length) return;
    st.sources = sources;
    runInterpretation(sources);
  }

  /* ---------- 03: leyendo, archivo por archivo ---------- */
  function rowHtml(r){
    const cls = kindThumbCls(r.kind), icon = kindIcon(r.kind);
    let meta;
    if(r.status==="queued") meta = `<span class="meta"><span class="imp-dot"></span> En cola</span>`;
    else if(r.status==="leyendo") meta = `<span class="meta"><span class="spin"></span> Leyendo…</span>`;
    else if(r.status==="ok") meta = `<span class="meta ok">${svg(I.check2)} Listo · ${r.found} ${r.found===1?"reserva encontrada":"reservas encontradas"}${r.modo==="texto"&&r.kind==="pdf"?" · leído del texto del PDF":""}</span>`;
    else if(r.status==="vacio") meta = `<span class="meta info">${svg(I.info)} Listo · no encontré ninguna reserva</span>`;
    else meta = `<span class="meta err">${svg(I.info)} No se pudo leer</span>`;
    return `<div class="imp-file" id="${r.rowId}">
      <span class="imp-thumb ${cls}">${svg(I[icon])}</span>
      <span class="bd"><span class="nm">${esc(r.name)}</span>${meta}</span>
    </div>`;
  }
  function renderLeyendo(rows){
    const body = `${marker}
      <div class="notice"><span class="spin"></span><span class="bd">Leyendo ${rows.length} ${rows.length===1?"archivo":"archivos"}…</span></div>
      <div class="imp-files">${rows.map(rowHtml).join("")}</div>
      <div id="im-slow"></div>`;
    openSheet("Importar reservas", body, `<button class="btn ghost block" id="im-cancelall">Cancelar todo</button>`);
    document.getElementById("im-cancelall").onclick = closeSheet;
  }
  function updateRow(r){
    const el = document.getElementById(r.rowId);
    if(el) el.outerHTML = rowHtml(r);
  }
  function showSlowNotice(){
    const el = document.getElementById("im-slow");
    if(!el) return;
    el.innerHTML = `<div class="notice warn">${svg(I.info)}<span class="bd">Che, esto está tardando más de lo normal. Las fotos con poca luz y los PDF pesados tardan más en leerse.
      <button class="act" id="im-acceptpartial">Quedarme con lo que ya está listo</button></span></div>`;
    const b = document.getElementById("im-acceptpartial");
    if(b) b.onclick = ()=>{ if(st.acceptPartial) st.acceptPartial(); };
  }
  function runInterpretation(sources){
    const rows = sources.map((s,i)=>({rowId:`im-row-${i}-${uid()}`, name:s.name, kind:s.kind, status:"queued", found:0}));
    renderLeyendo(rows);
    let doneCount = 0, finished = false;
    const slowTimer = setTimeout(()=>{ if(!finished && alive()) showSlowNotice(); }, 7000);
    function finishRun(){ if(finished) return; finished = true; clearTimeout(slowTimer); advance(); }
    st.acceptPartial = finishRun;
    sources.forEach((s,i)=>{
      rows[i].status = "leyendo";
      if(alive()) updateRow(rows[i]);
      runOne(s).then(result=>{
        doneCount++;
        rows[i].status = result.estado; rows[i].found = result.reservas.length;
        rows[i].modo = result.modo;   // "texto" | "imagenes": de dónde salió (§4.5 del diseño)
        if(alive()) updateRow(rows[i]);
        classifyAndQueue(result.reservas, {archivo:result.archivo, kind:result.kind, paginas:result.paginas});
        if(doneCount>=sources.length) finishRun();
      });
    });
  }
  function advance(){
    if(!alive()) return;
    const totalReservas = st.archivos.reduce((n,a)=>n+a.reservas.length,0);
    if(totalReservas===0 && !st.reviewList.length && !st.matchQueue.length) renderTotalEmpty();
    else proceed();
  }
  function proceed(){
    if(!alive()) return;
    if(st.matchQueue.length){ renderMatchStep(); return; }
    // Un lote sólo de coincidencias de vuelo (sin reservas nuevas ni archivos
    // con problemas) también pasa por la revisión final: ahí vive el único
    // botón que de verdad escribe, y el único punto donde cancelar todavía
    // sirve para no dejar nada aplicado.
    if(st.reviewList.length || st.pendingMatches.length || st.archivos.some(a=>a.estado!=="ok")){ renderReview(); return; }
    finish();
  }

  /* ---------- 10: ninguno aportó nada ---------- */
  function bindIssuesActions(){
    document.querySelectorAll("[data-retry]").forEach(b=>{
      b.onclick = ()=>{
        const source = st.sources.find(s=>s.name===b.dataset.retry);
        if(source) runInterpretation([source]);
      };
    });
    document.querySelectorAll("[data-rmfile]").forEach(b=>{
      b.onclick = ()=>{ st.archivos = st.archivos.filter(a=>a.archivo!==b.dataset.rmfile); proceed(); };
    });
  }
  function renderTotalEmpty(){
    if(!alive()) return;
    const n = st.archivos.length;
    const errCount = st.archivos.filter(a=>a.estado==="error").length;
    const vacioCount = n - errCount;
    let detalle;
    if(errCount && vacioCount) detalle = "Uno o más no se pudieron leer y los demás se leyeron bien pero no tenían pinta de reserva de viaje.";
    else if(errCount) detalle = n===1 ? "No se pudo leer." : "Ninguno se pudo leer.";
    else detalle = n===1 ? "Se leyó bien, pero no tenía pinta de reserva de viaje." : "Se leyeron bien, pero no tenían pinta de reserva de viaje.";
    const body = `${marker}
      <div class="empty">
        <h3>No conseguí ninguna reserva de ${n===1?"este archivo":`estos ${n} archivos`}</h3>
        <p>${detalle} El detalle de cada uno está abajo.</p>
      </div>
      ${issuesListHtml(st.archivos)}`;
    const footer = `<button class="btn ghost" id="im-manual">Cargar a mano</button>
      ${errCount?`<button class="btn primary" id="im-retryall">Reintentar ${errCount} ${errCount===1?"archivo":"archivos"}</button>`:""}`;
    openSheet("Importar reservas", body, footer);
    document.getElementById("im-manual").onclick = ()=>{ closeSheet(); sheetItem(trip, null); };
    const retryAll = document.getElementById("im-retryall");
    if(retryAll) retryAll.onclick = ()=>{
      const errNames = new Set(st.archivos.filter(a=>a.estado==="error").map(a=>a.archivo));
      const errSources = st.sources.filter(s=>errNames.has(s.name));
      if(errSources.length) runInterpretation(errSources);
    };
    bindIssuesActions();
  }

  /* ---------- 06/07/07B: tarjeta de embarque ---------- */
  function renderMatchStep(){
    if(!alive() || !st.matchQueue.length) return;
    const step = st.matchQueue[0];
    if(step.match.resultado==="mismo") renderMatchMismo(step);
    else renderMatchAmbiguo(step);
  }
  function srcChipForMeta(meta){
    if(!meta || !meta.archivo) return "";
    return `<span class="chip src">${svg(I[kindIcon(meta.kind)])}${esc(meta.archivo)}</span>`;
  }
  function flightLineHtml(f){
    const parts = [];
    if(f.provider) parts.push(esc(f.provider));
    if(f.flightNumber) parts.push(esc(f.flightNumber));
    let line = parts.join(" ");
    if(f.start) line += `${line?" · ":""}sale ${esc(fmtDateLong(f.start))}${fmtTime(f.start)?` ${esc(fmtTime(f.start))}`:""}`;
    return line || "Vuelo";
  }
  function renderMatchMismo(step){
    const {reserva, match, meta} = step;
    const ex = match.existente;
    const patchFields = [["gate","Puerta"],["terminal","Terminal"],["seat","Asiento"],["boardingTime","Embarque"]]
      .filter(([k])=> match.patch[k]);
    const title = reserva.flightNumber
      ? `Vuelo ${esc(reserva.flightNumber)}${reserva.start?`, ${esc(fmtDateLong(reserva.start))}`:""}`
      : "Tarjeta de embarque";
    const body = `${marker}
      <div class="imp-card">
        <div class="imp-card-hd">
          <span class="pass-icon">${svg(TYPES.flight.icon)}</span>
          <span class="ttl">
            <span style="font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:-.005em">${title}</span>
            <span class="imp-src"><span class="chip accent">Tarjeta de embarque</span>${srcChipForMeta(meta)}</span>
          </span>
        </div>
        <div class="imp-card-bd">
          <div class="f">
            <label>Ya tenías cargado</label>
            <div class="imp-existing">
              <span class="pass-icon">${svg(TYPES.flight.icon)}</span>
              <span class="info">
                <span class="pass-title">${esc(ex.title||"Vuelo")}</span>
                <span class="pass-when">${esc(flightLineHtml(ex))}</span>
              </span>
            </div>
          </div>
          ${patchFields.length?`
          <div class="f">
            <label>Se completa con</label>
            <div class="imp-diff">
              ${patchFields.map(([k,label])=>`<div class="field"><span class="k">${esc(label)}</span><span class="v">${esc(match.patch[k])}</span></div>`).join("")}
            </div>
          </div>`:""}
          <p class="tiny muted" style="margin:0">${esc(match.motivo)}</p>
        </div>
      </div>`;
    openSheet("Importar reservas", body, `
      <button class="btn ghost" id="im-asnew">Cargar como nuevo</button>
      <button class="btn primary" id="im-complete">${svg(I.check2)} Completar vuelo</button>`);
    document.getElementById("im-asnew").onclick = ()=>{
      st.matchQueue.shift();
      st.reviewList.push(makeCard(reserva, "Tarjeta de embarque", meta));
      proceed();
    };
    document.getElementById("im-complete").onclick = ()=>{
      // No se escribe acá: la decisión se acumula y se aplica recién con el
      // guardado final, junto con el resto del lote (ver comentario de `st`
      // más arriba). Si la persona cancela después de este toque, esto no
      // queda escrito en ningún lado.
      st.pendingMatches.push({existente:ex, patch:match.patch});
      st.matchQueue.shift();
      proceed();
    };
  }
  function renderMatchAmbiguo(step){
    const {reserva, match, meta} = step;
    const cand = match.candidatos;
    let selected = null;
    const body = `${marker}
      <div class="notice warn">${svg(I.info)}
        <span class="bd">${esc(match.motivo)} ¿A cuál corresponde?</span>
      </div>
      <div class="imp-choice" id="im-choice">
        ${cand.map((c,i)=>`
          <button type="button" aria-pressed="false" data-c="${i}">
            <span class="radio"></span>
            <span class="info"><span class="t">${esc(c.title||"Vuelo")}</span>
              <span class="s">${esc(flightLineHtml(c))}</span></span>
          </button>`).join("")}
        <div class="sep">o</div>
        <button type="button" aria-pressed="false" data-c="n">
          <span class="radio"></span>
          <span class="info"><span class="t">Ninguno de los dos</span>
            <span class="s">Es un vuelo nuevo, no lo tenía cargado</span></span>
        </button>
      </div>`;
    openSheet("Importar reservas", body, `
      <button class="btn ghost" id="im-cancel">Cancelar</button>
      <button class="btn primary" id="im-choicesave" disabled>Elegí una opción</button>`);
    document.getElementById("im-cancel").onclick = closeSheet;
    const choiceEl = document.getElementById("im-choice");
    const saveBtn = document.getElementById("im-choicesave");
    choiceEl.addEventListener("click", e=>{
      const b = e.target.closest("[data-c]"); if(!b) return;
      choiceEl.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed", x===b));
      selected = b.dataset.c;
      saveBtn.disabled = false;
      saveBtn.textContent = selected==="n" ? "Guardar como vuelo nuevo" : "Completar vuelo";
    });
    saveBtn.onclick = ()=>{
      if(selected===null) return;
      if(selected==="n"){
        st.matchQueue.shift();
        st.reviewList.push(makeCard(reserva, "Tarjeta de embarque", meta));
        proceed();
        return;
      }
      // Igual que en "Completar vuelo" del caso sin ambigüedad: se acumula,
      // no se escribe. El guardado final es el único lugar que toca `Store`.
      const ex = cand[Number(selected)];
      const patch = ImportEngine.buildFlightPatch(reserva, ex);
      st.pendingMatches.push({existente:ex, patch});
      st.matchQueue.shift();
      proceed();
    };
  }

  /* ---------- 04/05: revisión ---------- */
  function reviewCardHtml(card){
    const r = card.reserva;
    const T = TYPES[r.type] || TYPES.note;
    const pageTxt = card.meta.page ? ` · pág. ${card.meta.page}` : "";
    const srcHtml = card.meta.archivo ? `<span class="chip src">${svg(I[kindIcon(card.meta.kind)])}${esc(card.meta.archivo)}${pageTxt}</span>` : "";
    return `<div class="imp-card" data-card="${card.id}">
      <div class="imp-card-hd">
        <span class="pass-icon ${T.cls}">${svg(T.icon)}</span>
        <span class="ttl">
          <input class="imp-title" data-f="title" value="${esc(r.title||"")}" placeholder="Sin título">
          <span class="imp-src"><span class="chip accent">${esc(card.chip)}</span>${srcHtml}</span>
        </span>
        <button class="imp-discard" aria-label="Descartar esta reserva" data-discard="${card.id}">${svg(I.x)}</button>
      </div>
      <div class="imp-card-bd">${cardFieldsHtml(r, card.chip)}</div>
    </div>`;
  }
  function syncReviewInputsToState(){
    st.reviewList.forEach(c=>{
      const el = document.querySelector(`[data-card="${c.id}"]`);
      if(!el) return;
      el.querySelectorAll("[data-f]").forEach(inp=>{ c.reserva[inp.dataset.f] = inp.value.trim(); });
    });
  }
  /** Texto del único botón que de verdad escribe: nombra las dos cosas que
      puede llegar a hacer (guardar reservas nuevas, completar vuelos por
      tarjeta de embarque), nunca un "Guardar" genérico que esconda la mitad
      de lo que va a pasar. */
  function saveReviewLabel(n, m){
    if(n && m) return `Guardar ${n} ${n===1?"reserva":"reservas"} y completar ${m} ${m===1?"vuelo":"vuelos"}`;
    if(m) return `Completar ${m} ${m===1?"vuelo":"vuelos"}`;
    if(n) return `Guardar ${n} ${n===1?"reserva":"reservas"}`;
    return "Nada para guardar";
  }
  function renderReview(){
    if(!alive()) return;
    const cards = st.reviewList;
    const matches = st.pendingMatches;
    const issues = st.archivos.filter(a=>a.estado!=="ok");
    const n = cards.length, m = matches.length, totalArchivos = st.archivos.length;
    const encontrados = [];
    if(n) encontrados.push(`${n} ${n===1?"reserva":"reservas"}`);
    if(m) encontrados.push(`${m} ${m===1?"vuelo":"vuelos"} para completar con la tarjeta de embarque`);
    const noticeTxt = encontrados.length
      ? `Encontré ${encontrados.join(" y ")}${totalArchivos>1?` en ${totalArchivos} archivos`:""}. ${issues.length?"Los que no aportaron nada, mirá el detalle más abajo. ":""}${n?"Revisá los datos y corregí lo que haga falta antes de guardar.":"Nada de esto se aplicó todavía: se escribe recién al confirmar."}`
      : "Ya no queda ninguna reserva para revisar. Mirá el detalle de los archivos más abajo.";
    const body = `${marker}
      <div class="notice">${svg(I.info)}<span class="bd">${esc(noticeTxt)}</span></div>
      ${n?`<div class="stack">${cards.map(reviewCardHtml).join("")}</div>
        <p class="tiny muted" style="margin:0">Costo, teléfono y notas se completan después, abriendo la reserva ya guardada. Acá sólo lo que la lectura automática suele errar: fechas, rutas y códigos.</p>`:""}
      ${issues.length?issuesListHtml(issues):""}`;
    const total = n + m;
    const footer = `<button class="btn ghost" id="im-cancel">Cancelar</button>
      <button class="btn primary" id="im-save" ${total?"":"disabled"}>${svg(I.spark)} ${saveReviewLabel(n,m)}</button>`;
    openSheet("Importar reservas", body, footer);
    document.getElementById("im-cancel").onclick = closeSheet;
    document.querySelectorAll("[data-discard]").forEach(b=>{
      b.onclick = ()=>{
        syncReviewInputsToState();
        st.reviewList = st.reviewList.filter(c=>c.id!==b.dataset.discard);
        renderReview();
      };
    });
    bindIssuesActions();
    if(total) document.getElementById("im-save").onclick = doSaveReview;
  }
  async function doSaveReview(){
    if(!alive()) return;
    syncReviewInputsToState();
    const cards = st.reviewList.slice();
    const matches = st.pendingMatches.slice();
    if(!cards.length && !matches.length) return;
    const saveBtn = document.getElementById("im-save");
    saveBtn.disabled = true; saveBtn.innerHTML = `<span class="spin"></span> Guardando…`;
    try{
      // Primero los vuelos que se completan (acumulados desde 06/07/07B, sin
      // haber tocado `Store` hasta ahora), después las reservas nuevas.
      for(const pm of matches){
        await Store.saveItem(trip.id, {...pm.existente, ...pm.patch});
      }
      for(const c of cards){
        const r = c.reserva;
        const type = TYPES[r.type] ? r.type : "note";
        await Store.saveItem(trip.id, {
          id: uid(), type,
          title:r.title||"", start:r.start||"", end:r.end||"",
          from:(r.from||"").toUpperCase(), to:(r.to||"").toUpperCase(),
          provider:r.provider||"", flightNumber:(r.flightNumber||"").toUpperCase(),
          confirmation:(r.confirmation||"").toUpperCase(), seat:(r.seat||"").toUpperCase(),
          terminal:(r.terminal||"").toUpperCase(), gate:(r.gate||"").toUpperCase(),
          boardingTime:r.boardingTime||"",
          address:r.address||"", phone:r.phone||"", cost:r.cost||"",
          currency:(r.currency||"").toUpperCase(), notes:r.notes||"", source:"import"
        });
      }
      st.savedTotal += cards.length;
      st.matchDone += matches.length;
      st.reviewList = [];
      st.pendingMatches = [];
      finish();
    }catch(e){
      // Si falla a mitad de camino puede quedar parte del lote ya escrito
      // (algunos `Store.saveItem` resolvieron antes del que falló) — mismo
      // comportamiento que ya tenía el guardado de reservas nuevas frente a
      // un error de red a mitad de lote. Se muestra qué falló para que la
      // persona reintente sabiendo que puede haber quedado algo aplicado.
      toast(writeErr(e), true);
      saveBtn.disabled = false; saveBtn.innerHTML = `${svg(I.spark)} ${saveReviewLabel(cards.length, matches.length)}`;
    }
  }

  /* ---------- 09: guardado ---------- */
  function finish(){
    if(!alive()) return;
    closeSheet();
    const n = st.savedTotal, m = st.matchDone;
    let msg;
    if(n && m) msg = `Guardado. Agregué ${n} ${n===1?"reserva":"reservas"} y completé ${m} ${m===1?"vuelo":"vuelos"} con los datos de la tarjeta de embarque.`;
    else if(m) msg = `Guardado. Completé ${m} ${m===1?"vuelo":"vuelos"} con los datos de la tarjeta de embarque.`;
    else if(n) msg = `${n} ${n===1?"reserva agregada":"reservas agregadas"}`;
    else msg = "Listo";
    toast(msg);
    if(n || m) checkPackingPlan(trip);   // VAL-46: importar también hace crecer el viaje
  }

  renderElegir();
}

/* ============================================================
   VAL-46 · HOJA "LO QUE LE SUMO A LA VALIJA" (estado 17)
   Agrupada por la reserva que motivó cada ítem, no por categoría: la
   pregunta que se está haciendo la persona no es "qué me agregás" sino
   "por qué me agregás algo ahora". El encabezado es la respuesta.
   ============================================================ */

/** "el auto (Europcar)" -> "del auto (Europcar)"; "la actividad X" -> "de la actividad X". */
function pkDeReserva(txt){
  const t = String(txt||"");
  return /^el\s/i.test(t) ? ("del " + t.slice(3)) : ("de " + t);
}

function planGrupos(plan){
  const grupos = [];
  const porReserva = new Map();
  const viajeEntero = [], historial = [];
  plan.nuevos.forEach(n=>{
    if(n.reserva){
      if(!porReserva.has(n.reserva)) porReserva.set(n.reserva, []);
      porReserva.get(n.reserva).push(n);
    }else if(n.origen === "historial") historial.push(n);
    // Los ítems de origen "destino" no traen `reserva` (límite documentado del
    // motor, § 7 de packing-engine.md): para ellos la cita del dato concreto
    // está adentro del texto del motivo, que por eso se muestra entero.
    else viajeEntero.push(n);
  });
  porReserva.forEach((its, reserva)=> grupos.push({
    hd:`Porque agregaste <b>${esc(reserva)}</b>`, ico:planReservaIcon(reserva), its
  }));
  if(viajeEntero.length){
    const r = planReserva(plan);
    grupos.push({
      hd: r ? `Mirando el viaje entero, con ${esc(r)} adentro` : "Mirando el viaje entero",
      ico:"globe", its:viajeEntero
    });
  }
  if(historial.length) grupos.push({ hd:"Porque lo llevaste en viajes parecidos", ico:"spark", its:historial });
  return grupos;
}

function sheetPackingPlan(trip, plan){
