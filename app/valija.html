/* ---------- ¿está el lector de PDF? ----------
   VAL-50 dejó evidencia real, en el teléfono del PM: un <script src> de
   cdnjs puede no cargar ("No se pudo cargar el generador de PDF"). pdf.js
   viene del MISMO host y por el MISMO camino que jsPDF, así que la misma
   falla deja sin efecto toda la importación de PDF —que es justo el corazón
   de VAL-40—. No es una hipótesis: ya pasó una vez con la otra librería.

   Se detecta igual que las capacidades de la vista: antes de dibujar la
   pantalla, y se dice antes de que la persona suba nada. El <script> de la
   cabecera es sincrónico, así que cuando la app arranca ya cargó o ya
   falló: alcanza con mirar `window`. */
function pdfEngineReady(){
  return !!(window.pdfjsLib && typeof window.pdfjsLib.getDocument === "function");
}

/* Cuántas veces se abrió la hoja de importar. Una promesa que resuelve tarde
   tiene que saber si la apertura que la disparó sigue siendo la de la
   pantalla, y no alcanza con que exista la marca viva: la hoja pudo haberse
   cerrado y vuelto a abrir en el medio. */
let importSheetSeq = 0;

/** Espera una promesa con techo: si tarda más de `ms`, devuelve `valorSiTarda`
    y sigue. La promesa original NO se cancela (no se puede) ni se tira: quien
    llama puede engancharse a ella para usar la respuesta cuando llegue.
    @param {Promise} promesa @param {number} ms @param {*} valorSiTarda */
function esperaConTecho(promesa, ms, valorSiTarda){
  let t = null;
  return Promise.race([
    Promise.resolve(promesa).then(v=>{ clearTimeout(t); return v; }, ()=>{ clearTimeout(t); return valorSiTarda; }),
    new Promise(res=>{ t = setTimeout(()=>res(valorSiTarda), ms); })
  ]);
}
/* Techo de espera de `limits()`. El contrato (0.2.41) dice que `claude.use()`
   resuelve SIEMPRE más tarde que la primera corrida del script y que devuelve
   null recién a los 10 s: la espera larga es el caso previsto, no el raro.
   Pasado el techo se sigue con certeza "desconocida" —que es exactamente el
   comportamiento de una plataforma sin `limits`: no se saca nada de la
   pantalla— y si la respuesta llega después, se aplica ahí. */
/* DECISIÓN SIN MEDICIÓN. Nadie midió cuánto tarda `limits()` en el visor del
   teléfono: los 4 segundos son un criterio, no un dato. Si allá tardara más, lo
   que se ve es la pantalla completa ofreciendo todo y la corrección llegando
   unos segundos después — degradación prevista, no rotura. Está en el guion de
   pruebas del PM: anotar si la cámara desaparece después de abrir la pantalla.
   Con ese número real, este techo se ajusta. */
const LIMITS_TECHO_MS = 4000;

async function sheetImport(trip){
  if(!Store.canWrite){ renderImportReadOnly(); return; }

  /* Marca viva: mientras exista en el DOM Y sea de ESTA apertura, la hoja
     sigue siendo la que se ve. Si el visitante cerró, navegó a otro lado o
     volvió a abrir importar, una promesa que resuelve tarde no debe reabrir
     ni pisar un modal ajeno. Se define acá arriba, antes del primer `await`,
     porque las esperas de abajo ya la necesitan. */
  const marker = `<span id="imp-live" hidden></span>`;
  const miTurno = ++importSheetSeq;
  const alive = ()=> miTurno === importSheetSeq && !!document.getElementById("imp-live");

  /** Estado de carga de la hoja. Dos patrones que la app ya usa, los dos:
      el `.notice` + `.spin` de "Leyendo…" (paso 03 de esta misma hoja) para
      decir en palabras qué está pasando, y el esqueleto `.sk` de la pantalla
      de la valija para mostrar la forma de lo que está llegando. Con
      `prefers-reduced-motion` las dos animaciones quedan quietas —regla
      global— y el texto es el que sigue informando. */
  function renderPreparando(){
    const hueco = `<span class="sk" style="height:83px"></span>`;
    openSheet("Importar reservas", `${marker}
      <div class="notice" id="im-prep"><span class="spin"></span><span class="bd">Preparando la importación…</span></div>
      <div class="f">
        <label>Cómo lo cargás</label>
        <div class="tp tp3">${hueco}${hueco}${hueco}</div>
      </div>
      <div id="im-slow"></div>`,
      `<button class="btn ghost block" id="im-cancel-prep">Cancelar</button>`);
    document.getElementById("im-cancel-prep").onclick = closeSheet;
  }
  /** Mismo patrón que `runInterpretation`: a los 7 segundos se dice que está
      tardando y se ofrece la salida que no depende de nadie —cargar la
      reserva a mano—. Nunca se deja a la persona mirando un spinner sin
      opciones. */
  function mostrarPrepLenta(){
    const el = document.getElementById("im-slow");
    if(!el || el.innerHTML) return;
    el.innerHTML = `<div class="notice warn">${svg(I.info)}<span class="bd">Esto está tardando más de lo normal. Podés esperar unos segundos más, o cargar la reserva a mano.
      <button class="act" id="im-prep-manual">Cargar a mano</button></span></div>`;
    const b = document.getElementById("im-prep-manual");
    if(b) b.onclick = ()=>{ closeSheet(); sheetItem(trip, null); };
  }

  /* ---------- lo primero es la reacción, no el dato ----------
     Tocar "Importar" tiene que cambiar la pantalla EN EL ACTO, siempre. Lo
     que viene después son dos esperas de plataforma (`claude.use` y
     `limits()`) que pueden tardar segundos: si la hoja se dibujara recién
     al final, el botón se vería muerto —el mismo síntoma que el PM reportó
     tres veces—. Así que la hoja se abre ya, con su estado de carga, y se
     completa cuando llega la respuesta. */
  renderPreparando();
  const prepSlow = setTimeout(()=>{ if(alive()) mostrarPrepLenta(); }, 7000);
  const dejarDeEsperar = ()=> clearTimeout(prepSlow);

  let sample = null;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  if(!alive()){ dejarDeEsperar(); return; }
  /* El tier lo decide `tierDeImportacion` con las opciones que manda el
     motor: texto → "default", imágenes → "complex". No hay nada que
     recordar el día que la vista habilite las fotos. */
  const callModel = (sample && typeof sample.json === "function")
    ? (prompt, opts) => {
        // El nombre de la tarea sale del CAMINO, no del tier: si algún día
        // los dos tiers coinciden, el registro tiene que seguir distinguiendo
        // de dónde vino la llamada.
        const tarea = esImportacionPorImagen(opts) ? "importar-imagen" : "importar-texto";
        return askJson(sample, tarea, tierDeImportacion(opts), prompt, opts);
      }
    : null;
  if(!callModel){ dejarDeEsperar(); renderImportNoAi(); return; }

  /* ---------- qué puede ESTA vista, ANTES de dibujar la pantalla ----------
     El 11/09 el PM subió tres archivos desde su teléfono y los tres fallaron
     con "Esta vista no acepta imágenes": subió, esperó, y recién ahí se
     enteró. `sample.limits()` lo dice de antemano, es local y no gasta nada
     (contrato 0.2.41), así que se pregunta UNA vez al abrir la hoja y la
     pantalla se dibuja ofreciendo sólo lo que puede funcionar.

     La misma función memoizada se le inyecta después al motor: una sola
     llamada real por apertura de la hoja, aunque se suban seis archivos.

     Si la plataforma no expone `limits` no se inyecta nada: el motor
     responde `certeza:"desconocida"` y se ofrece todo como antes del
     cambio. No sabemos, y no se inventa. */
  let limitsOnce = null;
  const viewLimits = (sample && typeof sample.limits === "function")
    ? () => (limitsOnce || (limitsOnce = Promise.resolve().then(()=> sample.limits())))
    : null;
  /* La pregunta no rechaza nunca, pero puede tardar: se le pone techo. Si no
     contesta a tiempo se sigue con "desconocida" (todo se ofrece, nada se
     inventa) y la respuesta tardía se aplica cuando llegue. */
  const capsPromise = ImportEngine.getViewCapabilities(viewLimits);   // nunca rechaza
  const capsNoSe = await ImportEngine.getViewCapabilities(null);      // resuelve ya: no consulta nada
  let caps = await esperaConTecho(capsPromise, LIMITS_TECHO_MS, capsNoSe);
  dejarDeEsperar();
  if(!alive()) return;
  let sinImagenes = caps.certeza === "no";   // "desconocida" NO cambia nada

  /* El lector de PDF se mira una vez por apertura, igual que las
     capacidades de la vista (ver `pdfEngineReady`). */
  const sinPdf = !pdfEngineReady();

  /* CUÁNDO SE ABRE SOLA LA CAJA DE PEGAR EL TEXTO (ver el `<details>` de abajo).

     Se abre con `sinPdf`, y con texto ya pegado. NO con `sinImagenes`.

     Hasta el 18/09 también la abría `sinImagenes`, con el criterio de que si no se
     pueden leer imágenes, pegar sube de categoría. El PM lo usó en su teléfono y
     pidió lo contrario: "quiero que esté colapsado; no es la funcionalidad
     principal". Tiene razón, y el motivo es que en esta plataforma `sinImagenes`
     es PERMANENTE, no ocasional: una caja que nunca está cerrada dejó de ser un
     acordeón y pasó a ser ruido fijo compitiendo con el botón de subir el PDF,
     que es el camino principal y el que funciona.

     La guía no se pierde: el aviso de arriba dice "si no tenés el PDF, pegá el
     texto del correo acá abajo: eso funciona siempre". La da el aviso, no la caja.

     `sinPdf` es otra cosa y sí la sigue abriendo: ahí subir un PDF no lleva a
     ningún lado. Si además faltan las imágenes no queda NINGÚN botón de archivo en
     pantalla, y pegar es literalmente lo único que se puede hacer. Los dos casos
     los fija `importar-arranque.js`; el que cambió lo fija
     `importar-sin-imagenes.js`.

     Nota para el próximo que toque esto: el `<details>` vive adentro de un
     template literal, así que un comentario ahí no puede tener backticks —
     cierran la cadena. Por eso esta explicación está acá y no al lado. */

  // Estado de la hoja: nada de esto toca `Store` hasta el guardado final
  // (el botón "Guardar" de la pantalla de revisión). Eso incluye las
  // decisiones sobre una tarjeta de embarque —completar un vuelo, crear uno
  // nuevo, elegir entre varios—: viven como tarjetas de `reviewList` y recién
  // se escriben junto con el resto del lote. Cancelar en cualquier punto no
  // deja nada escrito, porque hasta ese momento todo vive sólo en este objeto.
  // Los documentos son lo mismo: se preparan al guardar y ni siquiera existen
  // antes de ese toque.
  const st = {
    queue:[], pastedText:"", sources:[],
    archivos:[], reviewList:[], matchQueue:[],
    matchDone:0, savedTotal:0, acceptPartial:null,
    // VAL-59: tarjetas que la persona descartó, para que el cierre lo diga.
    descartadas:0,
    // VAL-58: qué documento quedó adjunto a qué reserva, y cuál no entró (D14).
    adjuntos:[], adjuntosFuera:[],
    // D14: un archivo con varias reservas deja el documento en una sola. Acá
    // queda cuál se lo llevó y cuáles se guardaron sin comprobante.
    sinComprobante:[]
  };
  const tripCtx = ()=> ({name:trip.name, destination:trip.destination, startDate:trip.startDate, endDate:trip.endDate});

  /* Si `limits()` llegó tarde, la respuesta no se tira. Se aplica sin pisar
     lo que la persona ya escribió: si está tipeando el texto del correo, se
     cambia sólo el aviso de arriba; si no, se redibuja la pantalla (que
     conserva la cola y el texto pegado, porque los dos viven en `st`). */
  if(caps === capsNoSe) capsPromise.then(tardias=>{
    if(!alive() || !tardias || tardias.certeza === caps.certeza) return;
    caps = tardias;
    sinImagenes = caps.certeza === "no";
    st.queue.forEach(f=>Object.assign(f, flagsDeArchivo(f)));
    if(!document.getElementById("im-caps")) return;   // ya no está en la pantalla de elegir
    const ta = document.getElementById("im_text");
    if(ta && document.activeElement === ta){
      const aviso = document.getElementById("im-caps");
      if(aviso) aviso.outerHTML = avisoCapsHtml();
      return;
    }
    renderElegir();
  }, ()=>{});   // no rechaza nunca, pero si algún día lo hiciera no se cae nada

  function makeCard(reserva, chip, meta){ return {id:uid(), kind:"nueva", reserva, chip, meta:meta||{}}; }
  /* V1 · la coincidencia deja de ser un paso propio y pasa a ser una tarjeta
     de la pantalla de revisión: se MUESTRA lo que se va a completar (VAL-42)
     y no se pregunta nada (VAL-59). Se aplica con el mismo botón del lote. */
  function matchCard(reserva, match, meta){
    return {id:uid(), kind:"match", reserva, match, chip:"Tarjeta de embarque", meta:meta||{}};
  }
  /* V3 · el vuelo precargado con lo que trae la tarjeta. Es una tarjeta de
     revisión editable como las demás —nada se guarda sin revisar— con los
     campos partidos en dos grupos: lo que vino de la tarjeta y lo que quedó
     vacío. Un campo que la tarjeta no trae NO se rellena adivinando. */
  function cardVueloDeTarjeta(precarga, meta){
    const c = makeCard(Object.assign({}, precarga.vuelo), "Vuelo nuevo", meta);
    c.kind = "vuelo-nuevo";
    c.precarga = precarga;
    return c;
  }

  /* Las cuatro funciones que el motor necesita. El motor nunca llama a
     `claude.use` ni importa pdf.js: las recibe de acá.
       · extractPdfText    — el camino bueno: un PDF con capa de texto se
                             interpreta SIN imágenes y sin mirar limits().
       · renderPdfToImages — el último recurso, sólo si la vista acepta.
       · limits            — para que el motor sepa si puede. `null` si la
                             plataforma no lo expone: degrada a "no sé". */
  function opcionesDelMotor(){
    return {
      callModel,
      limits: viewLimits,
      extractPdfText: b=>ImportEngine.extractPdfText(b),
      renderPdfToImages: b=>ImportEngine.renderPdfPagesToImages(b),
      trip:tripCtx()
    };
  }

  /* El texto pegado NO pasa por el motor de archivos: se resuelve acá mismo,
     con su propio prompt (ver `interpretPastedText`). Los archivos van todos
     juntos por `interpretFiles` — si alguno volviera a pasar por acá, de a
     uno, el agrupado de VAL-60 dejaría de ocurrir. */
  function runTextoPegado(source){
    const opts = opcionesDelMotor();
    const p = interpretPastedText(source.text, source.name, opts);
    return p.then(result=>{
      result.kind = source.kind;
      result.srcId = source.id;
      const idx = st.archivos.findIndex(a=>a.srcId===source.id);
      if(idx>=0) st.archivos[idx] = result; else st.archivos.push(result);
      return result;
    });
  }

  function classifyAndQueue(reservas, ctx){
    const existentes = Store.itemsOf(trip.id);
    const assignPage = ctx && ctx.kind==="pdf" && ctx.paginas>1 && reservas.length===ctx.paginas;
    reservas.forEach((r,i)=>{
      const meta = {
        // `srcId` identifica la FUENTE; `archivo` es sólo el nombre que se muestra.
        srcId:(ctx&&ctx.srcId)||null,
        archivo:r.archivo||(ctx&&ctx.archivo)||"", kind:(ctx&&ctx.kind)||"img",
        page:assignPage?(i+1):null
      };
      if(r.type==="flight"){
        const m = ImportEngine.matchAgainstExisting(r, existentes);
        /* Que esto sea una tarjeta de embarque lo dice el MOTOR (`esTarjeta`),
           no la interfaz: si la app adivinara "es tarjeta porque trae asiento"
           trataría como tarjeta a un pasaje con asiento asignado. */
        meta.esTarjeta = !!m.esTarjeta;
        // Cada resultado tiene su pantalla, y son cuatro desde VAL-59.
        if(m.resultado==="nuevo") st.reviewList.push(makeCard(r,"Vuelo",meta));
        else if(m.resultado==="mismo") st.reviewList.push(matchCard(r, m, meta));   // V1
        else st.matchQueue.push({reserva:r, match:m, meta});   // "ambiguo" → V5 · "sin-vuelo" → V2/V4/V5
      } else {
        st.reviewList.push(makeCard(r, TYPES[r.type]?.label || "Nota", meta));
      }
    });
  }

  /* Si el selector no se abre, la persona se queda sin saber qué pasó y el
     botón parece roto. No lo podemos preguntar: lo medimos. Abrir el selector
     le saca el foco a la página en todos los navegadores; si después de tocar
     el foco nunca se fue y tampoco llegó ningún archivo, no se abrió nada.
     Entonces lo decimos y ofrecemos la vía que sí funciona siempre. */
  function avisarSelectorMudo(){
    const caja = document.getElementById("im-nopick");
    if(!caja || !caja.hidden) return;
    caja.hidden = false;
    caja.innerHTML = `<div class="notice warn">${svg(I.info)}<span class="bd">No se abrió el selector de archivos. Es un problema del navegador, no tuyo, y quiero saberlo: contámelo. Mientras tanto, pegá abajo el texto de la confirmación y lo interpreto igual.</span></div>`;
    const det = document.querySelector(".imp-more");
    if(det) det.open = true;
  }
  /* Ver `wireFilePick`: si el archivo llega después del aviso, el aviso se va. */
  function retirarSelectorMudo(){
    const caja = document.getElementById("im-nopick");
    if(caja){ caja.hidden = true; caja.innerHTML = ""; }
  }

  /* El cableado es el compartido (`wireFilePick`, definido con el visor del
     documento): mismo gesto, mismo aviso de selector mudo, un solo lugar. */
  function wireFileInput(id, forcedKind){
    wireFilePick(id, {
      alive,
      onMudo: avisarSelectorMudo,
      onRetirar: retirarSelectorMudo,
      onFiles: files => {
        const nuevas = files.map(file=>{
          const engineKind = ImportEngine.fileKind({name:file.name, mimeType:file.type});
          const entrada = {
            id:uid(), name:file.name, mimeType:file.type, blob:file, size:file.size,
            kind: forcedKind || (engineKind==="pdf" ? "pdf" : "img"),
            forced: !!forcedKind
          };
          st.queue.push(Object.assign(entrada, flagsDeArchivo(entrada)));
          return entrada;
        });
        renderElegir();
        // Ver `leerUnaVez`: el archivo se lee ya, una sola vez, y lo que sigue
        // usa esa copia. Redibujar al final porque el peso puede corregirse.
        Promise.all(nuevas.map(leerUnaVez)).then(()=>{ if(alive()) renderElegir(); });
      }
    });
  }
  /* ---------- UNA SOLA LECTURA DEL ARCHIVO ELEGIDO ----------
     HIPÓTESIS, no hecho comprobado: que un archivo entregado desde el correo
     o desde Drive llegue en Android como `content://`, servido por un
     proveedor remoto, y se pueda leer UNA sola vez — la segunda vuelve vacía
     y `size` pasa a 0. Nadie lo observó en el teléfono del PM; el síntoma
     siguió después de publicar este arreglo.

     Lo que la encajaba: la importación leía el archivo DOS veces, una para
     interpretarlo y otra, más tarde, para adjuntarlo, y la tarjeta del PM se
     interpretó bien —el vuelo se completó— mientras el documento "estaba
     vacío". Calza con el síntoma, y calzar no es ser la causa.

     Por qué se deja igual: leer una vez y reusar los bytes es mejor que leer
     dos, sea cierta la hipótesis o no. Una lectura menos no puede fallar.
     En una computadora no pasa nunca, porque el archivo es del disco y se
     puede leer todas las veces que uno quiera: por eso no lo vio ningún
     arnés, ni siquiera el que corre con el pdf.js real. Lo encontró él, en
     su teléfono, el 16/09.

     Entonces se lee UNA vez, apenas se elige, y de ahí en adelante todo usa
     esa copia en memoria. Si la lectura falla o vuelve vacía no se pisa
     nada: queda el archivo original, y el error aparece donde corresponde en
     vez de convertirse en un "está vacío" que no es cierto.

     El arnés que lo reproduce es `app/pruebas/archivo-de-una-lectura.js`:
     envuelve el File para que la segunda lectura devuelva cero bytes, que es
     exactamente lo que hace Android. */
  function leerUnaVez(entrada){
    const origen = entrada.blob;
    if(!origen) return Promise.resolve();
    /* El MISMO lector de tres caminos que usa el motor de adjuntos, no uno
       propio: si acá se leyera de una sola forma, un archivo que el motor sí
       puede leer quedaría afuera del importador por el camino equivocado.
       Un solo lugar sabe cómo leer un archivo. */
    entrada.leyendo = AdjuntosEngine.leerBytesConDiagnostico(origen, {}).then(r=>{
      entrada.intentos = r.intentos;
      if(!r.bytes.length){
        /* Los tres caminos fallaron: este archivo no se puede leer, y eso se
           sabe ACÁ, antes de gastar una llamada al modelo y antes de que el
           motor de interpretación invente una causa que no observó ("es un
           escaneo"). Se marca, se muestra lo que se vio, y no se manda.
           El hueco lo encontró la auditoría del 17/09: el arreglo del lector
           cubría adjuntar y dejaba importar diciendo cualquier cosa. */
        entrada.ilegible = true;
        entrada.detalle = AdjuntosEngine.detalleDeLectura(origen, r.intentos);
        return;
      }
      entrada.bytes = r.bytes;
      entrada.blob  = new Blob([r.bytes], {type: entrada.mimeType || "application/octet-stream"});
      entrada.size  = r.bytes.length;
      Object.assign(entrada, flagsDeArchivo(entrada));
    }).catch(()=>{});
    return entrada.leyendo;
  }
  /* Los motivos por los que un archivo no se va a poder leer, calculados en
     un solo lugar: al encolarlo, y otra vez si `limits()` contesta tarde.
     El `accept` del input es una sugerencia que varios selectores ignoran,
     así que la cola vuelve a mirar cada archivo antes de subir nada. */
  function flagsDeArchivo(f){
    const engineKind = ImportEngine.fileKind({name:f.name, mimeType:f.mimeType});
    return {
      ilegible: !!f.ilegible,
      big: f.size > MAX_FILE_BYTES,
      invalid: !f.forced && engineKind==="desconocido",
      noLeible: sinImagenes && (engineKind==="imagen" || f.kind==="img"),
      sinLector: sinPdf && (engineKind==="pdf" || f.kind==="pdf")
    };
  }
  const legible = f => !f.ilegible && !f.big && !f.invalid && !f.noLeible && !f.sinLector;
  function queueRowHtml(f){
    const cls = kindThumbCls(f.kind), icon = kindIcon(f.kind);
    let meta;
    if(f.ilegible) meta = `<span class="meta err">No pude leer este archivo: ninguno de los caminos que probé trajo nada. Si vino por mail, bajalo al teléfono primero y después elegilo desde ahí.</span>${f.detalle?`<span class="meta dato">${esc(f.detalle)} · v${esc(VALIJA_VERSION)}</span>`:""}`;
    else if(f.big) meta = `<span class="meta err">Pesa ${fmtSize(f.size)}, más de lo que puedo leer (máx. ${MAX_FILE_MB} MB). Elegí otro archivo o sacá la foto de nuevo con menos calidad.</span>`;
    else if(f.invalid) meta = `<span class="meta err">No reconozco este tipo de archivo. Subí una foto (PNG o JPG) o un PDF.</span>`;
    else if(f.noLeible) meta = `<span class="meta err">Acá no se pueden leer imágenes. Subí el PDF del comprobante, o pegá abajo el texto del correo.</span>`;
    else if(f.sinLector) meta = `<span class="meta err">El lector de PDF no cargó, así que este archivo no se puede leer acá. ${sinImagenes?"Pegá abajo el texto del correo.":"Sacale una foto al comprobante, o pegá abajo el texto del correo."}</span>`;
    else meta = `<span class="meta">${fmtSize(f.size)}</span>`;
    return `<div class="imp-file ${legible(f)?"":"err"}">
      <span class="imp-thumb ${cls}">${svg(I[icon])}</span>
      <span class="bd"><span class="nm">${esc(f.name)}</span>${meta}</span>
      <button class="rm" aria-label="Sacar ${esc(f.name)}" data-rmq="${f.id}">${svg(I.x)}</button>
    </div>`;
  }
  /* ---------- 01/02: elegir de dónde sale el documento ----------
     Dos pantallas, no una. Cuál se dibuja lo decide `caps`, que ya se
     preguntó antes de abrir la hoja:

       · certeza "si" o "desconocida" → todo como siempre: cámara, galería
         y archivo. "No sé" nunca saca nada de la pantalla.
       · certeza "no" → la cámara y la galería no se ofrecen, porque acá no
         funcionan. En su lugar queda, dicho de entrada y no después de
         subir y esperar, lo que sí funciona: el PDF del comprobante (se lee
         su texto) y pegar el texto del correo, que nunca dependió de
         imágenes.

     Y lo mismo con el lector de PDF (`sinPdf`, ver `pdfEngineReady`): si la
     librería no cargó, subir un PDF no puede funcionar de ninguna manera —ni
     por texto ni por imagen— así que no se ofrece. Si tampoco hay imágenes,
     no queda ningún selector de archivos: la única vía viva es pegar el
     texto, y se muestra sola, abierta, sin un botón que no lleva a ningún
     lado. */
  function acceptAttr(){
    const partes = String(caps.accept||"").split(",").map(s=>s.trim()).filter(Boolean);
    return (sinPdf ? partes.filter(p=>p!=="application/pdf") : partes).join(",");
  }
  function pickerHtml(){
    if(sinImagenes && sinPdf) return "";
    if(sinImagenes) return `
      <div class="f">
        <label>Cómo lo cargás</label>
        <div class="tp imp-pick">
          <button type="button" class="tpbtn" data-pick="im_doc">${svg(I.doc)} Subir el PDF <span class="n">del comprobante</span></button>
          <input id="im_doc" type="file" accept="${esc(acceptAttr())}" multiple>
        </div>
        <span class="hint">Podés subir varios PDF a la vez. Un PDF escaneado —el que por dentro es una foto— tampoco se puede leer acá: esa reserva cargala a mano desde <b>Agregar</b>.</span>
        <div id="im-nopick" hidden></div>
      </div>`;
    return `
      <div class="f">
        <label>Cómo lo cargás</label>
        <div class="tp tp3 imp-pick">
          <button type="button" class="tpbtn" data-pick="im_cam">${svg(I.cam)} Sacar foto <span class="n">con la cámara</span></button>
          <button type="button" class="tpbtn" data-pick="im_gal">${svg(I.gallery)} Galería <span class="n">fotos y capturas</span></button>
          <button type="button" class="tpbtn" data-pick="im_doc">${svg(I.doc)} Archivo <span class="n">${sinPdf?"foto o captura":"PDF o imagen"}</span></button>
          <input id="im_cam" type="file" accept="image/*" capture="environment">
          <input id="im_gal" type="file" accept="image/*" multiple>
          <input id="im_doc" type="file" accept="${esc(acceptAttr())}" multiple>
        </div>
        <span class="hint">${sinPdf?"Podés elegir varias fotos a la vez.":"Podés elegir varios a la vez, y combinar fotos con PDF en la misma carga."}</span>
        <div id="im-nopick" hidden></div>
      </div>`;
  }
  /* El aviso de arriba. `caps.nota` viene del motor (una sola fuente de
     verdad para el texto de la restricción) y acá se le agrega la segunda
     salida, que es de la pantalla: pegar el texto. */
  function avisoCapsHtml(){
    /* Las dos restricciones juntas: no queda ningún archivo que subir. No se
       usa `caps.nota` acá porque esa frase manda al PDF, que hoy tampoco
       funciona; decir lo que no es cierto sería peor que no decir nada. */
    if(sinImagenes && sinPdf) return `
      <div class="notice warn" id="im-caps">${svg(I.info)}
        <span class="bd">Acá no puedo leer imágenes, y el lector de PDF tampoco cargó —casi siempre es la conexión—. Queda una vía, y funciona siempre: pegá abajo el texto del correo. Si más tarde volvés a entrar, puede que el PDF ande de nuevo.</span>
      </div>`;
    if(sinPdf) return `
      <div class="notice warn" id="im-caps">${svg(I.info)}
        <span class="bd">El lector de PDF no cargó —casi siempre es la conexión—, así que en esta sesión no puedo leer archivos PDF. Te lo digo antes de que subas nada: sacale una foto al comprobante o pegá el texto del correo acá abajo, esas dos funcionan igual. Si más tarde volvés a entrar, puede que el PDF ande de nuevo.</span>
      </div>`;
    if(sinImagenes) return `
      <div class="notice warn" id="im-caps">${svg(I.info)}
        <span class="bd">${esc(caps.nota)} Una foto o una captura no se pueden interpretar en esta vista, así que te lo digo antes de que subas nada. Si no tenés el PDF, pegá el texto del correo acá abajo: eso funciona siempre.</span>
      </div>`;
    return `
      <div class="notice" id="im-caps">${svg(I.spark)}
        <span class="bd">Sacale una foto al voucher, subí la captura del mail o el PDF del pasaje. Te muestro lo que encuentro antes de guardar nada.</span>
      </div>`;
  }
  function renderElegir(){
    const validCount = st.queue.filter(legible).length;
    const body = `${marker}
      ${avisoCapsHtml()}
      ${pickerHtml()}
      ${st.queue.length ? `
      <div class="f">
        <label>Vas a interpretar</label>
        <div class="imp-files">${st.queue.map(queueRowHtml).join("")}</div>
      </div>` : ""}
      <details class="imp-more" ${(st.pastedText||sinPdf)?"open":""}>
        <summary>${(sinImagenes||sinPdf)?"Pegar el texto del correo":"Pegar el texto en cambio"}</summary>
        <div class="f">
          <label for="im_text">Texto de la confirmación</label>
          <textarea id="im_text" class="mono" placeholder="Tu reserva está confirmada&#10;Vuelo G3 1234 · EZE → GIG&#10;20 de septiembre, 06:40&#10;Código: K7QXPL">${esc(st.pastedText)}</textarea>
          <span class="hint">Podés pegar varias reservas juntas. Las separo yo.</span>
        </div>
      </details>`;
    const canInterpret = validCount>0 || st.pastedText.trim().length>0;
    const footer = `<button class="btn ghost" id="im-cancel">Cancelar</button>
      <button class="btn primary" id="im-run" ${canInterpret?"":"disabled"}>${svg(I.spark)} ${validCount?`Interpretar ${validCount} ${validCount===1?"archivo":"archivos"}`:"Interpretar"}</button>`;
    openSheet("Importar reservas", body, footer);
    document.getElementById("im-cancel").onclick = closeSheet;
    wireFileInput("im_cam","img"); wireFileInput("im_gal","img"); wireFileInput("im_doc",null);
    document.querySelectorAll("[data-rmq]").forEach(b=>{
      b.onclick = ()=>{ st.queue = st.queue.filter(f=>f.id!==b.dataset.rmq); renderElegir(); };
    });
    const ta = document.getElementById("im_text");
    ta.oninput = ()=>{
      st.pastedText = ta.value;
      const btn = document.getElementById("im-run");
      if(btn) btn.disabled = !(validCount>0 || ta.value.trim());
    };
    document.getElementById("im-run").onclick = startInterpret;
  }
  /* Cada fuente lleva su propio `id` y NADA de acá para adelante se identifica
     por el nombre del archivo. El nombre lo elige el navegador y se repite:
     varias cámaras de teléfono le ponen el mismo nombre genérico a dos fotos
     distintas, y con dos fuentes homónimas un `find` por string devolvía
     siempre la misma —el documento iba a la reserva equivocada y el otro
     cuerpo quedaba escrito sin que ningún ítem lo nombrara—. El nombre sigue
     sirviendo para mostrar; para atribuir, manda el id. */
  async function startInterpret(){
    // La lectura única puede no haber terminado si se tocó Interpretar muy
    // rápido. Esperarla acá evita mandar a interpretar el File frágil.
    await Promise.all(st.queue.map(f=>f.leyendo).filter(Boolean));
    if(!alive()) return;
    const fileSources = st.queue.filter(legible)
      .map(f=>({id:f.id, name:f.name, mimeType:f.mimeType, blob:f.blob, kind:f.kind}));
    const sources = fileSources.slice();
    if(st.pastedText && st.pastedText.trim()) sources.push({id:"src-texto-pegado", name:"Texto pegado", kind:"texto", text:st.pastedText.trim()});
    if(!sources.length) return;
    st.sources = sources;
    runInterpretation(sources);
  }

  /* ---------- 03: leyendo, archivo por archivo ---------- */
  function rowHtml(r){
    const cls = kindThumbCls(r.kind), icon = kindIcon(r.kind);
    let meta;
    if(r.status==="queued") meta = `<span class="meta"><span class="imp-dot"></span> En cola</span>`;
    else if(r.status==="leyendo") meta = `<span class="meta"><span class="spin"></span> Leyendo…</span>`;
    else if(r.status==="ok") meta = `<span class="meta ok">${svg(I.check2)} Listo · ${r.found} ${r.found===1?"reserva encontrada":"reservas encontradas"}${r.modo==="texto"&&r.kind==="pdf"?" · leído del texto del PDF":""}</span>`;
    else if(r.status==="vacio") meta = `<span class="meta info">${svg(I.info)} Listo · no encontré ninguna reserva</span>`;
    else meta = `<span class="meta err">${svg(I.info)} No se pudo leer</span>`;
    return `<div class="imp-file" id="${r.rowId}">
      <span class="imp-thumb ${cls}">${svg(I[icon])}</span>
      <span class="bd"><span class="nm">${esc(r.name)}</span>${meta}</span>
    </div>`;
  }
  function renderLeyendo(rows){
    const body = `${marker}
      <div class="notice"><span class="spin"></span><span class="bd">Leyendo ${rows.length} ${rows.length===1?"archivo":"archivos"}…</span></div>
      <div class="imp-files">${rows.map(rowHtml).join("")}</div>
      <div id="im-slow"></div>`;
    openSheet("Importar reservas", body, `<button class="btn ghost block" id="im-cancelall">Cancelar todo</button>`);
    document.getElementById("im-cancelall").onclick = closeSheet;
  }
  function updateRow(r){
    const el = document.getElementById(r.rowId);
    if(el) el.outerHTML = rowHtml(r);
  }
  function showSlowNotice(){
    const el = document.getElementById("im-slow");
    if(!el) return;
    el.innerHTML = `<div class="notice warn">${svg(I.info)}<span class="bd">Che, esto está tardando más de lo normal. Las fotos con poca luz y los PDF pesados tardan más en leerse.
      <button class="act" id="im-acceptpartial">Quedarme con lo que ya está listo</button></span></div>`;
    const b = document.getElementById("im-acceptpartial");
    if(b) b.onclick = ()=>{ if(st.acceptPartial) st.acceptPartial(); };
  }
  /* ---------- VAL-60: TODOS los archivos en UNA llamada ----------
     El motor v3 agrupa los que se leen como texto y los resuelve en una sola
     llamada por lote; las imágenes siguen sueltas, porque juntarlas no ahorra
     nada (se reenvían en cada ronda). Por eso acá se llama a `interpretFiles`
     UNA vez con todos los archivos, y no a `interpretFile` en un bucle: con el
     bucle el agrupado no ocurría nunca.

     El progreso por fila —la razón válida por la que se llamaba una vez por
     archivo— se conserva con `onProgress`: cada fila recorre sus estados igual
     que antes. Lo que se pierde, y está dicho en el diseño del motor § 7.5: en
     un lote las filas dejan de terminar de a una, porque hay una sola
     respuesta.

     El texto pegado no pasa por el motor (lo resuelve `interpretPastedText`),
     así que va aparte, como siempre. */
  function runInterpretation(sources){
    const rows = sources.map((s,i)=>({rowId:`im-row-${i}-${uid()}`, name:s.name, kind:s.kind, status:"queued", found:0}));
    renderLeyendo(rows);
    let finished = false;
    const slowTimer = setTimeout(()=>{ if(!finished && alive()) showSlowNotice(); }, 7000);
    function finishRun(){ if(finished) return; finished = true; clearTimeout(slowTimer); advance(); }
    st.acceptPartial = finishRun;

    /* El motor avisa el progreso por NOMBRE de archivo (es lo único que tiene
       en su contrato). Con dos fuentes homónimas eso pintaría siempre la misma
       fila, así que entre las filas que comparten nombre se elige la que está
       en la etapa que corresponde. Con nombres distintos —el caso normal— se
       comporta exactamente igual que antes. */
    function filaDe(nombre, etapa){
      const mismas = rows.filter(r=>r.name===nombre);
      if(mismas.length<2) return mismas[0] || null;
      const terminal = r => r.status==="ok" || r.status==="vacio" || r.status==="error";
      const buscada = etapa==="terminado"
        ? mismas.find(r=>r.status==="leyendo")
        : mismas.find(r=>r.status==="queued");
      return buscada || mismas.find(r=>!terminal(r)) || mismas[0];
    }
    function pintarFila(r){ if(r && alive()) updateRow(r); }
    /* `srcId` es la identidad de la fuente y viaja hasta `meta` de cada
       tarjeta: es lo que después decide a qué reserva va el documento. */
    function anotarResultado(result, kind, srcId){
      result.kind = kind;
      result.srcId = srcId;
      const idx = st.archivos.findIndex(a=>a.srcId===srcId);
      if(idx>=0) st.archivos[idx] = result; else st.archivos.push(result);
      classifyAndQueue(result.reservas, {archivo:result.archivo, kind, paginas:result.paginas, srcId});
    }

    const archivos = sources.filter(s=>s.kind!=="texto");
    const textos   = sources.filter(s=>s.kind==="texto");
    const tareas = [];

    if(archivos.length){
      /* Los cuatro eventos del motor (§7.5), mapeados a los estados de la fila.
         Un onProgress que lanza no puede romper la importación: el motor lo
         envuelve, pero acá tampoco se hace nada que pueda fallar. */
      const onProgress = ev => {
        const fila = filaDe(ev.archivo, ev.evento);
        if(!fila) return;
        if(ev.evento==="preparado"){ fila.modo = ev.modo; }
        else if(ev.evento==="leyendo"){ fila.status = "leyendo"; pintarFila(fila); }
        else if(ev.evento==="terminado"){
          const r = ev.resultado || {};
          fila.status = r.estado || "error";
          fila.found = (r.reservas||[]).length;
          fila.modo = r.modo || fila.modo;
          pintarFila(fila);
        }
      };
      const opts = Object.assign(opcionesDelMotor(), {onProgress});
      tareas.push(
        ImportEngine.interpretFiles(archivos.map(f=>({name:f.name, mimeType:f.mimeType, blob:f.blob})), opts)
          .then(res=>{
            /* El número que decide si VAL-60 sirvió: cuántas llamadas salieron
               de verdad. No se puede leer desde el teléfono sin consola, y está
               declarado como brecha en la entrega. */
            try{ console.info("[valija] importación", res.resumen); }catch(e){}
            /* `interpretFiles` devuelve UN resultado por entrada y EN ORDEN
               (así está escrito su contrato): se empareja por posición, no por
               nombre, que es lo que se repite. */
            res.archivos.forEach((result,i)=>{
              const src = archivos[i] || null;
              anotarResultado(result, src ? src.kind : "img", src ? src.id : null);
            });
          }, e=>{
            /* `interpretFiles` no rechaza: un archivo que falla vuelve como
               `estado:"error"`. Si igual pasara algo raro, cada fila lo dice en
               vez de dejar la pantalla quieta para siempre. */
            console.warn("interpretFiles", e);
            archivos.forEach(a=>{
              anotarResultado({archivo:a.name, estado:"error", reservas:[], paginas:null,
                error:ImportEngine.friendlyModelError(e)}, a.kind, a.id);
              const fila = filaDe(a.name, "terminado");
              if(fila){ fila.status = "error"; pintarFila(fila); }
            });
          })
      );
    }

    textos.forEach(s=>{
      const fila = filaDe(s.name, "leyendo");
      if(fila){ fila.status = "leyendo"; pintarFila(fila); }
      tareas.push(runTextoPegado(s).then(result=>{
        if(fila){ fila.status = result.estado; fila.found = result.reservas.length; fila.modo = result.modo; pintarFila(fila); }
        classifyAndQueue(result.reservas, {archivo:result.archivo, kind:result.kind, paginas:result.paginas, srcId:s.id});
      }));
    });

    Promise.all(tareas).then(finishRun, finishRun);
  }
  function advance(){
    if(!alive()) return;
    const totalReservas = st.archivos.reduce((n,a)=>n+a.reservas.length,0);
    if(totalReservas===0 && !st.reviewList.length && !st.matchQueue.length) renderTotalEmpty();
    else proceed();
  }
  function proceed(){
    if(!alive()) return;
    if(st.matchQueue.length){ renderMatchStep(); return; }
    // Un lote sólo de coincidencias de vuelo (sin reservas nuevas ni archivos
    // con problemas) también pasa por la revisión final: ahí vive el único
    // botón que de verdad escribe, y el único punto donde cancelar todavía
    // sirve para no dejar nada aplicado.
    if(st.reviewList.length || st.archivos.some(a=>a.estado!=="ok")){ renderReview(); return; }
    // V6 · descartaste la tarjeta y era lo único que había: el cierre no puede
    // ser una pantalla en blanco ni un "listo" que no pasó.
    if(st.descartadas && !st.savedTotal && !st.matchDone){ renderNadaGuardado(); return; }
    finish();
  }

  /* ---------- 10: ninguno aportó nada ---------- */
  function bindIssuesActions(){
    document.querySelectorAll("[data-retry]").forEach(b=>{
      b.onclick = ()=>{
        const k = b.dataset.retry;
        const source = st.sources.find(s=>s.id===k) || st.sources.find(s=>s.name===k);
        if(source) runInterpretation([source]);
      };
    });
    document.querySelectorAll("[data-rmfile]").forEach(b=>{
      b.onclick = ()=>{
        const k = b.dataset.rmfile;
        st.archivos = st.archivos.filter(a=>(a.srcId||a.archivo)!==k);
        proceed();
      };
    });
  }
  function renderTotalEmpty(){
    if(!alive()) return;
    const n = st.archivos.length;
    const errCount = st.archivos.filter(a=>a.estado==="error").length;
    const vacioCount = n - errCount;
    let detalle;
    if(errCount && vacioCount) detalle = "Uno o más no se pudieron leer y los demás se leyeron bien pero no tenían pinta de reserva de viaje.";
    else if(errCount) detalle = n===1 ? "No se pudo leer." : "Ninguno se pudo leer.";
    else detalle = n===1 ? "Se leyó bien, pero no tenía pinta de reserva de viaje." : "Se leyeron bien, pero no tenían pinta de reserva de viaje.";
    const body = `${marker}
      <div class="empty">
        <h3>No conseguí ninguna reserva de ${n===1?"este archivo":`estos ${n} archivos`}</h3>
        <p>${detalle} El detalle de cada uno está abajo.</p>
      </div>
      ${issuesListHtml(st.archivos)}`;
    const footer = `<button class="btn ghost" id="im-manual">Cargar a mano</button>
      ${errCount?`<button class="btn primary" id="im-retryall">Reintentar ${errCount} ${errCount===1?"archivo":"archivos"}</button>`:""}`;
    openSheet("Importar reservas", body, footer);
    document.getElementById("im-manual").onclick = ()=>{ closeSheet(); sheetItem(trip, null); };
    const retryAll = document.getElementById("im-retryall");
    if(retryAll) retryAll.onclick = ()=>{
      const errIds = new Set(st.archivos.filter(a=>a.estado==="error").map(a=>a.srcId||a.archivo));
      const errSources = st.sources.filter(s=>errIds.has(s.id) || errIds.has(s.name));
      if(errSources.length) runInterpretation(errSources);
    };
    bindIssuesActions();
  }

  /* ---------- VAL-59: la tarjeta de embarque se desprende de un vuelo ----------
     La regla que atraviesa los tres casos: primero el match, siempre; después
     preguntar; nunca inventar. El motor decide CUÁL es el caso y devuelve los
     datos (`resultado:"sin-vuelo"` con su `caso`); acá se dibuja.

       "mismo"           → V1, una tarjeta de la revisión. No pregunta nada.
       "ambiguo"         → V5, el mismo componente de la iteración 2.
       "sin-vuelo" ·  sin-vuelos    → V2 · avisa y ofrece crear el vuelo
                   ·  un-vuelo      → V4 · dos salidas, ninguna preferida
                   ·  varios-vuelos → V5 · contra cuál la asocio */
  const CAMPO_ES = {
    from:"Origen", to:"Destino", provider:"Aerolínea", flightNumber:"Nº de vuelo",
    start:"Sale", end:"Llega", seat:"Asiento", terminal:"Terminal",
    gate:"Puerta", boardingTime:"Embarque", confirmation:"Código de reserva"
  };
  function valorCampo(r, f){
    const v = r[f] || "";
    if((f==="start" || f==="end") && v){
      const h = fmtTime(v);
      return fmtDate(v) + (h ? ` ${h}` : "");
    }
    return v;
  }
  /** "Lo que leí de la tarjeta": sólo lo que la tarjeta trae, sin rellenar. */
  function tarjetaDiffHtml(reserva, campos){
    const filas = campos.filter(f=>reserva[f]).map(f=>
      `<div class="field"><span class="k">${esc(CAMPO_ES[f]||f)}</span><span class="v">${esc(valorCampo(reserva,f))}</span></div>`).join("");
    return filas ? `<div class="imp-diff">${filas}</div>` : `<p class="tiny muted" style="margin:0">La tarjeta no trae ningún dato legible.</p>`;
  }
  function tituloTarjeta(reserva){
    if(reserva.flightNumber) return `Vuelo ${reserva.flightNumber}${reserva.start?`, ${fmtDateLong(reserva.start)}`:""}`;
    return "Tarjeta de embarque";
  }
  /** La tira del documento adentro de una tarjeta: a qué vuelo va a quedar
      enganchado el archivo. Cierra el círculo entre VAL-59 y VAL-58. */
  function tiraAdjuntoHtml(meta, frase){
    if(!meta || !meta.archivo) return "";
    const icon = kindIcon(meta.kind);
    return `<div class="imp-files"><div class="imp-file">
      <span class="imp-thumb ${kindThumbCls(meta.kind)}">${svg(I[icon])}</span>
      <span class="bd"><span class="nm">${esc(meta.archivo)}</span>
        <span class="meta">${esc(frase)}</span></span>
    </div></div>`;
  }

  function renderMatchStep(){
    if(!alive() || !st.matchQueue.length) return;
    const step = st.matchQueue[0];
    const res = step.match.resultado;
    if(res==="ambiguo"){ renderMatchAmbiguo(step); return; }
    if(res==="sin-vuelo"){
      if(step.match.caso==="sin-vuelos") renderTarjetaSinVuelos(step);
      else if(step.match.caso==="un-vuelo") renderTarjetaUnVuelo(step);
      else renderTarjetaVarios(step);
      return;
    }
    // "mismo" y "nuevo" ya no abren paso propio: se resuelven en la revisión.
    st.matchQueue.shift();
    proceed();
  }
  function srcChipForMeta(meta){
    if(!meta || !meta.archivo) return "";
    return `<span class="chip src">${svg(I[kindIcon(meta.kind)])}${esc(meta.archivo)}</span>`;
  }
  function flightLineHtml(f){
    const parts = [];
    if(f.from || f.to) parts.push(`${esc(f.from||"—")} → ${esc(f.to||"—")}`);
    if(f.start) parts.push(`${esc(fmtDate(f.start))}${fmtTime(f.start)?` ${esc(fmtTime(f.start))}`:""}`);
    const quien = [f.provider, f.flightNumber].filter(Boolean).join(" ");
    if(quien) parts.push(esc(quien));
    return parts.join(" · ") || "Vuelo";
  }

  /* ---------- V2: no hay ningún vuelo cargado ---------- */
  function renderTarjetaSinVuelos(step){
    const {reserva, match, meta} = step;
    const campos = match.precarga.desdeLaTarjeta;
    const vacios = match.precarga.vacios.map(f=>(CAMPO_ES[f]||f).toLowerCase());
    const body = `${marker}
      <div class="notice warn">${svg(I.info)}<span class="bd"><b>Esta tarjeta de embarque no tiene vuelo al que engancharse.</b>
        En este viaje no tenés ningún vuelo cargado, y una tarjeta sola no es una reserva: se desprende de un vuelo.
        ¿Creo el vuelo con lo que dice la tarjeta?</span></div>
      <div class="imp-card">
        <div class="imp-card-hd">
          <span class="pass-icon">${svg(TYPES.flight.icon)}</span>
          <span class="ttl">
            <span style="font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:-.005em">${esc(tituloTarjeta(reserva))}</span>
            <span class="imp-src"><span class="chip accent">Tarjeta de embarque</span>${srcChipForMeta(meta)}</span>
          </span>
        </div>
        <div class="imp-card-bd">
          <div class="f"><label>Lo que leí de la tarjeta</label>${tarjetaDiffHtml(reserva, campos)}</div>
          ${vacios.length?`<p class="tiny muted" style="margin:0">${esc(vacios.join(", "))} no ${vacios.length===1?"está":"están"} en la tarjeta. Si creás el vuelo, ${vacios.length===1?"ese campo queda vacío y lo completás":"esos campos quedan vacíos y los completás"} cuando quieras.</p>`:""}
        </div>
      </div>
      <p class="tiny muted" style="margin:0;text-align:center">Si la descartás no queda nada: ni el vuelo ni el archivo.</p>`;
    openSheet("Importar reservas", body, `
      <button class="btn ghost" id="im-descartar">Descartar la tarjeta</button>
      <button class="btn primary" id="im-crear">${svg(I.plus)} Crear el vuelo</button>`);
    document.getElementById("im-descartar").onclick = ()=> renderDescartarTarjeta(step);
    document.getElementById("im-crear").onclick = ()=>{
      st.matchQueue.shift();
      st.reviewList.push(cardVueloDeTarjeta(match.precarga, meta));
      proceed();
    };
  }

  /* ---------- V6: descartar la tarjeta se dice ---------- */
  function renderDescartarTarjeta(step){
    const body = `${marker}
      <div class="notice warn">${svg(I.info)}<span class="bd"><b>¿Descarto la tarjeta de embarque?</b>
        No se crea el vuelo y el archivo tampoco queda: se va todo. Siempre podés volver a importarla.</span></div>`;
    openSheet("Importar reservas", body, `
      <button class="btn ghost" id="im-volver">Volver</button>
      <button class="btn danger" id="im-descartar-ok">${svg(I.trash)} Sí, descartala</button>`);
    document.getElementById("im-volver").onclick = ()=> renderMatchStep();
    document.getElementById("im-descartar-ok").onclick = ()=>{
      st.matchQueue.shift();
      st.descartadas++;
      // El archivo de esa tarjeta no se adjunta a nada: ya no queda ninguna
      // tarjeta que salga de él.
      proceed();
    };
  }

  /* ---------- V4: hay UN vuelo cargado y no coincide ---------- */
  function renderTarjetaUnVuelo(step){
    const {reserva, match, meta} = step;
    const cand = match.candidatos[0];
    let selected = null;
    const nT = reserva.flightNumber ? `<b class="n">${esc(reserva.flightNumber)}</b>` : "no trae número de vuelo";
    const nV = cand.flightNumber ? `<b class="n">${esc(cand.flightNumber)}</b>` : "no tiene número cargado";
    const aviso = reserva.flightNumber
      ? `La tarjeta dice ${nT} y el único vuelo que tenés cargado ${cand.flightNumber?`dice ${nV}`:nV}. Puede ser que haya leído mal un número, o que sea otro vuelo. No lo decido yo: si tenés dudas, mirá el número impreso en la tarjeta.`
      : `La tarjeta ${nT}, así que no puedo compararla con el vuelo que tenés cargado sin adivinar. No lo decido yo: mirá la tarjeta y decime cuál es.`;
    const body = `${marker}
      <div class="notice warn">${svg(I.info)}<span class="bd">${aviso}</span></div>
      <div class="f"><label>Lo que leí de la tarjeta</label>${tarjetaDiffHtml(reserva, match.precarga.desdeLaTarjeta)}</div>
      <div class="f">
        <label>¿Qué hago con ella?</label>
        <div class="imp-choice" id="im-choice">
          <button type="button" aria-pressed="false" data-c="ex">
            <span class="radio"></span>
            <span class="info"><span class="t">Es este vuelo</span>
              <span class="s">${flightLineHtml(cand)}</span>
              <span class="tiny muted">Le sumo lo que trae la tarjeta y le adjunto el archivo</span></span>
          </button>
          <button type="button" aria-pressed="false" data-c="new">
            <span class="radio"></span>
            <span class="info"><span class="t">Es otro vuelo</span>
              <span class="s">${flightLineHtml(reserva)}</span>
              <span class="tiny muted">Creo un vuelo nuevo con lo que dice la tarjeta y le adjunto el archivo</span></span>
          </button>
        </div>
      </div>`;
    openSheet("Importar reservas", body, `
      <button class="btn ghost" id="im-cancel">Cancelar</button>
      <button class="btn primary" id="im-choicesave" disabled>Elegí una opción</button>`);
    document.getElementById("im-cancel").onclick = closeSheet;
    const choiceEl = document.getElementById("im-choice");
    const saveBtn = document.getElementById("im-choicesave");
    choiceEl.addEventListener("click", e=>{
      const b = e.target.closest("[data-c]"); if(!b) return;
      choiceEl.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed", x===b));
      selected = b.dataset.c;
      saveBtn.disabled = false;
      saveBtn.textContent = selected==="new" ? "Crear el vuelo nuevo" : "Completar ese vuelo";
    });
    saveBtn.onclick = ()=>{
      if(selected===null) return;
      st.matchQueue.shift();
      if(selected==="new") st.reviewList.push(cardVueloDeTarjeta(match.precarga, meta));
      else st.reviewList.push(matchCard(reserva, {
        resultado:"mismo", existente:cand, patch:ImportEngine.buildFlightPatch(reserva, cand),
        motivo:"Lo elegiste vos: dijiste que la tarjeta es de este vuelo. No se toca ningún dato que ya tuvieras."
      }, meta));
      proceed();
    };
  }

  /* ---------- V5: varios vuelos, contra cuál la asocio ----------
     Dos disparadores, un solo componente: el "ambiguo" de la iteración 2 y el
     "sin-vuelo" con más de un vuelo cargado. Lo único que cambia es el aviso
     de arriba, porque cambia el motivo. */
  function renderElegirVuelo(step, opts){
    const {reserva, match, meta} = step;
    const cand = opts.candidatos;
    let selected = null;
    const body = `${marker}
      <div class="notice warn">${svg(I.info)}<span class="bd">${opts.aviso}</span></div>
      ${opts.diff ? `<div class="f"><label>Lo que leí de la tarjeta</label>${tarjetaDiffHtml(reserva, opts.diff)}</div>` : ""}
      <div class="imp-choice" id="im-choice">
        ${cand.map((c,i)=>`
          <button type="button" aria-pressed="false" data-c="${i}">
            <span class="radio"></span>
            <span class="info"><span class="t">${esc(c.title||"Vuelo")}</span>
              <span class="s">${flightLineHtml(c)}</span></span>
          </button>`).join("")}
        <div class="sep">o</div>
        <button type="button" aria-pressed="false" data-c="n">
          <span class="radio"></span>
          <span class="info"><span class="t">${esc(opts.ninguno)}</span>
            <span class="s">${esc(opts.ningunoSub)}</span></span>
        </button>
      </div>
      ${meta && meta.archivo ? `<p class="tiny muted" style="margin:0">La tarjeta queda adjunta al vuelo que elijas, sea uno de estos o el nuevo.</p>` : ""}`;
    openSheet("Importar reservas", body, `
      <button class="btn ghost" id="im-cancel">Cancelar</button>
      <button class="btn primary" id="im-choicesave" disabled>Elegí una opción</button>`);
    document.getElementById("im-cancel").onclick = closeSheet;
    const choiceEl = document.getElementById("im-choice");
    const saveBtn = document.getElementById("im-choicesave");
    choiceEl.addEventListener("click", e=>{
      const b = e.target.closest("[data-c]"); if(!b) return;
      choiceEl.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed", x===b));
      selected = b.dataset.c;
      saveBtn.disabled = false;
      saveBtn.textContent = selected==="n" ? opts.botonNuevo : "Completar ese vuelo";
    });
    saveBtn.onclick = ()=>{
      if(selected===null) return;
      st.matchQueue.shift();
      if(selected==="n"){
        // Una tarjeta nunca se guarda como reserva suelta: se crea el vuelo
        // precargado (V3). Un pasaje que no es tarjeta sí es una reserva nueva.
        if(match.esTarjeta){
          const precarga = match.precarga || ImportEngine.preloadFlightFromBoardingPass(reserva);
          st.reviewList.push(cardVueloDeTarjeta(precarga, meta));
        }else{
          st.reviewList.push(makeCard(reserva, "Vuelo", meta));
        }
        proceed();
        return;
      }
      const ex = cand[Number(selected)];
      st.reviewList.push(matchCard(reserva, {
        resultado:"mismo", existente:ex, patch:ImportEngine.buildFlightPatch(reserva, ex),
        motivo:"Lo elegiste vos: dijiste que la tarjeta es de este vuelo. No se toca ningún dato que ya tuvieras."
      }, meta));
      proceed();
    };
  }
  function renderTarjetaVarios(step){
    const {reserva, match} = step;
    const n = match.candidatos.length;
    const aviso = reserva.flightNumber
      ? `La tarjeta dice <b class="n">${esc(reserva.flightNumber)}</b> y ninguno de los ${n} vuelos que tenés cargados tiene ese número. Puede ser un número mal leído, o un vuelo que todavía no cargaste. ¿A cuál la asocio?`
      : `La tarjeta no trae número de vuelo y tenés ${n} vuelos cargados: sin número no hay forma de distinguir sin adivinar. ¿A cuál la asocio?`;
    renderElegirVuelo(step, {
      candidatos: match.candidatos,
      aviso,
      diff: match.precarga.desdeLaTarjeta,
      ninguno:"Ninguno de estos",
      ningunoSub:"Creá el vuelo con lo que dice la tarjeta",
      botonNuevo:"Crear el vuelo nuevo"
    });
  }
  function renderMatchAmbiguo(step){
    const {match} = step;
    renderElegirVuelo(step, {
      candidatos: match.candidatos,
      aviso: `${esc(match.motivo)} ¿A cuál corresponde?`,
      diff: match.esTarjeta ? ImportEngine.preloadFlightFromBoardingPass(step.reserva).desdeLaTarjeta : null,
      ninguno: match.candidatos.length===2 ? "Ninguno de los dos" : "Ninguno de estos",
      ningunoSub: match.esTarjeta ? "Creá el vuelo con lo que dice la tarjeta" : "Es un vuelo nuevo, no lo tenía cargado",
      botonNuevo: match.esTarjeta ? "Crear el vuelo nuevo" : "Guardar como vuelo nuevo"
    });
  }

  /* ---------- 04/05: revisión ---------- */
  /** V1 · la tarjeta de una coincidencia: muestra lo que se va a completar y
      el motivo, y NO pregunta nada. La única salida es un enlace al pie, para
      quien sabe que el match está mal. */
  function matchCardHtml(card){
    const {reserva, match, meta} = card;
    const ex = match.existente;
    const patchFields = [["gate","Puerta"],["terminal","Terminal"],["seat","Asiento"],["boardingTime","Embarque"]]
      .filter(([k])=> match.patch[k]);
    return `<div class="imp-card" data-card="${card.id}">
      <div class="imp-card-hd">
        <span class="pass-icon">${svg(TYPES.flight.icon)}</span>
        <span class="ttl">
          <span style="font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:-.005em">Se completa ${esc(ex.title||"tu vuelo")}</span>
          <span class="imp-src"><span class="chip accent">${esc(card.chip)}</span>${srcChipForMeta(meta)}</span>
        </span>
      </div>
      <div class="imp-card-bd">
        <div class="f">
          <label>Ya tenías cargado</label>
          <div class="imp-existing">
            <span class="pass-icon">${svg(TYPES.flight.icon)}</span>
            <span class="info">
              <span class="pass-title">${esc(ex.title||"Vuelo")}</span>
              <span class="pass-when">${flightLineHtml(ex)}</span>
            </span>
          </div>
        </div>
        ${patchFields.length?`
        <div class="f">
          <label>Se completa con</label>
          <div class="imp-diff">
            ${patchFields.map(([k,label])=>`<div class="field"><span class="k">${esc(label)}</span><span class="v">${esc(match.patch[k])}</span></div>`).join("")}
          </div>
        </div>`:""}
        <p class="tiny muted" style="margin:0">${esc(match.motivo)}</p>
        ${tiraAdjuntoHtml(meta, "Queda adjunta a este vuelo")}
      </div>
      <div class="card-acts">
        <button class="act warn" data-notthis="${card.id}">No es este vuelo</button>
      </div>
    </div>`;
  }
  /** V3 · el vuelo precargado, en dos grupos con su cuenta. Los valores son
      inputs de verdad (corregir una letra mal leída es escribir encima) y lo
      que la tarjeta no trajo queda vacío y visible. */
  function vueloNuevoCardHtml(card){
    const r = card.reserva, p = card.precarga;
    const campoHtml = (f, vacio) => {
      // VAL-87 · origen y destino son el mismo campo que en todas partes.
      if(f==="from" || f==="to") return apCampoHtml(CAMPO_ES[f], r[f], {f});
      const tipo = (f==="start"||f==="end") ? `type="datetime-local"` : "";
      const mono = (f==="start"||f==="end") ? "" : `class="mono"`;
      return `<div class="f"><label>${esc(CAMPO_ES[f]||f)}</label>
        <input data-f="${f}" ${tipo} ${mono} value="${esc(r[f]||"")}" ${vacio?`placeholder="No lo encontré"`:""}></div>`;
    };
    return `<div class="imp-card" data-card="${card.id}">
      <div class="imp-card-hd">
        <span class="pass-icon">${svg(TYPES.flight.icon)}</span>
        <span class="ttl">
          <input class="imp-title" data-f="title" value="${esc(r.title||"")}" placeholder="Sin título">
          <span class="imp-src"><span class="chip accent">${esc(card.chip)}</span>${srcChipForMeta(card.meta)}</span>
        </span>
        <button class="imp-discard" aria-label="Descartar esta reserva" data-discard="${card.id}">${svg(I.x)}</button>
      </div>
      <div class="imp-card-bd">
        <div class="notice">${svg(I.info)}<span class="bd">Armé el vuelo con lo que trae la tarjeta: <b class="n">${p.desdeLaTarjeta.length}</b> de <b class="n">${p.campos}</b> campos. Los otros no están impresos en la tarjeta, así que quedan vacíos — completalos ahora o cuando los tengas.</span></div>
        <div class="imp-src"><span class="chip accent src">${p.desdeLaTarjeta.length} campos · de la tarjeta</span></div>
        ${p.desdeLaTarjeta.map(f=>campoHtml(f,false)).join("")}
        ${p.vacios.length?`<hr class="hr">
        <div class="imp-src"><span class="chip src">${svg(I.dash)}${p.vacios.length} campos · vacíos, no están en la tarjeta</span></div>
        ${p.vacios.map(f=>campoHtml(f,true)).join("")}`:""}
        <!-- VAL-80 · el vuelo precargado desde una tarjeta de embarque también
             trae origen y destino, y pueden salir sin código. Va después de los dos
             grupos porque origen y destino pueden caer en grupos distintos
             (uno leído de la tarjeta, el otro vacío). -->
        <div data-rutaaviso="1">${avisoRutaHtml(r.from, r.to)}</div>
        ${tiraAdjuntoHtml(card.meta, "Queda adjunta a este vuelo")}
      </div>
    </div>`;
  }
  function reviewCardHtml(card){
    if(card.kind==="match") return matchCardHtml(card);
    if(card.kind==="vuelo-nuevo") return vueloNuevoCardHtml(card);
    const r = card.reserva;
    const T = TYPES[r.type] || TYPES.note;
    const pageTxt = card.meta.page ? ` · pág. ${card.meta.page}` : "";
    const srcHtml = card.meta.archivo ? `<span class="chip src">${svg(I[kindIcon(card.meta.kind)])}${esc(card.meta.archivo)}${pageTxt}</span>` : "";
    return `<div class="imp-card" data-card="${card.id}">
      <div class="imp-card-hd">
        <span class="pass-icon ${T.cls}">${svg(T.icon)}</span>
        <span class="ttl">
          <input class="imp-title" data-f="title" value="${esc(r.title||"")}" placeholder="Sin título">
          <span class="imp-src"><span class="chip accent">${esc(card.chip)}</span>${srcHtml}</span>
        </span>
        <button class="imp-discard" aria-label="Descartar esta reserva" data-discard="${card.id}">${svg(I.x)}</button>
      </div>
      <div class="imp-card-bd">${cardFieldsHtml(r, card.chip)}</div>
    </div>`;
  }
  function syncReviewInputsToState(){
    st.reviewList.forEach(c=>{
      if(c.kind==="match") return;   // no tiene inputs: no se edita un vuelo que ya existe
      const el = document.querySelector(`[data-card="${c.id}"]`);
      if(!el) return;
      // VAL-87 · el campo de ciudad o aeropuerto guarda el código, no lo que muestra.
      el.querySelectorAll("[data-f]").forEach(inp=>{
        c.reserva[inp.dataset.f] = inp.closest("[data-ap]") ? apValor(inp) : inp.value.trim();
      });
    });
  }
  /** Texto del único botón que de verdad escribe: nombra las dos cosas que
      puede llegar a hacer (guardar reservas nuevas, completar vuelos con la
      tarjeta de embarque), nunca un "Guardar" genérico. Con lote mixto el
      sustantivo es "cambios", porque "reservas" no describe a un vuelo que se
      completa. */
  function saveReviewLabel(n, m){
    if(n && m) return `Guardar ${n+m} cambios`;
    if(m) return `Completar ${m} ${m===1?"vuelo":"vuelos"}`;
    if(n) return `Guardar ${n} ${n===1?"reserva":"reservas"}`;
    return "Nada para guardar";
  }
  function renderReview(){
    if(!alive()) return;
    const matches = st.reviewList.filter(c=>c.kind==="match");
    const nuevas  = st.reviewList.filter(c=>c.kind!=="match");
    const issues = st.archivos.filter(a=>a.estado!=="ok");
    const n = nuevas.length, m = matches.length, totalArchivos = st.archivos.length;
    const encontrados = [];
    if(n) encontrados.push(`${n} ${n===1?"reserva":"reservas"}`);
    if(m) encontrados.push(`${m} ${m===1?"vuelo":"vuelos"} para completar con la tarjeta de embarque`);
    const noticeTxt = encontrados.length
      ? `Encontré ${encontrados.join(" y ")}${totalArchivos>1?` en ${totalArchivos} archivos`:""}. ${issues.length?"Los que no aportaron nada, mirá el detalle más abajo. ":""}${n?"Revisá los datos y corregí lo que haga falta antes de guardar.":"Nada de esto se aplicó todavía: se escribe recién al confirmar."}`
      : "Ya no queda ninguna reserva para revisar. Mirá el detalle de los archivos más abajo.";
    // Las coincidencias primero: es lo que ya está decidido y sólo se muestra.
    const cards = matches.concat(nuevas);
    const body = `${marker}
      <div class="notice">${svg(I.info)}<span class="bd">${esc(noticeTxt)}</span></div>
      ${cards.length?`<div class="stack">${cards.map(reviewCardHtml).join("")}</div>
        <p class="tiny muted" style="margin:0">Costo, teléfono y notas se completan después, abriendo la reserva ya guardada. Acá sólo lo que la lectura automática suele errar: fechas, rutas y códigos.</p>`:""}
      ${issues.length?issuesListHtml(issues):""}`;
    const total = n + m;
    const footer = `<button class="btn ghost" id="im-cancel">Cancelar</button>
      <button class="btn primary" id="im-save" ${total?"":"disabled"}>${svg(I.spark)} ${saveReviewLabel(n,m)}</button>`;
    openSheet("Importar reservas", body, footer);
    document.getElementById("im-cancel").onclick = closeSheet;
    document.querySelectorAll("[data-discard]").forEach(b=>{
      b.onclick = ()=>{
        syncReviewInputsToState();
        st.reviewList = st.reviewList.filter(c=>c.id!==b.dataset.discard);
        renderReview();
      };
    });
    /* "No es este vuelo": la app no estaba pidiendo una decisión, estaba
       ofreciendo una corrección. Se vuelve a preguntar con los vuelos que
       quedan —sin el que la persona acaba de descartar— y de ahí sale V2, V4
       o V5 según cuántos haya. */
    document.querySelectorAll("[data-notthis]").forEach(b=>{
      b.onclick = ()=>{
        syncReviewInputsToState();
        const card = st.reviewList.find(c=>c.id===b.dataset.notthis);
        if(!card) return;
        st.reviewList = st.reviewList.filter(c=>c.id!==card.id);
        st.matchQueue.unshift(pasoSinVuelo(card.reserva, card.meta, card.match.existente.id));
        proceed();
      };
    });
    bindIssuesActions();
    /* VAL-80 · el aviso de la ruta, vivo mientras se corrige. Se engancha por
       tarjeta y no por delegación en el documento, porque la hoja se vuelve a
       dibujar entera en cada descarte y un listener colgado del contenedor
       viejo se quedaría escuchando a un nodo que ya no está. */
    document.querySelectorAll("[data-card]").forEach(el=>{
      const caja = el.querySelector("[data-rutaaviso]");
      if(!caja) return;                    // no es un vuelo, o es una coincidencia sin inputs
      const leer = f => apValorParaAviso(el.querySelector(`[data-f="${f}"]`));
      /* VAL-79, ronda 2: la pregunta del destino del vuelo no va al importar;
         va sólo en la valija (decisión del PM, 09/10). */
      const pintar = ()=>{ caja.innerHTML = avisoRutaHtml(leer("from"), leer("to")); };
      el.querySelectorAll("[data-ap]").forEach(w=> apEnganchar(w, pintar));
    });
    if(total) document.getElementById("im-save").onclick = doSaveReview;
  }
  /** Vuelve a plantear la pregunta de VAL-59 con los vuelos que quedan. El
      motor ya sabe cuáles son candidatos y en qué orden; acá no se ordena. */
  function pasoSinVuelo(reserva, meta, excluirId){
    const existentes = Store.itemsOf(trip.id).filter(x=> !excluirId || x.id!==excluirId);
    const candidatos = ImportEngine.flightCandidates(existentes);
    return {reserva, meta, match:{
      resultado:"sin-vuelo",
      caso: !candidatos.length ? "sin-vuelos" : (candidatos.length===1 ? "un-vuelo" : "varios-vuelos"),
      candidatos, esTarjeta:true,
      opciones: candidatos.length ? ["asociar","crear"] : ["crear"],
      precarga: ImportEngine.preloadFlightFromBoardingPass(reserva),
      motivo:"Dijiste que no es ese vuelo."
    }};
  }

  async function doSaveReview(){
    if(!alive()) return;
    syncReviewInputsToState();
    const cards = st.reviewList.slice();
    if(!cards.length) return;
    const matches = cards.filter(c=>c.kind==="match");
    const nuevas  = cards.filter(c=>c.kind!=="match");
    const saveBtn = document.getElementById("im-save");
    saveBtn.disabled = true; saveBtn.innerHTML = `<span class="spin"></span> Guardando…`;
    // Cada tarjeta ya sabe a qué reserva va: la que se completa, o una nueva.
    cards.forEach(c=>{ c.destinoId = c.kind==="match" ? c.match.existente.id : uid(); });
    // Vive afuera del `try` porque el `catch` lo necesita para barrer cuerpos.
    const trabajos = [];

    try{
      /* 1. Los documentos (VAL-58): UNO por archivo, al destino de la primera
         reserva que salió de ese archivo. Se prepara sin escribir nada, y si
         no entra, la reserva se guarda igual: el dato vale por sí mismo.

         La fuente se reconoce por su `id`, NUNCA por el nombre del archivo:
         dos archivos homónimos del mismo lote son dos fuentes distintas y cada
         una tiene que quedarse con su documento. */
      for(const src of st.sources){
        if(src.kind==="texto" || !src.blob) continue;
        const delSrc = cards.filter(c=>c.meta && c.meta.srcId===src.id);
        const card = delSrc[0];
        if(!card) continue;   // ese archivo no dejó ninguna reserva, o se descartó
        const info = st.archivos.find(a=>a.srcId===src.id) || null;
        const existente = card.kind==="match" ? card.match.existente : null;
        const r = await prepararAdjunto(src.blob, {
          origen:"importar",
          esTarjeta: !!(card.meta && card.meta.esTarjeta),
          tipoReserva: card.reserva.type,
          paginas: info ? info.paginas : null,
          docsActuales: (existente && existente.docs) || [],
          itemId: card.destinoId
        });
        // `hermanas`: las otras reservas que salieron del MISMO archivo. Son
        // las que se van a guardar sin comprobante, y el cierre las nombra.
        trabajos.push({src, card, r, guardado:false, referenciado:false, hermanas:delSrc.slice(1)});
      }
      for(const t of trabajos){
        if(!t.r.ok){ st.adjuntosFuera.push({nombre:t.src.name, mensaje:t.r.error.mensaje, detalle:(t.r.error && t.r.error.detalle) || ""}); continue; }
        try{ await Store.saveDocBody(trip.id, t.r.cuerpo); t.guardado = true; }
        catch(e){ st.adjuntosFuera.push({nombre:t.src.name, mensaje:AdjuntosEngine.interpretarErrorDeLaBase(e).mensaje}); }
      }
      /* Un cuerpo escrito que no termine referenciado por su ítem sería un
         huérfano: ocupa cupo de la base y ninguna pantalla lo puede borrar,
         porque `delItem`/`delTrip` sólo borran lo que está en `item.docs`. Por
         eso cada trabajo se marca `referenciado` en el mismo paso en que su
         ítem se guarda con el documento adentro, y lo que no llegó a
         referenciarse se borra en el `catch`. El orden no se invierte a
         propósito: guardar el ítem primero y el cuerpo después dejaría a la
         reserva prometiendo un documento que puede no existir, que es peor
         —se ve— que un cuerpo de más. */
      const trabajoDe = card => trabajos.find(x=>x.card===card && x.guardado) || null;

      // 2. Primero los vuelos que se completan, después las reservas nuevas.
      for(const c of matches){
        const ex = c.match.existente, t = trabajoDe(c), doc = t ? t.r.doc : null;
        const docs = ((ex.docs)||[]).concat(doc?[doc]:[]);
        await Store.saveItem(trip.id, Object.assign({}, ex, c.match.patch, {docs}));
        if(t) t.referenciado = true;
        if(doc) st.adjuntos.push({doc, destino: ex.title || "el vuelo"});
      }
      for(const c of nuevas){
        const r = c.reserva, t = trabajoDe(c), doc = t ? t.r.doc : null;
        const type = TYPES[r.type] ? r.type : "note";
        await Store.saveItem(trip.id, {
          id: c.destinoId, type,
          title:r.title||"", start:r.start||"", end:r.end||"",
          /* VAL-87 · en un vuelo, la misma tabla que el campo: un código va en
             mayúsculas y un texto ("Villa La Angostura") va como se escribió.
             El traslado no se toca: sigue como estaba. */
          from: type==="flight" ? apResolver(r.from).guarda : (r.from||"").toUpperCase(),
          to:   type==="flight" ? apResolver(r.to).guarda   : (r.to||"").toUpperCase(),
          provider:r.provider||"", flightNumber:(r.flightNumber||"").toUpperCase(),
          confirmation:(r.confirmation||"").toUpperCase(), seat:(r.seat||"").toUpperCase(),
          terminal:(r.terminal||"").toUpperCase(), gate:(r.gate||"").toUpperCase(),
          boardingTime:r.boardingTime||"",
          address:r.address||"", phone:r.phone||"", cost:r.cost||"",
          currency:(r.currency||"").toUpperCase(), notes:r.notes||"", source:"import",
          docs: doc?[doc]:[]
        });
        if(t) t.referenciado = true;
        if(doc) st.adjuntos.push({doc, destino: r.title || (TYPES[type]||TYPES.note).label});
      }
      /* D14 · un archivo que trajo varias reservas deja su documento en UNA
         sola, a propósito (un archivo, un documento). Las otras se guardan sin
         comprobante, y eso se dice: si no, la única forma de enterarse es
         abrir esa reserva y ver que no tiene la tira del documento. */
      trabajos.forEach(t=>{
        if(!t.referenciado || !t.hermanas.length) return;
        st.sinComprobante.push({
          archivo: t.src.name,
          conDoc: nombreDeReserva(t.card.kind==="match" ? t.card.match.existente : t.card.reserva),
          sinDoc: t.hermanas.map(h=> nombreDeReserva(h.kind==="match" ? h.match.existente : h.reserva))
        });
      });
      st.savedTotal += nuevas.length;
      st.matchDone += matches.length;
      st.reviewList = [];
      finish();
    }catch(e){
      /* Si falla a mitad de camino puede quedar parte del lote ya escrito
         (algunos `Store.saveItem` resolvieron antes del que falló). Dos cosas:
         se dice qué falló, y se barren los cuerpos que se escribieron pero
         cuyo ítem no llegó a guardarse. Sin ese barrido, un `saveItem` que
         falla justo después de un `saveDocBody` que anduvo deja el mismo
         huérfano que el cruce de nombres, por otra puerta. */
      try{
        for(const t of trabajos){
          if(t.guardado && !t.referenciado) await Store.delDocBody(trip.id, t.r.doc.id);
        }
      }catch(_){}
      toast(writeErr(e), true);
      saveBtn.disabled = false; saveBtn.innerHTML = `${svg(I.spark)} ${saveReviewLabel(nuevas.length, matches.length)}`;
    }
  }

  /* ---------- V6 (segunda parte): descartaste lo único que había ---------- */
  function renderNadaGuardado(){
    if(!alive()) return;
    const body = `${marker}
      <div class="empty">
        <h3>No quedó nada guardado</h3>
        <p>Descartaste la tarjeta de embarque y era lo único que había en esta carga. Ni el vuelo ni el archivo quedaron en la valija.</p>
      </div>`;
    openSheet("Importar reservas", body, `
      <button class="btn ghost" id="im-close">Cerrar</button>
      <button class="btn primary" id="im-manual">${svg(I.plus)} Cargar a mano</button>`);
    document.getElementById("im-close").onclick = closeSheet;
    document.getElementById("im-manual").onclick = ()=>{ closeSheet(); sheetItem(trip, null); };
  }

  /* ---------- 09 / D14: el cierre nombra qué quedó adjunto y qué no ---------- */
  function finish(){
    if(!alive()) return;
    const n = st.savedTotal, m = st.matchDone;
    const adj = st.adjuntos, fuera = st.adjuntosFuera, sinComp = st.sinComprobante;
    const sinCompN = sinComp.reduce((k,s)=>k+s.sinDoc.length, 0);
    const partes = [];
    if(n) partes.push(`${n} ${n===1?"reserva agregada":"reservas agregadas"}`);
    if(m) partes.push(`${m} ${m===1?"vuelo completado":"vuelos completados"} con la tarjeta de embarque`);
    if(adj.length) partes.push(`${adj.length} ${adj.length===1?"documento adjunto":"documentos adjuntos"}`);
    if(sinCompN) partes.push(`${sinCompN} ${sinCompN===1?"reserva sin comprobante":"reservas sin comprobante"}`);
    if(fuera.length) partes.push(`${fuera.length} ${fuera.length===1?"documento no entró":"documentos no entraron"}`);
    const resumen = partes.length ? partes.join(" · ") : "Listo";
    /** "A", "A y B", "A, B y C" — con las partes ya escapadas por quien llama. */
    const unir = ps => ps.length<=1 ? (ps[0]||"") : (ps.slice(0,-1).join(", ") + " y " + ps[ps.length-1]);

    // Sin documentos de por medio, el cierre es el de siempre: un toast y
    // afuera. Una hoja más para decir lo mismo sería un paso de más.
    if(!adj.length && !fuera.length && !sinComp.length){
      closeSheet();
      let msg;
      if(n && m) msg = `Guardado. Agregué ${n} ${n===1?"reserva":"reservas"} y completé ${m} ${m===1?"vuelo":"vuelos"} con los datos de la tarjeta de embarque.`;
      else if(m) msg = `Guardado. Completé ${m} ${m===1?"vuelo":"vuelos"} con los datos de la tarjeta de embarque.`;
      else if(n) msg = `${n} ${n===1?"reserva agregada":"reservas agregadas"}`;
      else msg = "Listo";
      toast(msg);
      if(n || m) checkPackingPlan(trip);
      return;
    }

    const okTxt = [
      "Guardado.",
      n ? `Agregué ${n} ${n===1?"reserva":"reservas"}.` : "",
      m ? `Completé ${m} ${m===1?"vuelo":"vuelos"} con los datos de la tarjeta de embarque.` : "",
      adj.length ? (sinComp.length
        ? `${adj.length===1?"El documento quedó adjunto":"Los documentos quedaron adjuntos"} a una reserva de cada archivo.`
        : `${adj.length===1?"El documento quedó adjunto":"Los documentos quedaron adjuntos"} a ${adj.length===1?"su reserva":"sus reservas"}.`) : ""
    ].filter(Boolean).join(" ");
    const body = `${marker}
      <div class="notice ok">${svg(I.check2)}<span class="bd">${esc(okTxt)}</span></div>
      ${fuera.map(f=>`<div class="notice warn">${svg(I.info)}<span class="bd"><b>Un documento quedó afuera:</b> <b>${esc(f.nombre)}</b> — ${esc(f.mensaje)} Sus reservas sí se guardaron; lo que no quedó es el archivo.${f.detalle ? `<br><span class="dato">${esc(f.detalle)} · v${esc(VALIJA_VERSION)}</span>` : ""}</span></div>`).join("")}
      ${sinComp.map(s=>{
        const k = s.sinDoc.length, total = k + 1;
        const nombres = unir(s.sinDoc.map(x=>`<b>${esc(x)}</b>`));
        return `<div class="notice warn">${svg(I.info)}<span class="bd"><b>El comprobante quedó en una sola reserva.</b>
          <b>${esc(s.archivo)}</b> trajo ${total} reservas y el archivo se guarda una vez: quedó adjunto a <b>${esc(s.conDoc)}</b>.
          ${k===1?`${nombres} se guardó con todos sus datos, pero sin el comprobante`:`${nombres} se guardaron con todos sus datos, pero sin el comprobante`}.
          Si lo querés ahí también, abrí ${k===1?"esa reserva":"cada una"} y adjuntá el mismo archivo desde <b>Documento</b>.</span></div>`;
      }).join("")}
      ${adj.length?`<div class="imp-files">${adj.map(a=>{
        const clas = AdjuntosEngine.clasificarArchivo({name:a.doc.nombre, mimeType:a.doc.mime});
        const icon = clas.familia==="imagen" ? "img" : "doc";
        const cls = clas.familia==="pdf" ? "pdf" : (clas.familia==="imagen" ? "img" : "");
        return `<div class="imp-file">
          <span class="imp-thumb ${cls}">${svg(I[icon])}</span>
          <span class="bd"><span class="nm">${esc(a.doc.nombreCorto||a.doc.nombre)}</span>
            <span class="meta ok">${esc(`Adjunto a ${a.destino} · ${AdjuntosEngine.textoFila(a.doc)}`)}</span></span>
        </div>`;
      }).join("")}</div>`:""}`;
    openSheet("Importar reservas", body, `<button class="btn primary block" id="im-done">Listo</button>`);
    document.getElementById("im-done").onclick = closeSheet;
    toast(resumen, !!fuera.length || !!sinCompN);
    if(n || m) checkPackingPlan(trip);
  }
  renderElegir();
}
