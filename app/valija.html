     Esto NO depende de ninguna hipótesis sobre el teléfono del PM, y es la
     diferencia con los otros dos arreglos de este defecto: se sostiene solo.

     `size: 0` significa "no sé cuánto mide", no "no tiene nada adentro". Son
     dos afirmaciones distintas y el motor las confundía: concluía "está
     vacío" de ese cero y ni siquiera intentaba leer. Lo único que prueba que
     un archivo está vacío es leerlo y que no venga nada.

     Que en Android un proveedor —el correo, Drive— pueda entregar un archivo
     entero sin el dato de cuánto mide es plausible y encaja con lo que el PM
     vio (el PDF del mail falló, la foto de la cámara entró y esa sí trae su
     tamaño), pero es hipótesis y no está observada en el aparato. No importa:
     el arreglo no la necesita. Tratar un cero como desconocido y caer al
     camino que lee para saber es correcto en cualquier navegador, porque la
     premisa que se corrige es un error de lógica, no una conjetura sobre una
     plataforma.

     Lo reproduce `app/pruebas/archivo-sin-tamano.js`. */
  var tam = tamañoDe(file);
  if (tam === 0) tam = null;

  var ctx = {
    id: opts.id || generarId(),
    itemId: opts.itemId || null,
    at: opts.ahora || new Date().toISOString(),
    nombre: norm(file && file.name) || ("documento." + (clas.extension || "bin")),
    origen: opts.origen || "manual",
    paginas: typeof opts.paginas === "number" ? opts.paginas : null,
    clas: clas
  };
  ctx.nombreCorto = nombreCorto({
    origen: ctx.origen, esTarjeta: opts.esTarjeta, tipoReserva: opts.tipoReserva, nombre: ctx.nombre
  });

  /* Caminos 1 y 2, que ahora son el mismo. Antes se separaban porque con el
     tamaño conocido se creía que no hacía falta leer para decidir; la
     experiencia dijo lo contrario.

     Precisión que la auditoría del 17/09 pidió y corresponde: esto NO es
     "siempre lee". Un archivo que informa un tamaño MAYOR al tope sigue yendo
     al camino 3 sin leerse, y está bien: ahí el número alcanza para decidir
     porque el error sería aceptar algo que no entra, no rechazar algo que sí.
     Lo que cambió es que un tamaño chico —o cero— ya no concluye nada. */
  if (tam === null || tam <= TOPE_ARCHIVO_BYTES) {
    return leerBytesConDiagnostico(file, opts).then(function (r) {
      var bytes = r.bytes;
      if (!bytes.length) {
        return resultadoFallido("archivo-vacio", { detalle: detalleDeLectura(file, r.intentos) });
      }
      if (bytes.length > TOPE_ARCHIVO_BYTES) return rutaGrande(file, opts, ctx, bytes.length);
      return armar(ctx, bytes, clas.mime, "ok", null);
    }, function (e) {
      /* NO ENCONTRÉ CÓMO LLEGAR ACÁ, y lo digo así.

         La auditoría del 17/09 marcó esta rama como código muerto. La primera
         respuesta que escribí fue que sí se alcanzaba, "porque `normalizarBytes`
         puede lanzar sobre un valor inyectado por `opts.leerBytes`". Era falso,
         y la segunda auditoría lo agarró: esa rama de `leerBytesConDiagnostico`
         tiene su propio manejador de rechazo y devuelve bytes vacíos, así que
         nunca propaga. Inventé una justificación en vez de comprobarla — la
         misma trampa que el proyecto tiene escrita, cometida al contestar una
         auditoría.

         Lo comprobé después, con cinco intentos de llegar (quedan en
         `app/pruebas/preparar-no-lanza.js`): `opts.leerBytes` que rechaza, que
         devuelve basura y que lanza sincrónico, y `file.bytes` con un valor
         raro y con un objeto hostil. Ninguno cae acá.

         Se queda de todos modos, y eso es una DECISIÓN, no un hecho
         demostrado: el costo es una función anónima que no corre, y el
         beneficio es que si mañana alguien agrega un camino de lectura que sí
         rechace, el usuario ve un mensaje en vez de nada. Lo que no se puede
         es seguir afirmando que dispara. */
      return resultadoFallido("no-se-pudo-leer", { detalle: detalleDeLectura(file, [{ via: "lectura", bytes: null, error: (e && e.name) || "Error" }]) });
    });
  }

  // Camino 3: pesa más que el tope.
  return rutaGrande(file, opts, ctx, tam);
}

/** Qué se hace con un archivo que no entra tal cual. */
function rutaGrande(file, opts, ctx, bytes) {
  if (!ctx.clas.recomprimible) {
    return Promise.resolve(resultadoFallido("no-entra-pdf", { bytes: bytes }));
  }
  var rec = resolverRecompresor(opts);
  if (typeof rec !== "function") {
    return Promise.resolve(resultadoFallido("sin-recompresor", { bytes: bytes }));
  }
  return bajarLaEscalera(file, rec, bytes).then(function (r) {
    if (typeof rec.liberar === "function") { try { rec.liberar(file); } catch (e) {} }
    if (!r.ok) return resultadoFallido(r.codigo, { bytes: bytes });
    return armar(ctx, r.bytes, r.mime, "recomprimido", {
      desdeBytes: bytes,
      aBytes: r.bytes.length,
      pasos: r.pasos,
      ladoMayor: r.paso.ladoMayor,
      calidad: r.paso.calidad
    });
  }, function () {
    if (typeof rec.liberar === "function") { try { rec.liberar(file); } catch (e) {} }
    return resultadoFallido("no-se-pudo-reducir", { bytes: bytes });
  });
}

/**
 * Prueba los pasos de la escalera en orden y se queda con el PRIMERO
 * que entra. No sigue achicando de gusto: cada paso de más es calidad
 * tirada a la basura en el documento que después hay que leer.
 */
function bajarLaEscalera(file, recomprimir, bytesOriginales) {
  var pasos = 0;
  function intentar(i) {
    if (i >= ESCALERA_RECOMPRESION.length) {
      return Promise.resolve({ ok: false, codigo: "no-entra-ni-reducida", pasos: pasos });
    }
    var paso = { ladoMayor: ESCALERA_RECOMPRESION[i].ladoMayor,
                 calidad: ESCALERA_RECOMPRESION[i].calidad,
                 mime: MIME_RECOMPRIMIDO };
    return Promise.resolve(recomprimir(file, paso)).then(function (salida) {
      pasos++;
      var bytes = normalizarBytes(salida && salida.bytes);
      if (bytes.length && bytes.length <= OBJETIVO_RECOMPRESION_BYTES && bytes.length < bytesOriginales) {
        return { ok: true, bytes: bytes, mime: (salida && salida.mime) || MIME_RECOMPRIMIDO, paso: paso, pasos: pasos };
      }
      return intentar(i + 1);
    });
  }
  return intentar(0);
}

/** Arma el resultado bueno: metadatos para el ítem y cuerpo para su documento. */
function armar(ctx, bytes, mime, estado, recompresion) {
  var doc = {
    id: ctx.id,
    nombre: ctx.nombre,
    nombreCorto: ctx.nombreCorto,
    mime: mime,
    bytes: bytes.length,
    paginas: ctx.paginas,
    estado: estado,
    origen: ctx.origen,
    at: ctx.at
  };
  if (estado === "recomprimido") doc.bytesOriginales = recompresion.desdeBytes;

  var cuerpo = {
    id: ctx.id,
    itemId: ctx.itemId,
    mime: mime,
    bytes: bytes.length,
    at: ctx.at,
    b64: bytesABase64(bytes)
  };

  var advertencias = [];
  if (bytesSerializados(cuerpo) > TOPE_DOC_BASE_BYTES) {
    advertencias.push(advertenciaInfo("al-filo-del-tope", { bytes: bytes.length }));
  }

  return {
    estado: estado,
    ok: true,
    bloqueaGuardado: false,
    doc: doc,
    cuerpo: cuerpo,
    recompresion: recompresion,
    error: null,
    advertencias: advertencias
  };
}

/* ============================================================
   EXPORTA
   ============================================================ */
return {
  VERSION: VERSION,

  // Topes (los del brief y los del contrato de la base)
  TOPE_ARCHIVO_BYTES: TOPE_ARCHIVO_BYTES,
  TOPE_DOC_BASE_BYTES: TOPE_DOC_BASE_BYTES,
  OBJETIVO_RECOMPRESION_BYTES: OBJETIVO_RECOMPRESION_BYTES,
  MAX_DOCS_POR_RESERVA: MAX_DOCS_POR_RESERVA,
  MAX_DOCS_BASE: MAX_DOCS_BASE,

  // Reglas declaradas como datos
  TIPOS: TIPOS,
  ORIGENES: ORIGENES,
  REGLAS_NOMBRE_CORTO: REGLAS_NOMBRE_CORTO,
  ESCALERA_RECOMPRESION: ESCALERA_RECOMPRESION,
  PISO_LADO_MAYOR: PISO_LADO_MAYOR,
  PISO_CALIDAD: PISO_CALIDAD,
  MIME_RECOMPRIMIDO: MIME_RECOMPRIMIDO,
  ERRORES: ERRORES,
  ERRORES_BASE: ERRORES_BASE,

  // Cuentas
  bytesCodificados: bytesCodificados,
  bytesSerializados: bytesSerializados,
  bytesABase64: bytesABase64,
  base64ABytes: base64ABytes,
  formatearBytes: formatearBytes,
  fechaCorta: fechaCorta,

  // Clasificación y nombres
  clasificarArchivo: clasificarArchivo,
  etiquetaTipo: etiquetaTipo,
  nombreCorto: nombreCorto,
  nombreDeDescarga: nombreDeDescarga,
  rutaDelCuerpo: rutaDelCuerpo,

  // Cupo
  espacioParaDocumentos: espacioParaDocumentos,
  agregarDocumento: agregarDocumento,
  quitarDocumento: quitarDocumento,
  presupuestoDeLaBase: presupuestoDeLaBase,
  interpretarErrorDeLaBase: interpretarErrorDeLaBase,
  leerBytesConDiagnostico: leerBytesConDiagnostico,
  detalleDeLectura: detalleDeLectura,

  // Textos derivados de los metadatos
  textoTira: textoTira,
  textoFila: textoFila,
  lineaDeDatos: lineaDeDatos,
  avisoMenorCalidad: avisoMenorCalidad,

  // Preparar (la puerta de entrada)
  prepararDocumento: prepararDocumento,
  bajarLaEscalera: bajarLaEscalera,

  // La única que toca el DOM
  recomprimirImagenConCanvas: recomprimirImagenConCanvas
};
})();

function readHash(){
  const h = location.hash.replace(/^#\/?/,"");
  const [a,b,c] = h.split("/");
  if(a==="trip" && b && c==="valija"){ App.view="packing"; App.tripId=b; }
  else if(a==="trip" && b){ App.view="trip"; App.tripId=b; }
  else { App.view="home"; App.tripId=null; }
}
function go(hash){ location.hash = hash; }
window.addEventListener("hashchange", ()=>{ readHash(); Store.watch(App.tripId); Store.watchPacking(App.tripId); render(); });

const $hdr = document.getElementById("hdr");
const $main = document.getElementById("main");
const $fab = document.getElementById("fab");
const $pkdock = document.getElementById("pkdock");

// Con un link compartido el viaje llega desde la nube, no de este dispositivo.
// Mientras la nube no contestó no sabemos si existe, así que esperamos en vez
// de rebotar a la lista.
function tripResuelto(){ return Store.ready && (!Store.db || Store.cloudSynced); }
function esperando(){
  $main.innerHTML = `<div class="sk"></div><div class="sk"></div>`;
  $fab.innerHTML = "";
}

function render(){
  pkSyncMount();   // montar/desmontar la pantalla de la valija (limpieza de marcas, § 4.3)
  if(App.view==="trip"){
    const trip = Store.trips.get(App.tripId);
    if(!trip && tripResuelto()){ go(""); return; }
    if(!trip){ esperando(); return; }
    renderTrip(trip);
  } else if(App.view==="packing"){
    const trip = Store.trips.get(App.tripId);
    if(!trip && tripResuelto()){ go(""); return; }
    if(!trip){ esperando(); return; }
    renderPacking(trip);
  } else {
    renderHome();
  }
}

    $main.innerHTML = `
      <div class="empty">
        <div class="ico">🧳</div>
        <h3>Tu valija está vacía</h3>
        <p>Abrí un viaje y empezá a guardar vuelos, alojamientos y autos. Podés tener todos los viajes que quieras en paralelo.</p>

  } else {
    const now = new Date().toISOString().slice(0,10);

    const section = (title, list) => !list.length ? "" : `

    });

  $fab.innerHTML = `<div class="fab">
    <button class="btn primary block" id="newtrip">${svg(I.plus)} Nuevo viaje</button>
  </div>`;

  if(!Store.canWrite){ nt.disabled = true; nt.title = "Tenés acceso de sólo lectura"; }
  else nt.onclick = ()=> sheetTrip(null);
}

function cardTrip(t){
  const items = Store.itemsOf(t.id);
  const [from,to] = routeCodes(t, items);
  const pct = completeness(t, items);
  const alerts = tripAlerts(t, items);
  const crit = alerts.filter(a=>a.sev==="crit").length;
  const soon = alerts.filter(a=>a.sev==="soon").length;
  const dd = daysUntil(t.startDate);
  const ringCls = pct>=85?"":(pct>=50?"warn":"low");
  const C = 2*Math.PI*14.5;

  const chips = [];
  if(dd!==null && dd>=0 && dd<=30) chips.push(`<span class="chip live">${dd===0?"hoy":`en ${dd} d`}</span>`);
  if(crit) chips.push(`<span class="chip alert">${crit} sin completar</span>`);
  if(!crit && soon) chips.push(`<span class="chip soon">${soon} por hacer</span>`);
  if(!crit && !soon && items.length) chips.push(`<span class="chip ok">listo</span>`);
  if(items.length) chips.push(`<span class="chip">${items.length} ${items.length===1?"reserva":"reservas"}</span>`);
  if(t.sample) chips.push(`<span class="chip accent">ejemplo</span>`);

  return `
  <button class="tag-card" data-trip="${esc(t.id)}" style="--band:${bandColor(t)}">
    <div class="tag-band"><span>${esc((t.destination||t.name||"VIAJE").toUpperCase().slice(0,14))}</span></div>
    <div class="tag-body">
      <div>
        <div class="route">
          ${from?`<span class="code">${esc(from)}</span><span class="dash"></span>`:""}
          ${svg(I.planeSmall)}
          <span class="dash"></span><span class="code">${esc(to)}</span>
        </div>
      </div>
      <span class="trip-name">${esc(t.name||"Viaje sin nombre")}</span>
      <div class="tag-meta">
        <div style="min-width:0;display:flex;flex-direction:column;gap:6px">
          <span class="dates">${esc(fmtRange(t.startDate,t.endDate))}</span>
          <div class="chips">${chips.join("")}</div>
        </div>
        <div class="ring ${ringCls}" title="${pct}% completo">
          <svg viewBox="0 0 34 34">
            <circle class="bg" cx="17" cy="17" r="14.5"></circle>
            <circle class="fg" cx="17" cy="17" r="14.5"
              stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}"></circle>
          </svg>
          <b>${pct}</b>
        </div>
      </div>
    </div>
  </button>`;
}

/* ---------- tira de entrada a la valija, arriba del segmentado ---------- */
function renderPackingEntry(trip, list){
  const dd = daysUntil(trip.startDate);
  if(list){
    // 14 · la lista quedó vieja y todavía no se aplazó: la tira lo dice acá,
    // que es donde la persona está parada cuando guarda una reserva.
    // Sin lista guardada no hay nada que actualizar y la tira no cambia.
    const plan = planOfrecible(trip.id);
    if(plan){
      const n = plan.nuevos.length;
      const r = planReserva(plan);
      return `<button class="vj-entry live" id="vjentry">
        <span class="band"></span>
        <span class="bd">
          <span class="t">Valija <span class="chip soon">${n} ${n===1?"cosa nueva":"cosas nuevas"}</span></span>
          <span class="s">${esc(r ? `Agregaste ${r}` : "El viaje cambió")}</span>
        </span>
        <span class="go">${svg(I.chev)}</span>
      </button>`;
    }
    const c = PackingEngine.packingProgress(list);
    const pctPack = c.total ? c.empacados/c.total*100 : 100;
    const pctDrop = 0;
    if(c.pendientes > 0){
      return `<button class="vj-entry live" id="vjentry">
        <span class="band"></span>
        <span class="bd">
          <span class="t">Valija</span>
          <span class="pk-prog">
            <span class="pk-bar"><i class="p" style="width:${pctPack}%"></i><i class="d" style="width:${pctDrop}%"></i></span>
            <span class="n"><b>${c.empacados}</b> de ${c.total} · faltan ${c.pendientes}</span>
          </span>
        </span>
        <span class="go">${svg(I.chev)}</span>
      </button>`;
    }
    return `<button class="vj-entry done" id="vjentry">
      <span class="band"></span>
      <span class="bd">
        <span class="t">Valija lista</span>
        <span class="pk-prog full">
          <span class="pk-bar"><i class="p" style="width:${pctPack}%"></i><i class="d" style="width:${pctDrop}%"></i></span>
          <span class="n"><b>${c.empacados}</b> de ${c.total}${c.descartados?` · ${c.descartados} descartados`:""}</span>
        </span>
      </span>
      <span class="go">${svg(I.chev)}</span>
    </button>`;
  }
  if(dd!==null && dd>=0 && dd<3){
    return `<button class="vj-entry due" id="vjentry">
      <span class="band"></span>
      <span class="bd">
        <span class="t">Valija <span class="chip soon">${dd===0?"salís hoy":`salís en ${dd} ${dd===1?"día":"días"}`}</span></span>
        <span class="s">Todavía no armaste la lista</span>
      </span>
      <span class="go">${svg(I.chev)}</span>
    </button>`;
  }
  return `<button class="vj-entry" id="vjentry">
    <span class="band"></span>
    <span class="bd">
      <span class="t">Valija</span>
      <span class="s">Armá la lista de lo que llevás</span>
    </span>
    <span class="go">${svg(I.chev)}</span>
  </button>`;
}

  /* D1 → D2/D3: la tira del documento abre el visor. Un toque, sin submenús:
     es el camino del mostrador de embarque. */
  $main.querySelectorAll("[data-doc]").forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const it = Store.itemsOf(trip.id).find(x=>x.id===b.dataset.docItem);
      if(it) sheetDoc(trip, it, b.dataset.doc);
    };
  });

  $fab.innerHTML = `<div class="fab">
    <button class="btn primary" id="additem" style="flex:2">${svg(I.plus)} Agregar</button>
    <button class="btn" id="imp" style="flex:1.2">${svg(I.spark)} Importar</button>
    <button class="btn" id="pdf" aria-label="Exportar PDF" style="flex:0 0 46px;padding:11px 0">${svg(I.pdf)}</button>
  </div>`;
  const ai = document.getElementById("additem"), im = document.getElementById("imp");
  if(!Store.canWrite){ ai.disabled=true; im.disabled=true; }
  else { ai.onclick = ()=> sheetItem(trip,null); im.onclick = ()=> sheetImport(trip); }
  document.getElementById("pdf").onclick = ()=> exportPDF(trip);
}

function viewPlan(trip, items){
  if(!items.length){
    return `<div class="empty">
      <div class="ico">✈️</div>
      <h3>Todavía no hay nada cargado</h3>
      <p>Agregá el primer vuelo, o pegá el mail de confirmación en <b>Importar</b> y lo interpreto por vos.</p>
    </div>`;
  }
  // agrupar por día
  const groups = new Map();
  const undated = [];
  items.forEach(it=>{
    const k = dayKey(it.start);
    if(!k){ undated.push(it); return; }
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(it);
  });
  const keys = [...groups.keys()].sort();
  const base = trip.startDate ? dayKey(trip.startDate) : keys[0];

  let html = "";
  keys.forEach(k=>{
    const list = groups.get(k).sort((a,b)=> String(a.start||"").localeCompare(String(b.start||"")));
    const n = base ? Math.round((new Date(k)-new Date(base))/86400000)+1 : null;
    html += `<div class="day">
      <div class="day-head">
        ${n&&n>0?`<span class="day-n">Día ${n}</span>`:""}
        <span class="day-date">${esc(fmtDateLong(k))}</span>
        <span class="day-rule"></span>
      </div>
      ${list.map(it=>cardItem(it)).join("")}
    </div>`;
  });
  if(undated.length){
    html += `<div class="day">
      <div class="day-head"><span class="day-n" style="background:var(--ink-3)">Sin fecha</span><span class="day-rule"></span></div>
      ${undated.map(it=>cardItem(it)).join("")}
    </div>`;
  }
  return html;
}

function cardItem(it){
  const T = TYPES[it.type] || TYPES.note;
  const miss = missingFields(it);
  const t1 = fmtTime(it.start), t2 = fmtTime(it.end);

  // El talón muestra los datos propios del tipo de reserva.
  // Tercer valor: true = campo obligatorio, se muestra aunque esté vacío.
  let stub = [];
  if(it.type==="flight"){
    stub = [
      ["Vuelo", it.flightNumber || it.provider, true],
      ["Ruta", (it.from||it.to) ? (it.from||"—")+" → "+(it.to||"—") : "", true],
      ["Reserva", it.confirmation, true],
      ["Asiento", it.seat, false],
      ["Terminal", it.terminal, false],
      ["Puerta", it.gate, false],
      ["Embarque", it.boardingTime, false]
    ];
  } else if(it.type==="stay"){
    stub = [
      ["Alojamiento", it.provider, true],
      ["Check-in", t1 || (it.start?fmtDate(it.start):""), true],
      ["Check-out", t2 || (it.end?fmtDate(it.end):""), true],
      ["Noches", nightsBetween(it.start,it.end) || "", false],
      ["Reserva", it.confirmation, true],
      ["Dirección", it.address, true]
    ];
  } else if(it.type==="car"){
    stub = [
      ["Rentadora", it.provider, true],
      ["Retiro", it.start?fmtDate(it.start):"", true],
      ["Devolución", it.end?fmtDate(it.end):"", true],
      ["Reserva", it.confirmation, true],
      ["Lugar", it.address, true]
    ];
  } else {
    stub = [
      ["Dónde", it.address || it.to, false],
      ["Reserva", it.confirmation, false],
      ["Proveedor", it.provider, false]
    ];
  }
  stub = stub.filter(([,v,req]) => v || req);

  const cost = it.cost ? `<span class="chip">${esc(it.currency||"")} ${esc(it.cost)}</span>` : "";
  const missChip = miss.length ? `<span class="chip alert">falta ${miss.length}</span>` : "";

  const stubHtml = stub.length ? `<div class="pass-stub">${stub.map(([k,v])=>`
    <div class="field"><span class="k">${esc(k)}</span>
    <span class="v ${v?"":"miss"}">${v?esc(v):"pendiente"}</span></div>`).join("")}</div>` : "";


  /* D1 · el documento adjunto, una tira por documento debajo del troquelado.
     Si la reserva no tiene documentos, `.pass-docs` NO se renderiza: la
     tarjeta queda exactamente igual que antes. En la tira va sólo lo que hace
     falta para decidir tocarla —qué es y cuánto pesa—; el nombre del archivo,
     las páginas, la fecha, la compresión y la descarga viven en el visor. */
  const docs = Array.isArray(it.docs) ? it.docs.filter(Boolean) : [];
  const docsHtml = docs.length ? `<div class="pass-docs">${docs.map(d=>`
    <button class="pass-doc" data-doc="${esc(d.id)}" data-doc-item="${esc(it.id)}">
      ${svg(I.clip)}
      <span class="nm">${esc(d.nombreCorto || d.nombre || "Documento")}</span>
      <span class="sz">${esc(AdjuntosEngine.textoTira(d))}</span>
    </button>`).join("")}</div>` : "";

  return `<div class="pass">
    <button class="pass-main" data-item="${esc(it.id)}">
      <span class="pass-icon ${T.cls}">${svg(T.icon)}</span>
      <span class="pass-txt">
        <span class="pass-title">${esc(it.title || T.label)}</span>
        <span class="pass-when">${esc(T.label)}${it.provider?` · ${esc(it.provider)}`:""}</span>
        <span class="chips">${missChip}${cost}</span>
      </span>
      ${t1?`<span class="pass-time">${t1}${t2?`<small>a ${t2}</small>`:""}</span>`:""}
    </button>
    ${stubHtml}
    ${docsHtml}
  </div>`;
}

function viewTodo(trip, alerts){
  if(!alerts.length){
    return `<div class="empty">
      <div class="ico">🎉</div>
      <h3>No falta nada</h3>
      <p>Todas las reservas están completas y no hay vencimientos cerca. Buen viaje.</p>

/* ============================================================
   VALIJA INTELIGENTE — pantalla propia (VAL-30..33)
   No es una pestaña del segmentado: `App.view==="packing"` es una
   tercera vista del router, hermana de "trip", que reusa `App.tripId`.
   Ver docs/design/valija-inteligente.md, sección 5.3.

   Estado efímero de esta pantalla, en memoria, NO en el documento
   guardado: qué categorías se abrieron/cerraron a mano, si se está
   generando, si el aviso de "recién ajustado por destino" ya se
   mostró, y el tipo de viaje elegido a mano en el selector.
   ============================================================ */
function pkEstadoInicial(tripId){
  return {
    tripId, generating:false, justEnriched:false, openCats:{}, adding:null,
    pickingType:false, selectedType:null, typeCounts:null,
    /* ---------- bloque B: las tres señales nuevas ---------- */
    applied:false,          // se acaba de aplicar un plan: aviso 18
    appliedN:0, appliedReserva:null,
    fresh:false,            // animación .fresh de llegada, una sola vez
    avisoAplazado:null,     // acuse "Ahora no" (estado 19), de una sola visita
    hideRemovals:false,     // el aviso 20 se cerró en ESTA visita (§ 4.4)
    seenNew:new Set(),      // claves de ítems nuevos ya vistos en esta visita
    visitsSinceApply:0,     // degradación sin IntersectionObserver (§ 4.3)
    io:null, ioTimers:new Map(), ioOk:(typeof IntersectionObserver === "function")
  };
}
let PK = pkEstadoInicial(null);
function resetPKIfNeeded(tripId){
  if(PK.tripId !== tripId){
    pkStopObserver();
    PK = pkEstadoInicial(tripId);
  }
}

/* ============================================================
   VAL-46 · EL PLAN DE ACTUALIZACIÓN — memoria, aplazamiento y disparo
   Ver docs/design/valija-inteligente-b.md, § 4.2 y § 5 (puntos 3 y 5).
   ============================================================ */

/** Firma del plan: qué ítems ofrece, sin importar el orden. */
function planFirma(plan){
  return ((plan && plan.nuevos) || []).map(n=>n.clave).sort().join("|");
}

/* El aplazamiento vive en ESTE dispositivo, nunca en el documento compartido:
   es una decisión personal, no del viaje, y quien mira sin permiso de edición
   también tiene que poder sacarse el aviso de encima (§ 4.2). Si localStorage
   no está disponible, vale para la sesión en memoria y listo. */
const PK_APLAZADO_MEM = new Map();
const pkAplazadoKey = tripId => `valija.pk.aplazado.${tripId}`;
function pkAplazadoDe(tripId){
  try{
    const raw = localStorage.getItem(pkAplazadoKey(tripId));
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return PK_APLAZADO_MEM.get(tripId) || null;
}
function pkGuardarAplazado(tripId, plan){
  const dato = { firma:planFirma(plan), en:new Date().toISOString() };
  PK_APLAZADO_MEM.set(tripId, dato);
  try{ localStorage.setItem(pkAplazadoKey(tripId), JSON.stringify(dato)); }catch(e){}
}
function pkOlvidarAplazado(tripId){
  PK_APLAZADO_MEM.delete(tripId);
  try{ localStorage.removeItem(pkAplazadoKey(tripId)); }catch(e){}
}
/** ¿Este plan ya se aplazó? Sólo si TODAS sus claves ya estaban en la firma
    aplazada. Una clave que no estaba vuelve a ofrecerse (§ 4.2, punto 4). */
function pkPlanAplazado(tripId, plan){
  const dato = pkAplazadoDe(tripId);
  if(!dato || !dato.firma) return false;
  const previas = new Set(String(dato.firma).split("|").filter(Boolean));
  const claves = ((plan && plan.nuevos) || []).map(n=>n.clave);
  if(!claves.length) return true;
  return claves.every(c => previas.has(c));
}

/** El plan vigente de este viaje, aplazado o no. */
function planDe(tripId){
  if(!tripId || App.planTripId !== tripId) return null;
  const p = App.plan;
  if(!p || !p.desactualizada || !p.nuevos || !p.nuevos.length || !p.listaPropuesta) return null;
  return p;
}
/** El plan que corresponde ofrecer solo: vigente y sin aplazar. */
function planOfrecible(tripId){
  const p = planDe(tripId);
  return (p && !pkPlanAplazado(tripId, p)) ? p : null;
}
/** La reserva más citable del plan, para nombrar la causa. */
function planReserva(plan){
  const con = ((plan && plan.nuevos) || []).filter(n=>n.reserva)[0];
  return con ? con.reserva : null;
}
/** Ícono de la reserva a partir de su descripción (describeReservation). */
function planReservaIcon(txt){
  const t = String(txt||"").toLowerCase();
  if(t.startsWith("el vuelo")) return "flight";
  if(t.startsWith("el alojamiento")) return "stay";
  if(t.startsWith("el auto")) return "car";
  if(t.startsWith("la actividad")) return "act";
  return "note";
}
/** El texto del aviso 15/16, con la cantidad en mono. */
function planAvisoTexto(plan){
  const n = plan.nuevos.length;
  const cant = n===1 ? `<b class="n">una</b> cosa` : `<b class="n">${n}</b> cosas`;
  const r = planReserva(plan);
  return r
    ? `Agregaste <b>${esc(r)}</b>. Tengo ${cant} para sumarle a la valija.`
    : `El viaje cambió y la lista quedó vieja. Tengo ${cant} para sumarle.`;
}

/** Ítems de la lista con propuesta de sacar todavía sin resolver. */
function pkPropuestasQuitar(list){
  return PackingEngine.itemList(list, {includeDismissed:true})
    .filter(it => it && it.sugerenciaQuitar && it.sugerenciaQuitar.motivo && it.estado !== "descartado");
}
/** Ítems marcados como nuevos. */
function pkItemsNuevos(list){
  return PackingEngine.itemList(list, {includeDismissed:true}).filter(it => it && it.nuevo);
}

/* ---------- H1 · de qué lista salió este plan ----------
   `plan.listaPropuesta` es una FOTO de la lista completa, sacada en el momento
   en que se calculó el plan. Escribirla más tarde es un `set` que pisa todo lo
   que pasó en el medio: regenerar, cambiar el tipo de viaje, agregar un ítem
   propio, o una escritura de otra persona del viaje que llegó por `onSnapshot`.

   Para no escribir nunca una foto vieja, se guarda junto al plan la huella de
   la lista sobre la que se calculó. Al aplicar, si la lista guardada ya no da
   esa misma huella, no se escribe la foto: se recalcula (§ aplicarPlan).

   La huella es TOTAL a propósito —serializa el documento entero, con las claves
   ordenadas para que no dependa del orden en que la base o localStorage las
   devuelvan—. Una huella hecha a mano con los campos que se nos ocurran hoy es
   justo el tipo de cosa que se desactualiza cuando el motor sume un campo. */
function firmaEstable(v){
  if(v === null || typeof v !== "object") return JSON.stringify(v === undefined ? null : v);
  if(Array.isArray(v)) return "[" + v.map(firmaEstable).join(",") + "]";
  return "{" + Object.keys(v).sort()
    .map(k => JSON.stringify(k) + ":" + firmaEstable(v[k])).join(",") + "}";
}

/** Deja un plan en memoria, junto con la huella de la lista de la que salió. */
function recordarPlan(tripId, plan, list){
  App.plan = plan;
  App.planTripId = tripId;
  App.planDesde = firmaEstable(list);
}

/* Borra el plan en memoria y pide que se vuelva a mirar contra la lista nueva.
   Se llama desde todo camino que reemplace la lista entera: el aviso tiene que
   desaparecer, porque lo que ofrecía ya no se corresponde con lo que hay. */
function invalidarPlan(tripId){
  if(App.planTripId === tripId){
    App.plan = null; App.planTripId = null; App.planDesde = null; App.planDock = false;
  }
  PK_RECALC_HECHO.delete(tripId);
  if(PK.tripId === tripId) PK.avisoAplazado = null;
}

/* ---------- el disparo (§ 5, punto 3) ----------
   Se llama después de que la escritura de una reserva resolvió. No en cada
   tecla: al guardar, editar o borrar. Nunca lanza y nunca bloquea la interfaz:
   sin capa de IA (claude.use devuelve null) el plan sale igual con las reglas
   y el historial, que es lo que hace planListUpdate sincrónico. */
/** Calcula el plan contra UNA lista puntual, con capa de IA si la hay.
    Devuelve el plan, o `null` si no se pudo calcular con confianza. */
async function recalcularPlanContra(trip, list){
  if(!trip || !list) return null;
  let history;
  // Si el historial no se puede leer, no se calcula: `learnFromHistory` es lo
  // que arma `aprendizaje.suprimidos`, y sin eso se volvería a ofrecer justo lo
  // que la persona ya descartó dos veces. Mejor no ofrecer que ofrecer mal.
  try{ history = await Store.packingHistory(trip.id); }catch(e){ return null; }
  let sample = null;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  // "complex" a propósito: acá sí hay razonamiento (ver `TIER`).
  const ask = (sample && typeof sample.json === "function")
    ? (prompt)=> askJson(sample, "equipaje-plan", TIER.equipaje, prompt)
    : null;
  try{
    return await PackingEngine.planListUpdateAsync({
      list, trip, items: Store.itemsOf(trip.id),
      tipoViaje: list.tipoViaje, history, ask
    });
  }catch(e){ return null; }   // el motor degrada solo; si igual lanzara, la app sigue
}

/* ============================================================
   VAL-63 · ¿ESTE CAMBIO DEL VIAJE MUEVE LA VALIJA?

   De dónde sale: el PM creó un viaje a Noruega para septiembre, la app
   entendió que allá es otoño y sugirió en consecuencia. Después lo cambió a
   junio de 2027 y la lista no se movió ni un ítem. Faltaba el disparador:
   `checkPackingPlan` se llamaba al guardar una reserva y al importar, y NUNCA
   al guardar el viaje.

   POR QUÉ ACÁ NO HAY UNA LISTA DE CAMPOS, Y LA PRIMERA VERSIÓN SÍ LA TENÍA.

   Escribí `CAMPOS_QUE_MUEVEN_LA_VALIJA = [fechas, destino, viajeros]` y dejé
   afuera el nombre y las notas, con dos motivos escritos en el comentario:
   "el nombre es una etiqueta" y "las notas hoy no las lee nadie".

   Los dos eran falsos, y no hizo falta discutirlo: se miden en cuatro líneas
   de node contra el motor.

     · cambiar SÓLO las notas       → 3 ítems nuevos (malla, ojotas, repelente)
     · cambiar SÓLO el nombre       → 5 ítems nuevos, aun con el destino puesto

   El motivo es que `tripContext` arma un `textBlob` con el nombre, el destino,
   las notas y los títulos de las reservas, todo junto, y de ahí salen los
   `facts` que las reglas usan directo. Y las notas además viajan al modelo por
   `sanitizeNotesForAI` desde antes de esta entrega. O sea que "no las lee
   nadie" no era una decisión de diseño: era una afirmación mía sin comprobar,
   metida en un comentario, sobre código que ya hacía lo contrario.

   Es exactamente la trampa que este proyecto tiene escrita —la documentación
   que queda mintiendo— y la cometí dos días después de la última vez.

   Entonces se deja de adivinar qué campo importa. Se compara TODO lo que la
   persona puede editar en esa hoja. No puede haber falso negativo, que es el
   único error que importa acá: uno de más cuesta una consulta al modelo; uno
   de menos es el bug original volviendo por otra puerta.

   Lo único que no entra son los campos de contabilidad —`id`, `hue`,
   `createdAt`, `updatedAt`, `sample`—, que la persona no toca y que cambian
   solos en cada guardado.

   Queda una pregunta de producto abierta, y va anotada en VAL-72: que el
   NOMBRE del viaje mueva las sugerencias es raro. Renombrar "Viaje" a
   "Noruega" no debería valer lo mismo que cargar un vuelo a Oslo. Pero
   mientras el motor lo use, ignorarlo acá sería mentir dos veces. */
const CAMPOS_EDITABLES_DEL_VIAJE = ["name", "destination", "startDate", "endDate", "travelers", "notes"];

function cambioQueMueveLaValija(antes, despues){
  if(!antes || !despues) return false;
  const norm = (k, v) => {
    const s = String(v ?? "").trim();
    return (k === "startDate" || k === "endDate") ? dayKey(s) : s;
  };
  return CAMPOS_EDITABLES_DEL_VIAJE.some(k => norm(k, antes[k]) !== norm(k, despues[k]));
}

async function checkPackingPlan(trip){
  if(!trip) return;
  const list = Store.packingOf(trip.id);
  if(!list) return;                       // sin lista guardada no hay nada que actualizar
  PK_RECALC_HECHO.delete(trip.id);        // este cálculo es mejor que el de entrada: vale de nuevo

  const plan = await recalcularPlanContra(trip, list);
  if(plan === null) return;               // no se pudo calcular: se deja todo como estaba

  if(!plan.desactualizada || !plan.nuevos.length){
    if(App.planTripId === trip.id){ App.plan = null; App.planTripId = null; App.planDesde = null; App.planDock = false; }
    render();
    return null;                          // nada que ofrecer, y quien llamó puede saberlo
  }
  // La huella es la de `list`: la lista con la que se calculó, no la que haya
  // ahora. Entre medio pasaron dos `await` y la lista pudo cambiar.
  recordarPlan(trip.id, plan, list);
  // Un plan con una clave que no estaba en la firma aplazada vuelve a ofrecerse:
  // el acuse de "Ahora no" de esta visita ya no corresponde (§ 4.2, punto 4).
  if(PK.tripId === trip.id && !pkPlanAplazado(trip.id, plan)) PK.avisoAplazado = null;
  // Si la valija ya estaba abierta cuando resolvió, el aviso entra por abajo y
  // no corre la lista bajo el pulgar (estado 16, § 4.1).
  App.planDock = (App.view === "packing" && App.tripId === trip.id);
  render();
  /* Se devuelve el plan para que quien haya disparado la revisión pueda decir
     algo. Es aditivo: los cuatro call sites que existían no miran el retorno y
     siguen comportándose igual. Lo usa VAL-63 (ver el handler de la hoja del
     viaje) porque ahí la persona NO está mirando la valija. */
  return plan;
}

/* ---------- recálculo al ENTRAR a la pantalla de la valija ----------
   `App.plan` es memoria: al recargar la app se pierde, y sin esto la lista
   sigue vieja y no lo dice ni la tira ni el aviso. El caso normal no es raro:
   cerrar la app y volver al día siguiente, que es justo cuando alguien abre
   la valija.

   Acá va `planListUpdate` SINCRÓNICO, no el async: capas 1 y 3, sin modelo,
   sin red y sin poder fallar. La llamada al modelo se paga una sola vez, al
   guardar la reserva, que es donde vale.

   Lo único asíncrono es leer el historial, y no es opcional: `learnFromHistory`
   es lo que arma `aprendizaje.suprimidos`. Reconstruir la base sin historial
   volvería a proponer justo lo que la persona ya descartó dos veces. Si esa
   lectura falla, no se recalcula nada: es preferible no ofrecer a ofrecer mal.

   El aviso entra ARRIBA de la lista (estado 15), no por el dock: recién se
   entró a la pantalla y no hay ningún gesto en curso que proteger. */
const PK_RECALC_HECHO = new Set();

function recalcularPlanAlEntrar(tripId){
  if(PK_RECALC_HECHO.has(tripId)) return;      // ya se miró en esta sesión
  if(planDe(tripId)) return;                   // ya hay un plan en memoria, más fresco
  const trip = Store.trips.get(tripId);
  const list = Store.packingOf(tripId);
  if(!trip || !list) return;
  PK_RECALC_HECHO.add(tripId);
  Store.packingHistory(tripId).then(history=>{
    let plan;
    try{
      plan = PackingEngine.planListUpdate({
        list, trip, items: Store.itemsOf(tripId),
        tipoViaje: list.tipoViaje, history
      });
    }catch(e){ return; }                       // planListUpdate no lanza; por las dudas
    if(!plan || !plan.desactualizada || !plan.nuevos.length) return;
    if(planDe(tripId)) return;                 // llegó uno mejor mientras leíamos el historial
    if(Store.packingOf(tripId) !== list){
      // La lista cambió mientras leíamos el historial: este plan salió de una
      // foto que ya no existe y no se ofrece. Se suelta la marca para que el
      // próximo render lo vuelva a intentar contra la lista buena; si no, el
      // recálculo se perdería para toda la sesión.
      PK_RECALC_HECHO.delete(tripId);
      return;
    }
    recordarPlan(tripId, plan, list);
    App.planDock = false;
    render();
  }).catch(()=>{ PK_RECALC_HECHO.delete(tripId); });
}

/* ============================================================
   MONTAJE Y DESMONTAJE DE LA PANTALLA DE LA VALIJA
   Es donde se limpian las marcas de "nuevo" (§ 4.3): al SALIR, y sólo
   si todos los ítems marcados quedaron vistos en esta visita.
   ============================================================ */
const PKMount = { tripId:null };

function pkSyncMount(){
  const destino = (App.view === "packing") ? App.tripId : null;
  if(PKMount.tripId === destino) return;
  const saliendo = PKMount.tripId;
  // Se marca el destino ANTES de desmontar: pkUnmount puede escribir, y esa
  // escritura emite y vuelve a llamar a render(). Sin esto la reentrada
  // volvería a intentar el mismo desmontaje.
  PKMount.tripId = destino;
  if(saliendo) pkUnmount(saliendo);
  if(destino) pkMount(destino);
  else if($pkdock){ $pkdock.dataset.firma = ""; $pkdock.innerHTML = ""; }
}

function pkMount(tripId){
  resetPKIfNeeded(tripId);
  // lo que vale por visita se reinicia acá, aunque el viaje sea el mismo
  PK.avisoAplazado = null;
  PK.hideRemovals = false;
  PK.seenNew = new Set();
  App.planDock = false;   // al entrar de nuevo, el aviso vuelve a su lugar de arriba
  const list = Store.packingOf(tripId);
  if(list && pkItemsNuevos(list).length) PK.visitsSinceApply++;
}

function pkUnmount(tripId){
  pkStopObserver();
  if(!Store.canWrite) return;              // quien mira no escribe (estado 24)
  const list = Store.packingOf(tripId);
  if(!list) return;
  const nuevos = pkItemsNuevos(list);
  if(!nuevos.length) return;
  const todosVistos = PK.ioOk
    ? nuevos.every(it => PK.seenNew.has(it.clave))
    : (PK.visitsSinceApply >= 2);          // degradación declarada (§ 4.3)
  if(!todosVistos) return;                 // alguno quedó sin mirar: la marca espera
  const limpia = PackingEngine.clearNewFlags(list);
  if(limpia === list) return;
  // Idempotente: si la escritura falla, los flags quedan y se reintenta al salir de nuevo.
  Promise.resolve(Store.savePacking(tripId, limpia)).catch(()=>{});
}

/* Cerrar la pestaña también es salir de la pantalla. */
window.addEventListener("pagehide", ()=>{ if(PKMount.tripId) pkUnmount(PKMount.tripId); });

/* ---------- "visto" por permanencia en pantalla (§ 4.3) ---------- */
function pkStopObserver(){
  if(PK.io){ try{ PK.io.disconnect(); }catch(e){} PK.io = null; }
  if(PK.ioTimers){ PK.ioTimers.forEach(t=>clearTimeout(t)); PK.ioTimers.clear(); }
}
function pkObserveNew(main){
  pkStopObserver();
  if(!Store.canWrite || !PK.ioOk) return;
  // Dos cosas cuentan como "lo vio":
  //   · la fila del ítem nuevo, cuando la categoría está abierta;
  //   · el encabezado de una categoría PLEGADA con su chip "N nuevos", que es
  //     lo único que se puede ver de esos ítems sin abrirla. Ver que hay dos
  //     cosas nuevas en Documentación y elegir no abrirla es información
  //     recibida y una decisión tomada; tratarla como "todavía no se enteró"
  //     es no escuchar (§ 4.3).
  const objetivos = main.querySelectorAll(".pk-row.is-new[data-row], .pk-cat-hd[data-newclaves]");
  if(!objetivos.length) return;
  const clavesDe = el => el.dataset.newclaves
    ? el.dataset.newclaves.split(" ").filter(Boolean)
    : (el.dataset.row ? [el.dataset.row] : []);
  const io = new IntersectionObserver(entradas=>{
    entradas.forEach(en=>{
      const claves = clavesDe(en.target);
      if(!claves.length) return;
      const id = claves.join(" ");
      if(en.isIntersecting){
        if(PK.ioTimers.has(id)) return;
        PK.ioTimers.set(id, setTimeout(()=>{
          PK.ioTimers.delete(id);
          claves.forEach(c=> PK.seenNew.add(c));
        }, 600));
      }else{
        const t = PK.ioTimers.get(id);
        if(t){ clearTimeout(t); PK.ioTimers.delete(id); }
      }
    });
  }, { threshold:0.6 });
  objetivos.forEach(el=> io.observe(el));
  PK.io = io;
}
/** Actuar sobre un ítem o abrir su hoja también es haberlo mirado. */
function pkMarcarVisto(clave){ if(clave) PK.seenNew.add(clave); }

function pkRowHtml(it, trip, canWrite){
  const ST_MAP = {pendiente:"pend", empacado:"pack", descartado:"drop"};
  const st = ST_MAP[it.estado] || "pend";
  const drop = st === "drop";
  const src = srcChip(it, trip);
  const stateIcon = st==="drop" ? svg(I.dash) : (st==="pack" || canWrite) ? svg(I.check) : "";
  // 18 · la marca de ítem nuevo: barra ámbar al filo (sin costo de layout) más
  // la palabra "nuevo" en mono, que es lo que se lee con lector de pantalla.
  const esNuevo = !!it.nuevo && !drop;
  const nuevoTag = esNuevo ? `<span class="pk-newtag">nuevo</span>` : "";
  // 20 · la propuesta de sacar: la ÚNICA marca es el círculo de descartar
  // teñido. La fila no crece ni una línea y el motivo original queda intacto.
  const sug = (!drop && it.sugerenciaQuitar && it.sugerenciaQuitar.motivo) ? it.sugerenciaQuitar : null;
  const cls = `pk-row${esNuevo?" is-new":""}${(esNuevo && PK.fresh)?" fresh":""}`;
  const why = drop ? "" : `<span class="pk-why">${nuevoTag}<span class="${src.cls}">${esc(src.tx)}</span>${it.motivo?`<span class="r">${esc(it.motivo)}</span>`:""}</span>`;
  const nm = `<span class="pk-nm"><span class="t">${esc(it.nombre)}</span>${it.cantidad?`<span class="q">×${esc(it.cantidad)}</span>`:""}</span>`;

  if(!canWrite){
    // Sin permiso no hay botón de descartar, así que la propuesta de sacar no
    // tiene dónde marcarse: se lee entera en la hoja del ítem (estado 24).
    return `<div class="${cls}" data-st="${st}">
      <span class="pk-slide">
        <span class="pk-mark" style="cursor:default"><span class="pk-state">${stateIcon}</span></span>
        <span class="pk-txt" style="cursor:default;padding-right:14px">${nm}${why}</span>
      </span>
    </div>`;
  }
  const dropLabel = `Descartar ${it.nombre}.${sug?` Te propongo sacarlo: ${sug.motivo}`:""}`;
  return `<div class="${cls}" data-st="${st}" data-row="${esc(it.clave)}">
    <span class="pk-swipe">${svg(I.ban)} Descartar</span>
    <span class="pk-slide">
      <button class="pk-mark" data-mark="${esc(it.clave)}"
              aria-label="${esNuevo?"Nuevo. ":""}${esc(it.nombre)}: ${esc(it.estado)}. ${drop?"Volver a la lista":"Marcar como empacado"}">
        <span class="pk-state">${stateIcon}</span>
      </button>
      <button class="pk-txt" data-detail="${esc(it.clave)}">${nm}${why}</button>
      ${drop
        ? `<button class="pk-back" data-mark="${esc(it.clave)}">volver</button>`
        : `<button class="pk-drop${sug?" sug":""}" data-dropbtn="${esc(it.clave)}" aria-label="${esc(dropLabel)}">${svg(I.ban)}</button>`}
    </span>
  </div>`;
}

function pkCategoryHtml(cat, trip, canWrite){
  const pend = cat.items.filter(i=>i.estado==="pendiente").length;
  const packed = cat.items.filter(i=>i.estado==="empacado").length;
  const dropped = cat.items.filter(i=>i.estado==="descartado").length;
  const full = cat.items.length>0 && pend===0;
  const nuevos = cat.items.filter(i=>i.nuevo && i.estado!=="descartado").length;
  // Una categoría sin pendientes se pliega sola, salvo que tenga algo
  // descartado: ahí sigue habiendo algo que mirar (el botón "volver").
  // Una categoría con ítems nuevos se abre sola, PERO si la persona la plegó a
  // mano manda ella: reabrirla porque el sistema decidió que tiene que mirar
  // algo es exactamente lo que hace que una app se sienta impertinente.
  // El agujero que eso deja —una fila plegada nunca entra en la ventana visible
  // y su marca no se limpiaría jamás— lo cierra el chip: si el "N nuevos" del
  // encabezado estuvo a la vista, los ítems de adentro cuentan como vistos
  // (§ 4.3, ver pkObserveNew).
  const open = PK.openCats[cat.key] !== undefined ? PK.openCats[cat.key] : (nuevos>0 || !full || dropped>0);
  const icon = CAT_ICON[cat.key] || "doc";
  // El chip es el localizador grueso: sin él, tres filas ámbar en cuarenta
  // ítems se encuentran scrolleando a ciegas. Se ve también plegada.
  const chipNuevos = nuevos ? ` <span class="chip soon">${nuevos} ${nuevos===1?"nuevo":"nuevos"}</span>` : "";
  // Claves de los ítems nuevos que quedan tapados con la categoría plegada:
  // son los que el chip representa, y los que se dan por vistos con él.
  const tapadas = (!open && nuevos)
    ? cat.items.filter(i=>i.nuevo && i.estado!=="descartado").map(i=>i.clave).join(" ")
    : "";
  return `<div class="pk-cat ${full?"full":""}" data-open="${open}">
    <button class="pk-cat-hd" aria-expanded="${open}" data-cat="${esc(cat.key)}"${tapadas?` data-newclaves="${esc(tapadas)}"`:""}>
      <span class="pk-cat-ico">${svg(I[icon])}</span>
      <span class="nm">${esc(cat.label)}</span>
      <span class="cnt">${full?`<span class="chip ok">listo</span>`:`${packed} de ${cat.items.length - dropped}`}${chipNuevos}</span>
      ${svg(I.chevd,"chev")}
    </button>
    <div class="pk-body-wrap">
      ${cat.items.map(it=>pkRowHtml(it,trip,canWrite)).join("")}
      ${canWrite ? (PK.adding===cat.key
        ? `<div class="pk-addform">
             <input id="pk-add-${esc(cat.key)}" placeholder="Qué te falta" autocomplete="off">
             <button class="btn primary sm" data-pksave="${esc(cat.key)}">Agregar</button>
           </div>`
        : `<button class="pk-add" data-pkadd="${esc(cat.key)}">${svg(I.plus)} Agregar a ${esc(cat.label.toLowerCase())}</button>`) : ""}
    </div>
  </div>`;
}

/* ---------- generar / regenerar ---------- */
async function runGenerate(trip, tipoViaje, previous){
  // Armar, rehacer o cambiar el tipo reemplaza la lista entera: el plan que
  // hubiera pendiente ofrecía cosas de una lista que ya no existe. Se tira acá
  // y se recalcula solo contra la lista nueva (H1, capa 1). Los tres caminos
  // ("Armar la lista", "Rehacer la lista", "Usar este tipo") pasan por acá.
  invalidarPlan(trip.id);
  const items = Store.itemsOf(trip.id);
  let history = [];
  try{ history = await Store.packingHistory(trip.id); }catch(e){ history = []; }
  const base = PackingEngine.buildPackingList({ trip, items, tipoViaje, history });
  const interim = previous ? PackingEngine.mergeLists(previous, base) : base;

  if(PK.tripId === trip.id) PK.generating = true;
  try{ await Store.savePacking(trip.id, interim); }
  catch(e){
    toast(writeErr(e), true);
    if(PK.tripId === trip.id){ PK.generating = false; render(); }
    return;
  }
  if(PK.tripId === trip.id) render();

  let sample = null;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  // "complex" a propósito, igual que el plan (ver `TIER`).
  const ask = (sample && typeof sample.json === "function")
    ? (prompt) => askJson(sample, "equipaje-destino", TIER.equipaje, prompt)
    : null;

  let enriched;
  try{ enriched = await PackingEngine.enrichWithDestination(base, ask); }
  catch(e){ enriched = base; }

  // Mezclamos contra lo que haya guardado AHORA (no contra `interim` de más
  // arriba): si mientras la IA respondía la persona ya marcó o descartó algo,
  // esa acción no se pierde al guardar el resultado final.
  const latest = Store.packingOf(trip.id) || interim;
  const final = PackingEngine.mergeLists(latest, enriched);

  if(PK.tripId === trip.id){
    PK.generating = false;
    PK.justEnriched = !!(final.capaInteligente && final.capaInteligente.estado === "ok");
  }
  try{ await Store.savePacking(trip.id, final); }
  catch(e){ toast(writeErr(e), true); }
  // Otra vez al final: entre las dos escrituras se pudo recalcular contra la
  // lista intermedia. Lo que valga se recalcula contra ESTA, que es la buena.
  invalidarPlan(trip.id);
  if(PK.tripId === trip.id) render();
}

async function applyItemState(trip, list, clave, estado){
  PK.justEnriched = false;   // tocar un ítem también da por leído el aviso de ajuste por destino
  try{
    const patch = PackingEngine.stateUpdatePatch(clave, estado);
    await Store.savePackingPatch(trip.id, patch);
  }catch(e){ toast(writeErr(e), true); }
}

function bindPackingRows(main, trip, list, canWrite){
  main.querySelectorAll("[data-cat]").forEach(b=>{
    b.onclick = ()=>{
      const catEl = b.parentElement;
      PK.openCats[b.dataset.cat] = catEl.dataset.open !== "true";
      render();
    };
  });

  if(!canWrite) return;

  main.querySelectorAll("[data-mark]").forEach(b=> b.onclick = ()=>{
    const clave = b.dataset.mark, it = list.items[clave]; if(!it) return;
    delete PK.openCats[it.categoria];
    pkMarcarVisto(clave);   // actuar sobre un ítem es la prueba más fuerte de haberlo mirado
    const next = it.estado === "pendiente" ? "empacado" : "pendiente";
    applyItemState(trip, list, clave, next);
  });
  main.querySelectorAll("[data-dropbtn]").forEach(b=> b.onclick = ()=>{
    const clave = b.dataset.dropbtn, it = list.items[clave]; if(!it) return;
    delete PK.openCats[it.categoria];
    pkMarcarVisto(clave);
    // El círculo teñido ES la aceptación de la propuesta: descartar y borrar la
    // sugerencia van en la MISMA escritura (§ 4.4).
    if(it.sugerenciaQuitar) aceptarQuitar(trip, clave);
    else applyItemState(trip, list, clave, "descartado");
  });
  main.querySelectorAll("[data-detail]").forEach(b=> b.onclick = ()=>{
    sheetPackingItem(trip, list, b.dataset.detail);
  });
  main.querySelectorAll("[data-pkadd]").forEach(b=> b.onclick = ()=>{
    PK.adding = b.dataset.pkadd; render();
    setTimeout(()=> document.getElementById("pk-add-"+PK.adding)?.focus(), 0);
  });
  main.querySelectorAll("[data-pksave]").forEach(b=> b.onclick = async ()=>{
    const cat = b.dataset.pksave;
    const inp = document.getElementById("pk-add-"+cat);
    const nombre = (inp.value||"").trim();
    PK.adding = null;
    if(!nombre){ render(); return; }
    const updated = PackingEngine.addManualItem(list, {nombre, categoria:cat});
    try{ await Store.savePacking(trip.id, updated); }
    catch(e){ toast(writeErr(e), true); render(); }
  });
  main.querySelectorAll(".pk-addform input").forEach(inp=>{
    inp.onkeydown = e=>{
      if(e.key==="Enter") main.querySelector("[data-pksave]")?.click();
      if(e.key==="Escape"){ PK.adding=null; render(); }
    };
  });

  /* deslizar: izquierda descarta, derecha marca/desmarca. Sin puntería. */
  main.querySelectorAll(".pk-row[data-row]").forEach(row=>{
    const slide = row.querySelector(".pk-slide");
    let x0=null, dx=0;
    row.addEventListener("pointerdown", e=>{
      if(e.pointerType==="mouse" && e.button!==0) return;
      x0 = e.clientX; dx = 0; slide.style.transition = "none";
    });
    row.addEventListener("pointermove", e=>{
      if(x0===null) return;
      dx = e.clientX - x0;
      if(Math.abs(dx) > 6) slide.style.transform = `translateX(${Math.max(-120, Math.min(120, dx))}px)`;
    });
    const end = ()=>{
      if(x0===null) return;
      slide.style.transition = ""; slide.style.transform = "";
      const clave = row.dataset.row, it = list.items[clave];
      const localDx = dx; x0 = null; dx = 0;
      if(!it) return;
      if(localDx < -70){
        delete PK.openCats[it.categoria]; pkMarcarVisto(clave);
        // deslizar a la izquierda es el mismo descarte que el círculo: si hay
        // propuesta, también la resuelve en la misma escritura (§ 4.4)
        if(it.sugerenciaQuitar) aceptarQuitar(trip, clave);
        else applyItemState(trip, list, clave, "descartado");
      }
      else if(localDx > 70){ delete PK.openCats[it.categoria]; pkMarcarVisto(clave); applyItemState(trip, list, clave, it.estado==="empacado" ? "pendiente" : "empacado"); }
    };
    row.addEventListener("pointerup", end);
    row.addEventListener("pointercancel", end);
    row.addEventListener("pointerleave", end);
    row.addEventListener("click", e=>{ if(Math.abs(dx) > 10){ e.preventDefault(); e.stopPropagation(); } }, true);
  });
}

    <div class="pk-inputs">${chips}</div>
    ${!list ? `<div class="empty" style="padding:24px 20px">
      <h3>Todavía no armaste la valija</h3>
      <p>Te propongo qué llevar según el destino, las fechas, los días que te quedás y lo que agregaste a mano en viajes del mismo tipo. Todo lo que sugiera lo podés sacar.</p>
    </div>` : ""}
    <div class="f">
      <label>Tipo de viaje</label>
      <div class="tp tp3" id="pk-tp">${rows}</div>
      ${hint ? `<span class="hint">${hint}</span>` : ""}
    </div>
    ${warnBlock}
  `;

  $fab.innerHTML = typeSelectorFab(trip, list);

  document.querySelectorAll("#pk-tp [data-t]").forEach(b=>{
    b.onclick = ()=>{ PK.selectedType = b.dataset.t; render(); };
  });
  const useSugg = document.getElementById("pk-usesugg");
  if(useSugg) useSugg.onclick = ()=>{ PK.selectedType = suggested; render(); };

  if(!list){
    const build = document.getElementById("pk-build");
    if(build && Store.canWrite){
      build.onclick = ()=>{ const t = chosen; PK.selectedType = null; runGenerate(trip, t, null); };
    }
  } else {
    const cancel = document.getElementById("pk-canceltype");
    const confirm = document.getElementById("pk-confirmtype");
    if(cancel) cancel.onclick = ()=>{ PK.pickingType = false; PK.selectedType = null; render(); };
    if(confirm && Store.canWrite){
      confirm.onclick = ()=>{ const t = chosen; PK.pickingType = false; PK.selectedType = null; runGenerate(trip, t, list); };
    }
  }

  if(!PK.typeCounts){
    Store.packingHistory(trip.id).then(hist=>{
      const c = {};
      hist.forEach(l=>{ if(l && l.tipoViaje) c[l.tipoViaje] = (c[l.tipoViaje]||0)+1; });
      PK.typeCounts = c;
      if(PK.tripId===trip.id) render();
    });
  }
}

/* ---------- 04/06/07/08/09/10: la lista, en todos sus estados ---------- */
function renderPackingBoard(trip, list){
  const canWrite = Store.canWrite;
  const generating = PK.generating;
  const cap = list.capaInteligente || {};

  const degradedChip = (!generating && (cap.estado==="no-disponible" || cap.estado==="error"))
    ? `<span class="chip">sin ajuste por destino</span>` : "";
  const readonlyChip = !canWrite ? `<span class="chip soon">sólo lectura</span>` : "";

  $hdr.innerHTML = packingHeader(trip, list) + `<div class="hdr-sub">${pkProgHtml(list)}${degradedChip}${readonlyChip}</div>`;
  bindPackingHeader(trip, ()=> sheetPackingInfo(trip, list));

  const destino = trip.destination || "tu destino";

  // 15/16 · el plan pendiente. Si resolvió con la pantalla ya abierta entra por
  // abajo (dock) y no corre la lista bajo el pulgar; si no, arriba de la lista.
  const planPend = canWrite ? planOfrecible(trip.id) : planDe(trip.id);
  const planDock = (canWrite && planPend && App.planDock) ? planPend : null;
  const planArriba = planDock ? null : planPend;

  // 25 · un solo aviso arriba de la lista, siempre. La regla vive en una sola
  // función para que no se rompa sola cuando aparezca el sexto aviso.
  const notices = generating
    ? `<div class="notice"><span class="spin"></span><span class="bd">Buscando lo específico de ${esc(destino)}…</span></div>`
    : packingNotice(trip, list, planArriba);

  const grouped = PackingEngine.groupByCategory(list, {includeDismissed:true});
  const groups = grouped.map(g=> pkCategoryHtml(g, trip, canWrite));
  const destGroupExists = grouped.some(g=>g.key==="destino");

  const skeletonCat = (generating && !destGroupExists) ? `
    <div class="pk-cat" data-open="true">
      <div class="pk-cat-hd">
        <span class="pk-cat-ico">${svg(I.globe)}</span>
        <span class="nm">Específicos de ${esc(destino)}</span>
        <span class="cnt sk" style="width:38px;height:12px;border-radius:5px;display:inline-block"></span>
        ${svg(I.chevd,"chev")}
      </div>
      <div class="pk-body-wrap">
        <div class="pk-row loading"><span class="sk" style="width:52%"></span><span class="sk" style="width:74%"></span></div>
        <div class="pk-row loading"><span class="sk" style="width:41%"></span><span class="sk" style="width:66%"></span></div>
        <div class="pk-row loading"><span class="sk" style="width:58%"></span><span class="sk" style="width:47%"></span></div>
      </div>
    </div>` : "";

  $main.innerHTML = notices + groups.join("") + skeletonCat;

  if(canWrite && !generating){
    $fab.innerHTML = `<div class="fab"><button class="btn primary block" id="pk-additem">${svg(I.plus)} Agregar ítem</button></div>`;
    document.getElementById("pk-additem").onclick = ()=> sheetAddPackingItem(trip, list);
  } else {
    $fab.innerHTML = "";
  }

  pkRenderDock(trip, planDock);

  bindPackingRows($main, trip, list, canWrite);
  bindPackingNotice($main, trip, list);
  bindPackingNotice($pkdock, trip, list);
  pkObserveNew($main);

  const closeFresh = document.getElementById("pk-closefresh");
  if(closeFresh) closeFresh.onclick = ()=>{ PK.justEnriched = false; render(); };
  const retry = document.getElementById("pk-retry");
  if(retry) retry.onclick = ()=> runGenerate(trip, list.tipoViaje, list);
}

/* ---------- 25 · UN SOLO AVISO ARRIBA DE LA LISTA ----------
   Devuelve el HTML del PRIMER aviso que aplique, en este orden:
     1 · la lista quedó vieja (15/24) o el acuse de aplazada (19)
     2 · sin ajuste por destino (08)
     3 · sumé N cosas (18)                — confirmación de lo recién aplicado
     3b· ajusté la lista al destino (07)  — la misma familia que el 3
     4 · hay N que capaz no necesitás (20)
     5 · valija lista (09)
     6 · sólo lectura, cuando no queda nada más que decir

   El plan va PRIMERO, invirtiendo el orden de la tabla del diseño. El motivo:
   `capaInteligente.estado` vive en el documento guardado, así que el aviso
   degradado no se va nunca hasta que se regenere la lista. Siendo permanente
   y estático, bloquearía para siempre a un aviso puntual y accionable. Entre
   "no pude ajustar la lista al destino" —una advertencia sobre la calidad de
   algo que ya está— y "el viaje cambió y tengo tres cosas para sumarte" —una
   acción concreta con fecha— gana la segunda. El costo, asumido: "Probar de
   nuevo" queda un toque más lejos mientras haya un plan sin resolver, y
   vuelve apenas se aplica o se toca "Ahora no", que además es persistente.

   Lo que no se muestra no se pierde: la hoja 12 lista siempre todo lo
   pendiente, y las marcas en las filas son independientes del aviso. */
function packingNotice(trip, list, plan){
  const canWrite = Store.canWrite;
  const cap = list.capaInteligente || {};
  const c = PackingEngine.packingProgress(list);
  const destino = trip.destination || "tu destino";
  const quitar = pkPropuestasQuitar(list);
  const nq = quitar.length;
  const verQuitarSec = nq
    ? `<button class="act sec" data-pk="verquitar">Y hay <b class="n">${nq}</b> que capaz no necesitás. Verlas</button>`
    : "";

  // 1 · la lista quedó vieja (15), o su variante sin acciones (24)
  if(plan){
    const n = plan.nuevos.length;
    if(!canWrite){
      return `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Quedó vieja: el viaje cambió después de que se armó, y hay <b class="n">${n}</b> ${n===1?"cosa":"cosas"} sin sumar. Las puede sumar quien tenga permiso de edición.</span></div>`;
    }
    return `<div class="notice">${svg(I.spark)}<span class="bd">${planAvisoTexto(plan)}
      <span class="acts">
        <button class="act" data-pk="verplan">Ver qué agrego</button>
        <button class="act sec" data-pk="ahorano">Ahora no</button>
      </span></span></div>`;
  }

  // 19 · acuse de "Ahora no", de una sola visita. No queda badge ni insistencia.
  // Ocupa el mismo lugar que el aviso que reemplaza: es la respuesta al gesto
  // que la persona acaba de hacer.
  if(PK.avisoAplazado && canWrite){
    const p = PK.avisoAplazado;
    const n = p.nuevos.length;
    const r = planReserva(p);
    return `<div class="notice">${svg(I.info)}<span class="bd">Listo, no toco nada. ${n===1?`La <b class="n">una</b> cosa`:`Las <b class="n">${n}</b> cosas`}${r?` ${esc(pkDeReserva(r))}`:""} quedan guardadas en <b>De dónde sale esta lista</b>, arriba a la derecha, por si después las querés.
      <span class="acts"><button class="act" data-pk="verplan">Verlas igual</button></span></span></div>`;
  }

  // 2 · sin ajuste por destino
  if(cap.estado==="no-disponible" || cap.estado==="error"){
    return `<div class="notice warn">${svg(I.info)}<span class="bd">Armé la lista con las reglas de siempre. No pude ajustarla a ${esc(destino)}, así que puede faltarte algo del lugar.
      ${canWrite?`<button class="act" id="pk-retry">Probar de nuevo</button>`:""}</span></div>`;
  }

  // 3 · sumé N cosas (18). Cerrar la confirmación ES confirmar (§ 4.3).
  if(PK.applied && canWrite && pkItemsNuevos(list).length){
    const n = PK.appliedN;
    return `<div class="notice ok">${svg(I.check2)}<span class="bd">Sumé <b class="n">${n}</b> ${n===1?"cosa":"cosas"}${PK.appliedReserva?` por <b>${esc(PK.appliedReserva)}</b>`:""}. Quedan marcadas hasta que las mires.
      <span class="acts"><button class="act sec" data-pk="vistas">Listo, ya las vi</button>${verQuitarSec}</span></span>
      <button class="x" aria-label="Cerrar" data-pk="vistas">${svg(I.x)}</button></div>`;
  }

  // 3b · ajusté la lista al destino (07). Único texto existente que cambia:
  // cuando la misma pasada además propuso sacar, suma la segunda acción.
  if(PK.justEnriched && cap.estado==="ok"){
    return `<div class="notice ok">${svg(I.spark)}<span class="bd">${esc(cap.nota||"Ajusté la lista al destino.")}
      ${verQuitarSec?`<span class="acts">${verQuitarSec}</span>`:""}</span>
      <button class="x" aria-label="Cerrar" id="pk-closefresh">${svg(I.x)}</button></div>`;
  }

  // 4 · hay N que capaz no necesitás (20). Se cierra por visita, no para
  // siempre: es un localizador, y las marcas siguen en las filas.
  if(nq && !PK.hideRemovals){
    return `<div class="notice warn">${svg(I.ban)}<span class="bd">Hay <b class="n">${nq}</b> ${nq===1?"cosa":"cosas"} de la lista que capaz no necesitás en ${esc(destino)}.
      <button class="act" data-pk="verquitar">Ver ${nq===1?"cuál":"cuáles"}</button></span>
      <button class="x" aria-label="Cerrar" data-pk="cerrarquitar">${svg(I.x)}</button></div>`;
  }

  // 5 · valija lista (09)
  if(c.total>0 && c.pendientes===0){
    const typeLbl = (TYPE_LABEL[list.tipoViaje]||"").toLowerCase();
    return `<div class="notice ok">${svg(I.check2)}<span class="bd">Valija lista.${c.descartados?` Los ${c.descartados} que descartaste ya quedaron anotados para tu próximo viaje${typeLbl?` de ${typeLbl}`:""}.`:""}</span></div>`;
  }

  // 6 · sólo lectura
  if(!canWrite){
    return `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Para marcar lo tuyo necesitás permiso de edición.</span></div>`;
  }
  return "";
}

/* ---------- 16 · el aviso anclado al pie ----------
   Sólo se reescribe cuando cambia de verdad: #pkdock es la región viva y
   volver a pintarla en cada render la haría anunciarse una y otra vez. */
function pkRenderDock(trip, plan){
  const firma = plan ? `${trip.id}|${planFirma(plan)}` : "";
  if($pkdock.dataset.firma === firma) return;
  $pkdock.dataset.firma = firma;
  $pkdock.innerHTML = plan ? `<div class="pk-dock"><div class="notice">${svg(I.spark)}<span class="bd">${planAvisoTexto(plan)}
    <span class="acts">
      <button class="act" data-pk="verplan">Ver qué agrego</button>
      <button class="act sec" data-pk="ahorano">Ahora no</button>
    </span></span></div></div>` : "";
}

/* ---------- las acciones de los avisos, en cualquiera de sus dos anclajes ---------- */
function bindPackingNotice(root, trip, list){
  if(!root) return;
  root.querySelectorAll("[data-pk]").forEach(b=> b.onclick = ()=>{
    const a = b.dataset.pk;
    const plan = planDe(trip.id) || PK.avisoAplazado;
    if(a==="verplan"){ if(plan) sheetPackingPlan(trip, plan); return; }
    if(a==="ahorano"){ if(plan) aplazarPlan(trip, plan); return; }
    if(a==="vistas"){ pkDarPorVistas(trip); return; }
    if(a==="verquitar"){ sheetPackingRemovals(trip); return; }
    if(a==="cerrarquitar"){ PK.hideRemovals = true; render(); return; }
  });
}

/* ---------- despachador de estados ---------- */
function renderPacking(trip){
  resetPKIfNeeded(trip.id);
  const list = Store.packingOf(trip.id);
  const hasDates = !!(trip.startDate && trip.endDate);

  if(!list && !hasDates && !PK.pickingType){ pkRenderDock(trip, null); renderPackingBlocked(trip); return; }
  if((!list && hasDates) || PK.pickingType){ pkRenderDock(trip, null); renderTypeSelector(trip, list); return; }
  // Acá ya hay viaje y hay lista: es el único punto donde se puede saber si la
  // lista quedó vieja sin datos a medio llegar. El propio recálculo se cuida de
  // correr una sola vez por viaje y por sesión.
  recalcularPlanAlEntrar(trip.id);
  renderPackingBoard(trip, list);
}

/** Un cartel. Con `alTocar`, se puede tocar y lleva a algún lado.

    Por qué existe la tercera forma: VAL-63 mostraba "Tengo N cosas para sumarte
    a la valija" y ahí se terminaba. El PM lo probó en su teléfono el 19/09 y el
    resultado fue peor que no avisar — el cartel aparecía TARDE, porque
    preguntarle al modelo tarda segundos y él ya se había ido a otra pantalla, y
    encima no llevaba a ningún lado. Un aviso que no sabe dónde estás y que no
    se puede tocar es un callejón.

    El que se puede tocar dura más: 2,6 segundos alcanzan para leer "Reserva
    guardada", no para decidir si te interesa ir a ver algo. */
function toast(msg, err, alTocar){
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="toast ${err?"err":""}${alTocar?" tocable":""}"${alTocar?' role="button" tabindex="0"':""}>${esc(msg)}${alTocar?` <b class="ver">Ver</b>`:""}</div>`;
  if(alTocar){
    const caja = t.firstElementChild;
    const ir = ()=>{ t.innerHTML=""; alTocar(); };
    caja.onclick = ir;
    caja.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); ir(); } };
  }
  /* CADA CARTEL SÓLO SE BORRA A SÍ MISMO.

     Antes el reloj hacía `t.innerHTML=""` sin mirar qué había adentro, así que
     un cartel viejo mataba al que lo había reemplazado. Se veía justo acá: al
     guardar el viaje salía "Viaje actualizado" (2,6 s) y un rato después
     "Tengo N cosas para sumarte" (7 s), pero a los 2,6 s el reloj del primero
     borraba al segundo. El aviso duraba lo que le quedaba al anterior.

     Lo destapó el arnés de VAL-63 al exigir que el cartel se pudiera tocar:
     el texto quedaba registrado —había aparecido— pero el elemento ya no
     estaba. Es un defecto viejo, de cualquier par de carteles seguidos; VAL-63
     sólo lo hizo visible porque es el primer caso donde el segundo importa
     más que el primero. */
  const mio = t.firstElementChild;
  setTimeout(()=>{ if(t.firstElementChild === mio) t.innerHTML=""; }, err?4200:(alTocar?7000:2600));
}
const val = id => (document.getElementById(id)?.value || "").trim();

/* ---------- viaje ---------- */
function sheetTrip(trip){
  const t = trip || {id:uid(), hue: Math.floor(Math.random()*360)};
  openSheet(trip?"Editar viaje":"Nuevo viaje", `
    <div class="f req"><label for="t_name">Nombre del viaje</label>
      <input id="t_name" value="${esc(t.name||"")}" placeholder="Vacaciones en el sur" autocomplete="off"></div>
    <div class="f"><label for="t_dest">Destino principal</label>
      <input id="t_dest" value="${esc(t.destination||"")}" placeholder="Bariloche" autocomplete="off">
      <span class="hint">Se usa en la etiqueta de la valija y en el PDF.</span></div>
    <div class="f2">
      <div class="f"><label for="t_from">Salida</label><input id="t_from" type="date" value="${esc(dayKey(t.startDate))}"></div>
      <div class="f"><label for="t_to">Regreso</label><input id="t_to" type="date" value="${esc(dayKey(t.endDate))}"
        ${t.startDate?`min="${esc(addDays(t.startDate,1))}"`:""}></div>
    </div>
    <div class="f"><label for="t_people">Quiénes viajan</label>
      <input id="t_people" value="${esc(t.travelers||"")}" placeholder="Tomás, Ana y Juli" autocomplete="off"></div>
    <div class="f"><label for="t_notes">Notas</label>
      <textarea id="t_notes" placeholder="Presupuesto, ideas, links sueltos...">${esc(t.notes||"")}</textarea></div>
    ${trip?`<hr class="hr"><button class="btn danger block" id="deltrip">${svg(I.trash)} Eliminar este viaje</button>`:""}
  `, `
    <button class="btn ghost" id="cancel">Cancelar</button>
    <button class="btn primary" id="save">Guardar</button>
  `);

  document.getElementById("cancel").onclick = closeSheet;
  // Elegir la salida limita el calendario de regreso ahí mismo: es mejor que el
  // día inválido no se pueda elegir, a explicar después por qué no sirve.
  const fIni = document.getElementById("t_from"), fFin = document.getElementById("t_to");
  if(fIni && fFin) fIni.onchange = ()=>{
    if(!fIni.value){ fFin.removeAttribute("min"); return; }
    fFin.min = addDays(fIni.value, 1);
    if(fFin.value && fFin.value <= fIni.value) fFin.value = "";
  };
  document.getElementById("save").onclick = async ()=>{
    const name = val("t_name");
    if(!name){ toast("Poné un nombre al viaje", true); return; }
    const from = val("t_from"), to = val("t_to");
    if(from && to && to <= from){ toast("El regreso tiene que ser después de la salida", true); return; }
    const guardado = {...t, name, destination:val("t_dest"),
      startDate:from, endDate:to, travelers:val("t_people"), notes:val("t_notes"), sample:t.sample||false};
    /* VAL-63: ¿este cambio mueve la valija? Se decide ACÁ, antes de guardar,
       porque después de `Store.saveTrip` los valores viejos ya no existen. */
    const mueveLaValija = !!trip && cambioQueMueveLaValija(t, guardado);
    try{
      await Store.saveTrip(guardado);
      closeSheet();
      if(!trip) go(`#/trip/${t.id}`);
      toast(trip?"Viaje actualizado":"Viaje creado");
      /* Y recién acá, con la hoja ya cerrada: `checkPackingPlan` habla con el
         modelo y tarda. Va sin `await` por lo mismo que en la hoja de la
         reserva — el aviso entra cuando resuelve, no traba el guardado.

         Y AVISA. Los otros cuatro disparadores pintan su aviso adentro de la
         pantalla de la valija, que es donde la persona ya está mirando. Acá
         no: acaba de cambiar una fecha desde la pantalla del viaje y se va a
         ir a otro lado. Sin este toast el plan queda esperándola adentro de la
         valija y ella no se entera de que pasó algo — que es exactamente el
         síntoma que VAL-63 vino a arreglar, con otro disfraz.

         Silencio cuando no hay nada que ofrecer: cambiar una fecha y que la
         lista ya esté bien no es una novedad. */
      if(mueveLaValija) checkPackingPlan(guardado).then(plan=>{
        if(!plan || !plan.nuevos || !plan.nuevos.length) return;
        const n = plan.nuevos.length;
        toast(n === 1 ? "Tengo 1 cosa para sumarte a la valija"
                      : `Tengo ${n} cosas para sumarte a la valija`,
              false,
              ()=> go(`#/trip/${guardado.id}/valija`));
      }).catch(()=>{});
    }catch(e){ toast(writeErr(e), true); }
  };
  const dl = document.getElementById("deltrip");
  if(dl) dl.onclick = async ()=>{
    dl.disabled = true;
    try{ await Store.delTrip(t.id); closeSheet(); go(""); toast("Viaje eliminado"); }
    catch(e){ dl.disabled = false; toast(writeErr(e), true); }
  };
}

/** Traduce un error de escritura de la base a algo que la persona pueda usar.

    `invalid_argument` NO significa "sólo lectura". La base lo devuelve al
    menos por dos motivos distintos: que quien mira no puede escribir, y que
    el documento se pasó del tope de 256 KiB. Este mensaje elegía uno de los
    dos y lo afirmaba.

    Lo encontró la auditoría de VAL-74 el 19/09 siguiendo el hilo de qué vería
    la persona si la lista se pasaba del tope: le habría dicho "tenés acceso de
    sólo lectura" a alguien que es dueño de su propia valija. Una causa
    inventada, que es justo lo que este proyecto tiene prohibido por escrito.

    Ahora dice lo que pasó —no se pudo guardar— y ofrece las dos salidas
    posibles sin decidir cuál es. Si más adelante la base distingue los casos,
    acá es donde se separan. */
function writeErr(e){
  if(e && e.code === "invalid_argument")
    return "No se pudo guardar. Puede ser que estés mirando una valija que no es tuya, o que esto ya no entre por tamaño";
  if(e && e.code === "quota_exceeded") return "La valija llegó a su límite de reservas";
  // Quedó guardado en este teléfono aunque no haya podido sincronizar: decirlo
  // evita que la persona cargue todo de nuevo pensando que se perdió.
  return "Guardado en este dispositivo. No se pudo sincronizar todavía";
}

function sheetItem(trip, item, prefill){
  const it = item || Object.assign({id:uid(), type:"flight"}, prefill||{});
  const T = k => TYPES[k];

  const fieldsFor = type => {
    const common = `

          type==="flight"?"Buenos Aires → Madrid":
          type==="stay"?"Hotel Atocha":
          type==="car"?"Auto en Madrid":
          type==="act"?"Visita al Prado":"Anotación"}" autocomplete="off"></div>`;

  const picker = `<div class="f"><label>Tipo de reserva</label><div class="tp" id="tp">

  const DOC = {

  async function elegirAdjunto(file, origen){
    if(!file) return;

    DOC.fallo = null; DOC.aviso = "";

      origen, tipoReserva: it.type, docsActuales: DOC.lista.map(e=>e.doc), itemId: it.id

      const fallados = [];

      DOC.quitados = [];

      else toast(item?"Reserva actualizada":"Reserva guardada");
      checkPackingPlan(trip);   // VAL-46: ¿la lista quedó vieja?
    }catch(e){ toast(writeErr(e), true); }
  };
  const di = document.getElementById("delitem");
  if(di) di.onclick = async ()=>{

      await Store.delItem(trip.id, it.id); closeSheet(); toast("Reserva eliminada");

    }
    catch(e){ di.disabled = false; toast(writeErr(e), true); }
