/**
 * Valida y normaliza lo que devolvió la IA. Descarta todo lo que no cumple.
 * @param {Object|string} raw respuesta cruda
 * @param {Object} list lista base, para no duplicar ni resucitar lo suprimido
 * @returns {{items:Array, clima:string}}
 */
function parseDestinationItems(raw, list) {
  var data = raw;
  if (typeof data === "string") { try { data = JSON.parse(data); } catch (e) { data = null; } }
  if (!data || !Array.isArray(data.items)) return { items:[], clima:"" };

  var have = indexItems(itemsArray(list));
  var suprimidos = {};
  ((list && list.aprendizaje && list.aprendizaje.suprimidos) || []).forEach(function (e) { suprimidos[e.clave] = true; });

  var out = [];
  data.items.forEach(function (x) {
    if (out.length >= MAX_AI_ITEMS) return;
    if (!x || typeof x !== "object") return;
    var nombre = String(x.nombre || x.label || "").trim();
    var motivo = String(x.motivo || x.reason || "").trim();
    if (!nombre || !motivo) return;                 // sin motivo no entra: VAL-33 lo exige
    var clave = slug(nombre);
    if (!clave || have[clave] || suprimidos[clave]) return;
    var categoria = CATEGORY_ORDER[x.categoria] !== undefined ? x.categoria : "destino";
    var cantidad = (typeof x.cantidad === "number" && isFinite(x.cantidad) && x.cantidad > 0) ? Math.round(x.cantidad) : null;
    have[clave] = true;
    out.push({ clave:clave, nombre:nombre, categoria:categoria, cantidad:cantidad, motivo:motivo });
  });

  return { items:out, clima:typeof data.clima === "string" ? data.clima.trim() : "" };
}

/**
 * CAPA 2. Nunca lanza: si la IA falla, devuelve la lista base con el aviso puesto.
 * @param {Object} list lista base
 * @param {Function} ask función asíncrona (prompt) => objeto o string JSON
 * @param {Object} [opts] {now}
 * @returns {Promise<Object>} lista, ajustada o no
 */
function enrichWithDestination(list, ask, opts) {
  opts = opts || {};
  var at = opts.now || nowISO();

  function conCapa(estado, nota, extra) {
    var avisos = (list.avisos || []).filter(function (w) { return w.codigo !== "ia-no-disponible" && w.codigo !== "ia-fallo"; });
    if (estado === "no-disponible") avisos = avisos.concat([{ codigo:"ia-no-disponible",
      texto:"Falta el ajuste por destino: la lista es la base de reglas. Igual sirve." }]);
    if (estado === "error") avisos = avisos.concat([{ codigo:"ia-fallo",
      texto:"No pude ajustar la lista al destino. Te muestro la lista base, que ya cubre lo esencial." }]);
    var previaClima = (list.capaInteligente && list.capaInteligente.clima) || "";
    return Object.assign({}, list, extra || {}, {
      capaInteligente:{ estado:estado, en:at, nota:nota || "",
                        clima:(extra && extra.clima != null) ? extra.clima : previaClima },
      avisos:avisos
    });
  }

  if (typeof ask !== "function") {
    return Promise.resolve(conCapa("no-disponible", "La app no pasó una función para consultar al modelo."));
  }

  return Promise.resolve()
    .then(function () { return ask(destinationPrompt(list), { list:list, base:list.base }); })
    .then(function (raw) {
      var parsed = parseDestinationItems(raw, list);
      if (!parsed.items.length) {
        return conCapa("vacio", "El modelo no agregó nada específico del destino.",
                       parsed.clima ? { clima:parsed.clima } : null);
      }
      var items = Object.assign({}, list.items);
      parsed.items.forEach(function (x, i) {
        items[x.clave] = makeItem({
          clave:x.clave, nombre:x.nombre, categoria:x.categoria, cantidad:x.cantidad,
          motivo:x.motivo, origen:ORIGEN.DESTINO, regla:"destino",
          orden:orderOf(x.categoria, 800 + i)
        }, at);
      });
      var out = conCapa("ok",
        "Ajustada al destino: " + parsed.items.length + (parsed.items.length === 1 ? " ítem agregado." : " ítems agregados."),
        { items:items, clima:parsed.clima || "" });
      out.conteo = packingProgress(out);
      return out;
    })
    .catch(function (e) {
      return conCapa("error", (e && e.message) ? String(e.message) : "Error desconocido.");
    });
}

/* ============================================================
   ENTRADA PRINCIPAL — las tres capas
   ============================================================ */

/**
 * Genera la lista completa. Nunca lanza por culpa de la IA.
 * @param {Object}   input
 * @returns {Promise<Object>} documento de lista listo para guardar
 */
function generatePackingList(input) {
  input = input || {};
  var base = buildPackingList(Object.assign({}, input, { previous: null }));
  if (typeof input.ask !== "function") {
    return Promise.resolve(input.previous ? mergeLists(input.previous, base) : base);
  }
  return enrichWithDestination(base, input.ask, { now:input.now }).then(function (enriched) {
    return input.previous ? mergeLists(input.previous, enriched) : enriched;
  });
}

/* ============================================================

function replaceItem(list, clave, fn) {
  var actual = (list.items || {})[clave];
  if (!actual) return list;
  var items = Object.assign({}, list.items);
  items[clave] = fn(actual);
  var out = Object.assign({}, list, { items:items, actualizadaEn:nowISO() });
  out.conteo = packingProgress(out);
  return out;
}

/**
 * Cambia el estado de un ítem. Tres estados: pendiente, empacado, descartado.
 * @param {Object} list
 * @param {string} clave clave normalizada del ítem
 * @param {string} estado uno de ESTADO
 * @param {Object} [opts] {now}
 * @returns {Object} lista nueva
 */
function setItemState(list, clave, estado, opts) {
  opts = opts || {};
  if (ESTADOS.indexOf(estado) < 0) return list;
  var at = opts.now || nowISO();
  return replaceItem(list, clave, function (i) {
    return Object.assign({}, i, {
      estado:estado,
      empacadoEn:estado === ESTADO.EMPACADO ? (i.empacadoEn || at) : null,
      actualizadoEn:at
    });
  });
}

/** Azúcar sobre setItemState. */
function packItem(list, clave, opts)    { return setItemState(list, clave, ESTADO.EMPACADO, opts); }
function dismissItem(list, clave, opts) { return setItemState(list, clave, ESTADO.DESCARTADO, opts); }
function resetItem(list, clave, opts)   { return setItemState(list, clave, ESTADO.PENDIENTE, opts); }

/**
 * El parche parcial para marcar UN ítem en la base sin reescribir la lista.
 *   db.doc(`trips/${tripId}/packing/lista`).update(stateUpdatePatch(clave, "empacado"))
 * @param {string} clave
 * @param {string} estado uno de ESTADO
 * @param {Object} [opts] {now}
 * @returns {Object|null} objeto para pasarle a update(), o null si el estado no existe
 */
function stateUpdatePatch(clave, estado, opts) {
  opts = opts || {};
  if (!clave || ESTADOS.indexOf(estado) < 0) return null;
  var at = opts.now || nowISO();
  var parche = { estado:estado, empacadoEn:estado === ESTADO.EMPACADO ? at : null, actualizadoEn:at };
  var items = {}; items[clave] = parche;
  return { items:items, actualizadaEn:at };
}

/** Corrige la cantidad a mano. Queda marcada para que regenerar no la pise. */
function setQty(list, clave, cantidad, opts) {
  opts = opts || {};
  var at = opts.now || nowISO();
  return replaceItem(list, clave, function (i) {
    return Object.assign({}, i, { cantidad:cantidad, cantidadEditada:true,
                                  motivo:"Lo ajustaste vos.", actualizadoEn:at });
  });
}

/**
 * Agrega un ítem propio. Es lo que después aprende el historial.
 * @returns {Object} lista nueva
 */
function addManualItem(list, fields, opts) {
  fields = fields || {}; opts = opts || {};
  var at = opts.now || nowISO();
  var nombre = String(fields.nombre || fields.label || "").trim();
  if (!nombre) return list;
  var clave = slug(nombre);
  if (!clave) return list;
  if ((list.items || {})[clave]) return setItemState(list, clave, ESTADO.PENDIENTE, { now:at });

  var categoria = CATEGORY_ORDER[fields.categoria] !== undefined ? fields.categoria : "otros";
  var it = makeItem({
    clave:clave, nombre:nombre, categoria:categoria,
    cantidad:typeof fields.cantidad === "number" ? fields.cantidad : null,
    motivo:fields.motivo || "Lo agregaste vos.",
    origen:ORIGEN.MANUAL, regla:"", orden:orderOf(categoria, 950)
  }, at);

  var items = Object.assign({}, list.items);
  items[clave] = it;
  var out = Object.assign({}, list, { items:items, actualizadaEn:at });
  out.conteo = packingProgress(out);
  return out;
}

/** Borra un ítem. Sólo los propios: los sugeridos se descartan, no se borran. */

  return out;

/**

  var todos = itemList(list, opts);

      var paginas = [];
      for (var n = 1; n <= pdf.numPages; n++) paginas.push(n);
      // Secuencial, no en paralelo: varias páginas grandes al mismo tiempo
      // multiplican la memoria de canvas en un teléfono.
      return paginas.reduce(function (chain, n) {
        return chain.then(function (acc) {
          return pdf.getPage(n).then(function (page) {
            var viewport = page.getViewport({ scale: scale });
            var canvas = document.createElement("canvas");
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            var ctx = canvas.getContext("2d");
            return page.render({ canvasContext: ctx, viewport: viewport }).promise
              .then(function () {
                return new Promise(function (resolve) { canvas.toBlob(resolve, mimeType); });
              })
              .then(function (blob) { if (blob) acc.push(blob); return acc; });
          });
        });
      }, Promise.resolve([]));
    });
}

/* ============================================================
   EL PROMPT DE INTERPRETACIÓN
   ============================================================ */

/**
 * Arma el prompt para una tanda de imágenes que pertenecen a un mismo
 * archivo. Mejora el prompt existente de `sheetImport` en valija.html:
 * agrega `boardingTime` y deja explícito que varias páginas son un
 * mismo comprobante, sin perder la instrucción de no inventar nada.
 *
 * @param {Object} [ctx]
 * @param {Object} [ctx.trip] {name, destination, startDate, endDate}
 * @param {string} [ctx.now]  fecha ISO, para pruebas determinísticas
 * @param {string} [ctx.archivo] nombre del archivo, sólo para el mensaje
 * @param {number|null} [ctx.paginas] cantidad de imágenes de este archivo
 * @returns {string}
 */
function buildImportPrompt(ctx) {
  ctx = ctx || {};
  var trip = ctx.trip || {};
  var hoy = ctx.now ? String(ctx.now).slice(0, 10) : new Date().toISOString().slice(0, 10);
  var paginas = ctx.paginas;

  var nombreArchivo = ctx.archivo ? " (\"" + ctx.archivo + "\")" : "";
  var origenTxt = (paginas && paginas > 1)
    ? "Las " + paginas + " imágenes adjuntas son las páginas, en orden, de un mismo comprobante" + nombreArchivo +
      ". Pueden describir una reserva o varias (por ejemplo ida y vuelta): leelas todas juntas antes de decidir cuántas hay."
    : "La imagen adjunta" + nombreArchivo + " es un comprobante de viaje: tarjeta de embarque, voucher de hotel, contrato de auto, o la captura de un mail de confirmación.";

  var contexto = "El viaje se llama \"" + (trip.name || "") + "\"" +
    (trip.destination ? ", destino " + trip.destination : "") +
    (trip.startDate ? ", entre " + trip.startDate + " y " + (trip.endDate || "?") : "") +
    ". Hoy es " + hoy + ".";

  return [
    "Extraés datos de reservas de viaje a partir de imágenes y devolvés SOLO JSON, sin texto alrededor.",
    "",
    origenTxt,
    "",
    "Contexto: " + contexto,
    "",
    "Devolvé este JSON exacto:",
    '{"items":[{',
    '"type":"flight|stay|car|transfer|act|note",',
    '"title":"texto corto y humano, ej: Buenos Aires → Madrid",',
    '"start":"YYYY-MM-DDTHH:mm o vacío",',
    '"end":"YYYY-MM-DDTHH:mm o vacío",',
    '"from":"IATA de 3 letras si es vuelo, si no ciudad o lugar",',
    '"to":"idem",',
    '"provider":"aerolínea, hotel, plataforma o rentadora",',
    '"flightNumber":"","confirmation":"","seat":"","terminal":"","gate":"",',
    '"boardingTime":"HH:mm o vacío",',
    '"address":"","phone":"","cost":"","currency":"","notes":""',
    "}]}",
    "",
    "Reglas que no se rompen:",
    "1. Un objeto por reserva. Ida y vuelta son DOS vuelos separados, cada uno con su propio número.",
    "2. Usá 24 horas. Si el año no figura en la imagen, deducilo del contexto del viaje de arriba.",
    "3. Si un dato no aparece con claridad en la imagen, dejá \"\" en ese campo. Es preferible un campo vacío: NUNCA inventes códigos de vuelo, horarios, direcciones ni montos que no estén escritos ahí.",
    "4. Para alojamiento, \"start\" es el check-in y \"end\" el check-out.",
    "5. \"boardingTime\" es la hora de embarque impresa en una tarjeta de embarque, distinta de la hora de salida del vuelo. Si la imagen no es una tarjeta de embarque, dejalo vacío.",
    "6. Si no reconocés ninguna reserva en las imágenes, devolvé {\"items\":[]}. Es preferible eso a inventar una.",
    "7. Nada de comentarios ni texto fuera del JSON."
  ].join("\n");
}

/* ============================================================
   VALIDAR LA RESPUESTA DEL MODELO
   Nunca confía: una respuesta rota, sin JSON, o con basura adentro
   se convierte en una lista vacía, no en una excepción.
   ============================================================ */

/**
 * @param {*} x un elemento de `items` en la respuesta cruda
 * @returns {Object|null} la reserva saneada, o null si no sirve
 */
function sanitizeReservation(x) {
  if (!x || typeof x !== "object") return null;
  var out = { type: RESERVATION_TYPES.indexOf(x.type) >= 0 ? x.type : "note" };
  STRING_FIELDS.forEach(function (f) {
    out[f] = typeof x[f] === "string" ? x[f].trim() : "";
  });
  // Sin título ni proveedor no hay nada que mostrarle a la persona para revisar
  // — EXCEPTO una tarjeta de embarque (VAL-42): ahí el título lo termina
  // aportando el vuelo ya cargado que se va a completar, no la tarjeta. El
  // estado 07B del diseño ("el disparador más frecuente") es justamente una
  // tarjeta sin aerolínea ni ruta legibles, sólo asiento y fecha. Alcanza con
  // algún dato que sirva para identificar o completar un vuelo: número de
  // vuelo, fecha de salida, asiento, puerta o terminal. Sin ninguno de esos
  // tampoco hay nada que mostrar, y se descarta igual.
  if (!out.title && !out.provider) {
    if (out.type !== "flight") return null;
    var tieneDatoDeVuelo = out.flightNumber || out.start || out.seat || out.gate || out.terminal;
    if (!tieneDatoDeVuelo) return null;
  }
  return out;
}

/**
 * @param {*} raw lo que devolvió `callModel`: objeto ya parseado o un string con JSON
 * @returns {Array<Object>} reservas saneadas; vacío si la respuesta es basura
 */
function parseImportResponse(raw) {
  var data = raw;
  if (typeof data === "string") {
    try { data = JSON.parse(data); } catch (e) { return []; }
  }
  if (!data || typeof data !== "object" || !Array.isArray(data.items)) return [];
  var out = [];
  data.items.forEach(function (x) {
    var r = sanitizeReservation(x);
    if (r) out.push(r);
  });
  return out;
}

/* ============================================================
   ERRORES DEL MODELO, EN MENSAJES HUMANOS
   Tabla declarativa: agregar un código conocido es agregar una
   entrada acá, igual que sheetImport en valija.html.
   ============================================================ */

var MODEL_ERROR_MESSAGES = {
  not_granted: "La lectura automática no está habilitada en esta vista.",
  rate_limited: "Demasiados pedidos seguidos. Esperá un momento y probá de nuevo.",
  images_unavailable: "Esta vista no acepta imágenes.",
  image_rejected: "No pude leer esa imagen. Probá con otra foto, con más luz o sin reflejos."
};

function friendlyModelError(e) {
  var code = e && e.code;
  var mensaje = (code && MODEL_ERROR_MESSAGES[code]) || (e && e.message) || "No pude interpretar el archivo.";
  return { codigo: code || "desconocido", mensaje: String(mensaje) };
}

/* ============================================================
   INTERPRETAR UN ARCHIVO — VAL-40 / VAL-41
   ============================================================ */

/**
 * Convierte un archivo (imagen o PDF) en las imágenes que hay que
 * mandarle al modelo. No llama al modelo: sólo prepara la entrada.
 * @returns {Promise<{imagenes:Array, paginas:number|null}>}
 */
function prepareImages(file, opts) {
  var kind = fileKind(file);

  if (kind === "desconocido") {
    return Promise.reject(ImportError("tipo-no-soportado",
      "No reconozco este tipo de archivo. Subí una foto (PNG o JPG) o un PDF."));
  }

  if (kind === "imagen") {
    return Promise.resolve({ imagenes: [file.blob], paginas: null });
  }

  // PDF: VAL-40, se renderiza completo, tenga texto o sea escaneado.
  if (typeof opts.renderPdfToImages !== "function") {
    return Promise.reject(ImportError("pdf-no-disponible",
      "No pude convertir el PDF a imagen en este dispositivo. Probá con una foto del comprobante."));
  }
  return Promise.resolve()
    .then(function () { return opts.renderPdfToImages(file.blob, { name: file.name }); })
    .catch(function () {
      throw ImportError("pdf-fallo", "No pude leer ese PDF. Probá con una foto del comprobante.");
    })
    .then(function (imagenes) {
      imagenes = (imagenes || []).filter(Boolean);
      if (!imagenes.length) {
        throw ImportError("pdf-vacio", "El PDF no tiene páginas legibles.");
      }
      return { imagenes: imagenes, paginas: imagenes.length };
    });
}

/** Llama al modelo con las imágenes ya preparadas. Nunca rechaza: degrada a un fileResult de error. */
function callModelForImages(prep, nombre, opts) {
  if (typeof opts.callModel !== "function") {
    return fileResult(nombre, "error", [],
      errorInfo("ia-no-disponible", "La lectura automática no está disponible ahora mismo. Cargá la reserva a mano."),
      prep.paginas);
  }
  var prompt = buildImportPrompt({ trip: opts.trip, now: opts.now, archivo: nombre, paginas: prep.paginas });
  return Promise.resolve()
    .then(function () { return opts.callModel(prompt, { images: prep.imagenes }); })
    .then(function (raw) {
      var reservas = parseImportResponse(raw).map(function (r) { return Object.assign({}, r, { archivo: nombre }); });
      return fileResult(nombre, reservas.length ? "ok" : "vacio", reservas, null, prep.paginas);
    })
    .catch(function (e) {
      return fileResult(nombre, "error", [], friendlyModelError(e), prep.paginas);
    });
}

/**
 * Interpreta UN archivo. Nunca rechaza la promesa: cualquier falla
 * (tipo no soportado, PDF que no se pudo renderizar, modelo caído,
 * respuesta basura) se convierte en un `fileResult` con `estado:"error"`.
 * Así un archivo roto nunca invalida a los demás en `interpretFiles`.
 *
 * @param {{name:string, blob:Blob, mimeType?:string}} file
 * @param {Object} opts
 * @param {Function} opts.callModel        async (prompt, {images}) => objeto o string JSON
 * @param {Function} [opts.renderPdfToImages] async (blob) => Blob[]; sin esto los PDF fallan con dignidad
 * @param {Object}   [opts.trip]           {name, destination, startDate, endDate}
 * @param {string}   [opts.now]            fecha ISO fija, para pruebas
 * @returns {Promise<Object>} fileResult
 */
function interpretFile(file, opts) {
  opts = opts || {};
  var nombre = (file && file.name) || "archivo";
  return prepareImages(file, opts)
    .then(function (prep) { return callModelForImages(prep, nombre, opts); })
    .catch(function (e) {
      if (e && e.__importError) return fileResult(nombre, "error", [], e.info, null);
      return fileResult(nombre, "error", [], errorInfo("desconocido", (e && e.message) || "No pude interpretar el archivo."), null);
    });
}

/**
 * Interpreta varios archivos a la vez (VAL-41), mezclando fotos y PDFs.
 * La promesa se resuelve siempre: cada archivo lleva su propio resultado.
 *
 * @param {Array<{name:string, blob:Blob, mimeType?:string}>} files
 * @param {Object} opts ver `interpretFile`
 * @returns {Promise<{archivos:Array, reservas:Array, resumen:Object}>}
 */
function interpretFiles(files, opts) {
  opts = opts || {};
  files = (files || []).filter(Boolean);
  return Promise.all(files.map(function (f) { return interpretFile(f, opts); }))
    .then(function (archivos) {
      var reservas = [];
      archivos.forEach(function (a) { reservas = reservas.concat(a.reservas); });
      var resumen = {
        total: archivos.length,
        ok: archivos.filter(function (a) { return a.estado === "ok"; }).length,
        vacios: archivos.filter(function (a) { return a.estado === "vacio"; }).length,
        errores: archivos.filter(function (a) { return a.estado === "error"; }).length,
        reservas: reservas.length
      };
      return { archivos: archivos, reservas: reservas, resumen: resumen };
    });
}

/* ============================================================
   RECONOCER UN VUELO YA CARGADO — VAL-42
   ============================================================ */

/** Sólo letras y números, en mayúsculas: "JA 3040" y "ja3040" caen igual. */
function normalizeFlightNumber(fn) {
  return String(fn || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}
function flightNumberDigits(fn) {
  var m = /\d+/.exec(normalizeFlightNumber(fn));
  return m ? m[0].replace(/^0+(?=\d)/, "") : "";
}
function flightNumberLetters(fn) {
  return normalizeFlightNumber(fn).replace(/[0-9]/g, "");
}

/**
 * Dos números de vuelo son "el mismo" si comparten los mismos dígitos y
 * las letras no se contradicen. Una tarjeta de embarque a veces sólo trae
 * "3040" donde el vuelo ya cargado tiene "JA3040": igual cuentan como el
 * mismo número.
 */
function sameFlightNumber(a, b) {
  var da = flightNumberDigits(a), db = flightNumberDigits(b);
  if (!da || !db || da !== db) return false;
  var la = flightNumberLetters(a), lb = flightNumberLetters(b);
  return !la || !lb || la === lb;
}

/** Sólo la parte de fecha, YYYY-MM-DD, de un string ISO o "YYYY-MM-DD HH:mm". */
function dateOnly(s) {
  var m = /^(\d{4}-\d{2}-\d{2})/.exec(String(s || "").trim());
  return m ? m[1] : "";
}
function sameFlightDate(a, b) {
  var da = dateOnly(a), db = dateOnly(b);
  return !!da && da === db;
}

/**
 * Los campos que la tarjeta de embarque completa en el vuelo ya cargado,
 * sólo cuando el vuelo cargado los tiene vacíos. Nunca pisa un dato que
 * la persona ya había puesto.
 * @param {Object} candidato reserva interpretada, tipo "flight"
 * @param {Object} existente reserva ya cargada en el viaje
 * @returns {Object} patch parcial, listo para mostrar y para guardar
 */
function buildFlightPatch(candidato, existente) {
  var patch = {};
  CAMPOS_COMPLETABLES.forEach(function (campo) {
    var nuevo = norm(candidato && candidato[campo]);
    var actual = norm(existente && existente[campo]);
    if (nuevo && !actual) {
      patch[campo] = (campo === "boardingTime") ? nuevo : nuevo.toUpperCase();
    }
  });
  return patch;
}

/**
 * VAL-42. Decide si una reserva de vuelo interpretada es nueva, es un
 * vuelo ya cargado (y con qué se completa), o hay más de un candidato
 * y hace falta preguntar. El criterio es número de vuelo y fecha.
 *
 * Ante la duda, nunca decide. Eso incluye el caso en que la tarjeta no
 * trae número de vuelo: sin número no hay certeza, así que si la fecha
 * coincide con uno o más vuelos ya cargados, el resultado es "ambiguo"
 * con esos vuelos como candidatos — nunca "nuevo". Un duplicado
 * silencioso es peor que una pregunta: la persona pierde la confianza
 * en el importador si ve el mismo vuelo dos veces.
 *
 * Sólo es "nuevo" cuando no hay ningún vuelo cargado ese día, o cuando
 * hay número de vuelo y no coincide con ninguno de los de ese día.
 *
 * @param {Object} candidato    reserva interpretada (de `interpretFiles`)
 * @param {Array}  existentes   reservas que el viaje ya tiene
 * @returns {{resultado:"nuevo"|"mismo"|"ambiguo", motivo:string, candidato:Object,
 *            existente?:Object, patch?:Object, candidatos?:Array}}
 */
function matchFlightReservation(candidato, existentes) {
  existentes = (existentes || []).filter(Boolean);

  if (!candidato || candidato.type !== "flight") {
    return { resultado: "nuevo", motivo: "No es un vuelo.", candidato: candidato };
  }

  var numero = candidato.flightNumber;
  var fecha = dateOnly(candidato.start);

  if (!fecha) {
    return {
      resultado: "nuevo",
      motivo: "No se pudo determinar la fecha del vuelo: no hay con qué comparar, se carga como reserva nueva.",
      candidato: candidato
    };
  }

  var vuelosEseDia = existentes.filter(function (it) {
    return it && it.type === "flight" && sameFlightDate(it.start, fecha);
  });

  if (!numero) {
    if (!vuelosEseDia.length) {
      return {
        resultado: "nuevo",
        motivo: "La tarjeta no trae número de vuelo, pero no hay ningún vuelo cargado ese día: se carga como reserva nueva.",
        candidato: candidato
      };
    }
    return {
      resultado: "ambiguo",
      motivo: "La tarjeta no trae número de vuelo y hay " + vuelosEseDia.length +
        (vuelosEseDia.length === 1 ? " vuelo cargado" : " vuelos cargados") +
        " ese mismo día: sin número no hay forma de distinguir sin adivinar.",
      candidato: candidato,
      candidatos: vuelosEseDia
    };
  }

  var candidatos = vuelosEseDia.filter(function (it) { return sameFlightNumber(it.flightNumber, numero); });

  if (!candidatos.length) {
    return { resultado: "nuevo", motivo: "Ningún vuelo cargado coincide en número y fecha.", candidato: candidato };
  }

  if (candidatos.length > 1) {
    return {
      resultado: "ambiguo",
      motivo: "Hay " + candidatos.length + " vuelos cargados con el mismo número y la misma fecha.",
      candidato: candidato,
      candidatos: candidatos
    };
  }

  var existente = candidatos[0];
  return {
    resultado: "mismo",
    motivo: "Mismo número de vuelo (" + numero + ") y misma fecha (" + fecha + ").",
    candidato: candidato,
    existente: existente,
    patch: buildFlightPatch(candidato, existente)
  };
}

/**
 * Azúcar sobre `matchFlightReservation` para usar sobre cualquier reserva
 * interpretada sin fijarse antes el tipo: lo que no es vuelo siempre es
 * nuevo, porque el reconocimiento de duplicados de VAL-42 es sólo para
 * vuelos.
 * @param {Object} reserva
 * @param {Array}  existentes
 * @returns {Object} igual forma que matchFlightReservation
 */
function matchAgainstExisting(reserva, existentes) {
  if (reserva && reserva.type === "flight") return matchFlightReservation(reserva, existentes);
  return { resultado: "nuevo", motivo: "No es un vuelo: se carga como reserva nueva.", candidato: reserva };
}

/* ============================================================
   EXPORTA
   ============================================================ */
return {
  VERSION: VERSION,
  RESERVATION_TYPES: RESERVATION_TYPES,
  STRING_FIELDS: STRING_FIELDS,
  CAMPOS_COMPLETABLES: CAMPOS_COMPLETABLES,
  PDFJS_VERSION: PDFJS_VERSION,
  PDFJS_CDN_BASE: PDFJS_CDN_BASE,

  // VAL-40: PDF a imágenes (única función que toca el DOM)
  renderPdfPagesToImages: renderPdfPagesToImages,
  openPdfDocument: openPdfDocument,

  // VAL-40 / VAL-41: interpretar archivos
  fileKind: fileKind,
  buildImportPrompt: buildImportPrompt,
  parseImportResponse: parseImportResponse,
  sanitizeReservation: sanitizeReservation,
  friendlyModelError: friendlyModelError,
  interpretFile: interpretFile,
  interpretFiles: interpretFiles,

  // VAL-42: reconocer un vuelo ya cargado
  matchFlightReservation: matchFlightReservation,
  matchAgainstExisting: matchAgainstExisting,
  buildFlightPatch: buildFlightPatch,
  normalizeFlightNumber: normalizeFlightNumber,
  sameFlightNumber: sameFlightNumber,
  sameFlightDate: sameFlightDate,
  dateOnly: dateOnly
};
})();

/* ============================================================
   ROUTER
   ============================================================ */
const App = { view:"home", tripId:null, tab:"plan" };

function readHash(){
  const h = location.hash.replace(/^#\/?/,"");
  const [a,b,c] = h.split("/");
  if(a==="trip" && b && c==="valija"){ App.view="packing"; App.tripId=b; }
  else if(a==="trip" && b){ App.view="trip"; App.tripId=b; }
  else { App.view="home"; App.tripId=null; }
}
function go(hash){ location.hash = hash; }
window.addEventListener("hashchange", ()=>{ readHash(); Store.watch(App.tripId); Store.watchPacking(App.tripId); render(); });

/* ============================================================
   RENDER
   ============================================================ */
const $hdr = document.getElementById("hdr");
const $main = document.getElementById("main");
const $fab = document.getElementById("fab");

// Con un link compartido el viaje llega desde la nube, no de este dispositivo.
// Mientras la nube no contestó no sabemos si existe, así que esperamos en vez
// de rebotar a la lista.
function tripResuelto(){ return Store.ready && (!Store.db || Store.cloudSynced); }
function esperando(){
  $main.innerHTML = `<div class="sk"></div><div class="sk"></div>`;
  $fab.innerHTML = "";
}

function render(){
  if(App.view==="trip"){
    const trip = Store.trips.get(App.tripId);
    if(!trip && tripResuelto()){ go(""); return; }
    if(!trip){ esperando(); return; }
    renderTrip(trip);
  } else if(App.view==="packing"){
    const trip = Store.trips.get(App.tripId);
    if(!trip && tripResuelto()){ go(""); return; }
    if(!trip){ esperando(); return; }
    renderPacking(trip);
  } else {
    renderHome();
  }
}

/* ---------- HOME ---------- */
function renderHome(){
  const trips = Store.tripList();
  const tema = temaGuardado();
  const badge = Store.mode==="cloud"
    ? (Store.canWrite ? `<span class="chip ok">sincronizada</span>` : `<span class="chip soon">sólo lectura</span>`)
    : `<span class="chip">en este dispositivo</span>`;

  $hdr.innerHTML = `
    <div class="hdr-row">
      <div class="brand">
        <h1>Valija</h1>
        <span class="tag">todo el viaje, un lugar</span>
      </div>
      <button class="iconbtn" id="tema" title="${esc(TEMA_INFO[tema].ayuda)}"
        aria-label="${esc(TEMA_INFO[tema].label)}. Tocá para cambiar">${svg(I[TEMA_INFO[tema].icono])}</button>
      <button class="iconbtn" id="about" title="Acerca de" aria-label="Acerca de">${svg(I.info)}</button>
    </div>
    <div class="hdr-sub">${badge}
      <span>${trips.length} ${trips.length===1?"viaje":"viajes"}</span>
    </div>`;
  document.getElementById("about").onclick = sheetAbout;
  document.getElementById("tema").onclick = ()=>{ temaCambiar(); renderHome(); };

  if(!Store.ready){ $main.innerHTML = `<div class="sk"></div><div class="sk"></div>`; $fab.innerHTML=""; return; }

  if(!trips.length){
    $main.innerHTML = `
      <div class="empty">
        <div class="ico">🧳</div>
        <h3>Tu valija está vacía</h3>
        <p>Abrí un viaje y empezá a guardar vuelos, alojamientos y autos. Podés tener todos los viajes que quieras en paralelo.</p>
      </div>`;
  } else {
    const now = new Date().toISOString().slice(0,10);
    const upcoming = trips.filter(t=> !t.endDate || t.endDate >= now);
    const past = trips.filter(t=> t.endDate && t.endDate < now);

    const section = (title, list) => !list.length ? "" : `
      <div class="stack">
        <div class="sec-head"><span class="eyebrow">${title}</span>
          <span class="eyebrow">${list.length}</span></div>
        <div class="stack">${list.map(cardTrip).join("")}</div>
      </div>`;

    $main.innerHTML = section("Próximos viajes", upcoming) + section("Ya viajados", past);
    $main.querySelectorAll("[data-trip]").forEach(el=>{
      el.onclick = ()=> go(`#/trip/${el.dataset.trip}`);
    });
  }

  $fab.innerHTML = `<div class="fab">
    <button class="btn primary block" id="newtrip">${svg(I.plus)} Nuevo viaje</button>
  </div>`;
  const nt = document.getElementById("newtrip");

  else nt.onclick = ()=> sheetTrip(null);

function cardTrip(t){
  const items = Store.itemsOf(t.id);
  const [from,to] = routeCodes(t, items);
  const pct = completeness(t, items);
  const alerts = tripAlerts(t, items);
  const crit = alerts.filter(a=>a.sev==="crit").length;
  const soon = alerts.filter(a=>a.sev==="soon").length;
  const dd = daysUntil(t.startDate);
  const ringCls = pct>=85?"":(pct>=50?"warn":"low");
  const C = 2*Math.PI*14.5;

  const chips = [];
  if(dd!==null && dd>=0 && dd<=30) chips.push(`<span class="chip live">${dd===0?"hoy":`en ${dd} d`}</span>`);
  if(crit) chips.push(`<span class="chip alert">${crit} sin completar</span>`);
  if(!crit && soon) chips.push(`<span class="chip soon">${soon} por hacer</span>`);
  if(!crit && !soon && items.length) chips.push(`<span class="chip ok">listo</span>`);
  if(items.length) chips.push(`<span class="chip">${items.length} ${items.length===1?"reserva":"reservas"}</span>`);
  if(t.sample) chips.push(`<span class="chip accent">ejemplo</span>`);

  return `
  <button class="tag-card" data-trip="${esc(t.id)}" style="--band:${bandColor(t)}">
    <div class="tag-band"><span>${esc((t.destination||t.name||"VIAJE").toUpperCase().slice(0,14))}</span></div>
    <div class="tag-body">
      <div>
        <div class="route">
          ${from?`<span class="code">${esc(from)}</span><span class="dash"></span>`:""}
          ${svg(I.planeSmall)}
          <span class="dash"></span><span class="code">${esc(to)}</span>
        </div>
      </div>
      <span class="trip-name">${esc(t.name||"Viaje sin nombre")}</span>
      <div class="tag-meta">
        <div style="min-width:0;display:flex;flex-direction:column;gap:6px">
          <span class="dates">${esc(fmtRange(t.startDate,t.endDate))}</span>
          <div class="chips">${chips.join("")}</div>
        </div>
        <div class="ring ${ringCls}" title="${pct}% completo">
          <svg viewBox="0 0 34 34">
            <circle class="bg" cx="17" cy="17" r="14.5"></circle>
            <circle class="fg" cx="17" cy="17" r="14.5"
              stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}"></circle>
          </svg>
          <b>${pct}</b>
        </div>
      </div>
    </div>
  </button>`;
}

function viewPlan(trip, items){
  if(!items.length){
    return `<div class="empty">
      <div class="ico">✈️</div>
      <h3>Todavía no hay nada cargado</h3>
      <p>Agregá el primer vuelo, o pegá el mail de confirmación en <b>Importar</b> y lo interpreto por vos.</p>
    </div>`;
  }
  // agrupar por día
  const groups = new Map();
  const undated = [];
  items.forEach(it=>{
    const k = dayKey(it.start);
    if(!k){ undated.push(it); return; }
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(it);
  });
  const keys = [...groups.keys()].sort();
  const base = trip.startDate ? dayKey(trip.startDate) : keys[0];

  let html = "";
  keys.forEach(k=>{
    const list = groups.get(k).sort((a,b)=> String(a.start||"").localeCompare(String(b.start||"")));
    const n = base ? Math.round((new Date(k)-new Date(base))/86400000)+1 : null;
    html += `<div class="day">
      <div class="day-head">
        ${n&&n>0?`<span class="day-n">Día ${n}</span>`:""}
        <span class="day-date">${esc(fmtDateLong(k))}</span>
        <span class="day-rule"></span>
      </div>
      ${list.map(it=>cardItem(it)).join("")}
    </div>`;
  });
  if(undated.length){
    html += `<div class="day">
      <div class="day-head"><span class="day-n" style="background:var(--ink-3)">Sin fecha</span><span class="day-rule"></span></div>
      ${undated.map(it=>cardItem(it)).join("")}
    </div>`;
  }
  return html;
}

function cardItem(it){
  const T = TYPES[it.type] || TYPES.note;
  const miss = missingFields(it);
  const t1 = fmtTime(it.start), t2 = fmtTime(it.end);

  // El talón muestra los datos propios del tipo de reserva.
  // Tercer valor: true = campo obligatorio, se muestra aunque esté vacío.
  let stub = [];
  if(it.type==="flight"){
    stub = [
      ["Vuelo", it.flightNumber || it.provider, true],
      ["Ruta", (it.from||it.to) ? (it.from||"—")+" → "+(it.to||"—") : "", true],
      ["Reserva", it.confirmation, true],
      ["Asiento", it.seat, false],
      ["Terminal", it.terminal, false],
      ["Puerta", it.gate, false],
      ["Embarque", it.boardingTime, false]
    ];
  } else if(it.type==="stay"){
    stub = [
      ["Alojamiento", it.provider, true],
      ["Check-in", t1 || (it.start?fmtDate(it.start):""), true],
      ["Check-out", t2 || (it.end?fmtDate(it.end):""), true],
      ["Noches", nightsBetween(it.start,it.end) || "", false],
      ["Reserva", it.confirmation, true],
      ["Dirección", it.address, true]
    ];
  } else if(it.type==="car"){
    stub = [
      ["Rentadora", it.provider, true],
      ["Retiro", it.start?fmtDate(it.start):"", true],
      ["Devolución", it.end?fmtDate(it.end):"", true],
      ["Reserva", it.confirmation, true],
      ["Lugar", it.address, true]
    ];
  } else {
    stub = [
      ["Dónde", it.address || it.to, false],
      ["Reserva", it.confirmation, false],
      ["Proveedor", it.provider, false]
    ];
  }
  stub = stub.filter(([,v,req]) => v || req);

  const cost = it.cost ? `<span class="chip">${esc(it.currency||"")} ${esc(it.cost)}</span>` : "";
  const missChip = miss.length ? `<span class="chip alert">falta ${miss.length}</span>` : "";

  const stubHtml = stub.length ? `<div class="pass-stub">${stub.map(([k,v])=>`
    <div class="field"><span class="k">${esc(k)}</span>
    <span class="v ${v?"":"miss"}">${v?esc(v):"pendiente"}</span></div>`).join("")}</div>` : "";


  return `<div class="pass">
    <button class="pass-main" data-item="${esc(it.id)}">
      <span class="pass-icon ${T.cls}">${svg(T.icon)}</span>
      <span class="pass-txt">
        <span class="pass-title">${esc(it.title || T.label)}</span>
        <span class="pass-when">${esc(T.label)}${it.provider?` · ${esc(it.provider)}`:""}</span>
        <span class="chips">${missChip}${cost}</span>
      </span>
      ${t1?`<span class="pass-time">${t1}${t2?`<small>a ${t2}</small>`:""}</span>`:""}
    </button>
    ${stubHtml}
  </div>`;
}

function viewTodo(trip, alerts){
  if(!alerts.length){
    return `<div class="empty">

  const pend = cat.items.filter(i=>i.estado==="pendiente").length;

/* ---------- generar / regenerar ---------- */
async function runGenerate(trip, tipoViaje, previous){
  const items = Store.itemsOf(trip.id);
  let history = [];
  try{ history = await Store.packingHistory(trip.id); }catch(e){ history = []; }
  const base = PackingEngine.buildPackingList({ trip, items, tipoViaje, history });
  const interim = previous ? PackingEngine.mergeLists(previous, base) : base;

  if(PK.tripId === trip.id) PK.generating = true;
  try{ await Store.savePacking(trip.id, interim); }
  catch(e){
    toast(writeErr(e), true);
    if(PK.tripId === trip.id){ PK.generating = false; render(); }
    return;
  }
  if(PK.tripId === trip.id) render();

  let sample = null;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  const ask = sample ? (prompt) => sample.json(prompt, { modelTier:"complex" }) : null;

  let enriched;
  try{ enriched = await PackingEngine.enrichWithDestination(base, ask); }
  catch(e){ enriched = base; }

  // Mezclamos contra lo que haya guardado AHORA (no contra `interim` de más
  // arriba): si mientras la IA respondía la persona ya marcó o descartó algo,
  // esa acción no se pierde al guardar el resultado final.
  const latest = Store.packingOf(trip.id) || interim;
  const final = PackingEngine.mergeLists(latest, enriched);

  if(PK.tripId === trip.id){
    PK.generating = false;
    PK.justEnriched = !!(final.capaInteligente && final.capaInteligente.estado === "ok");
  }
  try{ await Store.savePacking(trip.id, final); }
  catch(e){ toast(writeErr(e), true); }
  if(PK.tripId === trip.id) render();
}

async function applyItemState(trip, list, clave, estado){
  PK.justEnriched = false;   // tocar un ítem también da por leído el aviso de ajuste por destino
  try{
    const patch = PackingEngine.stateUpdatePatch(clave, estado);
    await Store.savePackingPatch(trip.id, patch);
  }catch(e){ toast(writeErr(e), true); }
}

function bindPackingRows(main, trip, list, canWrite){
  main.querySelectorAll("[data-cat]").forEach(b=>{
    b.onclick = ()=>{
      const catEl = b.parentElement;
      PK.openCats[b.dataset.cat] = catEl.dataset.open !== "true";
      render();
    };
  });

  if(!canWrite) return;

  main.querySelectorAll("[data-mark]").forEach(b=> b.onclick = ()=>{
    const clave = b.dataset.mark, it = list.items[clave]; if(!it) return;
    delete PK.openCats[it.categoria];
    const next = it.estado === "pendiente" ? "empacado" : "pendiente";
    applyItemState(trip, list, clave, next);
  });
  main.querySelectorAll("[data-dropbtn]").forEach(b=> b.onclick = ()=>{
    const clave = b.dataset.dropbtn, it = list.items[clave]; if(!it) return;
    delete PK.openCats[it.categoria];
    applyItemState(trip, list, clave, "descartado");
  });
  main.querySelectorAll("[data-detail]").forEach(b=> b.onclick = ()=>{
    sheetPackingItem(trip, list, b.dataset.detail);
  });
  main.querySelectorAll("[data-pkadd]").forEach(b=> b.onclick = ()=>{
    PK.adding = b.dataset.pkadd; render();
    setTimeout(()=> document.getElementById("pk-add-"+PK.adding)?.focus(), 0);
  });
  main.querySelectorAll("[data-pksave]").forEach(b=> b.onclick = async ()=>{
    const cat = b.dataset.pksave;
    const inp = document.getElementById("pk-add-"+cat);
    const nombre = (inp.value||"").trim();
    PK.adding = null;
    if(!nombre){ render(); return; }
    const updated = PackingEngine.addManualItem(list, {nombre, categoria:cat});
    try{ await Store.savePacking(trip.id, updated); }
    catch(e){ toast(writeErr(e), true); render(); }
  });
  main.querySelectorAll(".pk-addform input").forEach(inp=>{
    inp.onkeydown = e=>{
      if(e.key==="Enter") main.querySelector("[data-pksave]")?.click();
      if(e.key==="Escape"){ PK.adding=null; render(); }
    };
  });

  /* deslizar: izquierda descarta, derecha marca/desmarca. Sin puntería. */
  main.querySelectorAll(".pk-row[data-row]").forEach(row=>{
    const slide = row.querySelector(".pk-slide");
    let x0=null, dx=0;
    row.addEventListener("pointerdown", e=>{
      if(e.pointerType==="mouse" && e.button!==0) return;
      x0 = e.clientX; dx = 0; slide.style.transition = "none";
    });
    row.addEventListener("pointermove", e=>{
      if(x0===null) return;
      dx = e.clientX - x0;
      if(Math.abs(dx) > 6) slide.style.transform = `translateX(${Math.max(-120, Math.min(120, dx))}px)`;
    });
    const end = ()=>{
      if(x0===null) return;
      slide.style.transition = ""; slide.style.transform = "";
      const clave = row.dataset.row, it = list.items[clave];
      const localDx = dx; x0 = null; dx = 0;
      if(!it) return;
      if(localDx < -70){ delete PK.openCats[it.categoria]; applyItemState(trip, list, clave, "descartado"); }
      else if(localDx > 70){ delete PK.openCats[it.categoria]; applyItemState(trip, list, clave, it.estado==="empacado" ? "pendiente" : "empacado"); }
    };
    row.addEventListener("pointerup", end);
    row.addEventListener("pointercancel", end);
    row.addEventListener("pointerleave", end);
    row.addEventListener("click", e=>{ if(Math.abs(dx) > 10){ e.preventDefault(); e.stopPropagation(); } }, true);
  });
}

/* ---------- 01/02: selector de tipo de viaje (también "cambiar el tipo") ---------- */
function typeSelectorFab(trip, list){
  if(!list){
    return `<div class="fab"><button class="btn primary block" id="pk-build" ${Store.canWrite?"":"disabled"}>${svg(I.spark)} Armar la lista</button></div>`;
  }
  return `<div class="fab"><button class="btn block" id="pk-canceltype">Cancelar</button><button class="btn primary block" id="pk-confirmtype" ${Store.canWrite?"":"disabled"}>${svg(I.spark)} Usar este tipo</button></div>`;
}

function renderTypeSelector(trip, list){
  $hdr.innerHTML = packingHeader(trip, null, {info:false});
  bindPackingHeader(trip);

  const items = Store.itemsOf(trip.id);
  const ctx = PackingEngine.tripContext(trip, items, {});
  const suggested = ctx.tripType;
  const chosen = PK.selectedType || (list ? list.tipoViaje : suggested);

  const [, toCode] = routeCodes(trip, items);
  const chips = [
    toCode ? `<span class="chip accent">${esc(toCode)}</span>` : "",
    `<span class="chip">${esc(fmtRange(trip.startDate, trip.endDate))}</span>`,
    `<span class="chip">${ctx.days} ${ctx.days===1?"día":"días"}</span>`,
    trip.travelers ? `<span class="chip">${esc(trip.travelers)}</span>` : ""
  ].filter(Boolean).join("");

  const counts = PK.typeCounts || {};
  const rows = PackingEngine.TRIP_TYPES.map(t=>{
    const n = counts[t.key];
    const pressed = chosen === t.key;
    return `<button type="button" aria-pressed="${pressed}" class="${n?"used":""}" data-t="${t.key}">
      ${svg(I[TYPE_ICON[t.key]])} ${esc(t.label)} <span class="n">${n?`${n} ${n===1?"viaje":"viajes"}`:"—"}</span></button>`;
  }).join("");

  const suggestedLabel = TYPE_LABEL[suggested] || suggested;
  const hint = chosen === suggested
    ? `Te propongo <b>${esc(suggestedLabel)}</b>: ${esc(ctx.tripTypeReason || "por el destino y las fechas del viaje.")}${counts[suggested] ? ` Ya usaste ese tipo en ${counts[suggested]} ${counts[suggested]===1?"viaje":"viajes"} anteriores.` : ""}`
    : "";
  const warnBlock = (chosen !== suggested) ? `<div class="notice warn">
      ${svg(I.info)}
      <span class="bd">Con <b>${esc(TYPE_LABEL[chosen])}</b> ${counts[chosen] ? `tengo ${counts[chosen]} ${counts[chosen]===1?"viaje":"viajes"} tuyos de ese tipo` : "arranco casi de cero"}. En <b>${esc(suggestedLabel)}</b> ${counts[suggested] ? `ya tengo ${counts[suggested]}` : "no tengo ninguno"}: ${esc(ctx.tripTypeReason)}
        <button class="act" id="pk-usesugg">Usar ${esc(suggestedLabel)}</button></span>
    </div>` : "";

  $main.innerHTML = `
    <div class="pk-inputs">${chips}</div>
    ${!list ? `<div class="empty" style="padding:24px 20px">
      <h3>Todavía no armaste la valija</h3>
      <p>Te propongo qué llevar según el destino, las fechas, los días que te quedás y lo que agregaste a mano en viajes del mismo tipo. Todo lo que sugiera lo podés sacar.</p>
    </div>` : ""}
    <div class="f">
      <label>Tipo de viaje</label>
      <div class="tp tp3" id="pk-tp">${rows}</div>
      ${hint ? `<span class="hint">${hint}</span>` : ""}
    </div>
    ${warnBlock}
  `;

  $fab.innerHTML = typeSelectorFab(trip, list);

  document.querySelectorAll("#pk-tp [data-t]").forEach(b=>{
    b.onclick = ()=>{ PK.selectedType = b.dataset.t; render(); };
  });
  const useSugg = document.getElementById("pk-usesugg");
  if(useSugg) useSugg.onclick = ()=>{ PK.selectedType = suggested; render(); };

  if(!list){
    const build = document.getElementById("pk-build");
    if(build && Store.canWrite){
      build.onclick = ()=>{ const t = chosen; PK.selectedType = null; runGenerate(trip, t, null); };
    }
  } else {
    const cancel = document.getElementById("pk-canceltype");
    const confirm = document.getElementById("pk-confirmtype");
    if(cancel) cancel.onclick = ()=>{ PK.pickingType = false; PK.selectedType = null; render(); };
    if(confirm && Store.canWrite){
      confirm.onclick = ()=>{ const t = chosen; PK.pickingType = false; PK.selectedType = null; runGenerate(trip, t, list); };
    }
  }

  if(!PK.typeCounts){
    Store.packingHistory(trip.id).then(hist=>{
      const c = {};
      hist.forEach(l=>{ if(l && l.tipoViaje) c[l.tipoViaje] = (c[l.tipoViaje]||0)+1; });
      PK.typeCounts = c;
      if(PK.tripId===trip.id) render();
    });
  }
}

/* ---------- 04/06/07/08/09/10: la lista, en todos sus estados ---------- */
function renderPackingBoard(trip, list){
  const canWrite = Store.canWrite;
  const generating = PK.generating;
  const c = PackingEngine.packingProgress(list);
  const complete = c.total>0 && c.pendientes===0;
  const cap = list.capaInteligente || {};

  const degradedChip = (!generating && (cap.estado==="no-disponible" || cap.estado==="error"))
    ? `<span class="chip">sin ajuste por destino</span>` : "";
  const readonlyChip = !canWrite ? `<span class="chip soon">sólo lectura</span>` : "";

  $hdr.innerHTML = packingHeader(trip, list) + `<div class="hdr-sub">${pkProgHtml(list)}${degradedChip}${readonlyChip}</div>`;
  bindPackingHeader(trip, ()=> sheetPackingInfo(trip, list));

  const destino = trip.destination || "tu destino";
  let notices = "";
  if(generating){
    notices += `<div class="notice"><span class="spin"></span><span class="bd">Buscando lo específico de ${esc(destino)}…</span></div>`;
  } else {
    // Se muestra hasta que se cierra a mano o hasta la próxima acción sobre
    // un ítem (marcar/descartar): no se apaga sola en el primer re-render,
    // porque guardar dispara más de un render seguido (local y en la nube).
    if(PK.justEnriched && cap.estado==="ok"){
      notices += `<div class="notice ok">${svg(I.spark)}<span class="bd">${esc(cap.nota||"Ajusté la lista al destino.")}</span>
        <button class="x" aria-label="Cerrar" id="pk-closefresh">${svg(I.x)}</button></div>`;
    }
    if(cap.estado==="no-disponible" || cap.estado==="error"){
      notices += `<div class="notice warn">${svg(I.info)}<span class="bd">Armé la lista con las reglas de siempre. No pude ajustarla a ${esc(destino)}, así que puede faltarte algo del lugar.
        ${canWrite?`<button class="act" id="pk-retry">Probar de nuevo</button>`:""}</span></div>`;
    }
    if(complete){
      const typeLbl = (TYPE_LABEL[list.tipoViaje]||"").toLowerCase();
      notices += `<div class="notice ok">${svg(I.check2)}<span class="bd">Valija lista.${c.descartados?` Los ${c.descartados} que descartaste ya quedaron anotados para tu próximo viaje${typeLbl?` de ${typeLbl}`:""}.`:""}</span></div>`;
    }
    if(!canWrite){
      notices += `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Para marcar lo tuyo necesitás permiso de edición.</span></div>`;
    }
  }

  const grouped = PackingEngine.groupByCategory(list, {includeDismissed:true});
  const groups = grouped.map(g=> pkCategoryHtml(g, trip, canWrite));
  const destGroupExists = grouped.some(g=>g.key==="destino");

  const skeletonCat = (generating && !destGroupExists) ? `
    <div class="pk-cat" data-open="true">
      <div class="pk-cat-hd">
        <span class="pk-cat-ico">${svg(I.globe)}</span>
        <span class="nm">Específicos de ${esc(destino)}</span>
        <span class="cnt sk" style="width:38px;height:12px;border-radius:5px;display:inline-block"></span>
        ${svg(I.chevd,"chev")}
      </div>
      <div class="pk-body-wrap">
        <div class="pk-row loading"><span class="sk" style="width:52%"></span><span class="sk" style="width:74%"></span></div>
        <div class="pk-row loading"><span class="sk" style="width:41%"></span><span class="sk" style="width:66%"></span></div>
        <div class="pk-row loading"><span class="sk" style="width:58%"></span><span class="sk" style="width:47%"></span></div>
      </div>
    </div>` : "";

  $main.innerHTML = notices + groups.join("") + skeletonCat;

  if(canWrite && !generating){
    $fab.innerHTML = `<div class="fab"><button class="btn primary block" id="pk-additem">${svg(I.plus)} Agregar ítem</button></div>`;
    document.getElementById("pk-additem").onclick = ()=> sheetAddPackingItem(trip, list);
  } else {
    $fab.innerHTML = "";
  }

  bindPackingRows($main, trip, list, canWrite);

  const closeFresh = document.getElementById("pk-closefresh");
  if(closeFresh) closeFresh.onclick = ()=> render();
  const retry = document.getElementById("pk-retry");
  if(retry) retry.onclick = ()=> runGenerate(trip, list.tipoViaje, list);
}

/* ---------- despachador de estados ---------- */
function renderPacking(trip){
  resetPKIfNeeded(trip.id);
  const list = Store.packingOf(trip.id);
  const hasDates = !!(trip.startDate && trip.endDate);

  if(!list && !hasDates && !PK.pickingType){ renderPackingBlocked(trip); return; }
  if((!list && hasDates) || PK.pickingType){ renderTypeSelector(trip, list); return; }
  renderPackingBoard(trip, list);
}

function toast(msg, err){
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="toast ${err?"err":""}">${esc(msg)}</div>`;
  setTimeout(()=>{ t.innerHTML=""; }, err?4200:2600);
}
const val = id => (document.getElementById(id)?.value || "").trim();

/* ---------- viaje ---------- */
function sheetTrip(trip){
  const t = trip || {id:uid(), hue: Math.floor(Math.random()*360)};
  openSheet(trip?"Editar viaje":"Nuevo viaje", `
    <div class="f req"><label for="t_name">Nombre del viaje</label>
      <input id="t_name" value="${esc(t.name||"")}" placeholder="Vacaciones en el sur" autocomplete="off"></div>
    <div class="f"><label for="t_dest">Destino principal</label>
      <input id="t_dest" value="${esc(t.destination||"")}" placeholder="Bariloche" autocomplete="off">
      <span class="hint">Se usa en la etiqueta de la valija y en el PDF.</span></div>
    <div class="f2">
      <div class="f"><label for="t_from">Salida</label><input id="t_from" type="date" value="${esc(dayKey(t.startDate))}"></div>
      <div class="f"><label for="t_to">Regreso</label><input id="t_to" type="date" value="${esc(dayKey(t.endDate))}"
        ${t.startDate?`min="${esc(addDays(t.startDate,1))}"`:""}></div>
    </div>
    <div class="f"><label for="t_people">Quiénes viajan</label>
      <input id="t_people" value="${esc(t.travelers||"")}" placeholder="Tomás, Ana y Juli" autocomplete="off"></div>
    <div class="f"><label for="t_notes">Notas</label>
      <textarea id="t_notes" placeholder="Presupuesto, ideas, links sueltos...">${esc(t.notes||"")}</textarea></div>
    ${trip?`<hr class="hr"><button class="btn danger block" id="deltrip">${svg(I.trash)} Eliminar este viaje</button>`:""}
  `, `
    <button class="btn ghost" id="cancel">Cancelar</button>
    <button class="btn primary" id="save">Guardar</button>
  `);

  document.getElementById("cancel").onclick = closeSheet;
  // Elegir la salida limita el calendario de regreso ahí mismo: es mejor que el
  // día inválido no se pueda elegir, a explicar después por qué no sirve.
  const fIni = document.getElementById("t_from"), fFin = document.getElementById("t_to");
  if(fIni && fFin) fIni.onchange = ()=>{
    if(!fIni.value){ fFin.removeAttribute("min"); return; }
    fFin.min = addDays(fIni.value, 1);
    if(fFin.value && fFin.value <= fIni.value) fFin.value = "";
  };
  document.getElementById("save").onclick = async ()=>{
    const name = val("t_name");
    if(!name){ toast("Poné un nombre al viaje", true); return; }
    const from = val("t_from"), to = val("t_to");
    if(from && to && to <= from){ toast("El regreso tiene que ser después de la salida", true); return; }
    try{
      await Store.saveTrip({...t, name, destination:val("t_dest"),
        startDate:from, endDate:to, travelers:val("t_people"), notes:val("t_notes"), sample:t.sample||false});
      closeSheet();
      if(!trip) go(`#/trip/${t.id}`);
      toast(trip?"Viaje actualizado":"Viaje creado");
    }catch(e){ toast(writeErr(e), true); }
  };
  const dl = document.getElementById("deltrip");
  if(dl) dl.onclick = async ()=>{
    dl.disabled = true;
    try{ await Store.delTrip(t.id); closeSheet(); go(""); toast("Viaje eliminado"); }
    catch(e){ dl.disabled = false; toast(writeErr(e), true); }
  };
}

function writeErr(e){
  if(e && e.code === "invalid_argument") return "Tenés acceso de sólo lectura a esta valija";
  if(e && e.code === "quota_exceeded") return "La valija llegó a su límite de reservas";
  // Quedó guardado en este teléfono aunque no haya podido sincronizar: decirlo
  // evita que la persona cargue todo de nuevo pensando que se perdió.
  return "Guardado en este dispositivo. No se pudo sincronizar todavía";
}

        <div class="f req"><label for="i_start">Cuándo</label><input id="i_start" type="datetime-local" value="${esc(it.start||"")}"></div>
        <div class="f"><label for="i_end">Termina</label><input id="i_end" type="datetime-local" value="${esc(it.end||"")}"></div>
      </div>
      <div class="f"><label for="i_address">Dónde</label><input id="i_address" value="${esc(it.address||"")}" autocomplete="off"></div>
      <div class="f"><label for="i_conf">Entrada / reserva</label><input id="i_conf" class="mono" value="${esc(it.confirmation||"")}" autocomplete="off"></div>
      ${money}${notes}`;

    return common + `
      <div class="f"><label for="i_start">Fecha (opcional)</label><input id="i_start" type="datetime-local" value="${esc(it.start||"")}"></div>
      ${notes}`;
  };

  const picker = `<div class="f"><label>Tipo de reserva</label><div class="tp" id="tp">
    ${Object.entries(TYPES).map(([k,v])=>`
      <button type="button" data-t="${k}" aria-pressed="${it.type===k}">${svg(v.icon)} ${v.label}</button>`).join("")}
  </div></div>`;

  openSheet(item?"Editar reserva":"Nueva reserva",
    picker + `<div id="fields">${fieldsFor(it.type)}</div>` +
    (item?`<hr class="hr"><button class="btn danger block" id="delitem">${svg(I.trash)} Eliminar</button>`:""),
    `<button class="btn ghost" id="cancel">Cancelar</button>
     <button class="btn primary" id="save">Guardar</button>`);

  const bind = ()=>{
    document.querySelectorAll("#tp button").forEach(b=>{
      b.onclick = ()=>{
        it.type = b.dataset.t;
        collect();
        document.querySelectorAll("#tp button").forEach(x=> x.setAttribute("aria-pressed", x.dataset.t===it.type));
        document.getElementById("fields").innerHTML = fieldsFor(it.type);
      };
    });
  };
  const collect = ()=>{
    const g = id => document.getElementById(id)?.value?.trim();
    const up = id => (g(id)||"").toUpperCase();
    if(document.getElementById("i_title")!==null){
      it.title = g("i_title"); it.start = g("i_start"); it.end = g("i_end");
      it.provider = g("i_provider"); it.confirmation = up("i_conf");
      it.address = g("i_address"); it.notes = g("i_notes");
      it.cost = g("i_cost"); it.currency = up("i_cur");
      it.seat = up("i_seat"); it.terminal = up("i_terminal"); it.gate = up("i_gate");
      it.boardingTime = g("i_boarding");
      it.flightNumber = up("i_flight"); it.phone = g("i_phone");
      if(it.type==="flight"){ it.from = up("i_from"); it.to = up("i_to"); }
      else { it.from = g("i_from"); it.to = g("i_to"); }
    }
  };
  bind();

  document.getElementById("cancel").onclick = closeSheet;
  document.getElementById("save").onclick = async ()=>{
    collect();
    if(!it.title){ toast("Poné un título", true); return; }
    if(it.start && it.end && it.end < it.start){ toast("La fecha de fin es anterior a la de inicio", true); return; }
    try{
      await Store.saveItem(trip.id, it);
      closeSheet(); toast(item?"Reserva actualizada":"Reserva guardada");
    }catch(e){ toast(writeErr(e), true); }
  };
  const di = document.getElementById("delitem");
  if(di) di.onclick = async ()=>{
    di.disabled = true;
    try{ await Store.delItem(trip.id, it.id); closeSheet(); toast("Reserva eliminada"); }
    catch(e){ di.disabled = false; toast(writeErr(e), true); }
  };
}

/* ============================================================
   IMPORTAR DOCUMENTOS — VAL-40, VAL-41, VAL-42
   Reemplaza al viejo sheetImport (texto pegado + una foto suelta) por
   el flujo completo del muestrario aprobado (app/parts/import-ui.html,
   14 estados) sobre el motor ImportEngine embebido más arriba.
   Ver docs/design/importar.md sección 5 (nota de integración).
   ============================================================ */
const MAX_FILE_MB = 15;
const MAX_FILE_BYTES = MAX_FILE_MB*1024*1024;

function fmtSize(bytes){
  if(bytes==null) return "";
  if(bytes < 1024*1024) return `${Math.round(bytes/1024)} KB`;
  return `${(bytes/1024/1024).toFixed(1).replace(".",",")} MB`;
}
function kindIcon(kind){ return kind==="img" ? "img" : "doc"; }
function kindThumbCls(kind){ return kind==="pdf" ? "pdf" : (kind==="img" ? "img" : ""); }

/** Prompt para el camino legado de texto pegado (el <details> del estado 01).
    ImportEngine sólo interpreta imágenes/PDF; el texto se resuelve acá mismo,
    reusando parseImportResponse/friendlyModelError para quedar consistente. */
function buildTextImportPrompt(trip, text){
  const hoy = new Date().toISOString().slice(0,10);
  return [
    "Extraés datos de reservas de viaje a partir de un texto y devolvés SOLO JSON, sin texto alrededor.",
    "",
    "Texto de la confirmación:",
    '"""', String(text).slice(0,12000), '"""',
    "",
    `Contexto: el viaje se llama "${trip.name||""}"${trip.destination?`, destino ${trip.destination}`:""}${trip.startDate?`, entre ${trip.startDate} y ${trip.endDate||"?"}`:""}. Hoy es ${hoy}.`,
    "",
    "Devolvé este JSON exacto:",
    '{"items":[{',
    '"type":"flight|stay|car|transfer|act|note",',
    '"title":"texto corto y humano, ej: Buenos Aires → Madrid",',
    '"start":"YYYY-MM-DDTHH:mm o vacío",',
    '"end":"YYYY-MM-DDTHH:mm o vacío",',
    '"from":"IATA de 3 letras si es vuelo, si no ciudad o lugar",',
    '"to":"idem",',
    '"provider":"aerolínea, hotel, plataforma o rentadora",',
    '"flightNumber":"","confirmation":"","seat":"","terminal":"","gate":"",',
    '"boardingTime":"HH:mm o vacío",',
    '"address":"","phone":"","cost":"","currency":"","notes":""',
    "}]}",
    "",
    "Reglas: un objeto por reserva; ida y vuelta son DOS vuelos separados. Usá 24 horas. Si un dato no aparece, dejá \"\" (nunca inventes códigos ni horarios). Para alojamiento, start es el check-in y end el check-out. Si el año no figura, deducilo del contexto del viaje."
  ].join("\n");
}
function interpretPastedText(text, name, opts){
  if(typeof opts.callModel !== "function"){
    return Promise.resolve({archivo:name, estado:"error", reservas:[],
      error:{codigo:"ia-no-disponible", mensaje:"La lectura automática no está disponible ahora mismo."}, paginas:null});
  }
  const prompt = buildTextImportPrompt(opts.trip||{}, text);
  return Promise.resolve()
    .then(()=> opts.callModel(prompt, {}))
    .then(raw=>{
      const reservas = ImportEngine.parseImportResponse(raw).map(r=> Object.assign({}, r, {archivo:name}));
      return {archivo:name, estado: reservas.length?"ok":"vacio", reservas, error:null, paginas:null};
    })
    .catch(e=> ({archivo:name, estado:"error", reservas:[], error:ImportEngine.friendlyModelError(e), paginas:null}));
}
