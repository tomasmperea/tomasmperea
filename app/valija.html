  document.getElementById("im-close").onclick = closeSheet;
}
function renderImportReadOnly(){
  openSheet("Importar reservas",
    `<div class="notice">${svg(I.info)}<span class="bd"><span class="chip soon">sólo lectura</span><br><br>
      Quien mira este viaje sin permiso de edición no puede importar reservas. Pedile a quien te compartió el link que te dé permiso para cargar.</span></div>`,
    `<button class="btn block" id="im-close">Cerrar</button>`);
  document.getElementById("im-close").onclick = closeSheet;
}

async function sheetImport(trip){
  if(!Store.canWrite){ renderImportReadOnly(); return; }

  let sample = null;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  const callModel = sample ? (prompt, opts) => sample.json(prompt, {...(opts||{}), modelTier:"complex"}) : null;
  if(!callModel){ renderImportNoAi(); return; }

  // Estado de la hoja: nada de esto toca `Store` hasta el guardado final
  // (el botón "Guardar" de la pantalla de revisión). Eso incluye las
  // decisiones de completar un vuelo (`pendingMatches`): se acumulan acá
  // mientras se resuelve la cola de coincidencias, y recién se escriben
  // junto con el resto del lote. Cancelar en cualquier punto —incluso
  // después de haber elegido "Completar vuelo" para alguna tarjeta de
  // embarque— no deja nada escrito, porque hasta ese momento todo vive
  // sólo en este objeto.
  const st = {
    queue:[], pastedText:"", sources:[],
    archivos:[], reviewList:[], matchQueue:[], pendingMatches:[],
    matchDone:0, savedTotal:0, acceptPartial:null
  };
  const tripCtx = ()=> ({name:trip.name, destination:trip.destination, startDate:trip.startDate, endDate:trip.endDate});
  // Marca viva: mientras exista en el DOM, esta hoja sigue siendo la que se
  // ve. Si el visitante cerró/navegó a otro lado, una promesa que resuelve
  // tarde no debe reabrir ni pisar un modal ajeno.
  const alive = ()=> !!document.getElementById("imp-live");
  const marker = `<span id="imp-live" hidden></span>`;

  function makeCard(reserva, chip, meta){ return {id:uid(), reserva, chip, meta:meta||{}}; }

  function runOne(source){
    const opts = { callModel, renderPdfToImages:b=>ImportEngine.renderPdfPagesToImages(b), trip:tripCtx() };
    const p = source.kind==="texto"
      ? interpretPastedText(source.text, source.name, opts)
      : ImportEngine.interpretFile({name:source.name, blob:source.blob, mimeType:source.mimeType}, opts);
    return p.then(result=>{
      result.kind = source.kind;
      const idx = st.archivos.findIndex(a=>a.archivo===result.archivo);
      if(idx>=0) st.archivos[idx] = result; else st.archivos.push(result);
      return result;
    });
  }

  function classifyAndQueue(reservas, ctx){
    const existentes = Store.itemsOf(trip.id);
    const assignPage = ctx && ctx.kind==="pdf" && ctx.paginas>1 && reservas.length===ctx.paginas;
    reservas.forEach((r,i)=>{
      const meta = { archivo:r.archivo||(ctx&&ctx.archivo)||"", kind:(ctx&&ctx.kind)||"img", page:assignPage?(i+1):null };
      if(r.type==="flight"){
        const m = ImportEngine.matchAgainstExisting(r, existentes);
        if(m.resultado==="nuevo") st.reviewList.push(makeCard(r,"Vuelo",meta));
        else st.matchQueue.push({reserva:r, match:m, meta});
      } else {
        st.reviewList.push(makeCard(r, TYPES[r.type]?.label || "Nota", meta));
      }
    });
  }

  /* ---------- 01/02: elegir archivos ---------- */
  function wireFileInput(id, forcedKind){
    const input = document.getElementById(id);
    if(!input) return;
    input.onchange = ()=>{
      Array.from(input.files||[]).forEach(file=>{
        const engineKind = ImportEngine.fileKind({name:file.name, mimeType:file.type});
        const kind = forcedKind || (engineKind==="pdf" ? "pdf" : "img");
        const invalid = !forcedKind && engineKind==="desconocido";
        const big = file.size > MAX_FILE_BYTES;
        st.queue.push({id:uid(), name:file.name, mimeType:file.type, blob:file, size:file.size, kind, big, invalid});
      });
      input.value = "";
      renderElegir();
    };
  }
  function queueRowHtml(f){
    const cls = kindThumbCls(f.kind), icon = kindIcon(f.kind);
    let meta;
    if(f.big) meta = `<span class="meta err">Pesa ${fmtSize(f.size)}, más de lo que puedo leer (máx. ${MAX_FILE_MB} MB). Elegí otro archivo o sacá la foto de nuevo con menos calidad.</span>`;
    else if(f.invalid) meta = `<span class="meta err">No reconozco este tipo de archivo. Subí una foto (PNG o JPG) o un PDF.</span>`;
    else meta = `<span class="meta">${fmtSize(f.size)}</span>`;
    return `<div class="imp-file ${(f.big||f.invalid)?"err":""}">
      <span class="imp-thumb ${cls}">${svg(I[icon])}</span>
      <span class="bd"><span class="nm">${esc(f.name)}</span>${meta}</span>
      <button class="rm" aria-label="Sacar ${esc(f.name)}" data-rmq="${f.id}">${svg(I.x)}</button>
    </div>`;
  }
  function renderElegir(){
    const validCount = st.queue.filter(f=>!f.big && !f.invalid).length;
    const body = `${marker}
      <div class="notice">${svg(I.spark)}
        <span class="bd">Sacale una foto al voucher, subí la captura del mail o el PDF del pasaje. Te muestro lo que encuentro antes de guardar nada.</span>
      </div>
      <div class="f">
        <label>Cómo lo cargás</label>
        <div class="tp tp3">
          <label class="tpbtn" for="im_cam">${svg(I.cam)} Sacar foto <span class="n">con la cámara</span></label>
          <input id="im_cam" type="file" accept="image/*" capture="environment" class="sr">
          <label class="tpbtn" for="im_gal">${svg(I.gallery)} Galería <span class="n">fotos y capturas</span></label>
          <input id="im_gal" type="file" accept="image/*" multiple class="sr">
          <label class="tpbtn" for="im_doc">${svg(I.doc)} Archivo <span class="n">PDF o imagen</span></label>
          <input id="im_doc" type="file" accept="application/pdf,image/*" multiple class="sr">
        </div>
        <span class="hint">Podés elegir varios a la vez, y combinar fotos con PDF en la misma carga.</span>
      </div>
      ${st.queue.length ? `
      <div class="f">
        <label>Vas a interpretar</label>
        <div class="imp-files">${st.queue.map(queueRowHtml).join("")}</div>
      </div>` : ""}
      <details class="imp-more" ${st.pastedText?"open":""}>
        <summary>Pegar el texto en cambio</summary>
        <div class="f">
          <label for="im_text">Texto de la confirmación</label>
          <textarea id="im_text" class="mono" placeholder="Tu reserva está confirmada&#10;Vuelo G3 1234 · EZE → GIG&#10;20 de septiembre, 06:40&#10;Código: K7QXPL">${esc(st.pastedText)}</textarea>
          <span class="hint">Podés pegar varias reservas juntas. Las separo yo.</span>
        </div>
      </details>`;
    const canInterpret = validCount>0 || st.pastedText.trim().length>0;
    const footer = `<button class="btn ghost" id="im-cancel">Cancelar</button>
      <button class="btn primary" id="im-run" ${canInterpret?"":"disabled"}>${svg(I.spark)} ${validCount?`Interpretar ${validCount} ${validCount===1?"archivo":"archivos"}`:"Interpretar"}</button>`;
    openSheet("Importar reservas", body, footer);
    document.getElementById("im-cancel").onclick = closeSheet;
    wireFileInput("im_cam","img"); wireFileInput("im_gal","img"); wireFileInput("im_doc",null);
    document.querySelectorAll("[data-rmq]").forEach(b=>{
      b.onclick = ()=>{ st.queue = st.queue.filter(f=>f.id!==b.dataset.rmq); renderElegir(); };
    });
    const ta = document.getElementById("im_text");
    ta.oninput = ()=>{
      st.pastedText = ta.value;
      const btn = document.getElementById("im-run");
      if(btn) btn.disabled = !(validCount>0 || ta.value.trim());
    };
    document.getElementById("im-run").onclick = startInterpret;
  }
  function startInterpret(){
    const fileSources = st.queue.filter(f=>!f.big && !f.invalid)
      .map(f=>({name:f.name, mimeType:f.mimeType, blob:f.blob, kind:f.kind}));
    const sources = fileSources.slice();
    if(st.pastedText && st.pastedText.trim()) sources.push({name:"Texto pegado", kind:"texto", text:st.pastedText.trim()});
    if(!sources.length) return;
    st.sources = sources;
    runInterpretation(sources);
  }

  /* ---------- 03: leyendo, archivo por archivo ---------- */
  function rowHtml(r){
    const cls = kindThumbCls(r.kind), icon = kindIcon(r.kind);
    let meta;
    if(r.status==="queued") meta = `<span class="meta"><span class="imp-dot"></span> En cola</span>`;
    else if(r.status==="leyendo") meta = `<span class="meta"><span class="spin"></span> Leyendo…</span>`;
    else if(r.status==="ok") meta = `<span class="meta ok">${svg(I.check2)} Listo · ${r.found} ${r.found===1?"reserva encontrada":"reservas encontradas"}</span>`;
    else if(r.status==="vacio") meta = `<span class="meta info">${svg(I.info)} Listo · no encontré ninguna reserva</span>`;
    else meta = `<span class="meta err">${svg(I.info)} No se pudo leer</span>`;
    return `<div class="imp-file" id="${r.rowId}">
      <span class="imp-thumb ${cls}">${svg(I[icon])}</span>
      <span class="bd"><span class="nm">${esc(r.name)}</span>${meta}</span>
    </div>`;
  }
  function renderLeyendo(rows){
    const body = `${marker}
      <div class="notice"><span class="spin"></span><span class="bd">Leyendo ${rows.length} ${rows.length===1?"archivo":"archivos"}…</span></div>
      <div class="imp-files">${rows.map(rowHtml).join("")}</div>
      <div id="im-slow"></div>`;
    openSheet("Importar reservas", body, `<button class="btn ghost block" id="im-cancelall">Cancelar todo</button>`);
    document.getElementById("im-cancelall").onclick = closeSheet;
  }
  function updateRow(r){
    const el = document.getElementById(r.rowId);
    if(el) el.outerHTML = rowHtml(r);
  }
  function showSlowNotice(){
    const el = document.getElementById("im-slow");
    if(!el) return;
    el.innerHTML = `<div class="notice warn">${svg(I.info)}<span class="bd">Che, esto está tardando más de lo normal. Las fotos con poca luz y los PDF pesados tardan más en leerse.
      <button class="act" id="im-acceptpartial">Quedarme con lo que ya está listo</button></span></div>`;
    const b = document.getElementById("im-acceptpartial");
    if(b) b.onclick = ()=>{ if(st.acceptPartial) st.acceptPartial(); };
  }
  function runInterpretation(sources){
    const rows = sources.map((s,i)=>({rowId:`im-row-${i}-${uid()}`, name:s.name, kind:s.kind, status:"queued", found:0}));
    renderLeyendo(rows);
    let doneCount = 0, finished = false;
    const slowTimer = setTimeout(()=>{ if(!finished && alive()) showSlowNotice(); }, 7000);
    function finishRun(){ if(finished) return; finished = true; clearTimeout(slowTimer); advance(); }
    st.acceptPartial = finishRun;
    sources.forEach((s,i)=>{
      rows[i].status = "leyendo";
      if(alive()) updateRow(rows[i]);
      runOne(s).then(result=>{
        doneCount++;
        rows[i].status = result.estado; rows[i].found = result.reservas.length;
        if(alive()) updateRow(rows[i]);
        classifyAndQueue(result.reservas, {archivo:result.archivo, kind:result.kind, paginas:result.paginas});
        if(doneCount>=sources.length) finishRun();
      });
    });
  }
  function advance(){
    if(!alive()) return;
    const totalReservas = st.archivos.reduce((n,a)=>n+a.reservas.length,0);
    if(totalReservas===0 && !st.reviewList.length && !st.matchQueue.length) renderTotalEmpty();
    else proceed();
  }
  function proceed(){
    if(!alive()) return;
    if(st.matchQueue.length){ renderMatchStep(); return; }
    // Un lote sólo de coincidencias de vuelo (sin reservas nuevas ni archivos
    // con problemas) también pasa por la revisión final: ahí vive el único
    // botón que de verdad escribe, y el único punto donde cancelar todavía
    // sirve para no dejar nada aplicado.
    if(st.reviewList.length || st.pendingMatches.length || st.archivos.some(a=>a.estado!=="ok")){ renderReview(); return; }
    finish();
  }

  /* ---------- 10: ninguno aportó nada ---------- */
  function bindIssuesActions(){
    document.querySelectorAll("[data-retry]").forEach(b=>{
      b.onclick = ()=>{
        const source = st.sources.find(s=>s.name===b.dataset.retry);
        if(source) runInterpretation([source]);
      };
    });
    document.querySelectorAll("[data-rmfile]").forEach(b=>{
      b.onclick = ()=>{ st.archivos = st.archivos.filter(a=>a.archivo!==b.dataset.rmfile); proceed(); };
    });
  }
  function renderTotalEmpty(){
    if(!alive()) return;
    const n = st.archivos.length;
    const errCount = st.archivos.filter(a=>a.estado==="error").length;
    const vacioCount = n - errCount;
    let detalle;
    if(errCount && vacioCount) detalle = "Uno o más no se pudieron leer y los demás se leyeron bien pero no tenían pinta de reserva de viaje.";
    else if(errCount) detalle = n===1 ? "No se pudo leer." : "Ninguno se pudo leer.";
    else detalle = n===1 ? "Se leyó bien, pero no tenía pinta de reserva de viaje." : "Se leyeron bien, pero no tenían pinta de reserva de viaje.";
    const body = `${marker}
      <div class="empty">
        <h3>No conseguí ninguna reserva de ${n===1?"este archivo":`estos ${n} archivos`}</h3>
        <p>${detalle} El detalle de cada uno está abajo.</p>
      </div>
      ${issuesListHtml(st.archivos)}`;
    const footer = `<button class="btn ghost" id="im-manual">Cargar a mano</button>
      ${errCount?`<button class="btn primary" id="im-retryall">Reintentar ${errCount} ${errCount===1?"archivo":"archivos"}</button>`:""}`;
    openSheet("Importar reservas", body, footer);
    document.getElementById("im-manual").onclick = ()=>{ closeSheet(); sheetItem(trip, null); };
    const retryAll = document.getElementById("im-retryall");
    if(retryAll) retryAll.onclick = ()=>{
      const errNames = new Set(st.archivos.filter(a=>a.estado==="error").map(a=>a.archivo));
      const errSources = st.sources.filter(s=>errNames.has(s.name));
      if(errSources.length) runInterpretation(errSources);
    };
    bindIssuesActions();
  }

  /* ---------- 06/07/07B: tarjeta de embarque ---------- */
  function renderMatchStep(){
    if(!alive() || !st.matchQueue.length) return;
    const step = st.matchQueue[0];
    if(step.match.resultado==="mismo") renderMatchMismo(step);
    else renderMatchAmbiguo(step);
  }
  function srcChipForMeta(meta){
    if(!meta || !meta.archivo) return "";
    return `<span class="chip src">${svg(I[kindIcon(meta.kind)])}${esc(meta.archivo)}</span>`;
  }
  function flightLineHtml(f){
    const parts = [];
    if(f.provider) parts.push(esc(f.provider));
    if(f.flightNumber) parts.push(esc(f.flightNumber));
    let line = parts.join(" ");
    if(f.start) line += `${line?" · ":""}sale ${esc(fmtDateLong(f.start))}${fmtTime(f.start)?` ${esc(fmtTime(f.start))}`:""}`;
    return line || "Vuelo";
  }
  function renderMatchMismo(step){
    const {reserva, match, meta} = step;
    const ex = match.existente;
    const patchFields = [["gate","Puerta"],["terminal","Terminal"],["seat","Asiento"],["boardingTime","Embarque"]]
      .filter(([k])=> match.patch[k]);
    const title = reserva.flightNumber
      ? `Vuelo ${esc(reserva.flightNumber)}${reserva.start?`, ${esc(fmtDateLong(reserva.start))}`:""}`
      : "Tarjeta de embarque";
    const body = `${marker}
      <div class="imp-card">
        <div class="imp-card-hd">
          <span class="pass-icon">${svg(TYPES.flight.icon)}</span>
          <span class="ttl">
            <span style="font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:-.005em">${title}</span>
            <span class="imp-src"><span class="chip accent">Tarjeta de embarque</span>${srcChipForMeta(meta)}</span>
          </span>
        </div>
        <div class="imp-card-bd">
          <div class="f">
            <label>Ya tenías cargado</label>
            <div class="imp-existing">
              <span class="pass-icon">${svg(TYPES.flight.icon)}</span>
              <span class="info">
                <span class="pass-title">${esc(ex.title||"Vuelo")}</span>
                <span class="pass-when">${esc(flightLineHtml(ex))}</span>
              </span>
            </div>
          </div>
          ${patchFields.length?`
          <div class="f">
            <label>Se completa con</label>
            <div class="imp-diff">
              ${patchFields.map(([k,label])=>`<div class="field"><span class="k">${esc(label)}</span><span class="v">${esc(match.patch[k])}</span></div>`).join("")}
            </div>
          </div>`:""}
          <p class="tiny muted" style="margin:0">${esc(match.motivo)}</p>
        </div>
      </div>`;
    openSheet("Importar reservas", body, `
      <button class="btn ghost" id="im-asnew">Cargar como nuevo</button>
      <button class="btn primary" id="im-complete">${svg(I.check2)} Completar vuelo</button>`);
    document.getElementById("im-asnew").onclick = ()=>{
      st.matchQueue.shift();
      st.reviewList.push(makeCard(reserva, "Tarjeta de embarque", meta));
      proceed();
    };
    document.getElementById("im-complete").onclick = ()=>{
      // No se escribe acá: la decisión se acumula y se aplica recién con el
      // guardado final, junto con el resto del lote (ver comentario de `st`
      // más arriba). Si la persona cancela después de este toque, esto no
      // queda escrito en ningún lado.
      st.pendingMatches.push({existente:ex, patch:match.patch});
      st.matchQueue.shift();
      proceed();
    };
  }
  function renderMatchAmbiguo(step){
    const {reserva, match, meta} = step;
    const cand = match.candidatos;
    let selected = null;
    const body = `${marker}
      <div class="notice warn">${svg(I.info)}
        <span class="bd">${esc(match.motivo)} ¿A cuál corresponde?</span>
      </div>
      <div class="imp-choice" id="im-choice">
        ${cand.map((c,i)=>`
          <button type="button" aria-pressed="false" data-c="${i}">
            <span class="radio"></span>
            <span class="info"><span class="t">${esc(c.title||"Vuelo")}</span>
              <span class="s">${esc(flightLineHtml(c))}</span></span>
          </button>`).join("")}
        <div class="sep">o</div>
        <button type="button" aria-pressed="false" data-c="n">
          <span class="radio"></span>
          <span class="info"><span class="t">Ninguno de los dos</span>
            <span class="s">Es un vuelo nuevo, no lo tenía cargado</span></span>
        </button>
      </div>`;
    openSheet("Importar reservas", body, `
      <button class="btn ghost" id="im-cancel">Cancelar</button>
      <button class="btn primary" id="im-choicesave" disabled>Elegí una opción</button>`);
    document.getElementById("im-cancel").onclick = closeSheet;
    const choiceEl = document.getElementById("im-choice");
    const saveBtn = document.getElementById("im-choicesave");
    choiceEl.addEventListener("click", e=>{
      const b = e.target.closest("[data-c]"); if(!b) return;
      choiceEl.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed", x===b));
      selected = b.dataset.c;
      saveBtn.disabled = false;
      saveBtn.textContent = selected==="n" ? "Guardar como vuelo nuevo" : "Completar vuelo";
    });
    saveBtn.onclick = ()=>{
      if(selected===null) return;
      if(selected==="n"){
        st.matchQueue.shift();
        st.reviewList.push(makeCard(reserva, "Tarjeta de embarque", meta));
        proceed();
        return;
      }
      // Igual que en "Completar vuelo" del caso sin ambigüedad: se acumula,
      // no se escribe. El guardado final es el único lugar que toca `Store`.
      const ex = cand[Number(selected)];
      const patch = ImportEngine.buildFlightPatch(reserva, ex);
      st.pendingMatches.push({existente:ex, patch});
      st.matchQueue.shift();
      proceed();
    };
  }

  /* ---------- 04/05: revisión ---------- */
  function reviewCardHtml(card){
    const r = card.reserva;
    const T = TYPES[r.type] || TYPES.note;
    const pageTxt = card.meta.page ? ` · pág. ${card.meta.page}` : "";
    const srcHtml = card.meta.archivo ? `<span class="chip src">${svg(I[kindIcon(card.meta.kind)])}${esc(card.meta.archivo)}${pageTxt}</span>` : "";
    return `<div class="imp-card" data-card="${card.id}">
      <div class="imp-card-hd">
        <span class="pass-icon ${T.cls}">${svg(T.icon)}</span>
        <span class="ttl">
          <input class="imp-title" data-f="title" value="${esc(r.title||"")}" placeholder="Sin título">
          <span class="imp-src"><span class="chip accent">${esc(card.chip)}</span>${srcHtml}</span>
        </span>
        <button class="imp-discard" aria-label="Descartar esta reserva" data-discard="${card.id}">${svg(I.x)}</button>
      </div>
      <div class="imp-card-bd">${cardFieldsHtml(r, card.chip)}</div>
    </div>`;
  }
  function syncReviewInputsToState(){
    st.reviewList.forEach(c=>{
      const el = document.querySelector(`[data-card="${c.id}"]`);
      if(!el) return;
      el.querySelectorAll("[data-f]").forEach(inp=>{ c.reserva[inp.dataset.f] = inp.value.trim(); });
    });
  }
  /** Texto del único botón que de verdad escribe: nombra las dos cosas que
      puede llegar a hacer (guardar reservas nuevas, completar vuelos por
      tarjeta de embarque), nunca un "Guardar" genérico que esconda la mitad
      de lo que va a pasar. */
  function saveReviewLabel(n, m){
    if(n && m) return `Guardar ${n} ${n===1?"reserva":"reservas"} y completar ${m} ${m===1?"vuelo":"vuelos"}`;
    if(m) return `Completar ${m} ${m===1?"vuelo":"vuelos"}`;
    if(n) return `Guardar ${n} ${n===1?"reserva":"reservas"}`;
    return "Nada para guardar";
  }
  function renderReview(){
    if(!alive()) return;
    const cards = st.reviewList;
    const matches = st.pendingMatches;
    const issues = st.archivos.filter(a=>a.estado!=="ok");
    const n = cards.length, m = matches.length, totalArchivos = st.archivos.length;
    const encontrados = [];
    if(n) encontrados.push(`${n} ${n===1?"reserva":"reservas"}`);
    if(m) encontrados.push(`${m} ${m===1?"vuelo":"vuelos"} para completar con la tarjeta de embarque`);
    const noticeTxt = encontrados.length
      ? `Encontré ${encontrados.join(" y ")}${totalArchivos>1?` en ${totalArchivos} archivos`:""}. ${issues.length?"Los que no aportaron nada, mirá el detalle más abajo. ":""}${n?"Revisá los datos y corregí lo que haga falta antes de guardar.":"Nada de esto se aplicó todavía: se escribe recién al confirmar."}`
      : "Ya no queda ninguna reserva para revisar. Mirá el detalle de los archivos más abajo.";
    const body = `${marker}
      <div class="notice">${svg(I.info)}<span class="bd">${esc(noticeTxt)}</span></div>
      ${n?`<div class="stack">${cards.map(reviewCardHtml).join("")}</div>
        <p class="tiny muted" style="margin:0">Costo, teléfono y notas se completan después, abriendo la reserva ya guardada. Acá sólo lo que la lectura automática suele errar: fechas, rutas y códigos.</p>`:""}
      ${issues.length?issuesListHtml(issues):""}`;
    const total = n + m;
    const footer = `<button class="btn ghost" id="im-cancel">Cancelar</button>
      <button class="btn primary" id="im-save" ${total?"":"disabled"}>${svg(I.spark)} ${saveReviewLabel(n,m)}</button>`;
    openSheet("Importar reservas", body, footer);
    document.getElementById("im-cancel").onclick = closeSheet;
    document.querySelectorAll("[data-discard]").forEach(b=>{
      b.onclick = ()=>{
        syncReviewInputsToState();
        st.reviewList = st.reviewList.filter(c=>c.id!==b.dataset.discard);
        renderReview();
      };
    });
    bindIssuesActions();
    if(total) document.getElementById("im-save").onclick = doSaveReview;
  }
  async function doSaveReview(){
    if(!alive()) return;
    syncReviewInputsToState();
    const cards = st.reviewList.slice();
    const matches = st.pendingMatches.slice();
    if(!cards.length && !matches.length) return;
    const saveBtn = document.getElementById("im-save");
    saveBtn.disabled = true; saveBtn.innerHTML = `<span class="spin"></span> Guardando…`;
    try{
      // Primero los vuelos que se completan (acumulados desde 06/07/07B, sin
      // haber tocado `Store` hasta ahora), después las reservas nuevas.
      for(const pm of matches){
        await Store.saveItem(trip.id, {...pm.existente, ...pm.patch});
      }
      for(const c of cards){
        const r = c.reserva;
        const type = TYPES[r.type] ? r.type : "note";
        await Store.saveItem(trip.id, {
          id: uid(), type,
          title:r.title||"", start:r.start||"", end:r.end||"",
          from:(r.from||"").toUpperCase(), to:(r.to||"").toUpperCase(),
          provider:r.provider||"", flightNumber:(r.flightNumber||"").toUpperCase(),
          confirmation:(r.confirmation||"").toUpperCase(), seat:(r.seat||"").toUpperCase(),
          terminal:(r.terminal||"").toUpperCase(), gate:(r.gate||"").toUpperCase(),
          boardingTime:r.boardingTime||"",
          address:r.address||"", phone:r.phone||"", cost:r.cost||"",
          currency:(r.currency||"").toUpperCase(), notes:r.notes||"", source:"import"
        });
      }
      st.savedTotal += cards.length;
      st.matchDone += matches.length;
      st.reviewList = [];
      st.pendingMatches = [];
      finish();
    }catch(e){
      // Si falla a mitad de camino puede quedar parte del lote ya escrito
      // (algunos `Store.saveItem` resolvieron antes del que falló) — mismo
      // comportamiento que ya tenía el guardado de reservas nuevas frente a
      // un error de red a mitad de lote. Se muestra qué falló para que la
      // persona reintente sabiendo que puede haber quedado algo aplicado.
      toast(writeErr(e), true);
      saveBtn.disabled = false; saveBtn.innerHTML = `${svg(I.spark)} ${saveReviewLabel(cards.length, matches.length)}`;
    }
  }

  /* ---------- 09: guardado ---------- */
  function finish(){
    if(!alive()) return;
    closeSheet();
    const n = st.savedTotal, m = st.matchDone;
    let msg;
    if(n && m) msg = `Guardado. Agregué ${n} ${n===1?"reserva":"reservas"} y completé ${m} ${m===1?"vuelo":"vuelos"} con los datos de la tarjeta de embarque.`;
    else if(m) msg = `Guardado. Completé ${m} ${m===1?"vuelo":"vuelos"} con los datos de la tarjeta de embarque.`;
    else if(n) msg = `${n} ${n===1?"reserva agregada":"reservas agregadas"}`;
    else msg = "Listo";
    toast(msg);
  }

  renderElegir();
}

/* ---------- compartir ---------- */
function sheetShare(trip){
  const url = location.href.split("#")[0] + `#/trip/${trip.id}`;
  const items = Store.itemsOf(trip.id);
  const alerts = tripAlerts(trip, items);
  const resumen = [
    `${trip.name||"Viaje"} · ${fmtRange(trip.startDate,trip.endDate)}`,
    "",
    ...items.slice().sort((a,b)=>String(a.start||"").localeCompare(String(b.start||"")))
      .map(i=> `• ${fmtDate(i.start)} ${fmtTime(i.start)||""} — ${i.title||TYPES[i.type]?.label}${i.confirmation?` (${i.confirmation})`:""}`),
    "",
    alerts.length ? `Pendientes (${alerts.length}):` : "Sin pendientes.",
    ...alerts.slice(0,8).map(a=>`- ${a.t}: ${a.d}`)
  ].join("\n");

  openSheet("Compartir el viaje", `
    <div class="notice">${svg(I.share)}
      <div>Usá el botón <b>Compartir</b> de Claude, arriba a la derecha de la app. Elegí <b>Can view</b> para que sólo miren, o <b>Can edit</b> para que carguen reservas con vos.</div>
    </div>
    <div class="f"><label for="sh_url">Link directo a este viaje</label>
      <input id="sh_url" class="mono" value="${esc(url)}" readonly onclick="this.select()">
      <span class="hint">Quien lo abra entra derecho a <b>${esc(trip.name||"este viaje")}</b>.</span>
    </div>
    <button class="btn block" id="cpurl">${svg(I.copy)} Copiar link</button>
    <hr class="hr">
    <div class="f"><label for="sh_txt">Resumen para pegar en un chat</label>
      <textarea id="sh_txt" class="mono" style="min-height:130px" readonly>${esc(resumen)}</textarea></div>
    <button class="btn block" id="cptxt">${svg(I.copy)} Copiar resumen</button>
  `, `<button class="btn block" id="cancel">Cerrar</button>`);

  document.getElementById("cancel").onclick = closeSheet;
  const cp = async (text, msg)=>{
    try{ await navigator.clipboard.writeText(text); toast(msg); }
    catch(e){ toast("Copialo a mano desde el campo", true); }
  };
  document.getElementById("cpurl").onclick = ()=> cp(url, "Link copiado");
  document.getElementById("cptxt").onclick = ()=> cp(resumen, "Resumen copiado");
}

/* ---------- valija: agregar un ítem propio (FAB de la lista) ---------- */
function sheetAddPackingItem(trip, list){
  openSheet("Agregar ítem", `
    <div class="f req"><label for="pk_new_nombre">Qué te falta</label>
      <input id="pk_new_nombre" placeholder="Ej: Cargador del reloj" autocomplete="off"></div>
    <div class="f"><label for="pk_new_cat">Categoría</label>
      <select id="pk_new_cat">
        ${PackingEngine.CATEGORIES.map(c=>`<option value="${esc(c.key)}">${esc(c.label)}</option>`).join("")}
      </select></div>
  `, `<button class="btn ghost" id="cancel">Cancelar</button>
      <button class="btn primary" id="save">Agregar</button>`);
  document.getElementById("cancel").onclick = closeSheet;

  };
}

/* ---------- valija: detalle de un ítem (estado 11) ---------- */
function sheetPackingItem(trip, list, clave){
  const it = list.items[clave]; if(!it) return;
  const canWrite = Store.canWrite;
  const src = srcChip(it, trip);

  const stateHtml = `
    <div class="f">
      <label>Estado</label>
      <div class="pk-states">
        <button type="button" data-s="pendiente" aria-pressed="${it.estado==="pendiente"}"><span class="pk-state"></span> Pendiente</button>
        <button type="button" data-s="empacado" aria-pressed="${it.estado==="empacado"}"><span class="pk-state">${svg(I.check)}</span> Empacado</button>
        <button type="button" data-s="descartado" aria-pressed="${it.estado==="descartado"}"><span class="pk-state">${svg(I.dash)}</span> Descartado</button>
      </div>
      <span class="hint">Descartar no es lo mismo que dejarlo pendiente: me dice que este ítem no va. Si lo descartás en dos viajes del mismo tipo, dejo de sugerírtelo.</span>
    </div>`;

  const qtyHtml = (it.cantidad!=null) ? `
    <hr class="hr">
    <div class="f">
      <label>Cuántos llevás</label>
      <div class="pk-qty">
        <button type="button" id="pk-qty-minus" aria-label="Uno menos">${svg(I.minus)}</button>
        <span class="v" id="pk-qty-val">${esc(it.cantidad)}</span>
        <button type="button" id="pk-qty-plus" aria-label="Uno más">${svg(I.plus)}</button>
      </div>
    </div>` : "";

  const originHtml = `
    <hr class="hr">
    <div class="f">
      <label>De dónde sale</label>
      <div class="chips" style="margin:2px 0 4px"><span class="${src.cls}">${esc(src.tx)}</span></div>
      <p style="margin:0;font-size:13.5px;line-height:1.5">${esc(it.motivo || "Sin motivo declarado.")}</p>
    </div>`;

  let qty = it.cantidad;
  let estado = it.estado;

  openSheet(it.nombre, stateHtml + qtyHtml + originHtml,
    canWrite ? `<button class="btn ghost" id="cancel">Cancelar</button><button class="btn primary" id="save">Guardar</button>`
             : `<button class="btn block" id="cancel">Cerrar</button>`);

  document.getElementById("cancel").onclick = closeSheet;
  if(!canWrite) return;

  document.querySelectorAll(".pk-states [data-s]").forEach(b=>{
    b.onclick = ()=>{
      estado = b.dataset.s;
      document.querySelectorAll(".pk-states [data-s]").forEach(x=> x.setAttribute("aria-pressed", String(x.dataset.s===estado)));
    };
  });
  const qmin = document.getElementById("pk-qty-minus"), qpl = document.getElementById("pk-qty-plus"), qval = document.getElementById("pk-qty-val");
  if(qmin){
    qmin.onclick = ()=>{ qty = Math.max(0, (qty||0)-1); qval.textContent = qty; };
    qpl.onclick = ()=>{ qty = (qty||0)+1; qval.textContent = qty; };
  }

  document.getElementById("save").onclick = async ()=>{
    const fields = {};
    if(estado !== it.estado){
      fields.estado = estado;
      fields.empacadoEn = estado === "empacado" ? (it.empacadoEn || new Date().toISOString()) : null;
    }
    if(qty !== it.cantidad){
      fields.cantidad = qty; fields.cantidadEditada = true; fields.motivo = "Lo ajustaste vos.";
    }
    if(!Object.keys(fields).length){ closeSheet(); return; }
    const now = new Date().toISOString();
    fields.actualizadoEn = now;
    try{
      await Store.savePackingPatch(trip.id, { items:{ [clave]:fields }, actualizadaEn:now });
      closeSheet();
    }catch(e){ toast(writeErr(e), true); }
  };
}

/* ============================================================
   PDF — resumen de una página, tipo hoja de ruta
   ============================================================ */
async function exportPDF(trip){
  const items = Store.itemsOf(trip.id).slice()
    .sort((a,b)=> String(a.start||"zzz").localeCompare(String(b.start||"zzz")));
  const alerts = tripAlerts(trip, items);

  if(!window.jspdf){ toast("No se pudo cargar el generador de PDF", true); return; }
  toast("Armando el PDF…");

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"a4"});
  const W = 595.28, M = 44;
  let y = 0;

  const INK=[15,27,46], MUT=[84,99,124], ACC=[11,69,196], LINE=[215,222,233], CRIT=[190,50,39];
  const line = (yy)=>{ doc.setDrawColor(...LINE); doc.setLineWidth(.7); doc.line(M,yy,W-M,yy); };
  const page = ()=>{ doc.addPage(); y = M + 10; };
  const need = h => { if(y + h > 800){ page(); } };

  // Cabecera
  doc.setFillColor(...INK); doc.rect(0,0,W,104,"F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(24);
  doc.text(String(trip.name||"Viaje"), M, 50, {maxWidth:W-M*2-90});
  doc.setFont("courier","normal"); doc.setFontSize(10);
  const sub = [fmtRange(trip.startDate,trip.endDate), trip.destination, trip.travelers].filter(Boolean).join("  ·  ");
  doc.text(sub, M, 72, {maxWidth:W-M*2-90});
  doc.setFontSize(8); doc.setTextColor(160,175,200);
  doc.text("VALIJA", W-M, 40, {align:"right"});
  doc.text(`${items.length} reservas`, W-M, 54, {align:"right"});
  y = 136;

  // Pendientes primero: es lo accionable
  if(alerts.length){
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...CRIT);
    doc.text(`PENDIENTES (${alerts.length})`, M, y); y += 15;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...MUT);
    alerts.slice(0,8).forEach(a=>{
      need(26);
      const t = doc.splitTextToSize(`•  ${a.t} — ${a.d}`, W-M*2);
      doc.text(t, M, y); y += t.length*12 + 2;
    });
    y += 10; line(y); y += 20;
  }

  // Itinerario
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...INK);
  doc.text("ITINERARIO", M, y); y += 16;

  if(!items.length){
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...MUT);
    doc.text("Todavía no hay reservas cargadas.", M, y);
  }

  let lastDay = null;
  items.forEach(it=>{
    need(88);
    const k = dayKey(it.start);
    if(k && k !== lastDay){
      lastDay = k;
      y += 6;
      doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...ACC);
      doc.text(fmtDateLong(k).toUpperCase(), M, y);
      line(y+5); y += 20;
    }

    const T = TYPES[it.type] || TYPES.note;
    const t1 = fmtTime(it.start), t2 = fmtTime(it.end);

    doc.setFont("courier","normal"); doc.setFontSize(10); doc.setTextColor(...MUT);
    doc.text(t1 || "—:—", M, y);

    doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor(...INK);
    doc.text(String(it.title || T.label), M+52, y, {maxWidth:W-M*2-60});

    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...MUT);
    let meta = T.label.toUpperCase();
    if(it.provider) meta += `  ·  ${it.provider}`;
    if(t2) meta += `  ·  hasta ${t2}`;
    doc.text(meta, M+52, y+13, {maxWidth:W-M*2-60});
    y += 27;

    // talón de datos
    const stub = [];
    if(it.from || it.to) stub.push(["RUTA", `${it.from||"—"} → ${it.to||"—"}`]);
    if(it.flightNumber) stub.push(["VUELO", it.flightNumber]);
    if(it.confirmation) stub.push(["RESERVA", it.confirmation]);
    if(it.seat) stub.push(["ASIENTO", it.seat]);
    if(it.terminal) stub.push(["TERMINAL", it.terminal]);
    if(it.gate) stub.push(["PUERTA", it.gate]);
    if(it.boardingTime) stub.push(["EMBARQUE", it.boardingTime]);
    if(it.address) stub.push(["DIRECCIÓN", it.address]);
    if(it.phone) stub.push(["TEL", it.phone]);
    if(it.cost) stub.push(["COSTO", `${it.currency||""} ${it.cost}`.trim()]);

    if(stub.length){
      let cx = M+52;
      doc.setFontSize(7);
      stub.forEach(([k2,v])=>{
        const wv = Math.max(doc.getTextWidth(String(v))+6, doc.getTextWidth(k2)+6);
        if(cx + wv > W-M){ cx = M+52; y += 24; need(30); }
        doc.setFont("helvetica","normal"); doc.setTextColor(...MUT);
        doc.text(k2, cx, y);
        doc.setFont("courier","normal"); doc.setFontSize(9); doc.setTextColor(...INK);
        doc.text(String(v).slice(0,42), cx, y+11);
        doc.setFontSize(7);
        cx += wv + 16;
      });
      y += 22;
    }

    const miss = missingFields(it);
    if(miss.length){
      doc.setFont("helvetica","italic"); doc.setFontSize(8); doc.setTextColor(...CRIT);
      doc.text(`Falta: ${miss.map(m=>m[1]).join(", ")}`, M+52, y);
      y += 13;
    }
    y += 10;
  });

  if(trip.notes){
    need(60); y += 6; line(y); y += 20;
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...INK);
    doc.text("NOTAS", M, y); y += 15;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...MUT);
    const t = doc.splitTextToSize(String(trip.notes), W-M*2);
    doc.text(t, M, y);
  }

  // pie en todas las páginas
  const total = doc.getNumberOfPages();
  for(let p=1;p<=total;p++){
    doc.setPage(p);
    doc.setFont("courier","normal"); doc.setFontSize(7.5); doc.setTextColor(...MUT);
    doc.text(`Valija  ·  ${new Date().toLocaleDateString("es-AR")}`, M, 815);
    doc.text(`${p} / ${total}`, W-M, 815, {align:"right"});
  }

  const safe = String(trip.name||"viaje").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase() || "viaje";
  const filename = `valija-${safe}.pdf`;
  const blob = doc.output("blob");

  let dl = null;
  try{ dl = await claude.use("downloads"); }catch(e){}
  if(dl){
    try{
      await dl.save({filename, data:blob});
      toast("PDF guardado");
    }catch(e){
      const c = e && e.code;
      if(c === "declined") return;
      if(c === "rate_limited"){ toast("Esperá un momento y probá de nuevo", true); return; }
      toast("No se pudo guardar el PDF", true);
    }
  } else {
    // sin la capacidad de descarga, imprimir es la salida a PDF del sistema
    toast("Usá Imprimir y elegí Guardar como PDF");
    try{ window.print(); }catch(e){}
  }
}
