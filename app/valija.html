/* ============================================================
   DOCUMENTOS ADJUNTOS — VAL-58
   El archivo que se importó, o el que se adjuntó a mano, queda en la
   reserva y se puede abrir y descargar. Diseño: docs/design/adjuntar.md
   (estados D1 a D14). El motor es AdjuntosEngine, embebido más arriba:
   acá no se calcula ningún tope ni se arma ningún texto de peso a mano.
   ============================================================ */

/** El archivo, rearmado a partir del cuerpo guardado. */
function docBlob(doc, cuerpo){
  const bytes = AdjuntosEngine.base64ABytes((cuerpo && cuerpo.b64) || "");
  return new Blob([bytes], {type:(cuerpo && cuerpo.mime) || (doc && doc.mime) || "application/octet-stream"});
}

/** La capacidad de descarga, o `null` si esta vista no la tiene. Nunca lanza. */
async function capDescargas(){
  try{ return await claude.use("downloads"); }catch(e){ return null; }
}

/** Deja el archivo en el teléfono. Mismo manejo de errores que el PDF del
    resumen: `declined` no dice nada (la persona ya decidió), `rate_limited`
    pide esperar, cualquier otro es un error con nombre. */
async function bajarDocumento(dl, filename, blob){
  try{
    await dl.save({filename, data:blob});
    toast("Documento guardado");
  }catch(e){
    const c = e && e.code;
    if(c === "declined") return;
    if(c === "rate_limited"){ toast("Esperá un momento y probá de nuevo", true); return; }
    toast("No se pudo guardar el documento", true);
  }
}

/** El patrón de origen de archivo que YA funciona en el teléfono: un
    `<button data-pick>` y un `<input type="file">` HERMANOS, y el toque del
    botón llama `input.click()` en el mismo gesto. No envolver el campo adentro
    del botón, no esconderlo con display:none, no ponerlo encima: así fue como
    los botones de importar quedaron muertos en el teléfono.

    Si el selector no se abre, la persona se queda sin saber qué pasó. No lo
    podemos preguntar: lo medimos. Abrir el selector le saca el foco a la
    página en todos los navegadores; si después de tocar el foco nunca se fue y
    tampoco llegó ningún archivo, no se abrió nada. */
function wireFilePick(id, opts){
  opts = opts || {};
  const input = document.getElementById(id);
  if(!input) return;
  const vivo = opts.alive || (()=>true);
  /* Que el archivo haya llegado se anota ACÁ y no se lee de `input.files`.
     Durante tres iteraciones la guarda fue `!(input.files && input.files.length)`
     y nunca pudo ser verdadera: `onchange` limpia `input.value` —hay que
     limpiarlo para poder volver a elegir el mismo archivo— y eso vacía
     `input.files` al instante, mucho antes de que corra el temporizador. Era
     código muerto. En escritorio no se notaba porque el `blur` tapa el caso;
     el respaldo sólo hace falta donde el `blur` no llega, que es justo el
     teléfono. Lo destapó el hallazgo H5 de QA el 14/09. */
  let llegaron = false;
  const boton = document.querySelector(`[data-pick="${id}"]`);
  if(boton) boton.onclick = ()=>{
    let seFue = false;
    llegaron = false;
    const salio = ()=>{ seFue = true; };
    window.addEventListener("blur", salio, {once:true});
    document.addEventListener("visibilitychange", salio, {once:true});
    /* El campo se limpia ACÁ, justo antes de abrir el selector, y NUNCA
       después de elegir. Limpiarlo hace falta para poder volver a elegir el
       mismo archivo; el problema es cuándo.

       La HIPÓTESIS por la que se movió —y es una hipótesis, no un hecho
       comprobado— es que un archivo que el selector trae del correo o de
       Drive no le pertenece al navegador: en Android llegaría como
       `content://`, prestado por un proveedor mientras el campo lo tenga, y
       limpiar el campo devolvería el préstamo antes de que alguien lo lea.

       Se cree plausible por una diferencia que el PM vio el 16/09: el PDF del
       mail falló y una foto de la cámara entró perfecta, y esa la crea el
       navegador y es suya. Pero NADIE lo observó en el aparato: este entorno
       no puede reproducirlo, y el síntoma siguió después de publicar este
       arreglo, lo cual es evidencia CONTRA que sea la causa única.

       Entonces por qué se deja: limpiar al abrir es correcto sin importar si
       la hipótesis es cierta. No hay ningún momento en que convenga tocar el
       campo mientras hay un archivo suyo en uso. Vale como arreglo que no
       depende de acertar la causa, que es lo único que este proyecto tiene
       permitido publicar sobre este defecto.

       Lo reproduce `app/pruebas/archivo-del-correo.js` — contra un simulador
       escrito desde esta misma hipótesis, así que confirma que el código hace
       lo que dice, NO que la hipótesis sea verdadera. */
    try{ input.value = ""; }catch(e){}
    input.click();
    setTimeout(()=>{
      window.removeEventListener("blur", salio);
      document.removeEventListener("visibilitychange", salio);
      if(!seFue && !llegaron && vivo() && opts.onMudo) opts.onMudo();
    }, 1500);
  };
  input.onchange = ()=>{
    const files = Array.from(input.files || []);
    llegaron = files.length > 0;
    // OJO: acá NO se limpia `input.value`. Ver el comentario de arriba.
    if(files.length){
      /* El aviso se RETRACTA si el archivo llega tarde. Elegir una foto en la
         galería tarda más de 1,5 segundos casi siempre, así que en un navegador
         donde el foco no se va el aviso aparece mientras el selector sigue
         abierto. Decirle a alguien que algo falló cuando funcionó es peor que
         no decir nada: si el archivo llega, el aviso se va. */
      if(opts.onRetirar) opts.onRetirar();
      if(opts.onFiles) opts.onFiles(files);
    }
  };
}

/** Prepara un archivo elegido, sin escribir nada (diseño 5.5): lo codifica y,
    si es una foto que no entra, la reduce. Nunca rechaza: un archivo que no se
    puede preparar vuelve como `estado:"no-entra"` con su motivo.

    "Nunca rechaza" incluye no lanzar SINCRÓNICAMENTE, y eso hasta el 17/09 no
    era cierto. `prepararDocumento` llama a `normalizarBytes` fuera de toda
    promesa, así que un valor hostil en `file.bytes` —uno cuyo `length` lanza—
    salía disparado antes de que existiera la promesa a la que este `.catch`
    se engancha. Un `.catch` no puede atrapar un throw que ocurrió antes de
    que hubiera algo que encadenar.

    El daño no era un mensaje equivocado: era la app MUDA. `elegirAdjunto`
    deja puesto `DOC.preparando` antes de llamar acá y lo limpia después; si
    el medio se va por un throw, el cartel de "preparando" se queda para
    siempre y "Guardar" contesta "esperá a que termine" sin que nunca termine.
    Justo el modo de falla que este proyecto ya pagó tres veces.

    Lo encontré probando si la rama `"no-se-pudo-leer"` del motor era
    alcanzable —la auditoría decía que era código muerto y tenía razón—. De
    cinco intentos, ninguno llegó a esa rama y DOS se escaparon sincrónicos.
    Queda en `app/pruebas/preparar-no-lanza.js`, con los cinco.

    `Promise.resolve().then(...)` mete la llamada dentro de la cadena, así que
    ahora un throw sincrónico llega a este mismo `.catch`. No depende de
    adivinar nada: se reproduce acá. */
function prepararAdjunto(file, opts){
  return Promise.resolve().then(()=> AdjuntosEngine.prepararDocumento(file, opts)).catch(e=>{
    console.warn("prepararDocumento", e);
    return {estado:"no-entra", ok:false, bloqueaGuardado:false, doc:null, cuerpo:null,
      recompresion:null, advertencias:[],
      error:{codigo:"no-se-pudo-leer", mensaje:"No pude leer ese archivo. Probá elegirlo de nuevo; si sigue, bajalo otra vez del mail."}};
  });
}

/* ---------- D8 a D13: el bloque "Documento" de la hoja de la reserva ----------
   Elegir el archivo lo PREPARA (lo codifica, lo reduce si hace falta y muestra
   el resultado) pero no lo escribe: escribe el mismo "Guardar" del formulario
   (diseño 5.5). Consecuencia buena: "no entró" (D12) aparece ANTES de guardar,
   así que se puede elegir otro sin haber dejado nada a medias. */
function docPickerHtml(estado){
  return `<div class="tp imp-pick" style="width:100%">
    <button class="tpbtn" type="button" data-pick="doc_file" ${estado.preparando?"disabled":""}>${svg(I.doc)} Archivo <span class="n">PDF o imagen</span></button>
    <button class="tpbtn" type="button" data-pick="doc_cam" ${estado.preparando?"disabled":""}>${svg(I.cam)} Sacar foto <span class="n">con la cámara</span></button>
    <input id="doc_file" type="file" accept="application/pdf,image/*">
    <input id="doc_cam" type="file" accept="image/*" capture="environment">
  </div>`;
}
function docRowHtml(e, canWrite){
  const clas = AdjuntosEngine.clasificarArchivo({name:e.doc.nombre, mimeType:e.doc.mime});
  const cls = clas.familia==="pdf" ? "pdf" : (clas.familia==="imagen" ? "img" : "");
  const icon = clas.familia==="imagen" ? "img" : "doc";
  const nombre = e.doc.nombreCorto || e.doc.nombre;
  /* Sin permiso de edición la cruz no queda deshabilitada: no está. Lo que sí
     está es abrir el documento, que es el sentido de compartir un viaje. */
  const acts = canWrite
    ? `<button class="rm" aria-label="Quitar ${esc(nombre)}" data-docrm="${esc(e.doc.id)}">${svg(I.x)}</button>`
    : (e.nuevo ? "" : `<button class="act" data-docopen="${esc(e.doc.id)}">Ver</button>`);
  return `<div class="imp-file">
    <span class="imp-thumb ${cls}">${svg(I[icon])}</span>
    <span class="bd"><span class="nm">${esc(nombre)}</span>
      <span class="meta">${esc(AdjuntosEngine.textoFila(e.doc))}</span></span>
    ${acts ? `<span class="row-acts">${acts}</span>` : ""}
  </div>`;
}
/** H4 · el aviso del cupo TOTAL de la base, dicho antes de gastarlo y no
    recién cuando rechaza. `usados` viene de `Store.usoDeLaBase()` y es `null`
    cuando no hay base compartida: ahí no hay tope de 5.000 que avisar y esto
    no existe. Se dice qué pasa y qué hacer: sacar documentos que ya no se
    usan libera lugar. */
function avisoCupoBaseHtml(usados){
  if(usados === null || usados === undefined) return "";
  const p = AdjuntosEngine.presupuestoDeLaBase(usados);
  if(p.nivel === "ok") return "";
  const txt = p.nivel === "lleno"
    ? `La valija llegó al tope de ${p.tope} documentos guardados. Para adjuntar uno nuevo, quitá antes alguno que ya no necesites —el de un viaje que terminó, por ejemplo—: eso libera el lugar.`
    : `Va quedando poco lugar: ${p.quedan} de ${p.tope} documentos. Si alguno ya no te sirve —los de un viaje que terminó—, quitalo y ese lugar vuelve a estar libre.`;
  return `<div class="notice warn">${svg(I.info)}<span class="bd">${esc(txt)}</span></div>`;
}
function docBlockHtml(estado, canWrite, usadosDeLaBase){
  const espacio = AdjuntosEngine.espacioParaDocumentos(estado.lista.map(e=>e.doc));
  // 5.6: sin permiso de edición y sin documentos, el bloque no existe. Un
  // bloque vacío que no ofrece ninguna acción es ruido en todas las reservas
  // de un viaje compartido.
  if(!canWrite && !estado.lista.length) return "";

  const filas = estado.lista.map(e=> docRowHtml(e, canWrite)).join("");
  const prep = estado.preparando ? `<div class="imp-file">
      <span class="imp-thumb ${estado.preparando.imagen?"img":"pdf"}">${svg(I[estado.preparando.imagen?"img":"doc"])}</span>
      <span class="bd"><span class="nm">${esc(estado.preparando.nombre)}</span>
        <span class="meta"><span class="spin"></span> ${estado.preparando.imagen?"Reduciendo la foto para que entre…":"Preparando el archivo…"}</span></span>
    </div>` : "";
  const fallo = estado.fallo ? `<div class="imp-file err">
      <span class="imp-thumb ${estado.fallo.imagen?"img":"pdf"}">${svg(I[estado.fallo.imagen?"img":"doc"])}</span>
      <span class="bd"><span class="nm">${esc(estado.fallo.nombre)}</span>
        <span class="meta err">${esc(estado.fallo.mensaje)}</span>
        ${estado.fallo.detalle ? `<span class="meta dato">${esc(estado.fallo.detalle)} · v${esc(VALIJA_VERSION)}</span>` : ""}</span>
      <span class="row-acts">
        <button class="act" id="doc-otro">Elegir otro</button>
        <button class="rm" aria-label="Sacar de la lista" data-docfallo="1">${svg(I.x)}</button>
      </span>
    </div>` : "";

  const hayFilas = !!(filas || prep || fallo);
  // D12: el motivo de que no haya entrado manda sobre el recordatorio del cupo.
  const hint = estado.fallo
    ? "La reserva no cambia: lo único que no entró es el archivo. Si en el mail viene también la página sola de tu pasaje, esa suele entrar."
    : (estado.lista.some(e=>e.nuevo)
        ? "Queda adjunto cuando toques Guardar. " + espacio.frase
        : espacio.frase);

  /* Sin permiso de edición la cuenta "1 de 3" sobra: nombra un cupo que el
     visitante no puede usar. Se dice qué hay, nada más. */
  const etiqueta = canWrite ? espacio.etiqueta
    : (estado.lista.length === 1 ? "Documento" : "Documentos");

  return `<div class="f">
    <label>${esc(etiqueta)}</label>
    ${hayFilas ? `<div class="imp-files">${filas}${prep}${fallo}</div>` : ""}
    ${(!hayFilas && canWrite) ? `<div class="empty sm">
      <p>Adjuntá el PDF que te mandaron o sacale una foto al papel. Queda guardado con la reserva, para tenerlo a mano sin ir a buscar el mail.</p>
      ${docPickerHtml(estado)}
    </div>` : ""}
    ${(hayFilas && canWrite && espacio.puedeSumar) ? docPickerHtml(estado) : ""}
    ${canWrite ? `<div id="doc-nopick" hidden></div><span class="hint">${esc(hint)}</span>` : ""}
  </div>
  ${canWrite ? avisoCupoBaseHtml(usadosDeLaBase) : ""}
  ${estado.aviso ? `<div class="notice warn">${svg(I.info)}<span class="bd">${esc(estado.aviso)}</span></div>` : ""}`;
}

/* ---------- D2 a D7: el visor del documento ----------
   El cuerpo del archivo no vive en el teléfono (ver Store.loadDocBody): hay
   que traerlo. Con señal el estado de carga pasa de largo; sin señal se queda,
   y ahí está D4 con el reintento. Por eso Descargar es la acción primaria: es
   la única que deja el archivo en el teléfono para cuando no haya señal. */
let docSheetSeq = 0;
function sheetDoc(trip, item, docId){
  const it = Store.itemsOf(trip.id).find(x=>x.id===item.id) || item;
  const doc = ((it && it.docs) || []).find(d=>d && d.id===docId);
  if(!doc){ toast("Ese documento ya no está en la reserva", true); return; }

  const titulo = doc.nombreCorto || doc.nombre || "Documento";
  const marker = `<span id="doc-live" hidden></span>`;
  const miTurno = ++docSheetSeq;
  const alive = ()=> miTurno === docSheetSeq && !!document.getElementById("doc-live");
  const clas = AdjuntosEngine.clasificarArchivo({name:doc.nombre, mimeType:doc.mime});
  /* "la tarjeta de embarque" / "el pasaje": el género sale de la misma tabla
     del motor que decide el nombre corto, no de un if acá. */
  const genero = (AdjuntosEngine.REGLAS_NOMBRE_CORTO.find(r=>r.nombre === doc.nombreCorto) || {}).genero || "m";
  const elLa = genero === "f" ? "la" : "el";
  const laLo = genero === "f" ? "la" : "lo";

  const st = {
    vista:"trayendo",     // trayendo | imagen | render | sin-previa | error | nohay
    cuerpo:null, url:null,
    dl:null, dlResuelto:false,
    confirmando:false, preparando:false
  };
  const soltarUrl = ()=>{ if(st.url){ try{ URL.revokeObjectURL(st.url); }catch(e){} st.url = null; } };

  // La capacidad se pregunta una vez por apertura y se maneja el null: si no
  // está, el botón no se muestra apagado, se reemplaza por la explicación.
  capDescargas().then(d=>{ st.dl = d; st.dlResuelto = true; if(alive()) pintar(); });

  function traer(){
    st.vista = "trayendo"; st.cuerpo = null; soltarUrl(); pintar();
    Store.loadDocBody(trip.id, docId).then(cuerpo=>{
      if(!alive()) return;
      if(!cuerpo || !cuerpo.b64){ st.vista = "nohay"; pintar(); return; }
      st.cuerpo = cuerpo;
      const blob = docBlob(doc, cuerpo);
      if(clas.familia === "imagen"){
        soltarUrl(); st.url = URL.createObjectURL(blob); st.vista = "imagen"; pintar(); return;
      }
      // PDF: la primera página, con el mismo pdf.js que usa la importación.
      // Si no cargó —se baja de un CDN y pasa— se dice y la descarga sigue.
      if(!pdfEngineReady()){ st.vista = "sin-previa"; pintar(); return; }
      st.vista = "render"; pintar();
      ImportEngine.renderPdfPagesToImages(blob, {scale:1.6}).then(imgs=>{
        if(!alive()) return;
        if(imgs && imgs[0]){ soltarUrl(); st.url = URL.createObjectURL(imgs[0]); st.vista = "imagen"; }
        else st.vista = "sin-previa";
        pintar();
      }, ()=>{ if(alive()){ st.vista = "sin-previa"; pintar(); } });
    }, e=>{
      console.warn("loadDocBody", e);
      if(!alive()) return;
      st.vista = "error"; pintar();
    });
  }

  function vistaHtml(){
    if(st.vista === "imagen") return `<img src="${esc(st.url)}" alt="${esc(titulo)}">`;
    if(st.vista === "trayendo") return `<span class="ph"><span class="spin"></span> Trayendo el documento…</span>`;
    if(st.vista === "render") return `<span class="ph"><span class="spin"></span> Armando la vista del PDF…</span>`;
    if(st.vista === "sin-previa") return `<span class="ph">${svg(I.doc)}
      <b>No puedo mostrarte el PDF acá</b>
      Está guardado y lo podés descargar. Para verlo en pantalla, abrilo después de bajarlo.</span>`;
    if(st.vista === "nohay") return `<span class="ph">${svg(I.doc)}
      <b>No encuentro el archivo</b>
      La reserva tiene anotado este documento, pero el archivo no está en la valija. Quitalo de la reserva y adjuntalo de nuevo.</span>`;
    return `<span class="ph">${svg(I.doc)}
      <b>No pude traer el documento</b>
      Está guardado en la valija y no se perdió: para abrirlo hace falta conexión.</span>`;
  }

  function pintar(){
    const aviso = AdjuntosEngine.avisoMenorCalidad(doc, {momento:"visor"});
    const puedeEditar = Store.canWrite;
    const hayCuerpo = !!st.cuerpo;

    const cuerpoHtml = st.confirmando
      // D7: la confirmación va en la MISMA hoja, sin un modal encima de otro.
      ? `${marker}
        <div class="doc-view" style="min-height:120px">${vistaHtml()}</div>
        <div class="notice warn">${svg(I.info)}<span class="bd"><b>¿Quito ${elLa} ${esc(titulo.toLowerCase())}?</b>
          Se borra el archivo de la valija y, si no lo tenés en el mail, no hay de dónde volver a sacarlo.
          La reserva y todos sus datos quedan como están.</span></div>`
      : `${marker}
        ${puedeEditar ? "" : `<div class="chips"><span class="chip soon">sólo lectura</span></div>`}
        <div class="doc-view">${vistaHtml()}</div>
        ${st.vista === "error" ? `<div class="notice warn">${svg(I.info)}<span class="bd">Probá de nuevo cuando tengas señal. Y si vas a estar sin señal justo cuando lo necesitás, descargalo antes de salir: así queda en el teléfono.
          <button class="act" id="doc-retry">Probar de nuevo</button></span></div>` : ""}
        ${aviso ? `<div class="notice warn">${svg(I.info)}<span class="bd">${esc(aviso)}</span></div>` : ""}
        ${(st.dlResuelto && !st.dl) ? `<div class="notice">${svg(I.info)}<span class="bd">Desde esta vista no puedo guardar archivos en el teléfono. Abrí la valija en el navegador y probá de nuevo, o pedile el archivo a quien te lo mandó.</span></div>` : ""}
        <p class="doc-meta">${esc(AdjuntosEngine.lineaDeDatos(doc, {compartido: !puedeEditar}))}</p>
        ${puedeEditar ? `<hr class="hr">
        <div class="tp imp-pick" style="width:100%">
          <button class="tpbtn" type="button" data-pick="doc_repl" ${st.preparando?"disabled":""}>${svg(I.edit)} Reemplazar <span class="n">por otro archivo</span></button>
          <input id="doc_repl" type="file" accept="application/pdf,image/*">
        </div>
        <button class="btn ghost block" id="doc-rm" ${st.preparando?"disabled":""}>${svg(I.trash)} Quitar</button>
        ${st.preparando ? `<div class="imp-files"><div class="imp-file"><span class="imp-thumb"></span>
          <span class="bd"><span class="nm">Reemplazando el documento</span>
          <span class="meta"><span class="spin"></span> Preparando el archivo…</span></span></div></div>` : ""}` : ""}`;

    const pie = st.confirmando
      ? `<button class="btn ghost" id="doc-keep">No, dejá${laLo}</button>
         <button class="btn danger" id="doc-rmok">${svg(I.trash)} Quitar ${elLa} ${esc(titulo.toLowerCase())}</button>`
      : (st.dlResuelto && !st.dl)
        ? `<button class="btn ghost block" id="doc-close">Cerrar</button>`
        : `<button class="btn ghost" id="doc-close">Cerrar</button>
           <button class="btn primary" id="doc-dl" ${hayCuerpo && st.dl ? "" : "disabled"}>${svg(I.pdf)} Descargar</button>`;

    openSheet(titulo, cuerpoHtml, pie);
    bind();
  }

  function bind(){
    const cerrar = document.getElementById("doc-close");
    if(cerrar) cerrar.onclick = ()=>{ soltarUrl(); closeSheet(); };
    const retry = document.getElementById("doc-retry");
    if(retry) retry.onclick = traer;

    const dlBtn = document.getElementById("doc-dl");
    if(dlBtn) dlBtn.onclick = ()=>{
      if(!st.cuerpo || !st.dl) return;
      const nombre = AdjuntosEngine.nombreDeDescarga(doc, {reserva: it.title || ""});
      bajarDocumento(st.dl, nombre, docBlob(doc, st.cuerpo));
    };

    const rm = document.getElementById("doc-rm");
    if(rm) rm.onclick = ()=>{ st.confirmando = true; pintar(); };
    const keep = document.getElementById("doc-keep");
    if(keep) keep.onclick = ()=>{ st.confirmando = false; pintar(); };
    const rmok = document.getElementById("doc-rmok");
    if(rmok) rmok.onclick = async ()=>{
      rmok.disabled = true;
      const docs = AdjuntosEngine.quitarDocumento(it.docs || [], docId).docs;
      try{
        await Store.saveItem(trip.id, Object.assign({}, it, {docs}));
        Store.delDocBody(trip.id, docId);
        soltarUrl(); closeSheet(); toast("Documento quitado");
      }catch(e){ rmok.disabled = false; toast(writeErr(e), true); }
    };

    if(Store.canWrite && !st.confirmando) wireFilePick("doc_repl", {
      alive,
      onFiles: files => reemplazar(files[0])
    });
  }

  /** Reemplazar es preparar + escribir: el documento ya existe, así que no hay
      un "Guardar" del formulario donde esperar. Si el archivo nuevo no entra,
      el viejo queda como estaba. */
  async function reemplazar(file){
    st.preparando = true; pintar();
    const otros = (it.docs || []).filter(d=>d && d.id !== docId);
    const r = await prepararAdjunto(file, {
      origen:"archivo", tipoReserva: it.type, docsActuales: otros, itemId: it.id
    });
    if(!alive()) return;
    st.preparando = false;
    if(!r.ok){ pintar(); toast(r.error.mensaje, true); return; }
    try{
      await Store.saveDocBody(trip.id, r.cuerpo);
      const docs = (it.docs || []).map(d=> (d && d.id === docId) ? r.doc : d);
      await Store.saveItem(trip.id, Object.assign({}, it, {docs}));
      Store.delDocBody(trip.id, docId);
      soltarUrl(); closeSheet();
      toast(r.estado === "recomprimido" ? "Documento reemplazado, guardado en menor calidad" : "Documento reemplazado");
    }catch(e){
      const info = AdjuntosEngine.interpretarErrorDeLaBase(e);
      pintar(); toast(info.mensaje, true);
    }
  }

  pintar();
  traer();
}

/* ---------- importador con IA ---------- */
/* ============================================================
   IMPORTAR DOCUMENTOS — VAL-40, VAL-41, VAL-42
   Reemplaza al viejo sheetImport (texto pegado + una foto suelta) por
   el flujo completo del muestrario aprobado (app/parts/import-ui.html,
   14 estados) sobre el motor ImportEngine embebido más arriba.
   Ver docs/design/importar.md sección 5 (nota de integración).
   ============================================================ */
const MAX_FILE_MB = 15;
const MAX_FILE_BYTES = MAX_FILE_MB*1024*1024;

function fmtSize(bytes){
  if(bytes==null) return "";
  if(bytes < 1024*1024) return `${Math.round(bytes/1024)} KB`;
  return `${(bytes/1024/1024).toFixed(1).replace(".",",")} MB`;
}
function kindIcon(kind){ return kind==="img" ? "img" : "doc"; }
function kindThumbCls(kind){ return kind==="pdf" ? "pdf" : (kind==="img" ? "img" : ""); }

/** Prompt para el camino legado de texto pegado (el <details> del estado 01).
    ImportEngine sólo interpreta imágenes/PDF; el texto se resuelve acá mismo,
    reusando parseImportResponse/friendlyModelError para quedar consistente. */
function buildTextImportPrompt(trip, text){
  const hoy = new Date().toISOString().slice(0,10);
  return [
    "Extraés datos de reservas de viaje a partir de un texto y devolvés SOLO JSON, sin texto alrededor.",
    "",
    "Texto de la confirmación:",
    '"""', String(text).slice(0,12000), '"""',
    "",
    `Contexto: el viaje se llama "${trip.name||""}"${trip.destination?`, destino ${trip.destination}`:""}${trip.startDate?`, entre ${trip.startDate} y ${trip.endDate||"?"}`:""}. Hoy es ${hoy}.`,
    "",
    "Devolvé este JSON exacto:",
    '{"items":[{',
    '"type":"flight|stay|car|transfer|act|note",',
    '"title":"texto corto y humano, ej: Buenos Aires → Madrid",',
    '"start":"YYYY-MM-DDTHH:mm o vacío",',
    '"end":"YYYY-MM-DDTHH:mm o vacío",',
    '"from":"IATA de 3 letras si es vuelo, si no ciudad o lugar",',
    '"to":"idem",',
    '"provider":"aerolínea, hotel, plataforma o rentadora",',
    '"flightNumber":"","confirmation":"","seat":"","terminal":"","gate":"",',
    '"boardingTime":"HH:mm o vacío",',
    '"address":"","phone":"","cost":"","currency":"","notes":""',
    "}]}",
    "",
    "Reglas: un objeto por reserva; ida y vuelta son DOS vuelos separados. Usá 24 horas. Si un dato no aparece, dejá \"\" (nunca inventes códigos ni horarios). Para alojamiento, start es el check-in y end el check-out. Si el año no figura, deducilo del contexto del viaje."
  ].join("\n");
}
function interpretPastedText(text, name, opts){
  if(typeof opts.callModel !== "function"){
    return Promise.resolve({archivo:name, estado:"error", reservas:[],
      error:{codigo:"ia-no-disponible", mensaje:"La lectura automática no está disponible ahora mismo."}, paginas:null});
  }
  const prompt = buildTextImportPrompt(opts.trip||{}, text);
  return Promise.resolve()
    .then(()=> opts.callModel(prompt, {}))
    .then(raw=>{
      const reservas = ImportEngine.parseImportResponse(raw).map(r=> Object.assign({}, r, {archivo:name}));
      return {archivo:name, estado: reservas.length?"ok":"vacio", reservas, error:null, paginas:null};
    })
    .catch(e=> ({archivo:name, estado:"error", reservas:[], error:ImportEngine.friendlyModelError(e), paginas:null}));
}

/** Campos editables por tipo, en la tarjeta de revisión (04/05/08). Sin
    tabla de tipo (ya se sabe qué tipo es): sólo lo que la lectura automática
    suele errar. Costo, teléfono y notas se completan después, abriendo la
    reserva ya guardada — mismo criterio que dice el muestrario.
    Todo campo que `doSaveReview` guarda tiene que tener acá su propio input:
    nada se guarda sin que la persona lo haya visto (regla del brief). Por eso
    "proveedor" también aparece en alojamiento y auto, no sólo en vuelo y
    traslado, y por eso puerta/terminal/embarque aparecen cuando la reserva

      <div class="f"><label>Dirección</label><input data-f="address" value="${v(r.address)}" placeholder="No lo encontré"></div>

      </div>
      <div class="f"><label>Código de reserva</label><input data-f="confirmation" class="mono" value="${v(r.confirmation)}" placeholder="No lo encontré" style="text-transform:uppercase"></div>`;
  if(r.type==="car") return `

      <div class="f"><label>Lugar de retiro</label><input data-f="address" value="${v(r.address)}" placeholder="No lo encontré"></div>
      <div class="f2">
        <div class="f"><label>Retiro</label><input data-f="start" type="datetime-local" value="${v(r.start)}"></div>

      </div>
      <div class="f"><label>Código de reserva</label><input data-f="confirmation" class="mono" value="${v(r.confirmation)}" placeholder="No lo encontré" style="text-transform:uppercase"></div>`;
  if(r.type==="transfer") return `

      <div class="f2">
        <div class="f"><label>Desde</label><input data-f="from" value="${v(r.from)}" placeholder="No lo encontré"></div>
        <div class="f"><label>Hasta</label><input data-f="to" value="${v(r.to)}" placeholder="No lo encontré"></div>
      </div>
      <div class="f"><label>Fecha y hora</label><input data-f="start" type="datetime-local" value="${v(r.start)}"></div>
      <div class="f"><label>Código de reserva</label><input data-f="confirmation" class="mono" value="${v(r.confirmation)}" placeholder="No lo encontré" style="text-transform:uppercase"></div>`;
  // act / note: sin ejemplo en el muestrario, campos mínimos razonables.
  return `
      <div class="f"><label>Proveedor</label><input data-f="provider" value="${v(r.provider)}" placeholder="No lo encontré"></div>
      <div class="f2">
        <div class="f"><label>Cuándo</label><input data-f="start" type="datetime-local" value="${v(r.start)}"></div>
        <div class="f"><label>Termina</label><input data-f="end" type="datetime-local" value="${v(r.end)}"></div>
      </div>
      <div class="f"><label>Dónde</label><input data-f="address" value="${v(r.address)}" placeholder="No lo encontré"></div>
      <div class="f"><label>Código / entrada</label><input data-f="confirmation" class="mono" value="${v(r.confirmation)}" placeholder="No lo encontré" style="text-transform:uppercase"></div>`;
}

/** Lista de archivos que no aportaron nada (05/10): vacío ≠ error, nunca el
    mismo tratamiento (ver docs/design/importar.md sección 3.2). */
/** Cómo se nombra una reserva cuando hay que señalarla en un texto: con lo
    que la persona reconocería en la lista. Un vuelo sin título se nombra por
    su número —"Vuelo G3 1245"—, que es lo único que lo distingue del otro
    tramo del mismo itinerario. Devuelve texto pelado: lo escapa quien lo pinta. */
function nombreDeReserva(r){
  r = r || {};
  const T = TYPES[r.type] || TYPES.note;
  const titulo = String(r.title||"").trim();
  const vuelo  = String(r.flightNumber||"").trim();
  if(titulo && vuelo && titulo.toUpperCase().indexOf(vuelo.toUpperCase())<0) return `${titulo} (${vuelo})`;
  if(titulo) return titulo;
  if(vuelo) return `${T.label} ${vuelo}`;
  return T.label;
}
function issuesListHtml(issues){
  // La clave de los botones es la IDENTIDAD de la fuente, no su nombre: dos
  // archivos homónimos tienen que poder reintentarse y sacarse por separado.
  const clave = a => a.srcId || a.archivo;
  return `<div class="imp-files">${issues.map(a=>{
    const cls = kindThumbCls(a.kind), icon = kindIcon(a.kind);
    if(a.estado==="error") return `<div class="imp-file err">
        <span class="imp-thumb ${cls}">${svg(I[icon])}</span>
        <span class="bd"><span class="nm">${esc(a.archivo)}</span>
          <span class="meta err">${esc((a.error&&a.error.mensaje)||"No pude leer este archivo.")}</span></span>
        <span class="row-acts">
          <button class="act" data-retry="${esc(clave(a))}">Reintentar</button>
          <button class="rm" aria-label="Sacar ${esc(a.archivo)}" data-rmfile="${esc(clave(a))}">${svg(I.x)}</button>
        </span>
      </div>`;
    return `<div class="imp-file">
        <span class="imp-thumb ${cls}">${svg(I[icon])}</span>
        <span class="bd"><span class="nm">${esc(a.archivo)}</span>
          <span class="meta info">Se leyó bien, pero no encontré ninguna reserva ahí. Puede ser una foto borrosa o un documento que no es de viaje.</span></span>
        <span class="row-acts"><button class="rm" aria-label="Sacar ${esc(a.archivo)}" data-rmfile="${esc(clave(a))}">${svg(I.x)}</button></span>
      </div>`;
  }).join("")}</div>`;
}

  openSheet("Importar reservas",
    `<div class="notice warn">${svg(I.info)}<span class="bd">La lectura automática no está disponible en esta vista. Cargá la reserva a mano desde <b>Agregar</b>.</span></div>`,
    `<button class="btn block" id="im-close">Cerrar</button>`);

}
function renderImportReadOnly(){

    `<div class="notice">${svg(I.info)}<span class="bd"><span class="chip soon">sólo lectura</span><br><br>
      Quien mira este viaje sin permiso de edición no puede importar reservas. Pedile a quien te compartió el link que te dé permiso para cargar.</span></div>`,
    `<button class="btn block" id="im-close">Cerrar</button>`);
