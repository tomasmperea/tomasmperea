   QUÉ TIPO DE ARCHIVO ES
   ============================================================ */

/**
 * @param {{name?:string, mimeType?:string, type?:string}} file
 * @returns {"pdf"|"imagen"|"desconocido"}
 */
function fileKind(file) {
  var mime = String((file && (file.mimeType || file.type)) || "").toLowerCase();
  var name = String((file && file.name) || "").toLowerCase();
  if (mime === "application/pdf" || /\.pdf$/.test(name)) return "pdf";
  if (mime.indexOf("image/") === 0 || /\.(png|jpe?g|jpg|heic|heif|webp)$/.test(name)) return "imagen";
  return "desconocido";
}

/* ============================================================
   RENDER DE PDF A IMÁGENES — VAL-40
   Única función del módulo que toca el DOM. Todo lo demás en este
   archivo se puede probar con `node`.
   ============================================================ */

/**
 * Abre el PDF con pdf.js. Primero intenta con el Web Worker, que es el
 * camino rápido. Si instanciarlo falla —típico dentro de un iframe con
 * sandbox restringido, que suele bloquear un Worker de otro origen—
 * reintenta en el hilo principal (`disableWorker:true`, la opción que
 * pdf.js expone para ese caso). La caída es automática y silenciosa: la
 * persona ya está mirando una pantalla de progreso, no un error.
 *
 * pdf.js puede fallar tanto lanzando de forma síncrona al pedir el
 * documento como rechazando la promesa una vez que arrancó el worker;
 * se cubren los dos casos.
 *
 * @param {Object} pdfjsLib
 * @param {ArrayBuffer} buf
 * @returns {Promise<Object>} el documento de pdf.js
 */
function openPdfDocument(pdfjsLib, buf) {
  function intentar(extraParams) {
    var task;
    try {
      task = pdfjsLib.getDocument(Object.assign({ data: buf }, extraParams || {}));
    } catch (e) {
      return Promise.reject(e);
    }
    return task.promise;
  }
  return intentar().catch(function () {
    return intentar({ disableWorker: true });
  });
}

/**
 * Renderiza cada página de un PDF a una imagen, con pdf.js. Corre sólo
 * en el navegador: usa document.createElement("canvas") y su contexto 2D.
 *
 * pdf.js NO se importa desde acá — este módulo no agrega dependencias.
 * Se recibe ya cargado (`opts.pdfjsLib`, o `window.pdfjsLib` si la app
 * ya lo cargó globalmente con un <script> a la versión fija de cdnjs,
 * ver PDFJS_VERSION y docs/design/import-engine.md). Así el resto del
 * módulo se puede probar sin navegador, inyectando una función propia
 * en lugar de esta.
 *
 * Un PDF escaneado sin texto seleccionable se renderiza igual: pdf.js
 * dibuja la página como imagen sin importar si tiene texto debajo.
 *
 * @param {Blob} pdfBlob
 * @param {Object} [opts]
 * @param {Object} [opts.pdfjsLib] librería pdf.js ya cargada
 * @param {number} [opts.scale]    resolución del render (2 por defecto)
 * @param {string} [opts.mimeType] tipo de imagen de salida ("image/png" por defecto)
 * @returns {Promise<Blob[]>} una imagen por página, en el orden del PDF
 */
function renderPdfPagesToImages(pdfBlob, opts) {
  opts = opts || {};
  var pdfjsLib = opts.pdfjsLib || (typeof globalThis !== "undefined" && globalThis.pdfjsLib);
  if (!pdfjsLib) {
    return Promise.reject(new Error("pdfjs-no-disponible: cargá pdf.js (ver PDFJS_VERSION) antes de llamar a esta función."));
  }
  if (typeof document === "undefined") {
    return Promise.reject(new Error("renderPdfPagesToImages necesita un navegador: usa document y canvas."));
  }
  var scale = opts.scale || 2;
  var mimeType = opts.mimeType || "image/png";

  return pdfBlob.arrayBuffer()
    .then(function (buf) { return openPdfDocument(pdfjsLib, buf); })
    .then(function (pdf) {
      var paginas = [];
      for (var n = 1; n <= pdf.numPages; n++) paginas.push(n);
      // Secuencial, no en paralelo: varias páginas grandes al mismo tiempo
      // multiplican la memoria de canvas en un teléfono.
      return paginas.reduce(function (chain, n) {
        return chain.then(function (acc) {
          return pdf.getPage(n).then(function (page) {
            var viewport = page.getViewport({ scale: scale });
            var canvas = document.createElement("canvas");
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            var ctx = canvas.getContext("2d");
            return page.render({ canvasContext: ctx, viewport: viewport }).promise
              .then(function () {
                return new Promise(function (resolve) { canvas.toBlob(resolve, mimeType); });
              })
              .then(function (blob) { if (blob) acc.push(blob); return acc; });
          });
        });
      }, Promise.resolve([]));
    });
}

/* ============================================================
   LA CAPA DE TEXTO DE UN PDF — el camino principal desde la versión 2
   No toca el DOM (no hay canvas acá): sólo necesita pdf.js, que se
   recibe inyectado. Se puede probar con `node` y un pdf.js falso.
   ============================================================ */

/**
 * Pasa un `TextContent` de pdf.js a un string.
 *
 * FORMA DEL CONTRATO DE pdf.js (no de la plataforma Claude): `getTextContent()`
 * resuelve `{ items: [{ str, hasEOL, ... }], styles }`. Se lee de forma
 * defensiva —`items` que no sea array, ítems sin `str`, ítems sin `hasEOL`—
 * porque esa parte del contrato NO se pudo verificar en este entorno: el CDN
 * de pdf.js está bloqueado acá (ver la nota de integración al final del
 * archivo y docs/design/import-engine.md).
 *
 * @param {Object} tc
 * @returns {string}
 */
function textContentToString(tc) {
  if (!tc || !Array.isArray(tc.items)) return "";
  var out = "";
  tc.items.forEach(function (it) {
    if (!it) return;
    var frag = typeof it.str === "string" ? it.str : "";
    out += frag;
    if (it.hasEOL) out += "\n";
    else if (frag && !/\s$/.test(frag)) out += " ";
  });
  return out;
}

/** Deja el texto de un PDF en algo legible: sin espacios repetidos ni líneas en blanco de más. */
function tidyPdfText(texto) {
  return String(texto == null ? "" : texto)
    .replace(/\r/g, "")
    .replace(/[ \t]{2,}/g, " ")
    .replace(/ *\n */g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

/**
 * Extrae la capa de texto de un PDF, todas las páginas en orden, con pdf.js.
 *
 * pdf.js NO se importa desde acá — este módulo no agrega dependencias. Se
 * recibe ya cargado (`opts.pdfjsLib`, o `window.pdfjsLib` si la app lo cargó
 * globalmente). Usa el mismo `openPdfDocument` que el render, así que hereda
 * la caída automática al modo sin Worker.
 *
 * Un PDF escaneado devuelve `texto:""` y `paginas` con su cantidad real de
 * páginas: no es un error, es el dato de que hay que ir por imágenes.
 *
 * @param {Blob} pdfBlob
 * @param {Object} [opts]
 * @param {Object} [opts.pdfjsLib]
 * @returns {Promise<{texto:string, paginas:number, porPagina:string[]}>}
 */
function extractPdfText(pdfBlob, opts) {
  opts = opts || {};
  var pdfjsLib = opts.pdfjsLib || (typeof globalThis !== "undefined" && globalThis.pdfjsLib);
  if (!pdfjsLib) {
    return Promise.reject(new Error("pdfjs-no-disponible: cargá pdf.js (ver PDFJS_VERSION) antes de llamar a esta función."));
  }
  return Promise.resolve()
    .then(function () { return pdfBlob.arrayBuffer(); })
    .then(function (buf) { return openPdfDocument(pdfjsLib, buf); })
    .then(function (pdf) {
      var numeros = [];
      for (var n = 1; n <= pdf.numPages; n++) numeros.push(n);
      // Secuencial, igual que el render: en un teléfono no conviene abrir
      // todas las páginas a la vez.
      return numeros.reduce(function (chain, n) {
        return chain.then(function (acc) {
          return Promise.resolve(pdf.getPage(n))
            .then(function (page) { return page.getTextContent(); })
            .then(function (tc) { acc.push(tidyPdfText(textContentToString(tc))); return acc; });
        });
      }, Promise.resolve([])).then(function (porPagina) {
        if (pdf && typeof pdf.destroy === "function") { try { pdf.destroy(); } catch (e) { /* liberar memoria es mejor esfuerzo */ } }
        return {
          texto: tidyPdfText(porPagina.join("\n\n")),
          paginas: porPagina.length,
          porPagina: porPagina
        };
      });
    });
}

/* ============================================================
   EL PROMPT DE INTERPRETACIÓN
   ============================================================ */

/**
 * Las reglas del prompt, declaradas como datos. Agregar una regla es agregar
 * una entrada, no escribir código. `comunes` van siempre; `texto` e
 * `imagenes` según por dónde se leyó el archivo.
 */
var REGLAS_PROMPT = {
  comunes: [
    "Un objeto por reserva. Ida y vuelta son DOS viajes separados, cada uno con su propio número.",
    "Usá 24 horas y el formato YYYY-MM-DDTHH:mm. Las fechas pueden venir como D/M/AAAA, con el día primero: \"13/9/2026\" es el 13 de septiembre de 2026. Si el año no figura, deducilo del contexto del viaje de arriba.",
    "Si un dato no aparece con claridad en el documento, dejá \"\" en ese campo. Es preferible un campo vacío: NUNCA inventes códigos de vuelo, códigos de reserva, horarios, direcciones ni montos que no estén escritos ahí.",
    "Para alojamiento, \"start\" es el check-in y \"end\" el check-out.",
    "Un micro, colectivo, tren, ferry, combi o traslado por tierra es type \"transfer\"; un avión es \"flight\". En un transfer, \"from\" y \"to\" son el lugar de salida y el de llegada tal como están escritos, sin códigos IATA.",
    "\"boardingTime\" es la hora de embarque impresa en una tarjeta de embarque, distinta de la hora de salida. Si el documento no es una tarjeta de embarque, dejalo vacío.",
    "Si no reconocés ninguna reserva en el documento, devolvé {\"items\":[]}. Es preferible eso a inventar una.",
    "Nada de comentarios ni texto fuera del JSON."
  ],
  texto: [
    "El texto de arriba es la capa de texto del PDF, tal como está guardada: puede venir con las columnas mezcladas, con espacios de más o con una etiqueta pegada a su valor. Interpretá lo que dice; no completes lo que no está.",
    "Si aparecen dos fechas con hora, una después de la otra, lo habitual es que la primera sea la salida y la segunda la llegada. Si no podés distinguirlas con seguridad, dejá \"end\" vacío.",
    "Las condiciones, avisos legales y textos de pie de página no son datos de la reserva: ignoralos."
  ],
  imagenes: [
    "Leé todo lo que esté impreso en la imagen, incluidos los recuadros chicos y los códigos al pie.",
    "Si una parte de la imagen está borrosa o cortada, dejá vacíos los campos que dependían de esa parte en vez de adivinarlos."
  ]
};

/** El JSON que se le pide al modelo. Es el mismo, se lea por texto o por imagen. */
var FORMATO_JSON_PROMPT = [
  "Devolvé este JSON exacto:",
  '{"items":[{',
  '"type":"flight|stay|car|transfer|act|note",',
  '"title":"texto corto y humano, ej: Buenos Aires → Madrid",',
  '"start":"YYYY-MM-DDTHH:mm o vacío",',
  '"end":"YYYY-MM-DDTHH:mm o vacío",',
  '"from":"IATA de 3 letras si es vuelo, si no ciudad o lugar",',
  '"to":"idem",',
  '"provider":"aerolínea, hotel, plataforma, empresa de micro o rentadora",',
  '"flightNumber":"","confirmation":"código de reserva","seat":"","terminal":"","gate":"",',
  '"boardingTime":"HH:mm o vacío",',
  '"address":"","phone":"","cost":"","currency":"","notes":""',
  "}]}"
];

/**
 * Arma el prompt para un archivo, según cómo se lo va a mandar.
 *
 * Mejora el prompt de `sheetImport` en valija.html: agrega `boardingTime`,
 * deja explícito que varias páginas son un mismo comprobante y, desde la
 * versión 2, tiene un camino de TEXTO —el principal— además del de imágenes.
 * En los dos casos mantiene la instrucción de dejar un campo vacío antes
 * que inventarlo.
 *
 * @param {Object} [ctx]
 * @param {"texto"|"imagenes"} [ctx.modo] por dónde se leyó el archivo ("imagenes" por defecto)
 * @param {string} [ctx.texto] la capa de texto del PDF, cuando `modo` es "texto"
 * @param {Object} [ctx.trip] {name, destination, startDate, endDate}
 * @param {string} [ctx.now]  fecha ISO, para pruebas determinísticas
 * @param {string} [ctx.archivo] nombre del archivo, sólo para el mensaje
 * @param {number|null} [ctx.paginas] cantidad de páginas/imágenes de este archivo
 * @returns {string}
 */
function buildImportPrompt(ctx) {
  ctx = ctx || {};
  var modo = ctx.modo === "texto" ? "texto" : "imagenes";
  var trip = ctx.trip || {};
  var hoy = ctx.now ? String(ctx.now).slice(0, 10) : new Date().toISOString().slice(0, 10);
  var paginas = ctx.paginas;
  var nombreArchivo = ctx.archivo ? " (\"" + ctx.archivo + "\")" : "";

  var contexto = "El viaje se llama \"" + (trip.name || "") + "\"" +
    (trip.destination ? ", destino " + trip.destination : "") +
    (trip.startDate ? ", entre " + trip.startDate + " y " + (trip.endDate || "?") : "") +
    ". Hoy es " + hoy + ".";

  var encabezado, cuerpo;

  if (modo === "texto") {
    encabezado = "Extraés datos de reservas de viaje a partir del TEXTO de un comprobante y devolvés SOLO JSON, sin texto alrededor.";
    cuerpo = [
      "Abajo está el texto de un comprobante de viaje" + nombreArchivo +
        (paginas && paginas > 1 ? ", de " + paginas + " páginas, en orden" : "") +
        ": puede ser un pasaje, un voucher, una tarjeta de embarque, una reserva de hotel o un contrato de alquiler. Puede describir una reserva o varias.",
      "",
      "--- COMIENZA EL COMPROBANTE ---",
      String(ctx.texto == null ? "" : ctx.texto),
      "--- TERMINA EL COMPROBANTE ---"
    ];
  } else {
    encabezado = "Extraés datos de reservas de viaje a partir de imágenes y devolvés SOLO JSON, sin texto alrededor.";
    cuerpo = [(paginas && paginas > 1)
      ? "Las " + paginas + " imágenes adjuntas son las páginas, en orden, de un mismo comprobante" + nombreArchivo +
        ". Pueden describir una reserva o varias (por ejemplo ida y vuelta): leelas todas juntas antes de decidir cuántas hay."
      : "La imagen adjunta" + nombreArchivo + " es un comprobante de viaje: tarjeta de embarque, voucher de hotel, contrato de auto, o la captura de un mail de confirmación."];
  }

  var reglas = REGLAS_PROMPT.comunes.concat(REGLAS_PROMPT[modo] || []);
  var reglasNumeradas = reglas.map(function (r, i) { return (i + 1) + ". " + r; });

  return [encabezado, ""]
    .concat(cuerpo)
    .concat(["", "Contexto: " + contexto, ""])
    .concat(FORMATO_JSON_PROMPT)
    .concat(["", "Reglas que no se rompen:"])
    .concat(reglasNumeradas)
    .join("\n");
}

/* ============================================================
   VALIDAR LA RESPUESTA DEL MODELO
   Nunca confía: una respuesta rota, sin JSON, o con basura adentro
   se convierte en una lista vacía, no en una excepción.
   ============================================================ */

/**
 * @param {*} x un elemento de `items` en la respuesta cruda
 * @returns {Object|null} la reserva saneada, o null si no sirve
 */
function sanitizeReservation(x) {
  if (!x || typeof x !== "object") return null;
  var out = { type: RESERVATION_TYPES.indexOf(x.type) >= 0 ? x.type : "note" };
  STRING_FIELDS.forEach(function (f) {
    out[f] = typeof x[f] === "string" ? x[f].trim() : "";
  });
  // Sin título ni proveedor no hay nada que mostrarle a la persona para revisar
  // — EXCEPTO una tarjeta de embarque (VAL-42): ahí el título lo termina
  // aportando el vuelo ya cargado que se va a completar, no la tarjeta. El
  // estado 07B del diseño ("el disparador más frecuente") es justamente una
  // tarjeta sin aerolínea ni ruta legibles, sólo asiento y fecha. Alcanza con
  // algún dato que sirva para identificar o completar un vuelo: número de
  // vuelo, fecha de salida, asiento, puerta o terminal. Sin ninguno de esos
  // tampoco hay nada que mostrar, y se descarta igual.
  if (!out.title && !out.provider) {
    if (out.type !== "flight") return null;
    var tieneDatoDeVuelo = out.flightNumber || out.start || out.seat || out.gate || out.terminal;
    if (!tieneDatoDeVuelo) return null;
  }
  return out;
}

/**
 * @param {*} raw lo que devolvió `callModel`: objeto ya parseado o un string con JSON
 * @returns {Array<Object>} reservas saneadas; vacío si la respuesta es basura
 */
function parseImportResponse(raw) {
  var data = raw;
  if (typeof data === "string") {
    try { data = JSON.parse(data); } catch (e) { return []; }
  }
  if (!data || typeof data !== "object" || !Array.isArray(data.items)) return [];
  var out = [];
  data.items.forEach(function (x) {
    var r = sanitizeReservation(x);
    if (r) out.push(r);
  });
  return out;
}

   ERRORES DEL MODELO, EN MENSAJES HUMANOS

var MODEL_ERROR_MESSAGES = {
  not_granted: "La lectura automática no está habilitada en esta vista.",
  rate_limited: "Demasiados pedidos seguidos. Esperá un momento y probá de nuevo.",
  images_unavailable: MENSAJE_SIN_IMAGENES,
  image_rejected: "No pude leer esa imagen. Probá con otra foto, con más luz o sin reflejos.",
  prompt_too_large: "El documento es demasiado largo para leerlo de una vez. Probá con las páginas que tienen la reserva.",
  invalid_json: "La respuesta vino incompleta. Probá de nuevo, o cargá la reserva a mano.",

function friendlyModelError(e) {

/**

  "pdf-no-disponible": "No pude abrir el PDF en este dispositivo. Probá con una foto del comprobante.",
  "pdf-fallo": "No pude leer ese PDF. Probá con una foto del comprobante.",
  "pdf-vacio": "El PDF no tiene páginas legibles.",
  "imagenes-no-disponibles": "Esta vista no puede leer imágenes, así que una foto o una captura no se pueden interpretar acá. Subí el PDF del comprobante: si tiene texto, se lee igual. Si no, cargá la reserva a mano.",
  "pdf-escaneado-sin-imagenes": "Este PDF es un escaneo: no tiene texto adentro para leer, y esta vista no puede leer imágenes. Si tenés el comprobante original en texto (el PDF que manda la empresa, o el mail), probá con ese; si no, cargá la reserva a mano.",

function failWith(codigo) {

/* ============================================================
   INTERPRETAR UN ARCHIVO — VAL-40 / VAL-41
   Primero texto, imágenes como último recurso (ver la cabecera).
   ============================================================ */

/**
 * Intenta la capa de texto de un PDF. NUNCA rechaza: si no hay función de
 * extracción inyectada, o si se cae, devuelve texto vacío y el camino sigue
 * por imágenes, que es lo que hacía la versión 1 para todos los PDFs.
 * @returns {Promise<{texto:string, paginas:number|null, disponible:boolean, fallo:boolean}>}
 */
function extractTextFor(file, opts) {
  var vacio = { texto: "", paginas: null, disponible: false, fallo: false };
  if (typeof opts.extractPdfText !== "function") return Promise.resolve(vacio);
  return Promise.resolve()
    .then(function () { return opts.extractPdfText(file.blob, { name: file.name }); })
    .then(function (r) {
      if (typeof r === "string") r = { texto: r };
      r = r || {};
      return {
        texto: String(r.texto == null ? "" : r.texto),
        paginas: r.paginas == null ? null : r.paginas,
        disponible: true,
        fallo: false
      };
    })
    .catch(function () {
      return { texto: "", paginas: null, disponible: true, fallo: true };
    });
}

/** Renderiza el PDF a imágenes. Rechaza con un ImportError propio. */
function renderFor(file, opts) {
  if (typeof opts.renderPdfToImages !== "function") return Promise.reject(failWith("pdf-no-disponible"));
  return Promise.resolve()
    .then(function () { return opts.renderPdfToImages(file.blob, { name: file.name }); })
    .catch(function () { throw failWith("pdf-fallo"); })
    .then(function (imagenes) {
      imagenes = (imagenes || []).filter(Boolean);
      if (!imagenes.length) throw failWith("pdf-vacio");
      return { modo: "imagenes", imagenes: imagenes, paginas: imagenes.length, caracteres: null };
    });
}

/**
 * Decide CÓMO se le manda este archivo al modelo, y prepara esa entrada.
 * No llama al modelo. Éste es el corazón del cambio de la versión 2.
 *
 *   foto/captura  → imágenes, y sólo si `limits()` reporta `images`.
 *   PDF           → texto si la capa de texto alcanza; si no, imágenes
 *                   (mismo chequeo de `limits()`); si tampoco, error propio.
 *
 * @returns {Promise<{modo:"texto"|"imagenes", texto?:string, imagenes?:Array,
 *                    paginas:number|null, caracteres:number|null, nivel?:string}>}
 */
function prepareSource(file, opts, sesion) {
  var kind = fileKind(file);

  if (kind === "desconocido") return Promise.reject(failWith("tipo-no-soportado"));

  if (kind === "imagen") {
    // Una foto necesita visión: no hay camino de texto. Si sabemos que la
    // vista no acepta imágenes, se falla acá y no se gasta una llamada que
    // ya sabemos que va a ser rechazada con images_unavailable.
    return sesion.limits().then(function (l) {
      if (l.aceptaImagenes === false) throw failWith("imagenes-no-disponibles");
      return { modo: "imagenes", imagenes: [file.blob], paginas: null, caracteres: null };
    });
  }

  // PDF: primero el texto (VAL-40). Es más barato, más rápido y más exacto
  // que renderizar, y además no depende de que la vista acepte imágenes.
  return extractTextFor(file, opts).then(function (ex) {
    var normal = evaluateText(ex.texto, "normal");
    if (normal.suficiente) {
      return {
        modo: "texto",
        texto: clipText(ex.texto),
        paginas: ex.paginas,
        caracteres: normal.medida.caracteres,
        nivel: "normal"
      };
    }
    // Sin capa de texto (o con tres palabras sueltas de un pie de página):
    // recién ahora miramos si esta vista puede mandar imágenes.
    return sesion.limits().then(function (l) {
      if (l.aceptaImagenes !== false) return renderFor(file, opts);

      // No puede. Antes de darlo por perdido, si algo de texto había, se
      // manda igual: un texto flaco es mejor que no leer nada, y es la
      // única alternativa que queda.
      var ultimo = evaluateText(ex.texto, "ultimo-recurso");
      if (ultimo.suficiente) {
        return {
          modo: "texto",
          texto: clipText(ex.texto),
          paginas: ex.paginas,
          caracteres: ultimo.medida.caracteres,
          nivel: "ultimo-recurso"
        };
      }
      throw failWith("pdf-escaneado-sin-imagenes");
    });
  });
}

/** Llama al modelo con la entrada ya preparada. Nunca rechaza: degrada a un fileResult de error. */
function callModelForSource(fuente, nombre, opts) {
  var extra = { paginas: fuente.paginas, modo: fuente.modo, caracteres: fuente.caracteres };

  if (typeof opts.callModel !== "function") {
    return Promise.resolve(fileResult(nombre, "error", [], errorInfo("ia-no-disponible", ERRORES_PROPIOS["ia-no-disponible"]), extra));
  }

  var prompt = buildImportPrompt({
    trip: opts.trip, now: opts.now, archivo: nombre,
    paginas: fuente.paginas, modo: fuente.modo, texto: fuente.texto
  });

  // El segundo argumento lleva `images` SÓLO en el camino de imágenes: en el
  // de texto la clave ni aparece, así la app no manda `images: undefined` a
  // una vista que no las acepta. `modo` y `archivo` van de yapa, para que la
  // app pueda elegir tier o mostrar progreso.
  var opciones = { modo: fuente.modo, archivo: nombre, paginas: fuente.paginas };
  if (fuente.modo === "imagenes") opciones.images = fuente.imagenes;

  return Promise.resolve()
    .then(function () { return opts.callModel(prompt, opciones); })
    .then(function (raw) {
      var reservas = parseImportResponse(raw).map(function (r) { return Object.assign({}, r, { archivo: nombre }); });
      return fileResult(nombre, reservas.length ? "ok" : "vacio", reservas, null, extra);
    })
    .catch(function (e) {
      return fileResult(nombre, "error", [], friendlyModelError(e), extra);
    });
}

/**
 * Interpreta UN archivo. Nunca rechaza la promesa: cualquier falla
 * (tipo no soportado, PDF escaneado en una vista sin imágenes, modelo
 * caído, respuesta basura) se convierte en un `fileResult` con
 * `estado:"error"`. Así un archivo roto nunca invalida a los demás.
 *
 * @param {{name:string, blob:Blob, mimeType?:string}} file
 * @param {Object} opts
 * @param {Function} opts.callModel        async (prompt, {images?, modo, archivo}) => objeto o string JSON
 * @param {Function} [opts.limits]         async () => sample.limits(); sin esto no se sabe si la vista acepta imágenes y se intenta igual
 * @param {Function} [opts.extractPdfText] async (blob) => {texto, paginas}; sin esto un PDF va derecho a imágenes
 * @param {Function} [opts.renderPdfToImages] async (blob) => Blob[]; sin esto un PDF sin texto falla con dignidad
 * @param {Object}   [opts.trip]           {name, destination, startDate, endDate}
 * @param {string}   [opts.now]            fecha ISO fija, para pruebas
 * @param {Object}   [sesion]              interno: comparte la lectura de `limits` entre archivos
 * @returns {Promise<Object>} fileResult
 */
function interpretFile(file, opts, sesion) {
  opts = opts || {};
  sesion = sesion || newSession(opts);
  var nombre = (file && file.name) || "archivo";
  return prepareSource(file, opts, sesion)
    .then(function (fuente) { return callModelForSource(fuente, nombre, opts); })
    .catch(function (e) {
      if (e && e.__importError) return fileResult(nombre, "error", [], e.info, null);
      return fileResult(nombre, "error", [], errorInfo("desconocido", (e && e.message) || "No pude interpretar el archivo."), null);
    });
}

/**
 * Interpreta varios archivos a la vez (VAL-41), mezclando fotos y PDFs.
 * La promesa se resuelve siempre: cada archivo lleva su propio resultado.
 * `limits()` se consulta como mucho UNA vez por corrida, y sólo si algún
 * archivo necesita imágenes.
 *
 * @param {Array<{name:string, blob:Blob, mimeType?:string}>} files
 * @param {Object} opts ver `interpretFile`
 * @returns {Promise<{archivos:Array, reservas:Array, resumen:Object}>}
 */
function interpretFiles(files, opts) {
  opts = opts || {};
  var sesion = newSession(opts);
  files = (files || []).filter(Boolean);
  return Promise.all(files.map(function (f) { return interpretFile(f, opts, sesion); }))
    .then(function (archivos) {
      var reservas = [];
      archivos.forEach(function (a) { reservas = reservas.concat(a.reservas); });
      function cuantos(campo, valor) {
        return archivos.filter(function (a) { return a[campo] === valor; }).length;
      }
      var resumen = {
        total: archivos.length,
        ok: cuantos("estado", "ok"),
        vacios: cuantos("estado", "vacio"),
        errores: cuantos("estado", "error"),
        reservas: reservas.length,
        porTexto: cuantos("modo", "texto"),
        porImagenes: cuantos("modo", "imagenes")
      };
      return { archivos: archivos, reservas: reservas, resumen: resumen };
    });
}

/* ============================================================
   RECONOCER UN VUELO YA CARGADO — VAL-42
   ============================================================ */

/** Sólo letras y números, en mayúsculas: "JA 3040" y "ja3040" caen igual. */
function normalizeFlightNumber(fn) {
  return String(fn || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}
function flightNumberDigits(fn) {
  var m = /\d+/.exec(normalizeFlightNumber(fn));
  return m ? m[0].replace(/^0+(?=\d)/, "") : "";
}
function flightNumberLetters(fn) {
  return normalizeFlightNumber(fn).replace(/[0-9]/g, "");
}

/**
 * Dos números de vuelo son "el mismo" si comparten los mismos dígitos y
 * las letras no se contradicen. Una tarjeta de embarque a veces sólo trae
 * "3040" donde el vuelo ya cargado tiene "JA3040": igual cuentan como el
 * mismo número.
 */
function sameFlightNumber(a, b) {
  var da = flightNumberDigits(a), db = flightNumberDigits(b);
  if (!da || !db || da !== db) return false;
  var la = flightNumberLetters(a), lb = flightNumberLetters(b);
  return !la || !lb || la === lb;
}

/** Sólo la parte de fecha, YYYY-MM-DD, de un string ISO o "YYYY-MM-DD HH:mm". */
function dateOnly(s) {
  var m = /^(\d{4}-\d{2}-\d{2})/.exec(String(s || "").trim());
  return m ? m[1] : "";
}
function sameFlightDate(a, b) {
  var da = dateOnly(a), db = dateOnly(b);
  return !!da && da === db;
}

/**
 * Los campos que la tarjeta de embarque completa en el vuelo ya cargado,
 * sólo cuando el vuelo cargado los tiene vacíos. Nunca pisa un dato que
 * la persona ya había puesto.
 * @param {Object} candidato reserva interpretada, tipo "flight"
 * @param {Object} existente reserva ya cargada en el viaje
 * @returns {Object} patch parcial, listo para mostrar y para guardar
 */
function buildFlightPatch(candidato, existente) {
  var patch = {};
  CAMPOS_COMPLETABLES.forEach(function (campo) {
    var nuevo = norm(candidato && candidato[campo]);
    var actual = norm(existente && existente[campo]);
    if (nuevo && !actual) {
      patch[campo] = (campo === "boardingTime") ? nuevo : nuevo.toUpperCase();
    }
  });
  return patch;
}

/**
 * VAL-42. Decide si una reserva de vuelo interpretada es nueva, es un
 * vuelo ya cargado (y con qué se completa), o hay más de un candidato
 * y hace falta preguntar. El criterio es número de vuelo y fecha.
 *
 * Ante la duda, nunca decide. Eso incluye el caso en que la tarjeta no
 * trae número de vuelo: sin número no hay certeza, así que si la fecha
 * coincide con uno o más vuelos ya cargados, el resultado es "ambiguo"
 * con esos vuelos como candidatos — nunca "nuevo". Un duplicado
 * silencioso es peor que una pregunta: la persona pierde la confianza
 * en el importador si ve el mismo vuelo dos veces.
 *
 * Sólo es "nuevo" cuando no hay ningún vuelo cargado ese día, o cuando
 * hay número de vuelo y no coincide con ninguno de los de ese día.
 *
 * @param {Object} candidato    reserva interpretada (de `interpretFiles`)
 * @param {Array}  existentes   reservas que el viaje ya tiene
 * @returns {{resultado:"nuevo"|"mismo"|"ambiguo", motivo:string, candidato:Object,
 *            existente?:Object, patch?:Object, candidatos?:Array}}
 */
function matchFlightReservation(candidato, existentes) {
  existentes = (existentes || []).filter(Boolean);

  if (!candidato || candidato.type !== "flight") {
    return { resultado: "nuevo", motivo: "No es un vuelo.", candidato: candidato };
  }

  var numero = candidato.flightNumber;
  var fecha = dateOnly(candidato.start);

  if (!fecha) {
    return {
      resultado: "nuevo",
      motivo: "No se pudo determinar la fecha del vuelo: no hay con qué comparar, se carga como reserva nueva.",
      candidato: candidato
    };
  }

  var vuelosEseDia = existentes.filter(function (it) {
    return it && it.type === "flight" && sameFlightDate(it.start, fecha);
  });

  if (!numero) {
    if (!vuelosEseDia.length) {
      return {
        resultado: "nuevo",
        motivo: "La tarjeta no trae número de vuelo, pero no hay ningún vuelo cargado ese día: se carga como reserva nueva.",
        candidato: candidato
      };
    }
    return {
      resultado: "ambiguo",
      motivo: "La tarjeta no trae número de vuelo y hay " + vuelosEseDia.length +
        (vuelosEseDia.length === 1 ? " vuelo cargado" : " vuelos cargados") +
        " ese mismo día: sin número no hay forma de distinguir sin adivinar.",
      candidato: candidato,
      candidatos: vuelosEseDia
    };
  }

  var candidatos = vuelosEseDia.filter(function (it) { return sameFlightNumber(it.flightNumber, numero); });

  if (!candidatos.length) {
    return { resultado: "nuevo", motivo: "Ningún vuelo cargado coincide en número y fecha.", candidato: candidato };
  }

  if (candidatos.length > 1) {
    return {
      resultado: "ambiguo",
      motivo: "Hay " + candidatos.length + " vuelos cargados con el mismo número y la misma fecha.",
      candidato: candidato,
      candidatos: candidatos
    };
  }

  var existente = candidatos[0];
  return {
    resultado: "mismo",
    motivo: "Mismo número de vuelo (" + numero + ") y misma fecha (" + fecha + ").",
    candidato: candidato,
    existente: existente,
    patch: buildFlightPatch(candidato, existente)
  };
}

/**
 * Azúcar sobre `matchFlightReservation` para usar sobre cualquier reserva
 * interpretada sin fijarse antes el tipo: lo que no es vuelo siempre es
 * nuevo, porque el reconocimiento de duplicados de VAL-42 es sólo para
 * vuelos.
 * @param {Object} reserva
 * @param {Array}  existentes
 * @returns {Object} igual forma que matchFlightReservation
 */
function matchAgainstExisting(reserva, existentes) {
  if (reserva && reserva.type === "flight") return matchFlightReservation(reserva, existentes);
  return { resultado: "nuevo", motivo: "No es un vuelo: se carga como reserva nueva.", candidato: reserva };
}

/* ============================================================
   EXPORTA
   ============================================================ */
return {
  VERSION: VERSION,
  RESERVATION_TYPES: RESERVATION_TYPES,
  STRING_FIELDS: STRING_FIELDS,
  CAMPOS_COMPLETABLES: CAMPOS_COMPLETABLES,
  PDFJS_VERSION: PDFJS_VERSION,
  PDFJS_CDN_BASE: PDFJS_CDN_BASE,
  REGLAS_TEXTO_SUFICIENTE: REGLAS_TEXTO_SUFICIENTE,
  MAX_CARACTERES_TEXTO: MAX_CARACTERES_TEXTO,
  ERRORES_PROPIOS: ERRORES_PROPIOS,
  MODEL_ERROR_MESSAGES: MODEL_ERROR_MESSAGES,
  MENSAJE_SIN_IMAGENES: MENSAJE_SIN_IMAGENES,

  // Qué puede esta vista — lo que la app pregunta ANTES de dibujar la pantalla
  getViewCapabilities: getViewCapabilities,
  readViewLimits: readViewLimits,

  // VAL-40: la capa de texto de un PDF (el camino principal)
  extractPdfText: extractPdfText,
  textContentToString: textContentToString,
  tidyPdfText: tidyPdfText,
  measureText: measureText,
  evaluateText: evaluateText,
  clipText: clipText,

  // VAL-40: PDF a imágenes, último recurso (única función que toca el DOM)
  renderPdfPagesToImages: renderPdfPagesToImages,
  openPdfDocument: openPdfDocument,

  // VAL-40 / VAL-41: interpretar archivos
  fileKind: fileKind,
  buildImportPrompt: buildImportPrompt,
  parseImportResponse: parseImportResponse,
  sanitizeReservation: sanitizeReservation,
  friendlyModelError: friendlyModelError,
  interpretFile: interpretFile,
  interpretFiles: interpretFiles,

  // VAL-42: reconocer un vuelo ya cargado
  matchFlightReservation: matchFlightReservation,
  matchAgainstExisting: matchAgainstExisting,
  buildFlightPatch: buildFlightPatch,
  normalizeFlightNumber: normalizeFlightNumber,
  sameFlightNumber: sameFlightNumber,
  sameFlightDate: sameFlightDate,
  dateOnly: dateOnly
};
})();

const App = {
  view:"home", tripId:null, tab:"plan",
  /* ---------- VAL-46: el plan de actualización de la valija ----------
     Memoria, no dato del viaje: si se recarga la app se vuelve a calcular
     al guardar la próxima reserva. Ver docs/design/valija-inteligente-b.md
     § 5, puntos 3 y 6. */
  plan:null,          // lo último que devolvió planListUpdateAsync, si quedó desactualizada
  planTripId:null,    // de qué viaje es ese plan
  planDesde:null,     // huella de la lista con la que se calculó: sin esto se puede escribir una foto vieja
  planDock:false,     // resolvió con la pantalla de la valija ABIERTA -> entra por abajo (estado 16)
  planApplied:null    // {tripId, byClave:{...}} del plan que se aplicó: de acá sale "cuando agregaste el auto"
};

function readHash(){
  const h = location.hash.replace(/^#\/?/,"");
  const [a,b,c] = h.split("/");
  if(a==="trip" && b && c==="valija"){ App.view="packing"; App.tripId=b; }
  else if(a==="trip" && b){ App.view="trip"; App.tripId=b; }
  else { App.view="home"; App.tripId=null; }
}
function go(hash){ location.hash = hash; }
window.addEventListener("hashchange", ()=>{ readHash(); Store.watch(App.tripId); Store.watchPacking(App.tripId); render(); });

/* ============================================================
   RENDER
   ============================================================ */
const $hdr = document.getElementById("hdr");
const $main = document.getElementById("main");
const $fab = document.getElementById("fab");
const $pkdock = document.getElementById("pkdock");

// Con un link compartido el viaje llega desde la nube, no de este dispositivo.
// Mientras la nube no contestó no sabemos si existe, así que esperamos en vez
// de rebotar a la lista.
function tripResuelto(){ return Store.ready && (!Store.db || Store.cloudSynced); }
function esperando(){
  $main.innerHTML = `<div class="sk"></div><div class="sk"></div>`;
  $fab.innerHTML = "";
}

function render(){
  pkSyncMount();   // montar/desmontar la pantalla de la valija (limpieza de marcas, § 4.3)
  if(App.view==="trip"){
    const trip = Store.trips.get(App.tripId);
    if(!trip && tripResuelto()){ go(""); return; }
    if(!trip){ esperando(); return; }
    renderTrip(trip);
  } else if(App.view==="packing"){
    const trip = Store.trips.get(App.tripId);
    if(!trip && tripResuelto()){ go(""); return; }
    if(!trip){ esperando(); return; }
    renderPacking(trip);
  } else {
    renderHome();
  }
}

/* ---------- HOME ---------- */
function renderHome(){
  const trips = Store.tripList();
  const tema = temaGuardado();
  const badge = Store.mode==="cloud"
    ? (Store.canWrite ? `<span class="chip ok">sincronizada</span>` : `<span class="chip soon">sólo lectura</span>`)
    : `<span class="chip">en este dispositivo</span>`;

  $hdr.innerHTML = `
    <div class="hdr-row">
      <div class="brand">
        <h1>Valija</h1>
        <span class="tag">todo el viaje, un lugar</span>
      </div>
      <button class="iconbtn" id="tema" title="${esc(TEMA_INFO[tema].ayuda)}"
        aria-label="${esc(TEMA_INFO[tema].label)}. Tocá para cambiar">${svg(I[TEMA_INFO[tema].icono])}</button>
      <button class="iconbtn" id="about" title="Acerca de" aria-label="Acerca de">${svg(I.info)}</button>
    </div>
    <div class="hdr-sub">${badge}
      <span>${trips.length} ${trips.length===1?"viaje":"viajes"}</span>
    </div>`;
  document.getElementById("about").onclick = sheetAbout;
  document.getElementById("tema").onclick = ()=>{ temaCambiar(); renderHome(); };

  if(!Store.ready){ $main.innerHTML = `<div class="sk"></div><div class="sk"></div>`; $fab.innerHTML=""; return; }

  if(!trips.length){
    $main.innerHTML = `
      <div class="empty">
        <div class="ico">🧳</div>
        <h3>Tu valija está vacía</h3>
        <p>Abrí un viaje y empezá a guardar vuelos, alojamientos y autos. Podés tener todos los viajes que quieras en paralelo.</p>
      </div>`;
  } else {
    const now = new Date().toISOString().slice(0,10);
    const upcoming = trips.filter(t=> !t.endDate || t.endDate >= now);
    const past = trips.filter(t=> t.endDate && t.endDate < now);

    const section = (title, list) => !list.length ? "" : `
      <div class="stack">
        <div class="sec-head"><span class="eyebrow">${title}</span>
          <span class="eyebrow">${list.length}</span></div>
        <div class="stack">${list.map(cardTrip).join("")}</div>
      </div>`;

    $main.innerHTML = section("Próximos viajes", upcoming) + section("Ya viajados", past);
    $main.querySelectorAll("[data-trip]").forEach(el=>{
      el.onclick = ()=> go(`#/trip/${el.dataset.trip}`);
    });
  }

  $fab.innerHTML = `<div class="fab">
    <button class="btn primary block" id="newtrip">${svg(I.plus)} Nuevo viaje</button>
  </div>`;
  const nt = document.getElementById("newtrip");
  if(!Store.canWrite){ nt.disabled = true; nt.title = "Tenés acceso de sólo lectura"; }
  else nt.onclick = ()=> sheetTrip(null);
}

function cardTrip(t){
  const items = Store.itemsOf(t.id);
  const [from,to] = routeCodes(t, items);
  const pct = completeness(t, items);
  const alerts = tripAlerts(t, items);
  const crit = alerts.filter(a=>a.sev==="crit").length;
  const soon = alerts.filter(a=>a.sev==="soon").length;
  const dd = daysUntil(t.startDate);
  const ringCls = pct>=85?"":(pct>=50?"warn":"low");
  const C = 2*Math.PI*14.5;

  const chips = [];
  if(dd!==null && dd>=0 && dd<=30) chips.push(`<span class="chip live">${dd===0?"hoy":`en ${dd} d`}</span>`);
  if(crit) chips.push(`<span class="chip alert">${crit} sin completar</span>`);
  if(!crit && soon) chips.push(`<span class="chip soon">${soon} por hacer</span>`);
  if(!crit && !soon && items.length) chips.push(`<span class="chip ok">listo</span>`);
  if(items.length) chips.push(`<span class="chip">${items.length} ${items.length===1?"reserva":"reservas"}</span>`);
  if(t.sample) chips.push(`<span class="chip accent">ejemplo</span>`);

  return `
  <button class="tag-card" data-trip="${esc(t.id)}" style="--band:${bandColor(t)}">
    <div class="tag-band"><span>${esc((t.destination||t.name||"VIAJE").toUpperCase().slice(0,14))}</span></div>
    <div class="tag-body">
      <div>
        <div class="route">
          ${from?`<span class="code">${esc(from)}</span><span class="dash"></span>`:""}
          ${svg(I.planeSmall)}
          <span class="dash"></span><span class="code">${esc(to)}</span>
        </div>
      </div>
      <span class="trip-name">${esc(t.name||"Viaje sin nombre")}</span>
      <div class="tag-meta">
        <div style="min-width:0;display:flex;flex-direction:column;gap:6px">
          <span class="dates">${esc(fmtRange(t.startDate,t.endDate))}</span>
          <div class="chips">${chips.join("")}</div>
        </div>
        <div class="ring ${ringCls}" title="${pct}% completo">
          <svg viewBox="0 0 34 34">
            <circle class="bg" cx="17" cy="17" r="14.5"></circle>
            <circle class="fg" cx="17" cy="17" r="14.5"
              stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}"></circle>
          </svg>
          <b>${pct}</b>
        </div>
      </div>
    </div>
  </button>`;
}

/* ---------- tira de entrada a la valija, arriba del segmentado ---------- */
function renderPackingEntry(trip, list){
  const dd = daysUntil(trip.startDate);
  if(list){
    // 14 · la lista quedó vieja y todavía no se aplazó: la tira lo dice acá,
    // que es donde la persona está parada cuando guarda una reserva.
    // Sin lista guardada no hay nada que actualizar y la tira no cambia.
    const plan = planOfrecible(trip.id);
    if(plan){
      const n = plan.nuevos.length;
      const r = planReserva(plan);
      return `<button class="vj-entry live" id="vjentry">
        <span class="band"></span>
        <span class="bd">
          <span class="t">Valija <span class="chip soon">${n} ${n===1?"cosa nueva":"cosas nuevas"}</span></span>
          <span class="s">${esc(r ? `Agregaste ${r}` : "El viaje cambió")}</span>
        </span>
        <span class="go">${svg(I.chev)}</span>
      </button>`;
    }
    const c = PackingEngine.packingProgress(list);
    const pctPack = c.total ? c.empacados/c.total*100 : 100;
    const pctDrop = 0;
    if(c.pendientes > 0){
      return `<button class="vj-entry live" id="vjentry">
        <span class="band"></span>
        <span class="bd">
          <span class="t">Valija</span>
          <span class="pk-prog">
            <span class="pk-bar"><i class="p" style="width:${pctPack}%"></i><i class="d" style="width:${pctDrop}%"></i></span>
            <span class="n"><b>${c.empacados}</b> de ${c.total} · faltan ${c.pendientes}</span>
          </span>
        </span>
        <span class="go">${svg(I.chev)}</span>
      </button>`;
    }
    return `<button class="vj-entry done" id="vjentry">
      <span class="band"></span>
      <span class="bd">
        <span class="t">Valija lista</span>
        <span class="pk-prog full">
          <span class="pk-bar"><i class="p" style="width:${pctPack}%"></i><i class="d" style="width:${pctDrop}%"></i></span>
          <span class="n"><b>${c.empacados}</b> de ${c.total}${c.descartados?` · ${c.descartados} descartados`:""}</span>
        </span>
      </span>
      <span class="go">${svg(I.chev)}</span>
    </button>`;
  }
  if(dd!==null && dd>=0 && dd<3){
    return `<button class="vj-entry due" id="vjentry">
      <span class="band"></span>
      <span class="bd">
        <span class="t">Valija <span class="chip soon">${dd===0?"salís hoy":`salís en ${dd} ${dd===1?"día":"días"}`}</span></span>
        <span class="s">Todavía no armaste la lista</span>
      </span>
      <span class="go">${svg(I.chev)}</span>
    </button>`;
  }
  return `<button class="vj-entry" id="vjentry">
    <span class="band"></span>
    <span class="bd">
      <span class="t">Valija</span>
      <span class="s">Armá la lista de lo que llevás</span>
    </span>
    <span class="go">${svg(I.chev)}</span>
  </button>`;
}

function viewPlan(trip, items){
  if(!items.length){
    return `<div class="empty">
      <div class="ico">✈️</div>
      <h3>Todavía no hay nada cargado</h3>
      <p>Agregá el primer vuelo, o pegá el mail de confirmación en <b>Importar</b> y lo interpreto por vos.</p>
    </div>`;
  }
  // agrupar por día
  const groups = new Map();
  const undated = [];
  items.forEach(it=>{
    const k = dayKey(it.start);
    if(!k){ undated.push(it); return; }
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(it);
  });
  const keys = [...groups.keys()].sort();
  const base = trip.startDate ? dayKey(trip.startDate) : keys[0];

  let html = "";
  keys.forEach(k=>{
    const list = groups.get(k).sort((a,b)=> String(a.start||"").localeCompare(String(b.start||"")));
    const n = base ? Math.round((new Date(k)-new Date(base))/86400000)+1 : null;
    html += `<div class="day">
      <div class="day-head">
        ${n&&n>0?`<span class="day-n">Día ${n}</span>`:""}
        <span class="day-date">${esc(fmtDateLong(k))}</span>
        <span class="day-rule"></span>
      </div>
      ${list.map(it=>cardItem(it)).join("")}
    </div>`;
  });
  if(undated.length){
    html += `<div class="day">
      <div class="day-head"><span class="day-n" style="background:var(--ink-3)">Sin fecha</span><span class="day-rule"></span></div>
      ${undated.map(it=>cardItem(it)).join("")}
    </div>`;
  }
  return html;
}

function cardItem(it){
  const T = TYPES[it.type] || TYPES.note;
  const miss = missingFields(it);
  const t1 = fmtTime(it.start), t2 = fmtTime(it.end);

  // El talón muestra los datos propios del tipo de reserva.
  // Tercer valor: true = campo obligatorio, se muestra aunque esté vacío.
  let stub = [];
  if(it.type==="flight"){
    stub = [
      ["Vuelo", it.flightNumber || it.provider, true],
      ["Ruta", (it.from||it.to) ? (it.from||"—")+" → "+(it.to||"—") : "", true],
      ["Reserva", it.confirmation, true],
      ["Asiento", it.seat, false],
      ["Terminal", it.terminal, false],
      ["Puerta", it.gate, false],
      ["Embarque", it.boardingTime, false]
    ];
  } else if(it.type==="stay"){
    stub = [
      ["Alojamiento", it.provider, true],
      ["Check-in", t1 || (it.start?fmtDate(it.start):""), true],
      ["Check-out", t2 || (it.end?fmtDate(it.end):""), true],
      ["Noches", nightsBetween(it.start,it.end) || "", false],
      ["Reserva", it.confirmation, true],
      ["Dirección", it.address, true]
    ];
  } else if(it.type==="car"){
    stub = [
      ["Rentadora", it.provider, true],
      ["Retiro", it.start?fmtDate(it.start):"", true],
      ["Devolución", it.end?fmtDate(it.end):"", true],
      ["Reserva", it.confirmation, true],
      ["Lugar", it.address, true]
    ];
  } else {
    stub = [
      ["Dónde", it.address || it.to, false],
      ["Reserva", it.confirmation, false],
      ["Proveedor", it.provider, false]
    ];
  }
  stub = stub.filter(([,v,req]) => v || req);

  const cost = it.cost ? `<span class="chip">${esc(it.currency||"")} ${esc(it.cost)}</span>` : "";
  const missChip = miss.length ? `<span class="chip alert">falta ${miss.length}</span>` : "";

  const stubHtml = stub.length ? `<div class="pass-stub">${stub.map(([k,v])=>`
    <div class="field"><span class="k">${esc(k)}</span>
    <span class="v ${v?"":"miss"}">${v?esc(v):"pendiente"}</span></div>`).join("")}</div>` : "";


  return `<div class="pass">
    <button class="pass-main" data-item="${esc(it.id)}">
      <span class="pass-icon ${T.cls}">${svg(T.icon)}</span>
      <span class="pass-txt">
        <span class="pass-title">${esc(it.title || T.label)}</span>
        <span class="pass-when">${esc(T.label)}${it.provider?` · ${esc(it.provider)}`:""}</span>
        <span class="chips">${missChip}${cost}</span>
      </span>
      ${t1?`<span class="pass-time">${t1}${t2?`<small>a ${t2}</small>`:""}</span>`:""}
    </button>
    ${stubHtml}
  </div>`;
}

/* ============================================================
   VALIJA INTELIGENTE — pantalla propia (VAL-30..33)
   No es una pestaña del segmentado: `App.view==="packing"` es una
   tercera vista del router, hermana de "trip", que reusa `App.tripId`.
   Ver docs/design/valija-inteligente.md, sección 5.3.

   Estado efímero de esta pantalla, en memoria, NO en el documento
   guardado: qué categorías se abrieron/cerraron a mano, si se está
   generando, si el aviso de "recién ajustado por destino" ya se
   mostró, y el tipo de viaje elegido a mano en el selector.
   ============================================================ */
function pkEstadoInicial(tripId){
  return {
    tripId, generating:false, justEnriched:false, openCats:{}, adding:null,
    pickingType:false, selectedType:null, typeCounts:null,
    /* ---------- bloque B: las tres señales nuevas ---------- */
    applied:false,          // se acaba de aplicar un plan: aviso 18
    appliedN:0, appliedReserva:null,
    fresh:false,            // animación .fresh de llegada, una sola vez
    avisoAplazado:null,     // acuse "Ahora no" (estado 19), de una sola visita
    hideRemovals:false,     // el aviso 20 se cerró en ESTA visita (§ 4.4)
    seenNew:new Set(),      // claves de ítems nuevos ya vistos en esta visita
    visitsSinceApply:0,     // degradación sin IntersectionObserver (§ 4.3)
    io:null, ioTimers:new Map(), ioOk:(typeof IntersectionObserver === "function")
  };
}
let PK = pkEstadoInicial(null);
function resetPKIfNeeded(tripId){
  if(PK.tripId !== tripId){
    pkStopObserver();
    PK = pkEstadoInicial(tripId);
  }
}

/* ============================================================
   VAL-46 · EL PLAN DE ACTUALIZACIÓN — memoria, aplazamiento y disparo
   Ver docs/design/valija-inteligente-b.md, § 4.2 y § 5 (puntos 3 y 5).
   ============================================================ */

/** Firma del plan: qué ítems ofrece, sin importar el orden. */
function planFirma(plan){
  return ((plan && plan.nuevos) || []).map(n=>n.clave).sort().join("|");
}

/* El aplazamiento vive en ESTE dispositivo, nunca en el documento compartido:
   es una decisión personal, no del viaje, y quien mira sin permiso de edición
   también tiene que poder sacarse el aviso de encima (§ 4.2). Si localStorage
   no está disponible, vale para la sesión en memoria y listo. */
const PK_APLAZADO_MEM = new Map();
const pkAplazadoKey = tripId => `valija.pk.aplazado.${tripId}`;
function pkAplazadoDe(tripId){
  try{
    const raw = localStorage.getItem(pkAplazadoKey(tripId));
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return PK_APLAZADO_MEM.get(tripId) || null;
}
function pkGuardarAplazado(tripId, plan){
  const dato = { firma:planFirma(plan), en:new Date().toISOString() };
  PK_APLAZADO_MEM.set(tripId, dato);
  try{ localStorage.setItem(pkAplazadoKey(tripId), JSON.stringify(dato)); }catch(e){}
}
function pkOlvidarAplazado(tripId){
  PK_APLAZADO_MEM.delete(tripId);
  try{ localStorage.removeItem(pkAplazadoKey(tripId)); }catch(e){}
}
/** ¿Este plan ya se aplazó? Sólo si TODAS sus claves ya estaban en la firma
    aplazada. Una clave que no estaba vuelve a ofrecerse (§ 4.2, punto 4). */
function pkPlanAplazado(tripId, plan){
  const dato = pkAplazadoDe(tripId);
  if(!dato || !dato.firma) return false;
  const previas = new Set(String(dato.firma).split("|").filter(Boolean));
  const claves = ((plan && plan.nuevos) || []).map(n=>n.clave);
  if(!claves.length) return true;
  return claves.every(c => previas.has(c));
}

/** El plan vigente de este viaje, aplazado o no. */
function planDe(tripId){
  if(!tripId || App.planTripId !== tripId) return null;
  const p = App.plan;
  if(!p || !p.desactualizada || !p.nuevos || !p.nuevos.length || !p.listaPropuesta) return null;
  return p;
}
/** El plan que corresponde ofrecer solo: vigente y sin aplazar. */
function planOfrecible(tripId){
  const p = planDe(tripId);
  return (p && !pkPlanAplazado(tripId, p)) ? p : null;
}
/** La reserva más citable del plan, para nombrar la causa. */
function planReserva(plan){
  const con = ((plan && plan.nuevos) || []).filter(n=>n.reserva)[0];
  return con ? con.reserva : null;
}
/** Ícono de la reserva a partir de su descripción (describeReservation). */
function planReservaIcon(txt){
  const t = String(txt||"").toLowerCase();
  if(t.startsWith("el vuelo")) return "flight";
  if(t.startsWith("el alojamiento")) return "stay";
  if(t.startsWith("el auto")) return "car";
  if(t.startsWith("la actividad")) return "act";
  return "note";
}
/** El texto del aviso 15/16, con la cantidad en mono. */
function planAvisoTexto(plan){
  const n = plan.nuevos.length;
  const cant = n===1 ? `<b class="n">una</b> cosa` : `<b class="n">${n}</b> cosas`;
  const r = planReserva(plan);
  return r
    ? `Agregaste <b>${esc(r)}</b>. Tengo ${cant} para sumarle a la valija.`
    : `El viaje cambió y la lista quedó vieja. Tengo ${cant} para sumarle.`;
}

/** Ítems de la lista con propuesta de sacar todavía sin resolver. */
function pkPropuestasQuitar(list){
  return PackingEngine.itemList(list, {includeDismissed:true})
    .filter(it => it && it.sugerenciaQuitar && it.sugerenciaQuitar.motivo && it.estado !== "descartado");
}
/** Ítems marcados como nuevos. */
function pkItemsNuevos(list){
  return PackingEngine.itemList(list, {includeDismissed:true}).filter(it => it && it.nuevo);
}

/* ---------- H1 · de qué lista salió este plan ----------
   `plan.listaPropuesta` es una FOTO de la lista completa, sacada en el momento
   en que se calculó el plan. Escribirla más tarde es un `set` que pisa todo lo
   que pasó en el medio: regenerar, cambiar el tipo de viaje, agregar un ítem
   propio, o una escritura de otra persona del viaje que llegó por `onSnapshot`.

   Para no escribir nunca una foto vieja, se guarda junto al plan la huella de
   la lista sobre la que se calculó. Al aplicar, si la lista guardada ya no da
   esa misma huella, no se escribe la foto: se recalcula (§ aplicarPlan).

   La huella es TOTAL a propósito —serializa el documento entero, con las claves
   ordenadas para que no dependa del orden en que la base o localStorage las
   devuelvan—. Una huella hecha a mano con los campos que se nos ocurran hoy es
   justo el tipo de cosa que se desactualiza cuando el motor sume un campo. */
function firmaEstable(v){
  if(v === null || typeof v !== "object") return JSON.stringify(v === undefined ? null : v);
  if(Array.isArray(v)) return "[" + v.map(firmaEstable).join(",") + "]";
  return "{" + Object.keys(v).sort()
    .map(k => JSON.stringify(k) + ":" + firmaEstable(v[k])).join(",") + "}";
}

/** Deja un plan en memoria, junto con la huella de la lista de la que salió. */
function recordarPlan(tripId, plan, list){
  App.plan = plan;
  App.planTripId = tripId;
  App.planDesde = firmaEstable(list);
}

/* Borra el plan en memoria y pide que se vuelva a mirar contra la lista nueva.
   Se llama desde todo camino que reemplace la lista entera: el aviso tiene que
   desaparecer, porque lo que ofrecía ya no se corresponde con lo que hay. */
function invalidarPlan(tripId){
  if(App.planTripId === tripId){
    App.plan = null; App.planTripId = null; App.planDesde = null; App.planDock = false;
  }
  PK_RECALC_HECHO.delete(tripId);
  if(PK.tripId === tripId) PK.avisoAplazado = null;
}

/* ---------- el disparo (§ 5, punto 3) ----------
   Se llama después de que la escritura de una reserva resolvió. No en cada
   tecla: al guardar, editar o borrar. Nunca lanza y nunca bloquea la interfaz:
   sin capa de IA (claude.use devuelve null) el plan sale igual con las reglas
   y el historial, que es lo que hace planListUpdate sincrónico. */
/** Calcula el plan contra UNA lista puntual, con capa de IA si la hay.
    Devuelve el plan, o `null` si no se pudo calcular con confianza. */
async function recalcularPlanContra(trip, list){
  if(!trip || !list) return null;
  let history;
  // Si el historial no se puede leer, no se calcula: `learnFromHistory` es lo
  // que arma `aprendizaje.suprimidos`, y sin eso se volvería a ofrecer justo lo
  // que la persona ya descartó dos veces. Mejor no ofrecer que ofrecer mal.
  try{ history = await Store.packingHistory(trip.id); }catch(e){ return null; }
  let sample = null;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  const ask = sample ? (prompt)=> sample.json(prompt, { modelTier:"complex" }) : null;
  try{
    return await PackingEngine.planListUpdateAsync({
      list, trip, items: Store.itemsOf(trip.id),
      tipoViaje: list.tipoViaje, history, ask
    });
  }catch(e){ return null; }   // el motor degrada solo; si igual lanzara, la app sigue
}

async function checkPackingPlan(trip){
  if(!trip) return;
  const list = Store.packingOf(trip.id);
  if(!list) return;                       // sin lista guardada no hay nada que actualizar
  PK_RECALC_HECHO.delete(trip.id);        // este cálculo es mejor que el de entrada: vale de nuevo

  const plan = await recalcularPlanContra(trip, list);
  if(plan === null) return;               // no se pudo calcular: se deja todo como estaba

  if(!plan.desactualizada || !plan.nuevos.length){
    if(App.planTripId === trip.id){ App.plan = null; App.planTripId = null; App.planDesde = null; App.planDock = false; }
    render();
    return;
  }
  // La huella es la de `list`: la lista con la que se calculó, no la que haya
  // ahora. Entre medio pasaron dos `await` y la lista pudo cambiar.
  recordarPlan(trip.id, plan, list);
  // Un plan con una clave que no estaba en la firma aplazada vuelve a ofrecerse:
  // el acuse de "Ahora no" de esta visita ya no corresponde (§ 4.2, punto 4).
  if(PK.tripId === trip.id && !pkPlanAplazado(trip.id, plan)) PK.avisoAplazado = null;
  // Si la valija ya estaba abierta cuando resolvió, el aviso entra por abajo y
  // no corre la lista bajo el pulgar (estado 16, § 4.1).
  App.planDock = (App.view === "packing" && App.tripId === trip.id);
  render();
}

/* ---------- recálculo al ENTRAR a la pantalla de la valija ----------
   `App.plan` es memoria: al recargar la app se pierde, y sin esto la lista
   sigue vieja y no lo dice ni la tira ni el aviso. El caso normal no es raro:
   cerrar la app y volver al día siguiente, que es justo cuando alguien abre
   la valija.

   Acá va `planListUpdate` SINCRÓNICO, no el async: capas 1 y 3, sin modelo,
   sin red y sin poder fallar. La llamada al modelo se paga una sola vez, al
   guardar la reserva, que es donde vale.

   Lo único asíncrono es leer el historial, y no es opcional: `learnFromHistory`
   es lo que arma `aprendizaje.suprimidos`. Reconstruir la base sin historial
   volvería a proponer justo lo que la persona ya descartó dos veces. Si esa
   lectura falla, no se recalcula nada: es preferible no ofrecer a ofrecer mal.

   El aviso entra ARRIBA de la lista (estado 15), no por el dock: recién se
   entró a la pantalla y no hay ningún gesto en curso que proteger. */
const PK_RECALC_HECHO = new Set();

function recalcularPlanAlEntrar(tripId){
  if(PK_RECALC_HECHO.has(tripId)) return;      // ya se miró en esta sesión
  if(planDe(tripId)) return;                   // ya hay un plan en memoria, más fresco
  const trip = Store.trips.get(tripId);
  const list = Store.packingOf(tripId);
  if(!trip || !list) return;
  PK_RECALC_HECHO.add(tripId);
  Store.packingHistory(tripId).then(history=>{
    let plan;
    try{
      plan = PackingEngine.planListUpdate({
        list, trip, items: Store.itemsOf(tripId),
        tipoViaje: list.tipoViaje, history
      });
    }catch(e){ return; }                       // planListUpdate no lanza; por las dudas
    if(!plan || !plan.desactualizada || !plan.nuevos.length) return;
    if(planDe(tripId)) return;                 // llegó uno mejor mientras leíamos el historial
    if(Store.packingOf(tripId) !== list){
      // La lista cambió mientras leíamos el historial: este plan salió de una
      // foto que ya no existe y no se ofrece. Se suelta la marca para que el
      // próximo render lo vuelva a intentar contra la lista buena; si no, el
      // recálculo se perdería para toda la sesión.
      PK_RECALC_HECHO.delete(tripId);
      return;
    }
    recordarPlan(tripId, plan, list);
    App.planDock = false;
    render();
  }).catch(()=>{ PK_RECALC_HECHO.delete(tripId); });
}

/* ============================================================
   MONTAJE Y DESMONTAJE DE LA PANTALLA DE LA VALIJA
   Es donde se limpian las marcas de "nuevo" (§ 4.3): al SALIR, y sólo
   si todos los ítems marcados quedaron vistos en esta visita.
   ============================================================ */
const PKMount = { tripId:null };

function pkSyncMount(){
  const destino = (App.view === "packing") ? App.tripId : null;
  if(PKMount.tripId === destino) return;
  const saliendo = PKMount.tripId;
  // Se marca el destino ANTES de desmontar: pkUnmount puede escribir, y esa
  // escritura emite y vuelve a llamar a render(). Sin esto la reentrada
  // volvería a intentar el mismo desmontaje.
  PKMount.tripId = destino;
  if(saliendo) pkUnmount(saliendo);
  if(destino) pkMount(destino);
  else if($pkdock){ $pkdock.dataset.firma = ""; $pkdock.innerHTML = ""; }
}

function pkMount(tripId){
  resetPKIfNeeded(tripId);
  // lo que vale por visita se reinicia acá, aunque el viaje sea el mismo
  PK.avisoAplazado = null;
  PK.hideRemovals = false;
  PK.seenNew = new Set();
  App.planDock = false;   // al entrar de nuevo, el aviso vuelve a su lugar de arriba
  const list = Store.packingOf(tripId);
  if(list && pkItemsNuevos(list).length) PK.visitsSinceApply++;
}

function pkUnmount(tripId){
  pkStopObserver();
  if(!Store.canWrite) return;              // quien mira no escribe (estado 24)
  const list = Store.packingOf(tripId);
  if(!list) return;
  const nuevos = pkItemsNuevos(list);
  if(!nuevos.length) return;
  const todosVistos = PK.ioOk
    ? nuevos.every(it => PK.seenNew.has(it.clave))
    : (PK.visitsSinceApply >= 2);          // degradación declarada (§ 4.3)
  if(!todosVistos) return;                 // alguno quedó sin mirar: la marca espera
  const limpia = PackingEngine.clearNewFlags(list);
  if(limpia === list) return;
  // Idempotente: si la escritura falla, los flags quedan y se reintenta al salir de nuevo.
  Promise.resolve(Store.savePacking(tripId, limpia)).catch(()=>{});
}

/* Cerrar la pestaña también es salir de la pantalla. */
window.addEventListener("pagehide", ()=>{ if(PKMount.tripId) pkUnmount(PKMount.tripId); });

/* ---------- "visto" por permanencia en pantalla (§ 4.3) ---------- */
function pkStopObserver(){
  if(PK.io){ try{ PK.io.disconnect(); }catch(e){} PK.io = null; }
  if(PK.ioTimers){ PK.ioTimers.forEach(t=>clearTimeout(t)); PK.ioTimers.clear(); }
}
function pkObserveNew(main){
  pkStopObserver();
  if(!Store.canWrite || !PK.ioOk) return;
  // Dos cosas cuentan como "lo vio":
  //   · la fila del ítem nuevo, cuando la categoría está abierta;
  //   · el encabezado de una categoría PLEGADA con su chip "N nuevos", que es
  //     lo único que se puede ver de esos ítems sin abrirla. Ver que hay dos
  //     cosas nuevas en Documentación y elegir no abrirla es información
  //     recibida y una decisión tomada; tratarla como "todavía no se enteró"
  //     es no escuchar (§ 4.3).
  const objetivos = main.querySelectorAll(".pk-row.is-new[data-row], .pk-cat-hd[data-newclaves]");
  if(!objetivos.length) return;
  const clavesDe = el => el.dataset.newclaves
    ? el.dataset.newclaves.split(" ").filter(Boolean)
    : (el.dataset.row ? [el.dataset.row] : []);
  const io = new IntersectionObserver(entradas=>{
    entradas.forEach(en=>{
      const claves = clavesDe(en.target);
      if(!claves.length) return;
      const id = claves.join(" ");
      if(en.isIntersecting){
        if(PK.ioTimers.has(id)) return;
        PK.ioTimers.set(id, setTimeout(()=>{
          PK.ioTimers.delete(id);
          claves.forEach(c=> PK.seenNew.add(c));
        }, 600));
      }else{
        const t = PK.ioTimers.get(id);
        if(t){ clearTimeout(t); PK.ioTimers.delete(id); }
      }
    });
  }, { threshold:0.6 });
  objetivos.forEach(el=> io.observe(el));
  PK.io = io;
}
/** Actuar sobre un ítem o abrir su hoja también es haberlo mirado. */
function pkMarcarVisto(clave){ if(clave) PK.seenNew.add(clave); }

function pkProgHtml(list){
  const c = PackingEngine.packingProgress(list);
  const pctPack = c.total ? c.empacados/c.total*100 : 100;
  const full = c.total>0 ? c.pendientes===0 : c.descartados>0;
  const text = full
    ? `<b>${c.empacados}</b> de ${c.total}${c.descartados?` · ${c.descartados} descartados`:""}`
    : `<b>${c.empacados}</b> de ${c.total} · faltan ${c.pendientes}`;
  return `<span class="pk-prog ${full?"full":""}" role="progressbar" aria-valuemin="0" aria-valuemax="${c.total}"
      aria-valuenow="${c.empacados}" aria-valuetext="${c.empacados} de ${c.total} empacados${c.descartados?`, ${c.descartados} descartados`:""}">
    <span class="pk-bar"><i class="p" style="width:${pctPack}%"></i></span>
    <span class="n">${text}</span>
  </span>`;
}

function pkRowHtml(it, trip, canWrite){
  const ST_MAP = {pendiente:"pend", empacado:"pack", descartado:"drop"};
  const st = ST_MAP[it.estado] || "pend";
  const drop = st === "drop";
  const src = srcChip(it, trip);
  const stateIcon = st==="drop" ? svg(I.dash) : (st==="pack" || canWrite) ? svg(I.check) : "";
  // 18 · la marca de ítem nuevo: barra ámbar al filo (sin costo de layout) más
  // la palabra "nuevo" en mono, que es lo que se lee con lector de pantalla.
  const esNuevo = !!it.nuevo && !drop;
  const nuevoTag = esNuevo ? `<span class="pk-newtag">nuevo</span>` : "";
  // 20 · la propuesta de sacar: la ÚNICA marca es el círculo de descartar
  // teñido. La fila no crece ni una línea y el motivo original queda intacto.
  const sug = (!drop && it.sugerenciaQuitar && it.sugerenciaQuitar.motivo) ? it.sugerenciaQuitar : null;
  const cls = `pk-row${esNuevo?" is-new":""}${(esNuevo && PK.fresh)?" fresh":""}`;
  const why = drop ? "" : `<span class="pk-why">${nuevoTag}<span class="${src.cls}">${esc(src.tx)}</span>${it.motivo?`<span class="r">${esc(it.motivo)}</span>`:""}</span>`;
  const nm = `<span class="pk-nm"><span class="t">${esc(it.nombre)}</span>${it.cantidad?`<span class="q">×${esc(it.cantidad)}</span>`:""}</span>`;

  if(!canWrite){
    // Sin permiso no hay botón de descartar, así que la propuesta de sacar no
    // tiene dónde marcarse: se lee entera en la hoja del ítem (estado 24).
    return `<div class="${cls}" data-st="${st}">
      <span class="pk-slide">
        <span class="pk-mark" style="cursor:default"><span class="pk-state">${stateIcon}</span></span>
        <span class="pk-txt" style="cursor:default;padding-right:14px">${nm}${why}</span>
      </span>
    </div>`;
  }
  const dropLabel = `Descartar ${it.nombre}.${sug?` Te propongo sacarlo: ${sug.motivo}`:""}`;
  return `<div class="${cls}" data-st="${st}" data-row="${esc(it.clave)}">
    <span class="pk-swipe">${svg(I.ban)} Descartar</span>
    <span class="pk-slide">
      <button class="pk-mark" data-mark="${esc(it.clave)}"
              aria-label="${esNuevo?"Nuevo. ":""}${esc(it.nombre)}: ${esc(it.estado)}. ${drop?"Volver a la lista":"Marcar como empacado"}">
        <span class="pk-state">${stateIcon}</span>
      </button>
      <button class="pk-txt" data-detail="${esc(it.clave)}">${nm}${why}</button>
      ${drop
        ? `<button class="pk-back" data-mark="${esc(it.clave)}">volver</button>`
        : `<button class="pk-drop${sug?" sug":""}" data-dropbtn="${esc(it.clave)}" aria-label="${esc(dropLabel)}">${svg(I.ban)}</button>`}
    </span>
  </div>`;
}

function pkCategoryHtml(cat, trip, canWrite){
  const pend = cat.items.filter(i=>i.estado==="pendiente").length;
  const packed = cat.items.filter(i=>i.estado==="empacado").length;
  const dropped = cat.items.filter(i=>i.estado==="descartado").length;
  const full = cat.items.length>0 && pend===0;
  const nuevos = cat.items.filter(i=>i.nuevo && i.estado!=="descartado").length;
  // Una categoría sin pendientes se pliega sola, salvo que tenga algo
  // descartado: ahí sigue habiendo algo que mirar (el botón "volver").
  // Una categoría con ítems nuevos se abre sola, PERO si la persona la plegó a
  // mano manda ella: reabrirla porque el sistema decidió que tiene que mirar
  // algo es exactamente lo que hace que una app se sienta impertinente.
  // El agujero que eso deja —una fila plegada nunca entra en la ventana visible
  // y su marca no se limpiaría jamás— lo cierra el chip: si el "N nuevos" del
  // encabezado estuvo a la vista, los ítems de adentro cuentan como vistos
  // (§ 4.3, ver pkObserveNew).
  const open = PK.openCats[cat.key] !== undefined ? PK.openCats[cat.key] : (nuevos>0 || !full || dropped>0);
  const icon = CAT_ICON[cat.key] || "doc";
  // El chip es el localizador grueso: sin él, tres filas ámbar en cuarenta
  // ítems se encuentran scrolleando a ciegas. Se ve también plegada.
  const chipNuevos = nuevos ? ` <span class="chip soon">${nuevos} ${nuevos===1?"nuevo":"nuevos"}</span>` : "";
  // Claves de los ítems nuevos que quedan tapados con la categoría plegada:
  // son los que el chip representa, y los que se dan por vistos con él.
  const tapadas = (!open && nuevos)
    ? cat.items.filter(i=>i.nuevo && i.estado!=="descartado").map(i=>i.clave).join(" ")
    : "";
  return `<div class="pk-cat ${full?"full":""}" data-open="${open}">
    <button class="pk-cat-hd" aria-expanded="${open}" data-cat="${esc(cat.key)}"${tapadas?` data-newclaves="${esc(tapadas)}"`:""}>
      <span class="pk-cat-ico">${svg(I[icon])}</span>
      <span class="nm">${esc(cat.label)}</span>
      <span class="cnt">${full?`<span class="chip ok">listo</span>`:`${packed} de ${cat.items.length - dropped}`}${chipNuevos}</span>
      ${svg(I.chevd,"chev")}
    </button>
    <div class="pk-body-wrap">
      ${cat.items.map(it=>pkRowHtml(it,trip,canWrite)).join("")}
      ${canWrite ? (PK.adding===cat.key
        ? `<div class="pk-addform">
             <input id="pk-add-${esc(cat.key)}" placeholder="Qué te falta" autocomplete="off">
             <button class="btn primary sm" data-pksave="${esc(cat.key)}">Agregar</button>
           </div>`
        : `<button class="pk-add" data-pkadd="${esc(cat.key)}">${svg(I.plus)} Agregar a ${esc(cat.label.toLowerCase())}</button>`) : ""}
    </div>
  </div>`;
}

/* ---------- generar / regenerar ---------- */
async function runGenerate(trip, tipoViaje, previous){
  // Armar, rehacer o cambiar el tipo reemplaza la lista entera: el plan que
  // hubiera pendiente ofrecía cosas de una lista que ya no existe. Se tira acá
  // y se recalcula solo contra la lista nueva (H1, capa 1). Los tres caminos
  // ("Armar la lista", "Rehacer la lista", "Usar este tipo") pasan por acá.
  invalidarPlan(trip.id);
  const items = Store.itemsOf(trip.id);
  let history = [];
  try{ history = await Store.packingHistory(trip.id); }catch(e){ history = []; }
  const base = PackingEngine.buildPackingList({ trip, items, tipoViaje, history });
  const interim = previous ? PackingEngine.mergeLists(previous, base) : base;

  if(PK.tripId === trip.id) PK.generating = true;
  try{ await Store.savePacking(trip.id, interim); }
  catch(e){
    toast(writeErr(e), true);
    if(PK.tripId === trip.id){ PK.generating = false; render(); }
    return;
  }
  if(PK.tripId === trip.id) render();

  let sample = null;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  const ask = sample ? (prompt) => sample.json(prompt, { modelTier:"complex" }) : null;

  let enriched;
  try{ enriched = await PackingEngine.enrichWithDestination(base, ask); }
  catch(e){ enriched = base; }

  // Mezclamos contra lo que haya guardado AHORA (no contra `interim` de más
  // arriba): si mientras la IA respondía la persona ya marcó o descartó algo,
  // esa acción no se pierde al guardar el resultado final.
  const latest = Store.packingOf(trip.id) || interim;
  const final = PackingEngine.mergeLists(latest, enriched);

  if(PK.tripId === trip.id){
    PK.generating = false;
    PK.justEnriched = !!(final.capaInteligente && final.capaInteligente.estado === "ok");
  }
  try{ await Store.savePacking(trip.id, final); }
  catch(e){ toast(writeErr(e), true); }
  // Otra vez al final: entre las dos escrituras se pudo recalcular contra la
  // lista intermedia. Lo que valga se recalcula contra ESTA, que es la buena.
  invalidarPlan(trip.id);
  if(PK.tripId === trip.id) render();
}

async function applyItemState(trip, list, clave, estado){
  PK.justEnriched = false;   // tocar un ítem también da por leído el aviso de ajuste por destino
  try{
    const patch = PackingEngine.stateUpdatePatch(clave, estado);
    await Store.savePackingPatch(trip.id, patch);
  }catch(e){ toast(writeErr(e), true); }
}

function bindPackingRows(main, trip, list, canWrite){
  main.querySelectorAll("[data-cat]").forEach(b=>{
    b.onclick = ()=>{
      const catEl = b.parentElement;
      PK.openCats[b.dataset.cat] = catEl.dataset.open !== "true";
      render();
    };
  });

  if(!canWrite) return;

  main.querySelectorAll("[data-mark]").forEach(b=> b.onclick = ()=>{
    const clave = b.dataset.mark, it = list.items[clave]; if(!it) return;
    delete PK.openCats[it.categoria];
    pkMarcarVisto(clave);   // actuar sobre un ítem es la prueba más fuerte de haberlo mirado
    const next = it.estado === "pendiente" ? "empacado" : "pendiente";
    applyItemState(trip, list, clave, next);
  });
  main.querySelectorAll("[data-dropbtn]").forEach(b=> b.onclick = ()=>{
    const clave = b.dataset.dropbtn, it = list.items[clave]; if(!it) return;
    delete PK.openCats[it.categoria];
    pkMarcarVisto(clave);
    // El círculo teñido ES la aceptación de la propuesta: descartar y borrar la
    // sugerencia van en la MISMA escritura (§ 4.4).
    if(it.sugerenciaQuitar) aceptarQuitar(trip, clave);
    else applyItemState(trip, list, clave, "descartado");
  });
  main.querySelectorAll("[data-detail]").forEach(b=> b.onclick = ()=>{
    sheetPackingItem(trip, list, b.dataset.detail);
  });
  main.querySelectorAll("[data-pkadd]").forEach(b=> b.onclick = ()=>{
    PK.adding = b.dataset.pkadd; render();
    setTimeout(()=> document.getElementById("pk-add-"+PK.adding)?.focus(), 0);
  });
  main.querySelectorAll("[data-pksave]").forEach(b=> b.onclick = async ()=>{
    const cat = b.dataset.pksave;
    const inp = document.getElementById("pk-add-"+cat);
    const nombre = (inp.value||"").trim();
    PK.adding = null;
    if(!nombre){ render(); return; }
    const updated = PackingEngine.addManualItem(list, {nombre, categoria:cat});
    try{ await Store.savePacking(trip.id, updated); }
    catch(e){ toast(writeErr(e), true); render(); }
  });
  main.querySelectorAll(".pk-addform input").forEach(inp=>{
    inp.onkeydown = e=>{
      if(e.key==="Enter") main.querySelector("[data-pksave]")?.click();
      if(e.key==="Escape"){ PK.adding=null; render(); }
    };
  });

  /* deslizar: izquierda descarta, derecha marca/desmarca. Sin puntería. */
  main.querySelectorAll(".pk-row[data-row]").forEach(row=>{
    const slide = row.querySelector(".pk-slide");
    let x0=null, dx=0;
    row.addEventListener("pointerdown", e=>{
      if(e.pointerType==="mouse" && e.button!==0) return;
      x0 = e.clientX; dx = 0; slide.style.transition = "none";
    });
    row.addEventListener("pointermove", e=>{
      if(x0===null) return;
      dx = e.clientX - x0;
      if(Math.abs(dx) > 6) slide.style.transform = `translateX(${Math.max(-120, Math.min(120, dx))}px)`;
    });
    const end = ()=>{
      if(x0===null) return;
      slide.style.transition = ""; slide.style.transform = "";
      const clave = row.dataset.row, it = list.items[clave];
      const localDx = dx; x0 = null; dx = 0;
      if(!it) return;
      if(localDx < -70){
        delete PK.openCats[it.categoria]; pkMarcarVisto(clave);
        // deslizar a la izquierda es el mismo descarte que el círculo: si hay
        // propuesta, también la resuelve en la misma escritura (§ 4.4)
        if(it.sugerenciaQuitar) aceptarQuitar(trip, clave);
        else applyItemState(trip, list, clave, "descartado");
      }
      else if(localDx > 70){ delete PK.openCats[it.categoria]; pkMarcarVisto(clave); applyItemState(trip, list, clave, it.estado==="empacado" ? "pendiente" : "empacado"); }
    };
    row.addEventListener("pointerup", end);
    row.addEventListener("pointercancel", end);
    row.addEventListener("pointerleave", end);
    row.addEventListener("click", e=>{ if(Math.abs(dx) > 10){ e.preventDefault(); e.stopPropagation(); } }, true);
  });
}
