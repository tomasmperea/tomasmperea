/* ============================================================
   VAL-46 · HOJA "LO QUE LE SUMO A LA VALIJA" (estado 17)
   Agrupada por la reserva que motivó cada ítem, no por categoría: la
   pregunta que se está haciendo la persona no es "qué me agregás" sino
   "por qué me agregás algo ahora". El encabezado es la respuesta.
   ============================================================ */

/** "el auto (Europcar)" -> "del auto (Europcar)"; "la actividad X" -> "de la actividad X". */
function pkDeReserva(txt){
  const t = String(txt||"");
  return /^el\s/i.test(t) ? ("del " + t.slice(3)) : ("de " + t);
}

function planGrupos(plan){
  const grupos = [];
  const porReserva = new Map();
  const viajeEntero = [], historial = [];
  plan.nuevos.forEach(n=>{
    if(n.reserva){
      if(!porReserva.has(n.reserva)) porReserva.set(n.reserva, []);
      porReserva.get(n.reserva).push(n);
    }else if(n.origen === "historial") historial.push(n);
    // Los ítems de origen "destino" no traen `reserva` (límite documentado del
    // motor, § 7 de packing-engine.md): para ellos la cita del dato concreto
    // está adentro del texto del motivo, que por eso se muestra entero.
    else viajeEntero.push(n);
  });
  porReserva.forEach((its, reserva)=> grupos.push({
    hd:`Porque agregaste <b>${esc(reserva)}</b>`, ico:planReservaIcon(reserva), its
  }));
  if(viajeEntero.length){
    const r = planReserva(plan);
    grupos.push({
      hd: r ? `Mirando el viaje entero, con ${esc(r)} adentro` : "Mirando el viaje entero",
      ico:"globe", its:viajeEntero
    });
  }
  if(historial.length) grupos.push({ hd:"Porque lo llevaste en viajes parecidos", ico:"spark", its:historial });
  return grupos;
}

function sheetPackingPlan(trip, plan){
  const {suma, saca} = planCuentas(plan);
  const items = (plan.listaPropuesta && plan.listaPropuesta.items) || {};

  /* VAL-75 · LO QUE SE SACA SE MUESTRA. El PM pidió que las sugerencias del
     destino viejo se vayan, no que se propongan — pero irse en silencio y
     irse son cosas distintas: una lista que cambia sola sin decir qué cambió
     es la app decidiendo a escondidas. Se listan con su motivo viejo, que es
     lo que explica por qué ya no van.
     Nunca aparece acá nada que la persona haya tocado: `mergeLists` retiene
     lo empacado, lo descartado y lo que agregó a mano, así que lo que llega
     a esta lista es sólo lo que sugirió la app y nadie marcó. */
  const bloqueSaca = saca ? `
    <div class="pk-plan-g">
      <div class="pk-plan-hd">${svg(I.info)}<span><b>Saco ${saca === 1 ? "esto" : "estas " + saca + " cosas"}</b>, que ya no ${saca === 1 ? "corresponde" : "corresponden"}</span></div>
      ${(plan.sacados || []).map(it=>`
        <div class="pk-plan-it">
          <span class="ic">${svg(I[CAT_ICON[it.categoria] || "doc"])}</span>
          <span class="bd">
            <span class="nm">${esc(it.nombre)}</span>
            ${it.porDestino?`<span class="r">Lo había sugerido por ${esc(it.porDestino)}.</span>`
                           :(it.motivo?`<span class="r">${esc(it.motivo)}</span>`:"")}
          </span>
        </div>`).join("")}
    </div>` : "";

  const body = `
    <div class="pk-plan">
      ${bloqueSaca}
      ${planGrupos(plan).map(g=>`
        <div class="pk-plan-g">
          <div class="pk-plan-hd">${svg(I[g.ico] || I.note)}<span>${g.hd}</span></div>
          ${g.its.map(it=>{
            const guardado = items[it.clave] || {};
            return `<div class="pk-plan-it">
              <span class="ic">${svg(I[CAT_ICON[it.categoria] || "doc"])}</span>
              <span class="bd">
                <span class="nm">${esc(it.nombre)}${guardado.cantidad?`<span class="q">×${esc(guardado.cantidad)}</span>`:""}</span>
                ${it.motivo?`<span class="r">${esc(it.motivo)}</span>`:""}
              </span>
            </div>`;
          }).join("")}
        </div>`).join("")}
    </div>
    <p class="tiny muted" style="margin:0;line-height:1.55">Nada de lo que ya marcaste se toca: lo empacado sigue empacado, lo descartado no vuelve, y lo que pusiste vos se queda. ${saca?"Lo que saco es sólo lo que había sugerido yo y no llegaste a marcar. ":""}Si alguna no va, la descartás de la lista con un toque y aprendo para la próxima.</p>`;

  openSheet(saca && !suma ? "Lo que saco de la valija"
                          : (saca ? "Lo que cambio en la valija" : "Lo que le sumo a la valija"),
    body, Store.canWrite
    ? `<button class="btn ghost" id="pk-plan-later">Ahora no</button>
       <button class="btn primary" id="pk-plan-apply">${esc(planVerbo(plan))}</button>`
    : `<button class="btn block" id="cancel">Cerrar</button>`);

  const cancel = document.getElementById("cancel");
  if(cancel) cancel.onclick = closeSheet;
  const later = document.getElementById("pk-plan-later");
  if(later) later.onclick = ()=> aplazarPlan(trip, plan);
  const apply = document.getElementById("pk-plan-apply");
  if(apply) apply.onclick = ()=> aplicarPlan(trip, plan);
}

/* ---------- 18 · aplicar ----------
   Un único `set` con la lista completa que devuelve el motor, PERO nunca con
   la foto vieja (H1). Antes de escribir se revalida contra lo que hay guardado
   en este instante:

     · la lista da la misma huella que cuando se calculó el plan
         -> se escribe `plan.listaPropuesta`, que es exactamente lo que se
            mostró en la hoja, con la capa de IA incluida;
     · la lista cambió (se rehizo, cambió el tipo, se agregó un ítem propio,
       escribió otra persona del viaje)
         -> se recalcula contra la lista de AHORA. Si ofrece los mismos ítems
            que se mostraron, se escribe la propuesta nueva —que ya contiene
            todo lo que pasó en el medio—; si ofrece otra cosa, NO se escribe
            nada y se le muestra el plan actualizado para que decida sobre eso.

   La huella hace el trabajo que no puede hacer una lista de caminos a
   invalidar: detecta también los cambios que no pasaron por ningún código
   nuestro, como el snapshot de otra persona del viaje. */
async function aplicarPlan(trip, plan){
  if(!Store.canWrite) return;
  const btn = document.getElementById("pk-plan-apply");
  const soltarBoton = ()=>{ if(btn){ btn.disabled = false; btn.textContent = planVerbo(plan); } };
  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Actualizando…`; }

  const actual = Store.packingOf(trip.id);
  if(!actual){
    toast("No encontré la lista de este viaje. Probá de nuevo.", true);
    soltarBoton(); return;
  }

  // `aplicado` es el plan que de verdad se escribe: puede no ser el mismo
  // objeto que se mostró, y de él salen la confirmación y la línea "cuándo
  // llegó" de la hoja 23, para que digan lo que se guardó y no lo que se vio.
  let aplicado = null;
  if(App.planTripId === trip.id && App.planDesde && App.planDesde === firmaEstable(actual)){
    aplicado = plan;                                 // nada cambió: es la misma lista
  }else{
    const fresco = await recalcularPlanContra(trip, actual);
    if(!fresco){
      toast("No pude comprobar la lista antes de cambiarla. Probá de nuevo.", true);
      soltarBoton(); return;
    }
    if(planFirma(fresco) === planFirma(plan) && fresco.listaPropuesta){
      aplicado = fresco;                             // mismo ofrecimiento, sobre la lista nueva
    }else{
      // Nada se escribe. Se le muestra lo que corresponde ahora.
      /* `planCuentas(...).total` y no `fresco.nuevos.length`: acá también
         un plan puede ser sólo sacar, y preguntando por lo que suma se
         tiraba justo el caso que VAL-75 vino a arreglar. */
      if(fresco.desactualizada && planCuentas(fresco).total){
        recordarPlan(trip.id, fresco, actual);
        App.planDock = false;
        PK_RECALC_HECHO.add(trip.id);
        sheetPackingPlan(trip, fresco);
        toast("La lista cambió mientras tanto. Esto es lo que le cambio ahora.");
      }else{
        invalidarPlan(trip.id);
        PK_RECALC_HECHO.add(trip.id);
        closeSheet();
        toast("La lista ya está al día: no quedó nada para cambiar.");
      }
      render();
      return;
    }
  }

  try{
    await Store.savePacking(trip.id, aplicado.listaPropuesta);
  }catch(e){
    // La hoja NO se cierra: nada se aplicó a medias, el motor devuelve el
    // documento entero y se guarda de una sola vez.
    toast("No se pudo guardar. Fijate la conexión y probá de nuevo.", true);
    soltarBoton();
    return;
  }
  // De acá sale la línea "cuando agregaste el auto (Europcar)" de la hoja 23.
  // Es memoria: si se pierde, la hoja muestra sólo el motivo, que ya está en el ítem.
  App.planApplied = { tripId:trip.id, byClave:{} };
  aplicado.nuevos.forEach(x=>{ App.planApplied.byClave[x.clave] = x; });
  App.plan = null; App.planTripId = null; App.planDesde = null; App.planDock = false;
  pkOlvidarAplazado(trip.id);
  if(PK.tripId === trip.id){
    PK.applied = true; PK.appliedN = aplicado.nuevos.length; PK.appliedReserva = planReserva(aplicado);
    PK.appliedSaca = planCuentas(aplicado).saca;
    PK.avisoAplazado = null;
    PK.fresh = true;                 // la animación de llegada, una sola vez
    PK.visitsSinceApply = 1;
    PK.seenNew = new Set();
    setTimeout(()=>{ if(PK.tripId === trip.id) PK.fresh = false; }, 2700);
  }
  closeSheet();
  /* El cartel verde de la valija cuenta lo que LLEGÓ, y se muestra sólo si
     hay ítems nuevos marcados. Un plan que sólo saca no deja ninguno, así
     que sin esto la hoja se cierra y nada dice qué pasó. */
  const saco = planCuentas(aplicado).saca;
  if(saco && !planCuentas(aplicado).suma)
    toast(saco === 1 ? "Saqué 1 cosa que ya no correspondía"
                     : `Saqué ${saco} cosas que ya no correspondían`);
  render();
}

/** 19 · aplazar: no descarta el plan, lo saca de la vista. Queda en la hoja 12. */
function aplazarPlan(trip, plan){
  pkGuardarAplazado(trip.id, plan);
  if(PK.tripId === trip.id) PK.avisoAplazado = plan;
  App.planDock = false;
  closeSheet();
  render();
}

/** "Listo, ya las vi" y cerrar la confirmación: cerrarla ES confirmar (§ 4.3). */
async function pkDarPorVistas(trip){
  PK.applied = false;
  const list = Store.packingOf(trip.id);
  if(Store.canWrite && list){
    const limpia = PackingEngine.clearNewFlags(list);
    if(limpia !== list){
      PK.seenNew = new Set();
      try{ await Store.savePacking(trip.id, limpia); }
      catch(e){ toast("No se pudo guardar. Fijate la conexión y probá de nuevo.", true); }
    }
  }
  render();
}

/* ============================================================
   VAL-43 · HOJA "LO QUE CAPAZ NO NECESITÁS" (estado 21)
   Se resuelven de a una y en cualquier orden. Aceptar es el descarte de
   siempre; rechazar borra sólo la propuesta. Las dos escrituras de
   aceptar van juntas (§ 4.4).
   ============================================================ */

/** Aceptar: dismissItem + clearRemovalSuggestion, SIEMPRE en la misma escritura. */
async function aceptarQuitar(trip, clave){
  if(!Store.canWrite) return false;
  const list = Store.packingOf(trip.id);
  if(!list || !list.items || !list.items[clave]) return false;
  PK.justEnriched = false;
  let l = PackingEngine.dismissItem(list, clave);
  l = PackingEngine.clearRemovalSuggestion(l, clave);
  try{ await Store.savePacking(trip.id, l); return true; }
  catch(e){ toast("No se pudo guardar. Fijate la conexión y probá de nuevo.", true); return false; }
}
/** Rechazar: sólo clearRemovalSuggestion. El ítem no se toca. */
async function rechazarQuitar(trip, clave){
  if(!Store.canWrite) return false;
  const list = Store.packingOf(trip.id);
  if(!list || !list.items || !list.items[clave]) return false;
  const l = PackingEngine.clearRemovalSuggestion(list, clave);
  try{ await Store.savePacking(trip.id, l); return true; }
  catch(e){ toast("No se pudo guardar. Fijate la conexión y probá de nuevo.", true); return false; }
}

function sheetPackingRemovals(trip){
  const canWrite = Store.canWrite;
  const lista = Store.packingOf(trip.id);
  // Se congela lo que hace falta mostrar: al resolver una, `sugerenciaQuitar`
  // desaparece del documento y la tarjeta tiene que seguir en pantalla.
  const props = (lista ? pkPropuestasQuitar(lista) : []).map(it=>({
    clave:it.clave, nombre:it.nombre, categoria:it.categoria,
    motivo:it.sugerenciaQuitar.motivo, origen:it.origen
  }));
  const estado = {};   // clave -> null | "out" | "keep"
  props.forEach(p=> estado[p.clave] = null);

  const catLabel = k => (PackingEngine.CATEGORIES.filter(c=>c.key===k)[0] || {}).label || k;

  function cuerpo(){
    const abiertas = props.filter(p=> estado[p.clave] === null);
    if(!props.length || !abiertas.length){
      const n = props.length;
      return `<div class="empty" style="padding:22px 6px">
        <h3>No queda ninguna</h3>
        <p>${n ? `Resolviste ${n===1?"la que había":`las ${n}`}. Lo que sacaste sigue en la lista, tachado, y lo podés recuperar con el botón <span class="mono">volver</span>.`
               : "No hay ninguna propuesta de sacar en esta lista."}</p>
      </div>`;
    }
    return `
      <p class="tiny muted" style="margin:0;line-height:1.55">Miré el destino, las fechas y lo que cargaste del viaje. ${abiertas.length===1?`Esta <b class="mono">1</b> capaz no te hace falta`:`Estas <b class="mono">${abiertas.length}</b> capaz no te hacen falta`}. Ninguna se saca sola.</p>
      ${props.map(p=> estado[p.clave] === null ? `
        <div class="pk-prop">
          <div class="pk-prop-bd">
            <div class="nm">${esc(p.nombre)}</div>
            <div class="r">${esc(p.motivo)}</div>
            <div class="was"><span class="chip">${esc(catLabel(p.categoria))}</span><span class="${srcChip(p, trip).cls}">${esc(srcChip(p, trip).tx)}</span></div>
          </div>
          ${canWrite ? `<div class="pk-prop-ft">
            <button class="btn sm" data-keep="${esc(p.clave)}">Dejarlo, lo llevo</button>
            <button class="btn sm primary" data-out="${esc(p.clave)}">Sacarlo</button>
          </div>` : `<div style="height:12px"></div>`}
        </div>` : `
        <div class="pk-prop done">
          <div class="pk-prop-bd">
            <div class="nm">${esc(p.nombre)}</div>
            <div class="r">${estado[p.clave]==="out" ? "lo sacaste · queda descartado en la lista" : "lo dejaste · no te lo vuelvo a proponer"}</div>
          </div>
        </div>`).join("")}`;
  }

  function pintar(){
    const bd = document.getElementById("pk-prop-bd");
    const ft = $modal.querySelector(".sheet-ft");
    if(!bd) return;
    bd.innerHTML = cuerpo();
    const quedan = props.filter(p=> estado[p.clave] === null).length;
    // No se cierra sola: cerrar una hoja bajo el dedo es el gesto que hace
    // tocar sin querer lo que hay detrás.
    if(ft) ft.innerHTML = quedan
      ? `<button class="btn block" id="pk-prop-close">Cerrar</button>`
      : `<button class="btn primary block" id="pk-prop-close">Volver a la lista</button>`;
    const close = document.getElementById("pk-prop-close");
    if(close) close.onclick = closeSheet;
    if(!canWrite) return;
    bd.querySelectorAll("[data-out]").forEach(b=> b.onclick = async ()=>{
      const clave = b.dataset.out;
      b.disabled = true;
      pkMarcarVisto(clave);
      const ok = await aceptarQuitar(trip, clave);
      if(ok) estado[clave] = "out"; else b.disabled = false;
      pintar(); render();
    });
    bd.querySelectorAll("[data-keep]").forEach(b=> b.onclick = async ()=>{
      const clave = b.dataset.keep;
      b.disabled = true;
      pkMarcarVisto(clave);
      const ok = await rechazarQuitar(trip, clave);
      if(ok) estado[clave] = "keep"; else b.disabled = false;
      pintar(); render();
    });
  }

  // aria-live en el cuerpo: resolver una anuncia el cambio sin mover el foco.
  openSheet("Lo que capaz no necesitás",
    `<div id="pk-prop-bd" aria-live="polite" style="display:flex;flex-direction:column;gap:13px"></div>`,
    `<button class="btn block" id="pk-prop-close">Cerrar</button>`);
  pintar();
}

/* ---------- valija: detalle de un ítem (estado 11) ---------- */
function sheetPackingItem(trip, list, clave){
  const it = list.items[clave]; if(!it) return;
  const canWrite = Store.canWrite;
  const src = srcChip(it, trip);

  // Abrir la hoja de un ítem nuevo cuenta como haberlo visto (§ 4.3).
  if(it.nuevo) pkMarcarVisto(clave);

  // 22 · la propuesta de sacar, arriba de todo: es lo único nuevo que hay para
  // decidir sobre este ítem. Lo de abajo ya estaba la última vez que se abrió.
  const sug = (it.sugerenciaQuitar && it.sugerenciaQuitar.motivo && it.estado!=="descartado")
    ? it.sugerenciaQuitar : null;
  const sugHtml = sug ? `
    <div class="pk-sug">
      <span class="hd">${svg(I.ban)}
        <span><b>Te propongo sacarlo</b>${esc(sug.motivo)}</span></span>
      ${canWrite ? `<span class="ft">
        <button class="btn sm" id="pk-sug-keep">Dejarlo, lo llevo</button>
        <button class="btn sm primary" id="pk-sug-out">Sacarlo</button>
      </span>` : ""}
    </div>` : "";

  const stateHtml = `
    <div class="f">
      <label>Estado</label>
      <div class="pk-states">
        <button type="button" data-s="pendiente" aria-pressed="${it.estado==="pendiente"}"><span class="pk-state"></span> Pendiente</button>
        <button type="button" data-s="empacado" aria-pressed="${it.estado==="empacado"}"><span class="pk-state">${svg(I.check)}</span> Empacado</button>
        <button type="button" data-s="descartado" aria-pressed="${it.estado==="descartado"}"><span class="pk-state">${svg(I.dash)}</span> Descartado</button>
      </div>
      <span class="hint">Descartar no es lo mismo que dejarlo pendiente: me dice que este ítem no va. Si lo descartás en dos viajes del mismo tipo, dejo de sugerírtelo.</span>
    </div>`;

  const qtyHtml = (it.cantidad!=null) ? `
    <hr class="hr">
    <div class="f">
      <label>Cuántos llevás</label>
      <div class="pk-qty">
        <button type="button" id="pk-qty-minus" aria-label="Uno menos">${svg(I.minus)}</button>
        <span class="v" id="pk-qty-val">${esc(it.cantidad)}</span>
        <button type="button" id="pk-qty-plus" aria-label="Uno más">${svg(I.plus)}</button>
      </div>
    </div>` : "";

  // 23 · un ítem nuevo dice cuándo llegó y por qué. La reserva sale del plan
  // que se aplicó, guardado en memoria; si se perdió, queda sólo el motivo.
  const desdePlan = (App.planApplied && App.planApplied.tripId === trip.id)
    ? App.planApplied.byClave[clave] : null;
  const llegada = (it.nuevo && it.agregadoEn) ? (()=> {
    const d = parseDT(it.agregadoEn);
    const cuando = d ? `el ${d.getDate()} de ${MESL[d.getMonth()]}` : "hace poco";
    const causa = (desdePlan && desdePlan.reserva) ? `, cuando agregaste <b>${esc(desdePlan.reserva)}</b>` : "";
    return `<p class="tiny muted" style="margin:6px 0 0;font-size:12.5px;line-height:1.45">Se sumó a la lista ${esc(cuando)}${causa}.</p>`;
  })() : "";

  const originHtml = `
    <hr class="hr">
    <div class="f">
      <label>De dónde sale</label>
      <div class="chips" style="margin:2px 0 4px"><span class="${src.cls}">${esc(src.tx)}</span></div>
      <p style="margin:0;font-size:13.5px;line-height:1.5">${esc(it.motivo || "Sin motivo declarado.")}</p>
      ${llegada}
    </div>`;

  let qty = it.cantidad;
  let estado = it.estado;

  openSheet(it.nombre, sugHtml + stateHtml + qtyHtml + originHtml,
    canWrite ? `<button class="btn ghost" id="cancel">Cancelar</button><button class="btn primary" id="save">Guardar</button>`
             : `<button class="btn block" id="cancel">Cerrar</button>`);

  // La palabra "nuevo" al lado del título. Se inserta por DOM para no tocar
  // openSheet(), que escapa el título a propósito.
  if(it.nuevo){
    const h2 = $modal.querySelector(".sheet-hd h2");
    if(h2) h2.insertAdjacentHTML("afterend", `<span class="pk-newtag">nuevo</span>`);
  }

  document.getElementById("cancel").onclick = closeSheet;

  const sugKeep = document.getElementById("pk-sug-keep");
  if(sugKeep) sugKeep.onclick = async ()=>{
    sugKeep.disabled = true;
    const ok = await rechazarQuitar(trip, clave);
    if(!ok){ sugKeep.disabled = false; return; }
    closeSheet(); render(); toast("Listo, no te lo vuelvo a proponer");
  };
  const sugOut = document.getElementById("pk-sug-out");
  if(sugOut) sugOut.onclick = async ()=>{
    sugOut.disabled = true;
    const ok = await aceptarQuitar(trip, clave);
    if(!ok){ sugOut.disabled = false; return; }
    closeSheet(); render(); toast("Descartado. Lo recuperás con el botón volver");
  };

  if(!canWrite) return;

  document.querySelectorAll(".pk-states [data-s]").forEach(b=>{
    b.onclick = ()=>{
      estado = b.dataset.s;
      document.querySelectorAll(".pk-states [data-s]").forEach(x=> x.setAttribute("aria-pressed", String(x.dataset.s===estado)));
    };
  });
  const qmin = document.getElementById("pk-qty-minus"), qpl = document.getElementById("pk-qty-plus"), qval = document.getElementById("pk-qty-val");
  if(qmin){
    qmin.onclick = ()=>{ qty = Math.max(0, (qty||0)-1); qval.textContent = qty; };
    qpl.onclick = ()=>{ qty = (qty||0)+1; qval.textContent = qty; };
  }

  document.getElementById("save").onclick = async ()=>{
    const fields = {};
    if(estado !== it.estado){
      fields.estado = estado;
      fields.empacadoEn = estado === "empacado" ? (it.empacadoEn || new Date().toISOString()) : null;
    }
    if(qty !== it.cantidad){
      fields.cantidad = qty; fields.cantidadEditada = true; fields.motivo = "Lo ajustaste vos.";
    }
    if(!Object.keys(fields).length){ closeSheet(); return; }
    const now = new Date().toISOString();
    fields.actualizadoEn = now;
    try{
      await Store.savePackingPatch(trip.id, { items:{ [clave]:fields }, actualizadaEn:now });
      closeSheet();
    }catch(e){ toast(writeErr(e), true); }
  };
}

/* ---------- valija: de dónde sale la lista (estado 12) ---------- */
function sheetPackingInfo(trip, list){
  const b = list.base || {};
  const muestra = (list.aprendizaje && list.aprendizaje.muestra) || 0;
  const typeLbl = typeLabel(list.tipoViaje) || list.tipoViaje || "sin tipo";
  /* VAL-77b: con la regla nueva, un viaje de dos tipos también aprende de los
     viajes que comparten UNA de sus partes, y `muestra` los cuenta. Decir
     "N viajes de ciudad y montaña" afirmaría que todos fueron de las dos
     cosas; "de ciudad o montaña" es lo que pasó. Con una parte la frase es la
     de siempre. Una lista armada antes de esto trae la `muestra` vieja —sólo
     la misma combinación—, y "de ciudad o montaña" también es cierto para ella. */
  const partesViaje = typeParts(list.tipoViaje);
  const deQueViajes = partesViaje.length >= 2
    ? partesViaje.map(p=> typeLabel(p).toLowerCase()).join(" o ")
    : typeLbl.toLowerCase();
  const d = parseDT(b.desde);
  const destMes = [b.destino, d?MESL[d.getMonth()]:null].filter(Boolean).join(" · ") || "sin destino";

  // 19 · el rastro permanente de lo que se aplazó. Es el único lugar donde nada
  // se esconde, y está a dos toques desde cualquier estado de la valija.
  const planPend = planDe(trip.id);
  const nPend = planPend ? planCuentas(planPend).total : 0;
  const rPend = planPend ? planReserva(planPend) : null;
  /* La TERCERA instancia de "Ver qué agrego", y la encontró la auditoría con
     `grep` de la cadena, no leyendo la función que yo había tocado. El barrido
     del commit anterior arregló dos —el aviso y el dock— y dejó ésta, que vive
     600 líneas más lejos. Es la clase de error que CLAUDE.md llama "se barre la
     clase del ARCHIVO, no la de la función", esta vez en el texto.
     Y el encabezado tenía el mismo problema una línea más arriba: "Novedades
     sin sumar" y "cosas que aparecieron" sobre un plan que sólo saca son dos
     afirmaciones falsas en lo que el PM lee para decidir. */
  const {suma:nSuma, saca:nSaca} = planPend ? planCuentas(planPend) : {suma:0, saca:0};
  /* VAL-85: lo sacado por lo aprendido no "ya no corresponde" ni "apareció":
     es lo que descartaste en otros viajes. Cada forma dice la suya; un plan
     que no es sólo lo aprendido dice lo de antes. */
  const formaPend = pkFormaAprendida(planPend);
  const queCosas = formaPend === "saca"  ? (nPend===1?"cosa para sacar":"cosas para sacar")
                 : formaPend === "ambas" ? (nPend===1?"cosa para cambiar":"cosas para cambiar")
                 : nSaca && !nSuma ? (nPend===1?"cosa que ya no corresponde":"cosas que ya no corresponden")
                                   : (nPend===1?"cosa que apareció":"cosas que aparecieron");
  const porQue = rPend ? ` cuando agregaste ${esc(rPend)}`
               : formaPend === "suma"  ? " por lo que agregaste a mano en otros viajes"
               : formaPend === "saca"  ? " por lo que descartaste en otros viajes"
               : formaPend === "ambas" ? " por lo que agregaste a mano y descartaste en otros viajes"
                                       : " cuando cambió el viaje";
  const novedadesHtml = planPend ? `
    <div class="stack" style="gap:7px">
      <div class="sec-head"><span class="eyebrow">${nSaca && !nSuma ? "Cambios sin aplicar" : "Novedades sin sumar"}</span></div>
      <p class="tiny muted" style="margin:0;line-height:1.55"><b class="mono">${nPend}</b> ${queCosas}${porQue}.</p>
      <div><button class="btn sm" id="pk-info-plan">${planVerQue(planPend)}</button></div>
    </div>
    <hr class="hr">` : "";

  // 20 · lo mismo para las propuestas de sacar: siempre alcanzables acá,
  // aunque el aviso que las explica no se esté mostrando.
  const nQuitar = pkPropuestasQuitar(list).length;
  const quitarHtml = nQuitar ? `
    <div class="stack" style="gap:7px">
      <div class="sec-head"><span class="eyebrow">Cosas que capaz no necesitás</span></div>
      <p class="tiny muted" style="margin:0;line-height:1.55"><b class="mono">${nQuitar}</b> ${nQuitar===1?"propuesta sin resolver":"propuestas sin resolver"}. Ninguna se saca sola.</p>
      <div><button class="btn sm" id="pk-info-quitar">Ver ${nQuitar===1?"cuál":"cuáles"}</button></div>
    </div>
    <hr class="hr">` : "";

  openSheet("De dónde sale esta lista", novedadesHtml + quitarHtml + `
    <p style="margin:0;font-size:13.5px;line-height:1.55">Miro cuatro cosas de este viaje:</p>
    <div class="pk-inputs">
      <span class="chip accent">${esc(typeLbl)}</span>
      <span class="chip">${esc(destMes)}</span>
      <span class="chip">${b.dias||"—"} ${b.dias===1?"día":"días"}</span>
      <span class="chip">${muestra} ${muestra===1?"viaje":"viajes"} de ${esc(deQueViajes)} anteriores</span>
    </div>
    <hr class="hr">
    <div class="stack" style="gap:12px">
      <div class="sec-head"><span class="eyebrow">Qué dice cada marca</span></div>
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span class="chip" style="margin-top:2px">lista base</span>
        <span class="tiny muted" style="flex:1;line-height:1.5">Las reglas de siempre: documentación, electrónica y ropa por cantidad de días. Salen sin conexión.</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span class="chip accent" style="margin-top:2px">tus viajes</span>
        <span class="tiny muted" style="flex:1;line-height:1.5">Lo que aprendí de vos. Si en dos viajes agregaste a mano lo mismo para el mismo tipo de viaje, la próxima ya te lo propongo.</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span class="chip soon" style="margin-top:2px">por ${esc(b.destino||"el destino")}</span>
        <span class="tiny muted" style="flex:1;line-height:1.5">El ajuste por destino y época: clima, enchufes, costumbres del lugar. Es lo único que necesita conexión.</span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-start">
        <span class="chip own" style="margin-top:2px">lo pusiste vos</span>
        <span class="tiny muted" style="flex:1;line-height:1.5">Lo que agregaste a mano en este viaje.</span>
      </div>
    </div>
    <hr class="hr">
    <p class="tiny muted" style="margin:0;line-height:1.55">Lo que descartás también cuenta: si sacás lo mismo dos veces en viajes del mismo tipo, dejo de sugerírtelo.</p>
    <p class="tiny muted" style="margin:0;line-height:1.55">Ningún ítem de esta lista tiene un negocio atrás. No hay links de compra ni marcas recomendadas, y no los va a haber.</p>
  `, Store.canWrite ? `
    <button class="btn" id="pk-changetype">Cambiar el tipo</button>
    <button class="btn" id="pk-redo">Rehacer la lista</button>
  ` : `<button class="btn block" id="cancel">Cerrar</button>`);

  const verPlan = document.getElementById("pk-info-plan");
  if(verPlan) verPlan.onclick = ()=>{ const p = planDe(trip.id); if(p) sheetPackingPlan(trip, p); };
  const verQuitar = document.getElementById("pk-info-quitar");
  if(verQuitar) verQuitar.onclick = ()=> sheetPackingRemovals(trip);

  if(Store.canWrite){
    /* VAL-76: este botón sigue acá y funciona igual. Lo que cambió es que ya
       no es el ÚNICO camino: el tipo se cambia desde donde se ve el tipo, que
       es el renglón del viaje en la cabecera. */
    document.getElementById("pk-changetype").onclick = ()=>{ closeSheet(); pkAbrirSelectorDeTipo(); };
    document.getElementById("pk-redo").onclick = ()=>{ closeSheet(); runGenerate(trip, list.tipoViaje, list); };
  } else {
    document.getElementById("cancel").onclick = closeSheet;
  }
}

/* ============================================================
   PDF — resumen de una página, tipo hoja de ruta
   ============================================================ */
async function exportPDF(trip){
  const items = Store.itemsOf(trip.id).slice()
    .sort((a,b)=> String(a.start||"zzz").localeCompare(String(b.start||"zzz")));
  const alerts = tripAlerts(trip, items);

  if(!window.jspdf){ toast("No se pudo cargar el generador de PDF", true); return; }
  toast("Armando el PDF…");

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"a4"});
  const W = 595.28, M = 44;
  let y = 0;

  const INK=[15,27,46], MUT=[84,99,124], ACC=[11,69,196], LINE=[215,222,233], CRIT=[190,50,39];
  const line = (yy)=>{ doc.setDrawColor(...LINE); doc.setLineWidth(.7); doc.line(M,yy,W-M,yy); };
  const page = ()=>{ doc.addPage(); y = M + 10; };
  const need = h => { if(y + h > 800){ page(); } };

  // Cabecera
  doc.setFillColor(...INK); doc.rect(0,0,W,104,"F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(24);
  doc.text(String(trip.name||"Viaje"), M, 50, {maxWidth:W-M*2-90});
  doc.setFont("courier","normal"); doc.setFontSize(10);
  const sub = [fmtRange(trip.startDate,trip.endDate), trip.destination, trip.travelers].filter(Boolean).join("  ·  ");
  doc.text(sub, M, 72, {maxWidth:W-M*2-90});
  doc.setFontSize(8); doc.setTextColor(160,175,200);
  doc.text("VALIJA", W-M, 40, {align:"right"});
  doc.text(`${items.length} reservas`, W-M, 54, {align:"right"});
  y = 136;

  // Pendientes primero: es lo accionable
  if(alerts.length){
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...CRIT);
    doc.text(`PENDIENTES (${alerts.length})`, M, y); y += 15;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...MUT);
    alerts.slice(0,8).forEach(a=>{
      need(26);
      const t = doc.splitTextToSize(`•  ${a.t} — ${a.d}`, W-M*2);
      doc.text(t, M, y); y += t.length*12 + 2;
    });
    y += 10; line(y); y += 20;
  }

  // Itinerario
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...INK);
  doc.text("ITINERARIO", M, y); y += 16;

  if(!items.length){
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...MUT);
    doc.text("Todavía no hay reservas cargadas.", M, y);
  }

  let lastDay = null;
  items.forEach(it=>{
    need(88);
    const k = dayKey(it.start);
    if(k && k !== lastDay){
      lastDay = k;
      y += 6;
      doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...ACC);
      doc.text(fmtDateLong(k).toUpperCase(), M, y);
      line(y+5); y += 20;
    }

    const T = TYPES[it.type] || TYPES.note;
    const t1 = fmtTime(it.start), t2 = fmtTime(it.end);

    doc.setFont("courier","normal"); doc.setFontSize(10); doc.setTextColor(...MUT);
    doc.text(t1 || "—:—", M, y);

    doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor(...INK);
    doc.text(String(it.title || T.label), M+52, y, {maxWidth:W-M*2-60});

    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...MUT);
    let meta = T.label.toUpperCase();
    if(it.provider) meta += `  ·  ${it.provider}`;
    if(t2) meta += `  ·  hasta ${t2}`;
    doc.text(meta, M+52, y+13, {maxWidth:W-M*2-60});
    y += 27;

    // talón de datos
    const stub = [];
    if(it.from || it.to) stub.push(["RUTA", `${it.from||"—"} → ${it.to||"—"}`]);
    if(it.flightNumber) stub.push(["VUELO", it.flightNumber]);
    if(it.confirmation) stub.push(["RESERVA", it.confirmation]);
    if(it.seat) stub.push(["ASIENTO", it.seat]);
    if(it.terminal) stub.push(["TERMINAL", it.terminal]);
    if(it.gate) stub.push(["PUERTA", it.gate]);
    if(it.boardingTime) stub.push(["EMBARQUE", it.boardingTime]);
    if(it.address) stub.push(["DIRECCIÓN", it.address]);
    if(it.phone) stub.push(["TEL", it.phone]);
    if(it.cost) stub.push(["COSTO", `${it.currency||""} ${it.cost}`.trim()]);

    if(stub.length){
      let cx = M+52;
      doc.setFontSize(7);
      stub.forEach(([k2,v])=>{
        const wv = Math.max(doc.getTextWidth(String(v))+6, doc.getTextWidth(k2)+6);
        if(cx + wv > W-M){ cx = M+52; y += 24; need(30); }
        doc.setFont("helvetica","normal"); doc.setTextColor(...MUT);
        doc.text(k2, cx, y);
        doc.setFont("courier","normal"); doc.setFontSize(9); doc.setTextColor(...INK);
        doc.text(String(v).slice(0,42), cx, y+11);
        doc.setFontSize(7);
        cx += wv + 16;
      });
      y += 22;
    }

    const miss = missingFields(it);
    if(miss.length){
      doc.setFont("helvetica","italic"); doc.setFontSize(8); doc.setTextColor(...CRIT);
      doc.text(`Falta: ${miss.map(m=>m[1]).join(", ")}`, M+52, y);
      y += 13;
    }
    y += 10;
  });

  if(trip.notes){
    need(60); y += 6; line(y); y += 20;
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...INK);
    doc.text("NOTAS", M, y); y += 15;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...MUT);
    const t = doc.splitTextToSize(String(trip.notes), W-M*2);
    doc.text(t, M, y);
  }

  // pie en todas las páginas
  const total = doc.getNumberOfPages();
  for(let p=1;p<=total;p++){
    doc.setPage(p);
    doc.setFont("courier","normal"); doc.setFontSize(7.5); doc.setTextColor(...MUT);
    doc.text(`Valija  ·  ${new Date().toLocaleDateString("es-AR")}`, M, 815);
    doc.text(`${p} / ${total}`, W-M, 815, {align:"right"});
  }

  const safe = String(trip.name||"viaje").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase() || "viaje";
  const filename = `valija-${safe}.pdf`;
  const blob = doc.output("blob");

  let dl = null;
  try{ dl = await claude.use("downloads"); }catch(e){}
  if(dl){
    try{
      await dl.save({filename, data:blob});
      toast("PDF guardado");
    }catch(e){
      const c = e && e.code;
      if(c === "declined") return;
      if(c === "rate_limited"){ toast("Esperá un momento y probá de nuevo", true); return; }
      toast("No se pudo guardar el PDF", true);
    }
  } else {
    // sin la capacidad de descarga, imprimir es la salida a PDF del sistema
    toast("Usá Imprimir y elegí Guardar como PDF");
    try{ window.print(); }catch(e){}
  }
}

/* ============================================================
   ARRANQUE
   ============================================================ */
readHash();
Store.onSyncError = e => toast(writeErr(e), true);
Store.on(render);
render();
Store.init().then(()=>{ Store.watch(App.tripId); Store.watchPacking(App.tripId); render(); });
</script>
