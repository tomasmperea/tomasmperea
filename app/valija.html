<title>Valija</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- pdf.js, versión fija (VAL-40). Si cdnjs está bloqueado o la versión no existe,
     window.pdfjsLib simplemente no queda definida: ImportEngine ya degrada cada
     PDF a un error propio sin tocar a los demás archivos ni romper la hoja. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
</script>

<style>
/* ============================================================
   VALIJA — tokens
   Light es la base. Dark redefine SOLO tokens, dos veces:
   preferencia del sistema y elección explícita.
   ============================================================ */
:root{
  --ink:#0F1B2E;
  --ink-2:#54637C;
  --ink-3:#8695AB;
  --ground:#EDF0F5;
  --surface:#FFFFFF;
  --surface-2:#F5F7FB;
  --line:#D7DEE9;
  --line-2:#E7ECF3;
  --accent:#0B45C4;
  --accent-soft:#E4EBFC;
  --accent-ink:#FFFFFF;
  --flap:#E8A317;
  --flap-soft:#FBF0D8;
  --ok:#0B7A5C;
  --ok-soft:#DDF1EA;
  --warn:#A96400;
  --warn-soft:#FBEEDA;
  --crit:#BE3227;
  --crit-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(15,27,46,.06), 0 8px 24px -12px rgba(15,27,46,.18);
  --shadow-lift:0 2px 4px rgba(15,27,46,.08), 0 18px 40px -18px rgba(15,27,46,.30);

  --f-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;

  --r-s:8px; --r-m:14px; --r-l:20px;
  --shell:460px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E9EEF7;
    --ink-2:#9FAFC6;
    --ink-3:#6F7F97;
    --ground:#080D17;
    --surface:#121B2B;
    --surface-2:#182234;
    --line:#26334A;
    --line-2:#1E2A3E;
    --accent:#6E9BFF;
    --accent-soft:#1A2748;
    --accent-ink:#08122A;
    --flap:#FFC24D;
    --flap-soft:#2E2413;
    --ok:#4FCFA5;
    --ok-soft:#102E26;
    --warn:#E9A93C;
    --warn-soft:#2E2413;
    --crit:#FF8A7A;
    --crit-soft:#331A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E9EEF7; --ink-2:#9FAFC6; --ink-3:#6F7F97;
  --ground:#080D17; --surface:#121B2B; --surface-2:#182234;
  --line:#26334A; --line-2:#1E2A3E;
  --accent:#6E9BFF; --accent-soft:#1A2748; --accent-ink:#08122A;
  --flap:#FFC24D; --flap-soft:#2E2413;
  --ok:#4FCFA5; --ok-soft:#102E26;
  --warn:#E9A93C; --warn-soft:#2E2413;
  --crit:#FF8A7A; --crit-soft:#331A18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 18px 40px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- shell ---------- */
.shell{
  max-width:var(--shell); margin:0 auto; min-height:100vh;
  background:var(--ground); position:relative;
  display:flex; flex-direction:column;
}
@media (min-width:520px){
  .shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* ---------- header ---------- */
.hdr{
  position:sticky; top:0; z-index:40;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:14px 16px 12px;
}
.hdr-row{display:flex;align-items:center;gap:10px;min-height:34px}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand h1{
  font-family:var(--f-display); font-weight:800; font-size:26px;
  letter-spacing:-.02em; margin:0; line-height:1;
}
.brand .tag{
  font-family:var(--f-mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap;
}
.hdr-sub{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.06em;
  color:var(--ink-2); margin-top:6px; display:flex; gap:8px; flex-wrap:wrap;
  align-items:center;
}
.iconbtn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  cursor:pointer; flex:none; transition:background .15s,border-color .15s;
}
.iconbtn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- main ---------- */
main{flex:1; padding:16px 16px 108px; display:flex; flex-direction:column; gap:14px}
.eyebrow{
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3);
}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* ---------- baggage tag (trip card) ---------- */
.tag-card{
  display:flex; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-m); overflow:hidden; box-shadow:var(--shadow);
  cursor:pointer; text-align:left; width:100%; padding:0;
  transition:transform .16s ease, box-shadow .16s ease;
}
.tag-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.tag-band{
  width:36px; flex:none; position:relative;
  background:var(--band); display:grid; place-items:center;
}
.tag-band::after{
  content:""; position:absolute; inset:6px auto 6px 6px; width:0;
  border-left:2px dotted rgba(255,255,255,.55);
}
.tag-band span{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.2em;
  color:#fff; writing-mode:vertical-rl; text-orientation:mixed;
  transform:rotate(180deg); text-shadow:0 1px 2px rgba(0,0,0,.35);
}
.tag-body{padding:13px 14px;flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.route{display:flex;align-items:center;gap:9px;font-family:var(--f-mono);font-weight:500}
.route .code{font-size:19px;letter-spacing:.05em;color:var(--ink)}
.route .dash{flex:1;height:1px;background:repeating-linear-gradient(to right,var(--line) 0 4px,transparent 4px 8px);min-width:16px}
.route svg{width:15px;height:15px;color:var(--ink-3);flex:none;fill:currentColor;stroke:none}
.trip-name{
  display:block; font-family:var(--f-display); font-weight:700; font-size:17px;
  letter-spacing:-.01em; line-height:1.2; margin:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tag-meta{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dates{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);letter-spacing:.02em}

/* completeness ring */
.ring{width:34px;height:34px;flex:none;position:relative}
.ring svg{width:34px;height:34px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--line-2)}
.ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring.warn .fg{stroke:var(--flap)}
.ring.low .fg{stroke:var(--crit)}
.ring b{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:9.5px;font-weight:500;color:var(--ink-2);
}

/* ---------- chips & badges ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.05em;
  padding:3px 7px; border-radius:6px; background:var(--surface-2);
  color:var(--ink-2); border:1px solid var(--line-2); white-space:nowrap;
}
.chip.alert{background:var(--crit-soft);color:var(--crit);border-color:transparent;font-weight:500}
.chip.soon{background:var(--flap-soft);color:var(--warn);border-color:transparent;font-weight:500}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.live{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:500}

/* ---------- boarding pass (item card) ---------- */
.pass{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-m); box-shadow:var(--shadow); overflow:hidden;
}
.pass-main{display:flex;gap:12px;padding:13px 14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;cursor:pointer}
.pass-icon{
  width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);
}
.pass-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pass-icon.stay{background:var(--ok-soft);color:var(--ok)}
.pass-icon.car{background:var(--flap-soft);color:var(--warn)}
.pass-icon.act{background:var(--crit-soft);color:var(--crit)}
.pass-icon.note{background:var(--surface-2);color:var(--ink-2)}
.pass-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pass-title{
  font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.25;
  letter-spacing:-.005em;margin:0;
}
.pass-when{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);letter-spacing:.02em}
.pass-time{
  font-family:var(--f-mono);font-size:14px;font-weight:500;color:var(--ink);
  flex:none;text-align:right;line-height:1.3;font-variant-numeric:tabular-nums;
}
.pass-time small{display:block;font-size:10px;color:var(--ink-3);font-weight:400}

/* perforated stub */
.pass-stub{
  border-top:1.5px dashed var(--line); background:var(--surface-2);
  padding:10px 14px; display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
  gap:9px 12px; position:relative;
}
.pass-stub::before,.pass-stub::after{
  content:"";position:absolute;top:-7px;width:13px;height:13px;border-radius:50%;
  background:var(--ground);border:1px solid var(--line);
}
.pass-stub::before{left:-7px;clip-path:inset(0 0 0 50%)}
.pass-stub::after{right:-7px;clip-path:inset(0 50% 0 0)}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.field .v{
  font-family:var(--f-mono);font-size:12.5px;color:var(--ink);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow-wrap:anywhere;line-height:1.35;
}
.field .v.miss{color:var(--crit);font-style:italic}

/* ---------- day group ---------- */
.day{display:flex;flex-direction:column;gap:9px}
.day-head{display:flex;align-items:center;gap:10px;padding-top:4px}
.day-n{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;
  background:var(--ink);color:var(--ground);padding:3px 7px;border-radius:5px;
  text-transform:uppercase;flex:none;
}
.day-date{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:-.01em}
.day-rule{flex:1;height:1px;background:var(--line)}
.day-nights{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}

/* ---------- alerts ---------- */
.alert-row{
  display:flex;gap:11px;align-items:flex-start;padding:11px 13px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  border-left:3px solid var(--sev);
}
.alert-row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.alert-row .t{font-weight:600;font-size:14px;line-height:1.3}
.alert-row .d{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.alert-dot{width:8px;height:8px;border-radius:50%;background:var(--sev);flex:none;margin-top:6px}
.alert-row .go{
  border:0;background:var(--surface-2);color:var(--ink-2);border-radius:7px;
  font-family:var(--f-mono);font-size:10.5px;padding:5px 8px;cursor:pointer;flex:none;
  letter-spacing:.06em;
}
.alert-row .go:hover{background:var(--accent-soft);color:var(--accent)}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:11px 14px; border-radius:11px; font-weight:600; font-size:14px;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  gap:8px; transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:scale(.985)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft);background:var(--crit-soft)}
.btn.block{width:100%}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap}
.btn-row>.btn{flex:1;min-width:130px}

/* FAB */
.fab{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  z-index:45;display:flex;gap:9px;
  max-width:var(--shell);width:calc(100% - 32px);
}
.fab .btn{box-shadow:var(--shadow-lift)}

/* ---------- segmented ---------- */
.seg{
  display:flex;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:3px;gap:3px;
}
.seg button{
  flex:1;border:0;background:transparent;color:var(--ink-2);padding:8px 6px;
  border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s,color .15s;
}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .count{
  font-family:var(--f-mono);font-size:10px;background:var(--crit);color:#fff;
  border-radius:20px;padding:1px 5px;line-height:1.5;
}
.seg .count.zero{background:var(--ok)}

/* ---------- empty ---------- */
.empty{
  text-align:center;padding:34px 20px;background:var(--surface);
  border:1px dashed var(--line);border-radius:var(--r-l);
  display:flex;flex-direction:column;gap:9px;align-items:center;
}
.empty .ico{font-size:30px;line-height:1}
.empty h3{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;letter-spacing:-.01em}
.empty p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:34ch;line-height:1.5}

/* ---------- sheet (modal) ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(15,27,46,.55);z-index:80;
  display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(3px);animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--surface);width:100%;max-width:var(--shell);
  border-radius:var(--r-l) var(--r-l) 0 0; max-height:92vh;
  display:flex;flex-direction:column;animation:rise .24s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 -10px 50px rgba(0,0,0,.28);
}
@keyframes rise{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
.sheet-hd{
  padding:14px 16px 11px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex:none;
}
.sheet-hd h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;flex:1;letter-spacing:-.01em}
.sheet-bd{padding:15px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:13px}
.sheet-ft{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:9px;flex:none}
.sheet-ft .btn{flex:1}

/* ---------- form ---------- */
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.f input,.f select,.f textarea{
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  padding:10px 11px;border-radius:9px;font-size:15px;width:100%;
  transition:border-color .15s,background .15s;
}
.f input:focus,.f select:focus,.f textarea:focus{background:var(--surface);border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.f textarea{min-height:78px;resize:vertical;font-family:var(--f-body);line-height:1.5}
.f .hint{font-size:11.5px;color:var(--ink-3);line-height:1.4}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.f input.mono,.f textarea.mono{font-family:var(--f-mono);font-size:14px}
.req label::after{content:" ·";color:var(--crit)}

/* type picker */
.tp{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:7px}
.tp button{
  border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
  padding:10px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;font-size:11.5px;font-weight:600;color:var(--ink-2);
  transition:all .14s;
}
.tp button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tp button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;
  transform:translateX(-50%);z-index:120;
  background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:11px;
  font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lift);
  max-width:calc(var(--shell) - 40px);text-align:center;
  animation:rise .2s ease;
}
.toast.err{background:var(--crit);color:#fff}

/* ---------- misc ---------- */
.notice{
  display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:10px;
  background:var(--accent-soft);color:var(--accent);font-size:12.5px;line-height:1.45;
}
.notice.warn{background:var(--flap-soft);color:var(--warn)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.notice .bd{flex:1;min-width:0}
.notice .act{background:none;border:0;padding:0;margin-top:6px;color:inherit;font:inherit;font-size:12.5px;font-weight:700;text-decoration:underline;cursor:pointer;display:block}
.notice .x{background:none;border:0;color:inherit;opacity:.7;cursor:pointer;padding:0;flex:none;line-height:1}
.notice .x svg{margin:0}
.notice svg{width:15px;height:15px;flex:none;margin-top:2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   VALIJA INTELIGENTE — componentes nuevos (VAL-30..33)
   Copiados del muestrario aprobado app/parts/packing-ui.html,
   Bloque C. Sin tokens nuevos: todo sale de los de :root de arriba.
   ============================================================ */
.vj-entry{
  display:flex;align-items:stretch;width:100%;text-align:left;padding:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  box-shadow:var(--shadow);overflow:hidden;cursor:pointer;
  transition:transform .16s ease,box-shadow .16s ease;
}
.vj-entry:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.vj-entry .band{width:8px;flex:none;background:var(--ink-3)}
.vj-entry.due .band{background:var(--flap)}
.vj-entry.live .band{background:var(--accent)}

.vj-entry .bd{flex:1;min-width:0;padding:12px 4px 12px 13px;display:flex;flex-direction:column;gap:6px}
.vj-entry .t{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:-.005em;line-height:1.2}
.vj-entry .s{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);letter-spacing:.02em}

.vj-entry .go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Progreso de empacado: DOS tramos (empacado + descartado). Los dos son

.pk-prog{display:flex;align-items:center;gap:9px;width:100%}
.pk-bar{flex:1;min-width:56px;height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex}

.pk-prog.full .n{color:var(--ok);font-weight:500}

.pk-cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);overflow:hidden}

.pk-cat-hd:hover{background:var(--surface-2)}
.pk-cat-ico{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.pk-cat-ico svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pk-cat-hd .nm{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:14.5px;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-cat-hd .cnt{flex:none;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pk-cat-hd .chev{flex:none;width:16px;height:16px;color:var(--ink-3);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease}
.pk-cat[data-open="false"] .chev{transform:rotate(-90deg)}
.pk-cat[data-open="false"] .pk-body-wrap{display:none}
.pk-cat.full .pk-cat-ico{background:var(--ok-soft);color:var(--ok)}
.pk-body-wrap{border-top:1px solid var(--line-2)}

/* Fila de ítem: TRES estados, distintos por relleno/borde/glifo, no sólo color. */
.pk-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line-2);position:relative;background:var(--surface)}
.pk-row:last-child{border-bottom:0}
.pk-row .pk-swipe{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;
  gap:7px;padding-right:16px;background:var(--surface-2);color:var(--ink-2);
  font-size:12.5px;font-weight:600;
}
.pk-row .pk-swipe svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.pk-slide{display:flex;flex:1;min-width:0;position:relative;background:var(--surface);transition:transform .18s ease}

.pk-mark{flex:none;width:44px;display:grid;place-items:center;background:none;border:0;cursor:pointer;padding:0}
.pk-state{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ink-3);display:grid;place-items:center;color:transparent;background:transparent;transition:background .14s,border-color .14s,color .14s}
.pk-state svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pk-mark:hover .pk-state{border-color:var(--ok)}

.pk-txt{flex:1;min-width:0;background:none;border:0;text-align:left;cursor:pointer;padding:10px 4px 10px 0;display:flex;flex-direction:column;gap:3px}
.pk-txt:hover .pk-nm .t{color:var(--accent)}
.pk-nm{display:flex;align-items:baseline;gap:10px}
.pk-nm .t{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.pk-nm .q{flex:none;font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pk-why{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pk-why .r{font-size:11.5px;color:var(--ink-2);line-height:1.35}

.pk-drop{flex:none;width:44px;display:grid;place-items:center;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0}
.pk-drop svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pk-drop:hover{background:var(--surface-2);color:var(--ink-2)}

.pk-row[data-st="pack"] .pk-mark .pk-state{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.pk-row[data-st="pack"] .pk-nm .t{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1.5px}
.pk-row[data-st="pack"] .pk-nm .q{color:var(--ink-3)}
.pk-row[data-st="pack"] .pk-why{opacity:.5}

.pk-row[data-st="drop"]{background:var(--surface-2)}
.pk-row[data-st="drop"] .pk-slide{background:var(--surface-2)}
.pk-row[data-st="drop"] .pk-state{border-style:dashed;color:var(--ink-3);background:transparent}
.pk-row[data-st="drop"] .pk-txt{padding-top:7px;padding-bottom:7px}
.pk-row[data-st="drop"] .pk-nm .t{font-weight:500;font-size:13.5px;color:var(--ink-3)}
.pk-row[data-st="drop"] .pk-nm .q{display:none}
.pk-row[data-st="drop"] .pk-why{display:none}
.pk-back{flex:none;align-self:center;margin-right:8px;background:none;border:0;color:var(--ink-3);cursor:pointer;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;padding:7px 8px;border-radius:6px;white-space:nowrap}
.pk-back:hover{background:var(--accent-soft);color:var(--accent)}

@keyframes pkin{from{background:var(--flap-soft)}to{background:var(--surface)}}
.pk-row.fresh .pk-slide{animation:pkin 2.6s ease 1}

.pk-row.loading{padding:12px 12px 12px 44px;flex-direction:column;gap:7px;align-items:flex-start}
.pk-row.loading span{display:block;height:11px;border-radius:5px}

.pk-add{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px 11px;background:none;border:0;border-top:1px solid var(--line-2);color:var(--ink-3);cursor:pointer;font-size:13px;font-weight:600;text-align:left}
.pk-add svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pk-add:hover{background:var(--surface-2);color:var(--accent)}
.pk-addform{display:flex;gap:8px;padding:10px 12px 11px;border-top:1px solid var(--line-2);background:var(--surface-2)}
.pk-addform input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 11px;border-radius:9px;font-size:15px}
.pk-addform input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

.pk-inputs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.tp.tp3{grid-template-columns:repeat(3,1fr)}
.tp button .n{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3);font-weight:400}
.tp button[aria-pressed="true"] .n{color:var(--accent)}
.tp button.used{border-color:var(--ink-3)}

.pk-states{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pk-states button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 5px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-2);transition:all .14s}
.pk-states button .pk-state{pointer-events:none}
.pk-states button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.pk-states button[data-s="empacado"][aria-pressed="true"] .pk-state{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.pk-states button[data-s="descartado"] .pk-state{border-style:dashed}

.pk-qty{display:flex;align-items:center;gap:14px;justify-content:center;padding:4px 0}
.pk-qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.pk-qty button:hover{background:var(--surface);border-color:var(--ink-3)}
.pk-qty button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.pk-qty .v{font-family:var(--f-mono);font-size:30px;font-weight:500;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}

.chip.own{border-style:dashed;border-color:var(--ink-3);color:var(--ink-3)}
.spin{
  width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line-2) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shim 1.3s infinite;border-radius:var(--r-m);height:88px}
@keyframes shim{to{background-position:-200% 0}}
.hr{height:1px;background:var(--line);border:0;margin:2px 0}
.stack{display:flex;flex-direction:column;gap:10px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink-2)}
.tiny{font-size:11.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   IMPORTAR DOCUMENTOS — componentes nuevos (VAL-40, VAL-41, VAL-42)
   Copiados de app/parts/import-ui.html, Bloque C (C1 a C7), sin
   tokens nuevos: todo sale de los mismos :root de arriba.
   ============================================================ */
/* C1. Chip con glifo chico: identifica de qué archivo salió un dato. */
.chip.src{display:inline-flex;align-items:center;gap:4px}
.chip.src svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* C2. Botón de origen del archivo: mismo aspecto que .tp button, pero es un
   <label> que activa un <input type=file> vecino. */
.tp label.tpbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--ink-2);transition:all .14s}
.tp label.tpbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tp label.tpbtn:active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* C3. "Pegar el texto en cambio": un <details> nativo, sin JS. */
.imp-more{border:0}
.imp-more summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:7px;padding:2px 0}
.imp-more summary::-webkit-details-marker{display:none}
.imp-more summary::before{content:"+";font-family:var(--f-mono);width:18px;height:18px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;flex:none}
.imp-more[open] summary::before{content:"–"}
.imp-more[open] summary{margin-bottom:10px}
.imp-more summary:hover{color:var(--ink)}

/* C4. La cola / el progreso de lectura: una lista de archivos. */
.imp-files{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);overflow:hidden}
.imp-file{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 12px;border-bottom:1px solid var(--line-2)}
.imp-file:last-child{border-bottom:0}
.imp-file.err{background:var(--crit-soft)}
.imp-thumb{width:38px;height:38px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.imp-thumb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.imp-thumb.pdf{background:var(--accent-soft);color:var(--accent)}
.imp-thumb.img{background:var(--flap-soft);color:var(--warn)}
.imp-file .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.imp-file .nm{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-file .meta{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:6px;line-height:1.4}
.imp-file .meta.err{color:var(--crit);font-family:var(--f-body);letter-spacing:0;line-height:1.4}
.imp-file .meta.ok{color:var(--ok)}
/* C4b. Archivo "vacío": se leyó bien, no había ninguna reserva ahí. No es un
   error: misma tipografía de frase larga que .err, pero en ink-2. Nunca lleva
   fondo rojo (nunca .imp-file.err). */
.imp-file .meta.info{color:var(--ink-2);font-family:var(--f-body);letter-spacing:0;line-height:1.4}
.imp-file .meta svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.imp-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.imp-file .rm{flex:none;width:36px;height:36px;display:grid;place-items:center;background:none;border:0;color:var(--ink-3);cursor:pointer;border-radius:9px}
.imp-file .rm:hover{background:var(--surface-2);color:var(--ink-2)}
.imp-file .rm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.imp-file .act{flex:none;font-size:12px;font-weight:700;color:var(--accent);background:none;border:0;cursor:pointer;text-decoration:underline;white-space:nowrap;padding:6px 0 6px 6px}
.imp-file .row-acts{display:flex;align-items:center;flex:none}

/* C5. Tarjeta de revisión: una reserva encontrada, editable. */
.imp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);overflow:hidden}
.imp-card-hd{display:flex;align-items:flex-start;gap:10px;padding:12px 6px 10px 13px}
.imp-card-hd .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:1px}
.imp-title{border:0;background:none;padding:0;font-family:var(--f-display);font-weight:700;font-size:15.5px;color:var(--ink);width:100%;letter-spacing:-.005em}
.imp-title:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}
.imp-src{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.imp-discard{flex:none;width:36px;height:36px;display:grid;place-items:center;background:none;border:0;color:var(--ink-3);cursor:pointer;border-radius:9px;margin-top:-2px}
.imp-discard:hover{background:var(--crit-soft);color:var(--crit)}
.imp-discard svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.imp-card-bd{padding:0 13px 13px;border-top:1px solid var(--line-2);margin-top:2px;padding-top:11px;display:flex;flex-direction:column;gap:9px}
.imp-note{font-size:12px;color:var(--ink-2);line-height:1.45;padding:0 13px 12px;margin:0}

/* C6. Tarjeta de embarque: caso de coincidencia con el vuelo cargado. */
.imp-existing{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:11px}
.imp-existing .pass-icon{width:30px;height:30px;flex:none}
.imp-existing .pass-title{font-size:14px}
.imp-existing .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.imp-diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:9px 12px}
.imp-diff .field .v{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:6px;font-weight:500}

/* C7. Duda entre dos vuelos: lista de opciones tipo radio, más una salida
   explícita para "ninguno de los dos". Nunca adivina. */
.imp-choice{display:flex;flex-direction:column;gap:8px}
.imp-choice button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;cursor:pointer}
.imp-choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.imp-choice .radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none;display:grid;place-items:center;background:var(--surface)}
.imp-choice button[aria-pressed="true"] .radio{border-color:var(--accent)}
.imp-choice button[aria-pressed="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.imp-choice .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.imp-choice .t{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:-.005em}
.imp-choice .s{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.imp-choice .sep{text-align:center;font-size:11px;color:var(--ink-3);padding:1px 0}

@media print{
  .hdr,.fab,.seg,.iconbtn,.btn{display:none !important}
  body,.shell{background:#fff}
  main{padding:0}
}
</style>

/* ---------- tema: automático, claro u oscuro ----------
   Los tokens ya contemplan los tres casos. Sin atributo la página sigue al
   sistema; con data-theme la elección de la persona manda en los dos sentidos. */
const TEMA_KEY = "valija.tema";
const TEMAS = ["auto","claro","oscuro"];
const TEMA_INFO = {
  auto:   {icono:"autoTema", label:"Tema automático", ayuda:"Sigue al sistema"},
  claro:  {icono:"sol",      label:"Tema claro",      ayuda:"Siempre claro"},
  oscuro: {icono:"luna",     label:"Tema oscuro",     ayuda:"Siempre oscuro"}
};
function temaGuardado(){
  try{ const v = localStorage.getItem(TEMA_KEY); return TEMAS.includes(v) ? v : "auto"; }
  catch(e){ return "auto"; }
}
function temaAplicar(t){
  const raiz = document.documentElement;
  if(t === "claro") raiz.setAttribute("data-theme","light");
  else if(t === "oscuro") raiz.setAttribute("data-theme","dark");
  else raiz.removeAttribute("data-theme");
}
function temaCambiar(){
  const actual = temaGuardado();
  const siguiente = TEMAS[(TEMAS.indexOf(actual) + 1) % TEMAS.length];
  try{ localStorage.setItem(TEMA_KEY, siguiente); }catch(e){}
  temaAplicar(siguiente);
  toast(TEMA_INFO[siguiente].label);
  return siguiente;
}
temaAplicar(temaGuardado());

/* ---------- utilidades de fecha ---------- */
const pad = n => String(n).padStart(2,"0");
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];

function parseDT(s){ if(!s) return null; const d = new Date(s); return isNaN(d) ? null : d; }
function dayKey(s){ return s ? String(s).slice(0,10) : ""; }
function fmtDate(s){ const d=parseDT(s); if(!d) return "—"; return `${pad(d.getDate())} ${MES[d.getMonth()]}`; }
function fmtDateLong(s){ const d=parseDT(s); if(!d) return "—"; return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESL[d.getMonth()]}`; }
function fmtTime(s){ if(!s||String(s).length<=10) return null; const d=parseDT(s); if(!d) return null; return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtRange(a,b){
  const x=parseDT(a), y=parseDT(b);
  if(!x&&!y) return "Sin fechas";
  if(x&&!y) return `desde ${fmtDate(a)}`;
  if(!x&&y) return `hasta ${fmtDate(b)}`;
  const sameY = x.getFullYear()===y.getFullYear();
  return `${fmtDate(a)} – ${fmtDate(b)}${sameY?` ${String(y.getFullYear()).slice(2)}`:""}`;
}
function daysUntil(s){
  const d=parseDT(s); if(!d) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const x=new Date(d); x.setHours(0,0,0,0);
  return Math.round((x-t)/86400000);
}
function nightsBetween(a,b){
  const x=parseDT(a), y=parseDT(b); if(!x||!y) return 0;
  const d = Math.round((new Date(dayKey(b))-new Date(dayKey(a)))/86400000);
  return Math.max(0,d);
}
function addDays(iso,n){ const d=new Date(dayKey(iso)+"T12:00"); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* ============================================================
   STORE — db compartida si está; localStorage si no.
   ============================================================ */
const Store = {
  db:null, ready:false, canWrite:true, mode:"local",
  trips:new Map(), items:new Map(),  // items: tripId -> Map(itemId, item)
  subs:new Set(), itemUnsub:null, watching:null,
  // Claves de lo que ya guardamos acá y la nube todavía no devolvió.
  pending:new Set(),
  // La nube ya contestó al menos una vez. Antes de eso no sabemos si un viaje
  // existe, así que no damos por perdido lo que todavía no llegó.
  cloudSynced:false,
  // Avisa a la interfaz si la sincronización falla. La app lo cablea al arrancar.
  onSyncError:null,
  /* La escritura a la nube va por su cuenta: la pantalla ya muestra el dato y
     el teléfono ya tiene su copia. Esperarla sólo agrega una demora visible
     con mala señal. Si falla avisamos, pero no deshacemos lo guardado acá. */
  sync(promesa){
    Promise.resolve(promesa).catch(e=>{
      console.warn("sync", e);
      if(this.onSyncError) this.onSyncError(e);
    });
  },

  emit(){ this.subs.forEach(f=>{ try{f()}catch(e){console.error(e)} }); },
  on(f){ this.subs.add(f); return ()=>this.subs.delete(f); },

  async init(){
    // Lo último que vimos se pinta ya, sin esperar a la nube. En el teléfono
    // esa espera es visible y hace parecer que no se guardó nada.
    this.loadLocal(); this.ready = true; this.emit();
    try{ this.db = await claude.use("db"); }catch(e){ this.db=null; }
    if(this.db){
      this.mode = "cloud";
      // Sondeo de escritura: define si este visitante edita o sólo mira.
      try{
        await this.db.doc("meta/probe").set({at:new Date().toISOString()});
        this.canWrite = true;
      }catch(e){
        this.canWrite = (e && e.code === "invalid_argument") ? false : true;
      }
      this.db.collection("trips").onSnapshot(
        snap => {
          const next = new Map();
          snap.docs.forEach(d => next.set(d.id, {id:d.id, ...(d.data()||{})}));
          // Confirmado por la nube recién cuando vuelve en un snapshot. Si lo
          // diéramos por confirmado al resolver la escritura, un snapshot
          // anterior todavía en camino borraría el dato de la pantalla.
          next.forEach((v,k)=> this.pending.delete("trip:"+k));
          // Un viaje recién guardado puede no venir todavía en este snapshot.
          // Lo conservamos hasta que la nube lo confirme, para que no
          // desaparezca de la pantalla justo después de crearlo.
          this.trips.forEach((v,k)=>{ if(this.pending.has("trip:"+k) && !next.has(k)) next.set(k,v); });
          this.trips = next;
          this.ready = true; this.cloudSynced = true; this.saveLocal(); this.emit();
        },
        err => { console.warn("trips",err); this.ready=true; this.cloudSynced=true; this.emit(); }
      );
    }
  },

  /* --- items de un viaje --- */
  watch(tripId){
    if(this.watching === tripId) return;
    if(this.itemUnsub){ this.itemUnsub(); this.itemUnsub=null; }
    this.watching = tripId;
    if(!tripId || !this.db) { this.emit(); return; }
    this.itemUnsub = this.db.collection(`trips/${tripId}/items`).onSnapshot(
      snap => {
        const m = new Map();
        snap.docs.forEach(d => m.set(d.id, {id:d.id, ...(d.data()||{})}));
        m.forEach((v,k)=> this.pending.delete(`item:${tripId}:${k}`));
        const cur = this.items.get(tripId);
        if(cur) cur.forEach((v,k)=>{ if(this.pending.has(`item:${tripId}:${k}`) && !m.has(k)) m.set(k,v); });
        this.items.set(tripId, m); this.saveLocal(); this.emit();
      },
      err => console.warn("items",err)
    );
  },
  itemsOf(tripId){
    const m = this.items.get(tripId);
    return m ? [...m.values()] : [];
  },
  tripList(){
    return [...this.trips.values()].sort((a,b)=>{
      const A = a.startDate||"9999", B = b.startDate||"9999";
      return A.localeCompare(B);
    });
  },

  /* --- escrituras --- */
  async saveTrip(t){
    const now = new Date().toISOString();
    const doc = {...t, updatedAt:now, createdAt:t.createdAt||now};
    delete doc.id;
    // Primero acá, para que se vea al instante y quede una copia en el
    // teléfono. Después la nube.
    this.trips.set(t.id, {...doc, id:t.id}); this.saveLocal(); this.emit();
    if(this.db){
      this.pending.add("trip:"+t.id);
      this.sync(this.db.doc(`trips/${t.id}`).set(doc));
    }
  },
  async delTrip(id){
    this.trips.delete(id); this.items.delete(id); this.packing.delete(id);
    this.saveLocal(); this.emit();
    if(this.db){
      const snap = await this.db.collection(`trips/${id}/items`).get();
      await Promise.all(snap.docs.map(d => this.db.doc(`trips/${id}/items/${d.id}`).delete()));
      await this.db.doc(`trips/${id}/packing/lista`).delete().catch(()=>{});
      await this.db.doc(`trips/${id}`).delete();
    }
  },
  async saveItem(tripId, it){
    const now = new Date().toISOString();
    const doc = {...it, updatedAt:now, createdAt:it.createdAt||now};
    delete doc.id;
    if(!this.items.has(tripId)) this.items.set(tripId, new Map());
    this.items.get(tripId).set(it.id, {...doc, id:it.id});
    this.saveLocal(); this.emit();
    if(this.db){
      this.pending.add(`item:${tripId}:${it.id}`);
      this.sync(this.db.doc(`trips/${tripId}/items/${it.id}`).set(doc));
    }
  },
  async delItem(tripId, id){
    this.items.get(tripId)?.delete(id); this.saveLocal(); this.emit();
    if(this.db){ await this.db.doc(`trips/${tripId}/items/${id}`).delete(); }
  },

  /* --- valija inteligente: un documento por viaje, trips/{tripId}/packing/lista ---
     Los ítems van indexados por clave (no en array) para que marcar uno solo
     escriba esa rama y dos personas marcando cosas distintas no se pisen.
     Ver docs/design/packing-engine.md, sección 3. */
  packing:new Map(), packingUnsub:null, packingWatching:null,

  watchPacking(tripId){
    if(this.packingWatching === tripId) return;
    if(this.packingUnsub){ this.packingUnsub(); this.packingUnsub=null; }
    this.packingWatching = tripId;
    if(!tripId || !this.db){ this.emit(); return; }
    this.packingUnsub = this.db.doc(`trips/${tripId}/packing/lista`).onSnapshot(
      doc => {
        // Una lista recién generada acá puede no venir en este snapshot todavía:
        // no la borramos de la pantalla mientras la nube no la confirme.
        if(doc && doc.exists) this.pending.delete("packing:"+tripId);
        else if(this.pending.has("packing:"+tripId)) return;
        this.packing.set(tripId, (doc && doc.exists) ? (doc.data()||null) : null);
        this.saveLocal(); this.emit();
      },
      err => { console.warn("packing",err); this.emit(); }
    );
  },
  packingOf(tripId){ return this.packing.get(tripId) || null; },

  /** Escritura completa: generar o regenerar la lista entera. */
  async savePacking(tripId, list){
    this.packing.set(tripId, list); this.saveLocal(); this.emit();
    if(this.db){
      this.pending.add("packing:"+tripId);
      this.sync(this.db.doc(`trips/${tripId}/packing/lista`).set(list));
    }
  },
  /** Escritura parcial: marcar/editar UN ítem sin reescribir la lista entera.
      `patch` viene armado por PackingEngine.stateUpdatePatch(...) o equivalente,
      con la forma {items:{clave:{...campos}}, actualizadaEn}. */
  async savePackingPatch(tripId, patch){
    // El mismo merge recursivo que hace la base, aplicado acá primero para que
    // tildar un ítem se vea en el acto y quede guardado en el teléfono.
    const cur = this.packing.get(tripId) || {};
    const merged = {...cur, ...patch};
    if(patch.items){
      merged.items = {...(cur.items||{})};
      Object.keys(patch.items).forEach(k=>{
        merged.items[k] = {...(merged.items[k]||{}), ...patch.items[k]};
      });
    }
    this.packing.set(tripId, merged); this.saveLocal(); this.emit();
    if(this.db){
      this.pending.add("packing:"+tripId);
      this.sync(this.db.doc(`trips/${tripId}/packing/lista`).update(patch));
    }
  },
  /** Listas de packing de los OTROS viajes, para el aprendizaje (VAL-32) y el
      conteo de viajes por tipo del selector. Es una lectura puntual, no una
      suscripción en vivo: no hace falta que se actualice sola. */
  async packingHistory(excludeTripId){
    if(this.db){
      const ids = this.tripList().map(t=>t.id).filter(id=>id!==excludeTripId);
      const docs = await Promise.all(ids.map(id=>
        this.db.doc(`trips/${id}/packing/lista`).get()
          .then(d=> (d && d.exists) ? (d.data()||null) : null)
          .catch(()=>null)
      ));
      return docs.filter(Boolean);
    }
    return [...this.packing.entries()]
      .filter(([id])=> id!==excludeTripId)
      .map(([,v])=>v).filter(Boolean);
  },

  /* --- respaldo local --- */
  KEY:"valija.v1",
  saveLocal(){
    try{
      const items = {};
      this.items.forEach((m,k)=> items[k] = [...m.values()]);
      const packing = {};
      this.packing.forEach((v,k)=> { if(v) packing[k] = v; });
      localStorage.setItem(this.KEY, JSON.stringify({trips:[...this.trips.values()], items, packing}));
    }catch(e){}
  },
  loadLocal(){
    try{
      const raw = localStorage.getItem(this.KEY); if(!raw) return;
      const d = JSON.parse(raw);
      (d.trips||[]).forEach(t => this.trips.set(t.id,t));
      Object.entries(d.items||{}).forEach(([k,arr])=>{
        this.items.set(k, new Map(arr.map(i=>[i.id,i])));
      });
      Object.entries(d.packing||{}).forEach(([k,v])=>{ this.packing.set(k, v); });
    }catch(e){}
  }
};

/* ============================================================
   MOTOR DE PENDIENTES — qué falta y qué se viene.
   Cada tipo de reserva tiene sus campos críticos.
   ============================================================ */
const REQUIRED = {
  flight:  [["start","fecha y hora de salida"],["from","origen"],["to","destino"],["confirmation","código de reserva"],["provider","aerolínea"]],
  stay:    [["start","check-in"],["end","check-out"],["provider","alojamiento"],["address","dirección"],["confirmation","código de reserva"]],
  car:     [["start","retiro"],["end","devolución"],["provider","rentadora"],["address","lugar de retiro"],["confirmation","código de reserva"]],
  transfer:[["start","fecha y hora"],["from","origen"],["to","destino"]],
  act:     [["start","fecha"],["title","nombre"]],
  note:    [["title","título"]]
};
const OPTIONAL_NICE = {
  flight:[["seat","asiento"],["terminal","terminal"]],
  stay:[["phone","teléfono"]],
  car:[["notes","política de combustible"]]
};

function missingFields(it){
  return (REQUIRED[it.type]||[]).filter(([k])=> !String(it[k]||"").trim());
}

function tripAlerts(trip, items){
  const out = [];
  const push = (sev,t,d,itemId)=> out.push({sev,t,d,itemId});

  // 1) datos faltantes por reserva
  items.forEach(it=>{
    const miss = missingFields(it);
    if(miss.length){
      push("crit",
        `${TYPES[it.type]?.label||"Reserva"}: ${it.title||"sin nombre"}`,
        `Falta ${miss.map(m=>m[1]).join(", ")}.`, it.id);
    }
  });

  // 2) el viaje sin fechas no puede planificarse
  if(!trip.startDate || !trip.endDate){
    push("crit","El viaje no tiene fechas","Sin fechas no puedo avisarte de vencimientos ni armar la agenda por día.");
  }

  // 3) noches sin alojamiento — la alerta más útil de todas
  if(trip.startDate && trip.endDate){
    const covered = new Set();
    items.filter(i=>i.type==="stay" && i.start).forEach(i=>{
      const n = nightsBetween(i.start, i.end || i.start);
      for(let k=0;k<Math.max(1,n);k++) covered.add(addDays(i.start,k));
    });
    const gaps = [];
    const total = nightsBetween(trip.startDate, trip.endDate);
    for(let k=0;k<total;k++){
      const d = addDays(trip.startDate,k);
      if(!covered.has(d)) gaps.push(d);
    }
    if(gaps.length){
      push("warn", `${gaps.length} ${gaps.length===1?"noche":"noches"} sin alojamiento`,
        `Sin reserva: ${gaps.slice(0,3).map(fmtDate).join(", ")}${gaps.length>3?` y ${gaps.length-3} más`:""}.`);
    }
  }

  // 4) ida sin vuelta
  const flights = items.filter(i=>i.type==="flight");
  if(flights.length===1 && trip.endDate){
    push("warn","Falta el vuelo de vuelta","Cargaste sólo un tramo y el viaje tiene fecha de regreso.");
  }
  if(flights.length===0 && trip.startDate){
    push("warn","Todavía no hay vuelos","Cargá los tramos para ver el itinerario completo.");
  }

  // 5) check-in online: se abre 48 h antes
  flights.forEach(f=>{
    const dd = daysUntil(f.start);
    if(dd!==null && dd>=0 && dd<=2 && !String(f.seat||"").trim()){
      push("soon", `Check-in abierto: ${f.title||"vuelo"}`,
        dd===0?"El vuelo sale hoy y no tenés asiento cargado.":`Sale en ${dd} ${dd===1?"día":"días"}. Hacé el check-in y cargá el asiento.`, f.id);
    }
  });

  // 6) hitos cercanos
  const dd = daysUntil(trip.startDate);
  if(dd!==null && dd>=0 && dd<=14){
    push("soon", dd===0?"El viaje empieza hoy":`Faltan ${dd} ${dd===1?"día":"días"}`,
      "Revisá documentación, equipaje y traslados al aeropuerto.");
  }

  const rank = {crit:0, soon:1, warn:2};
  return out.sort((a,b)=> rank[a.sev]-rank[b.sev]);
}

function completeness(trip, items){
  let total = 0, done = 0;
  items.forEach(it=>{
    const req = REQUIRED[it.type]||[];
    total += req.length; done += req.length - missingFields(it).length;
  });
  total += 2; done += (trip.startDate?1:0) + (trip.endDate?1:0);
  if(items.length===0) return items.length ? 0 : Math.round(done/total*100);
  return Math.max(0, Math.min(100, Math.round(done/total*100)));
}

/* ---------- color de banda por viaje ---------- */
function bandColor(trip){
  const h = Number.isFinite(trip.hue) ? trip.hue : 214;
  return `hsl(${h} 62% 42%)`;
}
function routeCodes(trip, items){
  const fl = items.filter(i=>i.type==="flight" && i.from && i.to)
                  .sort((a,b)=> String(a.start||"").localeCompare(String(b.start||"")));
  if(fl.length){
    return [String(fl[0].from).toUpperCase().slice(0,3), String(fl[0].to).toUpperCase().slice(0,3)];
  }
  const dest = (trip.destination||trip.name||"").trim();
  return [null, dest ? dest.toUpperCase().slice(0,3) : "···"];
}

     3. aprendizaje del historial (learnFromHistory) — sin red, sin IA.

 * Precedencia del origen: gana el número más chico, es decir la capa
 * más básica. Si una regla ya ponía el ítem, se acredita a la regla.
 */
var ORIGEN_PRECEDENCIA = { regla:0, destino:1, historial:2, manual:3 };

/** Categorías, en el orden en que se muestran. */

/* ============================================================
   UTILIDADES
   ============================================================ */

/** Saca acentos y baja a minúsculas. Base de todos los matcheos de texto. */
function norm(s) {
  return String(s == null ? "" : s)
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase().trim();
}

/**
 * Singular de una palabra, en castellano y por heurística.
 * No busca ser gramaticalmente perfecto: busca ser determinístico y que
 * la forma singular y la plural de la misma palabra caigan en la misma clave.
 *   remeras -> remera | pantalones -> pantalon | auriculares -> auricular
 */
function singularizeWord(w) {
  if (w.length <= 3) return w;
  if (/[^aeiou]es$/.test(w)) return w.slice(0, -2);   // consonante + "es": pantalones, auriculares
  if (/[aeiou]s$/.test(w))  return w.slice(0, -1);    // vocal + "s": remeras, líquidos
  return w;
}

/**
 * Clave normalizada y estable de un ítem: minúsculas, sin acentos,
 * en singular, separada por guiones. Es lo que permite reconocer
 * "Protector Solar" de un viaje anterior como el mismo ítem que
 * "protector solar" de este.
 * @param {string} label
 * @returns {string}
 */
function slug(label) {
  return norm(label)
    .replace(/[^a-z0-9]+/g, " ").trim()
    .split(/\s+/)
    .filter(Boolean)
    .map(singularizeWord)
    .join("-");
}

function parseDay(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ""));
  if (!m) return null;
  var t = Date.UTC(+m[1], +m[2] - 1, +m[3]);
  return isNaN(t) ? null : t;
}

/**
 * Días de viaje, contando el de salida y el de regreso.
 * @returns {number|null} null si no se puede calcular.
 */
function daysBetweenInclusive(startDate, endDate) {
  var a = parseDay(startDate), b = parseDay(endDate);
  if (a == null || b == null) return null;
  var d = Math.round((b - a) / 86400000);
  return d >= 0 ? d + 1 : 1;
}

function dias(n) { return n + (n === 1 ? " día" : " días"); }
function clamp(n, lo, hi) {
  if (lo != null && n < lo) n = lo;
  if (hi != null && n > hi) n = hi;
  return n;
}
function nowISO() { return new Date().toISOString(); }
function uniq(arr) { return arr.filter(function (v, i) { return arr.indexOf(v) === i; }); }

/** Gana el origen de menor precedencia: la capa más básica. */
function lowestOrigin(a, b) {
  var pa = ORIGEN_PRECEDENCIA[a], pb = ORIGEN_PRECEDENCIA[b];
  if (pa === undefined) return b;
  if (pb === undefined) return a;
  return pa <= pb ? a : b;
}

/** Normaliza un tipo de viaje escrito de cualquier forma. */
function normalizeTripType(t) {
  var n = norm(t);
  if (!n) return null;
  if (n === "montana" || n === "montanas" || n === "sierra") return "montana";
  if (n === "negocios" || n === "laboral" || n === "work") return "trabajo";
  if (n === "city" || n === "urbano") return "ciudad";
  if (n === "beach" || n === "costa") return "playa";
  return TRIP_TYPE_KEYS.indexOf(n) >= 0 ? n : null;
}

/**
 * Los ítems de una lista como array. Acepta el objeto indexado por clave
 * (la forma que se guarda) y también un array, por si viene de una versión
 * vieja del documento o de una prueba.
 */
function itemsArray(list) {
  var items = list && list.items;
  if (!items) return [];
  if (Array.isArray(items)) return items.filter(Boolean);
  return Object.keys(items).map(function (k) {
    var it = items[k];
    return it && !it.clave ? Object.assign({ clave:k }, it) : it;
  }).filter(Boolean);
}

/** Índice por clave a partir de un array de ítems. */
function indexItems(arr) {
  var out = {};
  arr.forEach(function (i) { if (i && i.clave) out[i.clave] = i; });
  return out;
}

/**
 * @param {Object} trip
 * @param {Array} items reservas del viaje
 * @returns {{value:boolean, known:boolean, source:string, detail:string}}
 */
function deduceInternational(trip, items) {
  trip = trip || {}; items = items || [];

  if (typeof trip.international === "boolean") {
    return { value:trip.international, known:true, source:"explicito",
             detail:trip.international ? "Marcado como internacional en el viaje." : "Marcado como nacional en el viaje." };
  }

  // 1) códigos IATA de los vuelos
  var codes = [];
  items.forEach(function (it) {
    if (!it || it.type !== "flight") return;
    [it.from, it.to].forEach(function (c) {
      var v = String(c || "").trim().toUpperCase();
      if (/^[A-Z]{3}$/.test(v)) codes.push(v);
    });
  });
  codes = uniq(codes);
  var foreignCodes = codes.filter(function (c) { return !AR_IATA_SET[c]; });

  // 2) texto del destino
  var dest = norm([trip.destination, trip.name].filter(Boolean).join(" "));
  var foreignHit = dest ? FOREIGN_HINTS.filter(function (w) { return dest.indexOf(w) >= 0; })[0] : null;
  var localHit   = dest ? AR_HINTS.filter(function (w) { return dest.indexOf(w) >= 0; })[0] : null;

  if (foreignCodes.length) {
    return { value:true, known:true, source:"vuelos",
             detail:"Vuelo con código " + foreignCodes.join(", ") + ", fuera del país." };
  }
  if (foreignHit) {
    return { value:true, known:true, source:"destino", detail:"El destino dice \"" + foreignHit + "\"." };
  }
  if (codes.length) {
    return { value:false, known:true, source:"vuelos",
             detail:"Todos los vuelos son de cabotaje (" + codes.join(", ") + ")." };
  }
  if (localHit) {
    return { value:false, known:true, source:"destino", detail:"El destino dice \"" + localHit + "\"." };
  }
  return { value:false, known:false, source:"desconocido",
           detail:"No hay vuelos cargados ni un destino reconocible." };
}

/* Completa la clave que falte y fija el orden de presentación. */
BASE_RULES = BASE_RULES.map(function (r, i) {
  return Object.assign({}, r, { clave:r.clave || slug(r.nombre), orden:orderOf(r.categoria, i) });
});

/** Orden de presentación: primero la categoría, después la posición dentro de ella. */
function orderOf(categoria, sub) {
  var c = CATEGORY_ORDER[categoria];
  return (c === undefined ? 90 : c) * 1000 + sub;
}

/**
 * Chequeo de integridad del catálogo de reglas. Lo corre la prueba.
 * @returns {string[]} lista de problemas. Vacía = catálogo sano.
 */
function validateRules(rules) {
  rules = rules || BASE_RULES;
  var problems = [], ids = {}, claves = {};
  rules.forEach(function (r) {
    if (!r.id) problems.push("regla sin id: " + JSON.stringify(r));
    if (ids[r.id]) problems.push("id repetido: " + r.id);
    ids[r.id] = true;
    if (claves[r.clave]) problems.push("clave repetida: " + r.clave + " (" + r.id + ")");
    claves[r.clave] = true;
    if (!r.nombre) problems.push("regla sin nombre: " + r.id);
    if (CATEGORY_ORDER[r.categoria] === undefined) problems.push("categoría desconocida en " + r.id + ": " + r.categoria);
    if (!r.motivo) problems.push("regla sin motivo: " + r.id);
  });
  return problems;
}

/* ============================================================
   EVALUADOR DE CONDICIONES Y CANTIDADES
   ============================================================ */

/**
 * Evalúa una condición declarativa contra el contexto del viaje.
 * Operadores: international, tripTypes, notTripTypes, minDays, maxDays,
 * facts (todos), anyFacts (alguno), notFacts (ninguno), all, any, not, test.
 * @param {Object|Function|null} cond
 * @param {Object} ctx
 * @returns {boolean}
 */
function matchesCondition(cond, ctx) {
  if (cond == null) return true;
  if (typeof cond === "function") return !!cond(ctx);
  if (Array.isArray(cond)) return cond.every(function (c) { return matchesCondition(c, ctx); });

  if (cond.international !== undefined && ctx.international !== cond.international) return false;
  if (cond.tripTypes && cond.tripTypes.indexOf(ctx.tripType) < 0) return false;
  if (cond.notTripTypes && cond.notTripTypes.indexOf(ctx.tripType) >= 0) return false;
  if (cond.minDays !== undefined && !(ctx.days >= cond.minDays)) return false;
  if (cond.maxDays !== undefined && !(ctx.days <= cond.maxDays)) return false;
  if (cond.facts && !cond.facts.every(function (f) { return !!ctx.facts[f]; })) return false;
  if (cond.anyFacts && !cond.anyFacts.some(function (f) { return !!ctx.facts[f]; })) return false;
  if (cond.notFacts && !cond.notFacts.every(function (f) { return !ctx.facts[f]; })) return false;
  if (cond.all && !cond.all.every(function (c) { return matchesCondition(c, ctx); })) return false;
  if (cond.any && !cond.any.some(function (c) { return matchesCondition(c, ctx); })) return false;
  if (cond.not && matchesCondition(cond.not, ctx)) return false;
  if (cond.test && !cond.test(ctx)) return false;
  return true;
}

/**
 * Resuelve la cantidad de un ítem a partir de la duración del viaje.
 * @param {number|Object|undefined} spec {fixed} | {perDay|everyDays, extra, min, max}
 * @param {Object} ctx
 * @returns {{qty:number|null, raw:number|null, capped:boolean}}
 */
function computeQty(spec, ctx) {
  if (spec == null) return { qty:null, raw:null, capped:false };
  if (typeof spec === "number") return { qty:spec, raw:spec, capped:false };
  if (spec.fixed != null) return { qty:spec.fixed, raw:spec.fixed, capped:false };

  var base = 0;
  if (spec.perDay != null) base = ctx.days * spec.perDay;
  else if (spec.everyDays) base = ctx.days / spec.everyDays;
  var raw = Math.ceil(base) + (spec.extra || 0);
  var qty = clamp(raw, spec.min, spec.max);
  return { qty:qty, raw:raw, capped:qty !== raw };
}

function resolveReason(motivo, qty, ctx, calc) {
  if (typeof motivo === "function") return String(motivo(qty, ctx, calc) || "");
  return String(motivo || "");
}

/* ============================================================
   CONTEXTO DEL VIAJE
   ============================================================ */

/**
 * Arma el contexto sobre el que se evalúan todas las reglas.
 * @param {Object} trip   viaje {id,name,destination,startDate,endDate,notes,international?}
 * @param {Array}  items  reservas del viaje
 * @param {Object} [opts] {tipoViaje} para forzar el tipo elegido por la persona
 * @returns {Object} contexto
 */
function tripContext(trip, items, opts) {
  trip = trip || {}; items = (items || []).filter(Boolean); opts = opts || {};

  var textBlob = norm([
    trip.name, trip.destination, trip.notes,
    items.map(function (i) { return [i.title, i.notes, i.provider].filter(Boolean).join(" "); }).join(" ")
  ].filter(Boolean).join(" "));

  var intl = deduceInternational(trip, items);
  var realDays = daysBetweenInclusive(trip.startDate, trip.endDate);
  var daysKnown = realDays != null;
  var days = daysKnown ? realDays : DEFAULT_DAYS;

  var ctx = {
    trip:trip, items:items, textBlob:textBlob,
    destination:String(trip.destination || "").trim(),
    startDate:trip.startDate || "", endDate:trip.endDate || "",
    days:days, nights:Math.max(0, days - 1), daysKnown:daysKnown,
    international:intl.value, internationalKnown:intl.known,
    internationalSource:intl.source, internationalDetail:intl.detail,
    facts:{}, tripType:null, tripTypeSource:"sugerido", tripTypeReason:""
  };

  Object.keys(FACTS).forEach(function (name) {
    try { ctx.facts[name] = !!FACTS[name].test(ctx); } catch (e) { ctx.facts[name] = false; }
  });

  var chosen = normalizeTripType(opts.tipoViaje || opts.tripType);
  if (chosen) {
    ctx.tripType = chosen; ctx.tripTypeSource = "elegido"; ctx.tripTypeReason = "Lo elegiste al generar la lista.";
  } else {
    var s = suggestTripType(trip, items, ctx);
    ctx.tripType = s.type; ctx.tripTypeSource = "sugerido"; ctx.tripTypeReason = s.reason; ctx.tripTypeConfidence = s.confidence;
  }
  return ctx;
}

/* ============================================================
   TIPO DE VIAJE SUGERIDO
   VAL-30: el tipo se propone según palabras clave del destino, las
   notas del viaje y la duración. NO compara este viaje contra otros
   viajes guardados: eso es lo que hace learnFromHistory (capa 3),
   sobre los ÍTEMS, no sobre el tipo.
   ============================================================ */

var TYPE_HINTS = [
  { type:"playa",    words:["playa","caribe","cancun","punta del este","copacabana","florianopolis","buzios","riviera","maldivas","bali","ibiza","mar del plata","pinamar","carilo","varadero","punta cana","camboriu","costa","isla","snorkel","balneario","aruba","curazao"] },
  { type:"montana",  words:["bariloche","ushuaia","cerro","aspen","andes","alpes","chapelco","angostura","chalten","calafate","nepal","cusco","montana","valle nevado","portillo","las lenas","ski","esqui","nieve","refugio","glaciar","el bolson","pucon"] },
  { type:"ciudad",   words:["madrid","paris","nueva york","new york","londres","roma","tokio","berlin","barcelona","santiago","montevideo","lisboa","amsterdam","milan","praga","budapest","ciudad","museo","teatro","capital"] },
  { type:"trabajo",  words:["congreso","conferencia","reunion","cliente","capacitacion","workshop","feria","summit","oficina","trabajo","laboral","entrevista"] },
  { type:"aventura", words:["trekking","senderismo","kayak","escalada","safari","camping","mochilero","rafting","selva","desierto","aventura","expedicion"] }
];

/**
 * Propone un tipo de viaje mirando el destino, las reservas y la duración.
 * Mira SÓLO este viaje (palabras clave y días); no compara con otros viajes.
 * @param {Object} trip
 * @param {Array} items
 * @param {Object} [ctx] contexto ya armado, para no recalcularlo
 * @returns {{type:string, confidence:"alta"|"media"|"baja", reason:string}}
 */
function suggestTripType(trip, items, ctx) {
  trip = trip || {}; items = items || [];
  var blob = ctx ? ctx.textBlob : norm([
    trip.name, trip.destination, trip.notes,
    items.map(function (i) { return [i.title, i.notes].filter(Boolean).join(" "); }).join(" ")
  ].filter(Boolean).join(" "));

  var days = ctx ? ctx.days : (daysBetweenInclusive(trip.startDate, trip.endDate) || DEFAULT_DAYS);
  var daysKnown = ctx ? ctx.daysKnown : daysBetweenInclusive(trip.startDate, trip.endDate) != null;

  var scores = {}, hits = {};
  TYPE_HINTS.forEach(function (h) {
    var found = h.words.filter(function (w) { return blob.indexOf(w) >= 0; });
    if (found.length) { scores[h.type] = found.length; hits[h.type] = found; }
  });

  var ranked = Object.keys(scores).sort(function (a, b) { return scores[b] - scores[a]; });

  if (ranked.length) {
    var top = ranked[0];
    // dos familias fuertes a la vez: es un viaje mixto
    if (ranked.length > 1 && scores[ranked[1]] === scores[top]) {
      return { type:"mixto", confidence:"media",
               reason:"El viaje mezcla " + TRIP_TYPE_LABEL[top].toLowerCase() + " y " + TRIP_TYPE_LABEL[ranked[1]].toLowerCase() + "." };
    }
    return { type:top, confidence:scores[top] >= 2 ? "alta" : "media",
             reason:"Por \"" + hits[top][0] + "\" en el viaje." };
  }
  if (!daysKnown) return { type:"mixto", confidence:"baja", reason:"Sin fechas ni pistas del destino, armo una lista mixta." };
  if (days <= 4) return { type:"ciudad", confidence:"baja", reason:"Viaje corto de " + dias(days) + ", sin otras pistas." };
  return { type:"mixto", confidence:"baja", reason:"Viaje de " + dias(days) + " sin pistas del destino." };
}

/* ============================================================
   CAPA 3 · APRENDIZAJE DEL HISTORIAL  (VAL-32)
   ============================================================ */

function bump(map, clave, item) {
  var e = map.get(clave);
  if (!e) { e = { clave:clave, nombre:item.nombre || clave, categoria:item.categoria || "otros", veces:0 }; map.set(clave, e); }
  e.veces++;
  if (item.nombre) e.nombre = item.nombre;              // el rótulo más reciente gana
  if (item.categoria) e.categoria = item.categoria;
  return e;
}

/**
 * Mira las listas de viajes anteriores del mismo tipo y decide qué promover
 * y qué suprimir. Un ítem cuenta una sola vez por viaje.
 *
 * Precedencia: si un ítem fue agregado a mano dos veces Y descartado dos veces,
 * gana la promoción. Agregarlo a mano es una acción más costosa que descartarlo,
 * así que es la señal más fuerte.
 *
 * @param {Array<Object>} history listas guardadas de viajes anteriores
 * @param {string} tipoViaje tipo del viaje que se está armando
 * @returns {{tipoViaje:string, muestra:number, promover:Array, suprimir:Array}}
 */
function learnFromHistory(history, tipoViaje) {
  var added = new Map(), dismissed = new Map(), muestra = 0;
  var tipo = normalizeTripType(tipoViaje);

  (history || []).forEach(function (list) {
    if (!list) return;
    var arr = itemsArray(list);
    if (!arr.length) return;
    if (normalizeTripType(list.tipoViaje || list.tripType) !== tipo) return;
    muestra++;
    var seenAdd = {}, seenDis = {};
    arr.forEach(function (it) {
      if (!it) return;
      var clave = it.clave || slug(it.nombre || it.label);
      if (!clave) return;
      if (it.origen === ORIGEN.MANUAL && !seenAdd[clave]) { seenAdd[clave] = true; bump(added, clave, it); }
      if (it.estado === ESTADO.DESCARTADO && !seenDis[clave]) { seenDis[clave] = true; bump(dismissed, clave, it); }
    });
  });

  var promover = [];
  added.forEach(function (e) { if (e.veces >= HISTORY_PROMOTE_AT) promover.push(e); });
  var promoverClaves = promover.reduce(function (m, e) { m[e.clave] = true; return m; }, {});

  var suprimir = [];
  dismissed.forEach(function (e) {
    if (e.veces >= HISTORY_SUPPRESS_AT && !promoverClaves[e.clave]) suprimir.push(e);
  });

  var porVeces = function (a, b) { return b.veces - a.veces || a.clave.localeCompare(b.clave); };
  return { tipoViaje:tipo, muestra:muestra, promover:promover.sort(porVeces), suprimir:suprimir.sort(porVeces) };
}

/* ============================================================
   ARMADO DE LA LISTA  (CAPA 1 + CAPA 3)
   ============================================================ */

function makeItem(fields, at) {
  return {
    clave:fields.clave,
    nombre:fields.nombre,
    categoria:fields.categoria || "otros",
    cantidad:fields.cantidad == null ? null : fields.cantidad,
    motivo:fields.motivo || "",
    origen:fields.origen || ORIGEN.REGLA,
    estado:ESTADO.PENDIENTE,
    empacadoEn:null,
    regla:fields.regla || "",
    cantidadEditada:false,
    nota:"",
    orden:fields.orden == null ? orderOf(fields.categoria, 500) : fields.orden,
    agregadoEn:at,
    actualizadoEn:at
  };
}

/**
 * Los ítems de la lista, ordenados y listos para mostrar.
 * @param {Object} list
 * @param {Object} [opts] {includeDismissed:true} para incluir los descartados
 * @returns {Array}
 */
function itemList(list, opts) {
  opts = opts || {};
  return itemsArray(list)
    .filter(function (i) { return opts.includeDismissed ? true : i.estado !== ESTADO.DESCARTADO; })
    .sort(function (a, b) {
      if (a.orden !== b.orden) return (a.orden || 0) - (b.orden || 0);
      return String(a.nombre).localeCompare(String(b.nombre), "es");
    });
}

/**
 * Contador de la lista. El porcentaje mide cuánto de la lista la persona ya
 * RESOLVIÓ, no cuánto entra en el bolso: descartar es una decisión tomada,
 * tan resuelta como empacar. Por eso entra en `resueltos` y en el `pct`,
 * y por eso `total` incluye los descartados en vez de restarlos.
 *
 * Corregido con el producto en la mano: sumar el descartado al total dejaba el
 * contador trabado, porque descartabas algo y el "de 42" no bajaba nunca. Lo
 * descartado sale del total: dejó de ser parte de la valija. El motivo de
 * arriba se cumple igual, porque descartar sube el porcentaje al achicar lo
 * que falta, en vez de sumar al numerador.
 *
 *     total     = todos los ítems MENOS los descartados
 *     resueltos = empacados
 *     pct       = empacados / total    (100 si se descartó todo)
 *
 * `totalConDescartados` conserva el total crudo, para la barra y para poder
 * recuperar lo descartado.
 *
 * @param {Object} list
 * @returns {{total:number, empacados:number, descartados:number, pendientes:number, resueltos:number, pct:number}}
 */
function packingProgress(list) {
  var arr = itemsArray(list);
  var empacados = arr.filter(function (i) { return i.estado === ESTADO.EMPACADO; }).length;
  var descartados = arr.filter(function (i) { return i.estado === ESTADO.DESCARTADO; }).length;
  /* Lo descartado sale del total. Si alguien decidió que algo no va, dejó de
     ser parte de su valija: no tiene que inflar el denominador ni quedar como
     un pendiente eterno. Descartar igual hace avanzar el porcentaje, porque
     achica lo que falta. */
  var total = arr.length - descartados;
  var pendientes = total - empacados;
  return {
    total:total,
    empacados:empacados,
    descartados:descartados,
    pendientes:pendientes,
    resueltos:empacados,
    totalConDescartados:arr.length,
    pct:total ? Math.round(empacados / total * 100) : (arr.length ? 100 : 0)
  };
}

/**
 * CAPA 1 + CAPA 3. Genera la lista base, sin IA y sin red.
 *
 * @param {Object}  input
 * @param {Object}  input.trip       viaje
 * @param {Array}   [input.items]    reservas del viaje
 * @param {string}  [input.tipoViaje] tipo elegido por la persona; si falta se sugiere
 * @param {Array}   [input.history]  listas guardadas de viajes anteriores
 * @param {Object}  [input.previous] lista ya guardada de este viaje, para regenerar sin perder nada
 * @param {string}  [input.now]      timestamp ISO, para pruebas determinísticas
 * @returns {Object} documento de lista, listo para guardar
 */
function buildPackingList(input) {
  input = input || {};
  var at = input.now || nowISO();
  var trip = input.trip || {};
  var items = input.items || [];
  var ctx = tripContext(trip, items, { tipoViaje:input.tipoViaje || input.tripType });
  var aprendido = learnFromHistory(input.history, ctx.tripType);

  var suprimidos = aprendido.suprimir.reduce(function (m, e) { m[e.clave] = e; return m; }, {});
  var out = {}, orden = 0;

  BASE_RULES.forEach(function (rule) {
    if (!matchesCondition(rule.when, ctx)) return;
    if (suprimidos[rule.clave]) return;                     // VAL-32: descartado dos veces
    var calc = computeQty(rule.cantidad, ctx);
    out[rule.clave] = makeItem({
      clave:rule.clave, nombre:rule.nombre, categoria:rule.categoria,
      cantidad:calc.qty, motivo:resolveReason(rule.motivo, calc.qty, ctx, calc),
      origen:ORIGEN.REGLA, regla:rule.id, orden:rule.orden
    }, at);
  });

  aprendido.promover.forEach(function (e, i) {
    // PRECEDENCIA: si una regla base ya lo puso, el origen sigue siendo "regla".
    if (out[e.clave]) return;
    out[e.clave] = makeItem({
      clave:e.clave, nombre:e.nombre, categoria:e.categoria || "otros", cantidad:null,
      motivo:"Lo agregaste a mano en " + e.veces + " viajes de " + (TRIP_TYPE_LABEL[ctx.tripType] || ctx.tripType).toLowerCase() + ".",
      origen:ORIGEN.HISTORIAL, regla:"historial", orden:orderOf(e.categoria || "otros", 900 + i)
    }, at);
  });

  var avisos = [];
  if (!ctx.daysKnown) avisos.push({ codigo:"sin-fechas",
    texto:"El viaje no tiene fechas: calculé las cantidades sobre " + dias(DEFAULT_DAYS) + ". Cargá salida y regreso para ajustarlas." });
  if (!ctx.internationalKnown) avisos.push({ codigo:"destino-desconocido",
    texto:"No pude deducir si el viaje es internacional. Cargá los vuelos o el destino para que aparezca la documentación que corresponde." });

  var fresh = {
    version:VERSION,
    tripId:trip.id || "",
    tipoViaje:ctx.tripType,
    creadaEn:at, generadaEn:at, actualizadaEn:at,
    base:{
      destino:ctx.destination, desde:ctx.startDate, hasta:ctx.endDate,
      dias:ctx.days, noches:ctx.nights, diasConocidos:ctx.daysKnown,
      internacional:ctx.international, internacionalConocido:ctx.internationalKnown,
      internacionalFuente:ctx.internationalSource, internacionalDetalle:ctx.internationalDetail,
      tipoViajeFuente:ctx.tripTypeSource, tipoViajeMotivo:ctx.tripTypeReason,
      hechos:ctx.facts
    },
    capaInteligente:{ estado:"sin-ajuste", en:null, nota:"Lista base, sin ajuste por destino.", clima:"" },
    aprendizaje:{ muestra:aprendido.muestra, promovidos:aprendido.promover, suprimidos:aprendido.suprimir },
    avisos:avisos,
    items:out,
    conteo:null
  };
  fresh.conteo = packingProgress(fresh);

  return input.previous ? mergeLists(input.previous, fresh) : fresh;
}

/**
 * VAL-30: generar dos veces no duplica ni pierde nada.
 *
 * Garantiza que regenerar NO:
 *   - resucita un ítem descartado (el estado de la lista anterior manda),
 *   - pisa el origen de un ítem ya presente con uno de mayor precedencia,
 *   - pierde lo empacado, su `empacadoEn`, las notas, las cantidades
 *     corregidas a mano ni los ítems propios.
 *
 * @param {Object} previous lista guardada
 * @param {Object} fresh    lista recién generada
 * @returns {Object} lista fusionada
 */
function mergeLists(previous, fresh) {
  if (!previous) return fresh;
  var prev = indexItems(itemsArray(previous));
  if (!Object.keys(prev).length) return fresh;

  var merged = {};

  itemsArray(fresh).forEach(function (f) {
    var p = prev[f.clave];
    if (!p) { merged[f.clave] = f; return; }
    merged[f.clave] = Object.assign({}, f, {
      // el estado de la persona manda: lo descartado no revive, lo empacado sigue empacado
      estado:ESTADOS.indexOf(p.estado) >= 0 ? p.estado : ESTADO.PENDIENTE,
      empacadoEn:p.empacadoEn || null,
      // PRECEDENCIA: nunca se pisa el origen con una capa de mayor precedencia
      origen:lowestOrigin(p.origen, f.origen),
      nota:p.nota || "",
      cantidad:p.cantidadEditada ? p.cantidad : f.cantidad,
      cantidadEditada:!!p.cantidadEditada,
      motivo:p.cantidadEditada ? (p.motivo || f.motivo) : f.motivo,
      agregadoEn:p.agregadoEn || f.agregadoEn,
      actualizadoEn:fresh.generadaEn
    });
  });

  // Lo que la persona tocó o agregó sobrevive aunque la regla ya no aplique.
  // Incluye los descartados: si desaparecieran, la próxima generación los resucitaría.
  itemsArray(previous).forEach(function (p) {
    if (merged[p.clave]) return;
    if (p.origen === ORIGEN.MANUAL || p.estado !== ESTADO.PENDIENTE) {
      merged[p.clave] = Object.assign({}, p, { retenido:true });
    }
  });

  var out = Object.assign({}, fresh, {
    creadaEn:previous.creadaEn || fresh.creadaEn,
    items:merged
  });
  out.conteo = packingProgress(out);
  return out;
}

/* ============================================================

   El módulo no llama a claude.use. Recibe una función asíncrona
