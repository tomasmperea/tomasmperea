function cardTrip(t){
  const items = Store.itemsOf(t.id);
  const [from,to] = routeCodes(t, items);
  const pct = completeness(t, items);
  const alerts = tripAlerts(t, items);
  const crit = alerts.filter(a=>a.sev==="crit").length;
  const soon = alerts.filter(a=>a.sev==="soon").length;
  const dd = daysUntil(t.startDate);
  const ringCls = pct>=85?"":(pct>=50?"warn":"low");
  const C = 2*Math.PI*14.5;

  const chips = [];
  if(dd!==null && dd>=0 && dd<=30) chips.push(`<span class="chip live">${dd===0?"hoy":`en ${dd} d`}</span>`);
  if(crit) chips.push(`<span class="chip alert">${crit} sin completar</span>`);
  if(!crit && soon) chips.push(`<span class="chip soon">${soon} por hacer</span>`);
  if(!crit && !soon && items.length) chips.push(`<span class="chip ok">listo</span>`);
  if(items.length) chips.push(`<span class="chip">${items.length} ${items.length===1?"reserva":"reservas"}</span>`);
  if(t.sample) chips.push(`<span class="chip accent">ejemplo</span>`);

  return `
  <button class="tag-card" data-trip="${esc(t.id)}" style="--band:${bandColor(t)}">
    <div class="tag-band"><span>${esc((t.destination||t.name||"VIAJE").toUpperCase().slice(0,14))}</span></div>
    <div class="tag-body">
      <div>
        <div class="route">
          ${from?`<span class="code">${esc(from)}</span><span class="dash"></span>`:""}
          ${svg(I.planeSmall)}
          <span class="dash"></span><span class="code">${esc(to)}</span>
        </div>
      </div>
      <span class="trip-name">${esc(t.name||"Viaje sin nombre")}</span>
      <div class="tag-meta">
        <div style="min-width:0;display:flex;flex-direction:column;gap:6px">
          <span class="dates">${esc(fmtRange(t.startDate,t.endDate))}</span>
          <div class="chips">${chips.join("")}</div>
        </div>
        <div class="ring ${ringCls}" title="${pct}% completo">
          <svg viewBox="0 0 34 34">
            <circle class="bg" cx="17" cy="17" r="14.5"></circle>
            <circle class="fg" cx="17" cy="17" r="14.5"
              stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct/100)).toFixed(1)}"></circle>
          </svg>
          <b>${pct}</b>
        </div>
      </div>
    </div>
  </button>`;
}

function viewPlan(trip, items){
  if(!items.length){
    return `<div class="empty">
      <div class="ico">✈️</div>
      <h3>Todavía no hay nada cargado</h3>
      <p>Agregá el primer vuelo, o pegá el mail de confirmación en <b>Importar</b> y lo interpreto por vos.</p>
    </div>`;
  }
  // agrupar por día
  const groups = new Map();
  const undated = [];
  items.forEach(it=>{
    const k = dayKey(it.start);
    if(!k){ undated.push(it); return; }
    if(!groups.has(k)) groups.set(k,[]);
    groups.get(k).push(it);
  });
  const keys = [...groups.keys()].sort();
  const base = trip.startDate ? dayKey(trip.startDate) : keys[0];

  let html = "";
  keys.forEach(k=>{
    const list = groups.get(k).sort((a,b)=> String(a.start||"").localeCompare(String(b.start||"")));
    const n = base ? Math.round((new Date(k)-new Date(base))/86400000)+1 : null;
    html += `<div class="day">
      <div class="day-head">
        ${n&&n>0?`<span class="day-n">Día ${n}</span>`:""}
        <span class="day-date">${esc(fmtDateLong(k))}</span>
        <span class="day-rule"></span>
      </div>
      ${list.map(it=>cardItem(it)).join("")}
    </div>`;
  });
  if(undated.length){
    html += `<div class="day">
      <div class="day-head"><span class="day-n" style="background:var(--ink-3)">Sin fecha</span><span class="day-rule"></span></div>
      ${undated.map(it=>cardItem(it)).join("")}
    </div>`;
  }
  return html;
}

function cardItem(it){
  const T = TYPES[it.type] || TYPES.note;
  const miss = missingFields(it);
  const t1 = fmtTime(it.start), t2 = fmtTime(it.end);

  // El talón muestra los datos propios del tipo de reserva.
  // Tercer valor: true = campo obligatorio, se muestra aunque esté vacío.
  let stub = [];
  if(it.type==="flight"){
    stub = [
      ["Vuelo", it.flightNumber || it.provider, true],
      ["Ruta", (it.from||it.to) ? (it.from||"—")+" → "+(it.to||"—") : "", true],
      ["Reserva", it.confirmation, true],
      ["Asiento", it.seat, false],
      ["Terminal", it.terminal, false],
      ["Puerta", it.gate, false]
    ];
  } else if(it.type==="stay"){
    stub = [
      ["Alojamiento", it.provider, true],
      ["Check-in", t1 || (it.start?fmtDate(it.start):""), true],
      ["Check-out", t2 || (it.end?fmtDate(it.end):""), true],
      ["Noches", nightsBetween(it.start,it.end) || "", false],
      ["Reserva", it.confirmation, true],
      ["Dirección", it.address, true]
    ];
  } else if(it.type==="car"){
    stub = [
      ["Rentadora", it.provider, true],
      ["Retiro", it.start?fmtDate(it.start):"", true],
      ["Devolución", it.end?fmtDate(it.end):"", true],
      ["Reserva", it.confirmation, true],
      ["Lugar", it.address, true]
    ];
  } else {
    stub = [
      ["Dónde", it.address || it.to, false],
      ["Reserva", it.confirmation, false],
      ["Proveedor", it.provider, false]
    ];
  }
  stub = stub.filter(([,v,req]) => v || req);

  const cost = it.cost ? `<span class="chip">${esc(it.currency||"")} ${esc(it.cost)}</span>` : "";
  const missChip = miss.length ? `<span class="chip alert">falta ${miss.length}</span>` : "";

  const stubHtml = stub.length ? `<div class="pass-stub">${stub.map(([k,v])=>`
    <div class="field"><span class="k">${esc(k)}</span>
    <span class="v ${v?"":"miss"}">${v?esc(v):"pendiente"}</span></div>`).join("")}</div>` : "";


  return `<div class="pass">
    <button class="pass-main" data-item="${esc(it.id)}">
      <span class="pass-icon ${T.cls}">${svg(T.icon)}</span>
      <span class="pass-txt">
        <span class="pass-title">${esc(it.title || T.label)}</span>
        <span class="pass-when">${esc(T.label)}${it.provider?` · ${esc(it.provider)}`:""}</span>
        <span class="chips">${missChip}${cost}</span>
      </span>
      ${t1?`<span class="pass-time">${t1}${t2?`<small>a ${t2}</small>`:""}</span>`:""}
    </button>
    ${stubHtml}
  </div>`;
}

function viewTodo(trip, alerts){
  if(!alerts.length){
    return `<div class="empty">
      <div class="ico">🎉</div>
      <h3>No falta nada</h3>
      <p>Todas las reservas están completas y no hay vencimientos cerca. Buen viaje.</p>
    </div>`;
  }
  const color = {crit:"var(--crit)", soon:"var(--flap)", warn:"var(--warn)"};
  const label = {crit:"Falta cargar", soon:"Para hacer ya", warn:"Revisar"};
  const groups = ["crit","soon","warn"].map(sev=>{
    const list = alerts.filter(a=>a.sev===sev);
    if(!list.length) return "";
    return `<div class="stack">
      <div class="sec-head"><span class="eyebrow">${label[sev]}</span><span class="eyebrow">${list.length}</span></div>
      ${list.map(a=>`
        <div class="alert-row" style="--sev:${color[sev]}">
          <span class="alert-dot"></span>
          <div class="body"><div class="t">${esc(a.t)}</div><div class="d">${esc(a.d)}</div></div>
          ${a.itemId?`<button class="go" data-goto="${esc(a.itemId)}">abrir</button>`:""}
        </div>`).join("")}
    </div>`;
  }).join("");

  return groups + `
    <div class="notice" style="margin-top:4px">${svg(I.bell)}
      <div>Los avisos por correo llegan en la próxima iteración. Por ahora este panel es tu checklist y viaja con el link compartido.</div>
    </div>`;
}

/* ============================================================
   VALIJA INTELIGENTE — pantalla propia (VAL-30..33)
   No es una pestaña del segmentado: `App.view==="packing"` es una
   tercera vista del router, hermana de "trip", que reusa `App.tripId`.
   Ver docs/design/valija-inteligente.md, sección 5.3.

   Estado efímero de esta pantalla, en memoria, NO en el documento
   guardado: qué categorías se abrieron/cerraron a mano, si se está
   generando, si el aviso de "recién ajustado por destino" ya se
   mostró, y el tipo de viaje elegido a mano en el selector.
   ============================================================ */
let PK = { tripId:null, generating:false, justEnriched:false, openCats:{}, adding:null, pickingType:false, selectedType:null, typeCounts:null };
function resetPKIfNeeded(tripId){
  if(PK.tripId !== tripId){
    PK = { tripId, generating:false, justEnriched:false, openCats:{}, adding:null, pickingType:false, selectedType:null, typeCounts:null };
  }
}

function packingHeader(trip, list, opts){
  opts = opts || {};
  const tagParts = [trip.destination, (list && !opts.noType) ? TYPE_LABEL[list.tipoViaje] : null].filter(Boolean);
  const tagTxt = tagParts.length ? tagParts.join(" · ") : "Valija";
  return `<div class="hdr-row">
    <button class="iconbtn" id="pk-back" aria-label="Volver">${svg(I.back)}</button>
    <div class="brand"><h1 style="font-size:19px">Valija</h1><span class="tag">${esc(tagTxt)}</span></div>
    ${opts.info===false ? "" : `<button class="iconbtn" id="pk-info" aria-label="De dónde sale esta lista">${svg(I.info)}</button>`}
  </div>`;
}
function bindPackingHeader(trip, onInfo){
  document.getElementById("pk-back").onclick = ()=> go(`#/trip/${trip.id}`);
  const infoBtn = document.getElementById("pk-info");
  if(infoBtn) infoBtn.onclick = onInfo || (()=>{});
}

function pkProgHtml(list){
  const c = PackingEngine.packingProgress(list);
  const pctPack = c.total ? c.empacados/c.total*100 : 100;
  const full = c.total>0 ? c.pendientes===0 : c.descartados>0;
  const text = full
    ? `<b>${c.empacados}</b> de ${c.total}${c.descartados?` · ${c.descartados} descartados`:""}`
    : `<b>${c.empacados}</b> de ${c.total} · faltan ${c.pendientes}`;
  return `<span class="pk-prog ${full?"full":""}" role="progressbar" aria-valuemin="0" aria-valuemax="${c.total}"
      aria-valuenow="${c.empacados}" aria-valuetext="${c.empacados} de ${c.total} empacados${c.descartados?`, ${c.descartados} descartados`:""}">
    <span class="pk-bar"><i class="p" style="width:${pctPack}%"></i></span>
    <span class="n">${text}</span>
  </span>`;
}

function pkRowHtml(it, trip, canWrite){
  const ST_MAP = {pendiente:"pend", empacado:"pack", descartado:"drop"};
  const st = ST_MAP[it.estado] || "pend";
  const drop = st === "drop";
  const src = srcChip(it, trip);
  const stateIcon = st==="drop" ? svg(I.dash) : (st==="pack" || canWrite) ? svg(I.check) : "";
  const why = drop ? "" : `<span class="pk-why"><span class="${src.cls}">${esc(src.tx)}</span>${it.motivo?`<span class="r">${esc(it.motivo)}</span>`:""}</span>`;
  const nm = `<span class="pk-nm"><span class="t">${esc(it.nombre)}</span>${it.cantidad?`<span class="q">×${esc(it.cantidad)}</span>`:""}</span>`;

  if(!canWrite){
    return `<div class="pk-row" data-st="${st}">
      <span class="pk-slide">
        <span class="pk-mark" style="cursor:default"><span class="pk-state">${stateIcon}</span></span>
        <span class="pk-txt" style="cursor:default;padding-right:14px">${nm}${why}</span>
      </span>
    </div>`;
  }
  return `<div class="pk-row" data-st="${st}" data-row="${esc(it.clave)}">
    <span class="pk-swipe">${svg(I.ban)} Descartar</span>
    <span class="pk-slide">
      <button class="pk-mark" data-mark="${esc(it.clave)}"
              aria-label="${esc(it.nombre)}: ${esc(it.estado)}. ${drop?"Volver a la lista":"Marcar como empacado"}">
        <span class="pk-state">${stateIcon}</span>
      </button>
      <button class="pk-txt" data-detail="${esc(it.clave)}">${nm}${why}</button>
      ${drop
        ? `<button class="pk-back" data-mark="${esc(it.clave)}">volver</button>`
        : `<button class="pk-drop" data-dropbtn="${esc(it.clave)}" aria-label="Descartar ${esc(it.nombre)}">${svg(I.ban)}</button>`}
    </span>
  </div>`;
}

function pkCategoryHtml(cat, trip, canWrite){
  const pend = cat.items.filter(i=>i.estado==="pendiente").length;
  const packed = cat.items.filter(i=>i.estado==="empacado").length;
  const dropped = cat.items.filter(i=>i.estado==="descartado").length;
  const full = cat.items.length>0 && pend===0;
  // Una categoría sin pendientes se pliega sola, salvo que tenga algo
  // descartado: ahí sigue habiendo algo que mirar (el botón "volver").
  const open = PK.openCats[cat.key] !== undefined ? PK.openCats[cat.key] : (!full || dropped>0);
  const icon = CAT_ICON[cat.key] || "doc";
  return `<div class="pk-cat ${full?"full":""}" data-open="${open}">
    <button class="pk-cat-hd" aria-expanded="${open}" data-cat="${esc(cat.key)}">
      <span class="pk-cat-ico">${svg(I[icon])}</span>
      <span class="nm">${esc(cat.label)}</span>
      <span class="cnt">${full?`<span class="chip ok">listo</span>`:`${packed} de ${cat.items.length - dropped}`}</span>
      ${svg(I.chevd,"chev")}
    </button>
    <div class="pk-body-wrap">
      ${cat.items.map(it=>pkRowHtml(it,trip,canWrite)).join("")}
      ${canWrite ? (PK.adding===cat.key
        ? `<div class="pk-addform">
             <input id="pk-add-${esc(cat.key)}" placeholder="Qué te falta" autocomplete="off">
             <button class="btn primary sm" data-pksave="${esc(cat.key)}">Agregar</button>
           </div>`
        : `<button class="pk-add" data-pkadd="${esc(cat.key)}">${svg(I.plus)} Agregar a ${esc(cat.label.toLowerCase())}</button>`) : ""}
    </div>
  </div>`;
}

/* ---------- generar / regenerar ---------- */
async function runGenerate(trip, tipoViaje, previous){
  const items = Store.itemsOf(trip.id);
  let history = [];
  try{ history = await Store.packingHistory(trip.id); }catch(e){ history = []; }
  const base = PackingEngine.buildPackingList({ trip, items, tipoViaje, history });
  const interim = previous ? PackingEngine.mergeLists(previous, base) : base;

  if(PK.tripId === trip.id) PK.generating = true;
  try{ await Store.savePacking(trip.id, interim); }
  catch(e){
    toast(writeErr(e), true);
    if(PK.tripId === trip.id){ PK.generating = false; render(); }
    return;
  }
  if(PK.tripId === trip.id) render();

  let sample = null;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  const ask = sample ? (prompt) => sample.json(prompt, { modelTier:"complex" }) : null;

  let enriched;
  try{ enriched = await PackingEngine.enrichWithDestination(base, ask); }
  catch(e){ enriched = base; }

  // Mezclamos contra lo que haya guardado AHORA (no contra `interim` de más
  // arriba): si mientras la IA respondía la persona ya marcó o descartó algo,
  // esa acción no se pierde al guardar el resultado final.
  const latest = Store.packingOf(trip.id) || interim;
  const final = PackingEngine.mergeLists(latest, enriched);

  if(PK.tripId === trip.id){
    PK.generating = false;
    PK.justEnriched = !!(final.capaInteligente && final.capaInteligente.estado === "ok");
  }
  try{ await Store.savePacking(trip.id, final); }
  catch(e){ toast(writeErr(e), true); }
  if(PK.tripId === trip.id) render();
}

async function applyItemState(trip, list, clave, estado){
  PK.justEnriched = false;   // tocar un ítem también da por leído el aviso de ajuste por destino
  try{
    const patch = PackingEngine.stateUpdatePatch(clave, estado);
    await Store.savePackingPatch(trip.id, patch);
  }catch(e){ toast(writeErr(e), true); }
}

function bindPackingRows(main, trip, list, canWrite){
  main.querySelectorAll("[data-cat]").forEach(b=>{
    b.onclick = ()=>{
      const catEl = b.parentElement;
      PK.openCats[b.dataset.cat] = catEl.dataset.open !== "true";
      render();
    };
  });

  if(!canWrite) return;

  main.querySelectorAll("[data-mark]").forEach(b=> b.onclick = ()=>{
    const clave = b.dataset.mark, it = list.items[clave]; if(!it) return;
    delete PK.openCats[it.categoria];
    const next = it.estado === "pendiente" ? "empacado" : "pendiente";
    applyItemState(trip, list, clave, next);
  });
  main.querySelectorAll("[data-dropbtn]").forEach(b=> b.onclick = ()=>{
    const clave = b.dataset.dropbtn, it = list.items[clave]; if(!it) return;
    delete PK.openCats[it.categoria];
    applyItemState(trip, list, clave, "descartado");
  });
  main.querySelectorAll("[data-detail]").forEach(b=> b.onclick = ()=>{
    sheetPackingItem(trip, list, b.dataset.detail);
  });
  main.querySelectorAll("[data-pkadd]").forEach(b=> b.onclick = ()=>{
    PK.adding = b.dataset.pkadd; render();
    setTimeout(()=> document.getElementById("pk-add-"+PK.adding)?.focus(), 0);
  });
  main.querySelectorAll("[data-pksave]").forEach(b=> b.onclick = async ()=>{
    const cat = b.dataset.pksave;
    const inp = document.getElementById("pk-add-"+cat);
    const nombre = (inp.value||"").trim();
    PK.adding = null;
    if(!nombre){ render(); return; }
    const updated = PackingEngine.addManualItem(list, {nombre, categoria:cat});
    try{ await Store.savePacking(trip.id, updated); }
    catch(e){ toast(writeErr(e), true); render(); }
  });
  main.querySelectorAll(".pk-addform input").forEach(inp=>{
    inp.onkeydown = e=>{
      if(e.key==="Enter") main.querySelector("[data-pksave]")?.click();
      if(e.key==="Escape"){ PK.adding=null; render(); }
    };
  });

  /* deslizar: izquierda descarta, derecha marca/desmarca. Sin puntería. */
  main.querySelectorAll(".pk-row[data-row]").forEach(row=>{
    const slide = row.querySelector(".pk-slide");
    let x0=null, dx=0;
    row.addEventListener("pointerdown", e=>{
      if(e.pointerType==="mouse" && e.button!==0) return;
      x0 = e.clientX; dx = 0; slide.style.transition = "none";
    });
    row.addEventListener("pointermove", e=>{
      if(x0===null) return;
      dx = e.clientX - x0;
      if(Math.abs(dx) > 6) slide.style.transform = `translateX(${Math.max(-120, Math.min(120, dx))}px)`;
    });
    const end = ()=>{
      if(x0===null) return;
      slide.style.transition = ""; slide.style.transform = "";
      const clave = row.dataset.row, it = list.items[clave];
      const localDx = dx; x0 = null; dx = 0;
      if(!it) return;
      if(localDx < -70){ delete PK.openCats[it.categoria]; applyItemState(trip, list, clave, "descartado"); }
      else if(localDx > 70){ delete PK.openCats[it.categoria]; applyItemState(trip, list, clave, it.estado==="empacado" ? "pendiente" : "empacado"); }
    };
    row.addEventListener("pointerup", end);
    row.addEventListener("pointercancel", end);
    row.addEventListener("pointerleave", end);
    row.addEventListener("click", e=>{ if(Math.abs(dx) > 10){ e.preventDefault(); e.stopPropagation(); } }, true);
  });
}

/* ---------- 03: sin fechas ---------- */
function renderPackingBlocked(trip){

  $main.innerHTML = `<div class="empty" style="padding:26px 20px">
    <h3>Necesito las fechas del viaje</h3>
    <p>Las cantidades salen de los días que te quedás. Cargá la salida y el regreso y armo la lista.</p>
  </div>`;
  if(Store.canWrite){
    $fab.innerHTML = `<div class="fab"><button class="btn primary block" id="pk-dates">${svg(I.edit)} Cargar las fechas</button></div>`;
    document.getElementById("pk-dates").onclick = ()=> sheetTrip(trip);
  } else {
    $fab.innerHTML = "";
  }
}

/* ---------- 01/02: selector de tipo de viaje (también "cambiar el tipo") ---------- */
function typeSelectorFab(trip, list){
  if(!list){
    return `<div class="fab"><button class="btn primary block" id="pk-build" ${Store.canWrite?"":"disabled"}>${svg(I.spark)} Armar la lista</button></div>`;
  }
  return `<div class="fab"><button class="btn block" id="pk-canceltype">Cancelar</button><button class="btn primary block" id="pk-confirmtype" ${Store.canWrite?"":"disabled"}>${svg(I.spark)} Usar este tipo</button></div>`;
}

function renderTypeSelector(trip, list){
  $hdr.innerHTML = packingHeader(trip, null, {info:false});
  bindPackingHeader(trip);

  const items = Store.itemsOf(trip.id);
  const ctx = PackingEngine.tripContext(trip, items, {});
  const suggested = ctx.tripType;
  const chosen = PK.selectedType || (list ? list.tipoViaje : suggested);

  const [, toCode] = routeCodes(trip, items);
  const chips = [
    toCode ? `<span class="chip accent">${esc(toCode)}</span>` : "",
    `<span class="chip">${esc(fmtRange(trip.startDate, trip.endDate))}</span>`,
    `<span class="chip">${ctx.days} ${ctx.days===1?"día":"días"}</span>`,
    trip.travelers ? `<span class="chip">${esc(trip.travelers)}</span>` : ""
  ].filter(Boolean).join("");

  const counts = PK.typeCounts || {};
  const rows = PackingEngine.TRIP_TYPES.map(t=>{
    const n = counts[t.key];
    const pressed = chosen === t.key;
    return `<button type="button" aria-pressed="${pressed}" class="${n?"used":""}" data-t="${t.key}">
      ${svg(I[TYPE_ICON[t.key]])} ${esc(t.label)} <span class="n">${n?`${n} ${n===1?"viaje":"viajes"}`:"—"}</span></button>`;
  }).join("");

  const suggestedLabel = TYPE_LABEL[suggested] || suggested;
  const hint = chosen === suggested
    ? `Te propongo <b>${esc(suggestedLabel)}</b>: ${esc(ctx.tripTypeReason || "por el destino y las fechas del viaje.")}${counts[suggested] ? ` Ya usaste ese tipo en ${counts[suggested]} ${counts[suggested]===1?"viaje":"viajes"} anteriores.` : ""}`
    : "";
  const warnBlock = (chosen !== suggested) ? `<div class="notice warn">
      ${svg(I.info)}
      <span class="bd">Con <b>${esc(TYPE_LABEL[chosen])}</b> ${counts[chosen] ? `tengo ${counts[chosen]} ${counts[chosen]===1?"viaje":"viajes"} tuyos de ese tipo` : "arranco casi de cero"}. En <b>${esc(suggestedLabel)}</b> ${counts[suggested] ? `ya tengo ${counts[suggested]}` : "no tengo ninguno"}: ${esc(ctx.tripTypeReason)}
        <button class="act" id="pk-usesugg">Usar ${esc(suggestedLabel)}</button></span>
    </div>` : "";

  $main.innerHTML = `
    <div class="pk-inputs">${chips}</div>
    ${!list ? `<div class="empty" style="padding:24px 20px">
      <h3>Todavía no armaste la valija</h3>
      <p>Te propongo qué llevar según el destino, las fechas, los días que te quedás y lo que agregaste a mano en viajes del mismo tipo. Todo lo que sugiera lo podés sacar.</p>
    </div>` : ""}
    <div class="f">
      <label>Tipo de viaje</label>
      <div class="tp tp3" id="pk-tp">${rows}</div>
      ${hint ? `<span class="hint">${hint}</span>` : ""}
    </div>
    ${warnBlock}
  `;

  $fab.innerHTML = typeSelectorFab(trip, list);

  document.querySelectorAll("#pk-tp [data-t]").forEach(b=>{
    b.onclick = ()=>{ PK.selectedType = b.dataset.t; render(); };
  });
  const useSugg = document.getElementById("pk-usesugg");
  if(useSugg) useSugg.onclick = ()=>{ PK.selectedType = suggested; render(); };

  if(!list){
    const build = document.getElementById("pk-build");
    if(build && Store.canWrite){
      build.onclick = ()=>{ const t = chosen; PK.selectedType = null; runGenerate(trip, t, null); };
    }
  } else {
    const cancel = document.getElementById("pk-canceltype");
    const confirm = document.getElementById("pk-confirmtype");
    if(cancel) cancel.onclick = ()=>{ PK.pickingType = false; PK.selectedType = null; render(); };
    if(confirm && Store.canWrite){
      confirm.onclick = ()=>{ const t = chosen; PK.pickingType = false; PK.selectedType = null; runGenerate(trip, t, list); };
    }
  }

  if(!PK.typeCounts){
    Store.packingHistory(trip.id).then(hist=>{
      const c = {};
      hist.forEach(l=>{ if(l && l.tipoViaje) c[l.tipoViaje] = (c[l.tipoViaje]||0)+1; });
      PK.typeCounts = c;
      if(PK.tripId===trip.id) render();
    });
  }
}

/* ---------- 04/06/07/08/09/10: la lista, en todos sus estados ---------- */
function renderPackingBoard(trip, list){
  const canWrite = Store.canWrite;
  const generating = PK.generating;
  const c = PackingEngine.packingProgress(list);
  const complete = c.total>0 && c.pendientes===0;
  const cap = list.capaInteligente || {};

  const degradedChip = (!generating && (cap.estado==="no-disponible" || cap.estado==="error"))
    ? `<span class="chip">sin ajuste por destino</span>` : "";
  const readonlyChip = !canWrite ? `<span class="chip soon">sólo lectura</span>` : "";

  $hdr.innerHTML = packingHeader(trip, list) + `<div class="hdr-sub">${pkProgHtml(list)}${degradedChip}${readonlyChip}</div>`;
  bindPackingHeader(trip, ()=> sheetPackingInfo(trip, list));

  const destino = trip.destination || "tu destino";
  let notices = "";
  if(generating){
    notices += `<div class="notice"><span class="spin"></span><span class="bd">Buscando lo específico de ${esc(destino)}…</span></div>`;
  } else {
    // Se muestra hasta que se cierra a mano o hasta la próxima acción sobre
    // un ítem (marcar/descartar): no se apaga sola en el primer re-render,
    // porque guardar dispara más de un render seguido (local y en la nube).
    if(PK.justEnriched && cap.estado==="ok"){
      notices += `<div class="notice ok">${svg(I.spark)}<span class="bd">${esc(cap.nota||"Ajusté la lista al destino.")}</span>
        <button class="x" aria-label="Cerrar" id="pk-closefresh">${svg(I.x)}</button></div>`;
    }
    if(cap.estado==="no-disponible" || cap.estado==="error"){
      notices += `<div class="notice warn">${svg(I.info)}<span class="bd">Armé la lista con las reglas de siempre. No pude ajustarla a ${esc(destino)}, así que puede faltarte algo del lugar.
        ${canWrite?`<button class="act" id="pk-retry">Probar de nuevo</button>`:""}</span></div>`;
    }
    if(complete){
      const typeLbl = (TYPE_LABEL[list.tipoViaje]||"").toLowerCase();
      notices += `<div class="notice ok">${svg(I.check2)}<span class="bd">Valija lista.${c.descartados?` Los ${c.descartados} que descartaste ya quedaron anotados para tu próximo viaje${typeLbl?` de ${typeLbl}`:""}.`:""}</span></div>`;
    }
    if(!canWrite){
      notices += `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Para marcar lo tuyo necesitás permiso de edición.</span></div>`;
    }
  }

  const grouped = PackingEngine.groupByCategory(list, {includeDismissed:true});
  const groups = grouped.map(g=> pkCategoryHtml(g, trip, canWrite));
  const destGroupExists = grouped.some(g=>g.key==="destino");

  const skeletonCat = (generating && !destGroupExists) ? `
    <div class="pk-cat" data-open="true">
      <div class="pk-cat-hd">
        <span class="pk-cat-ico">${svg(I.globe)}</span>
        <span class="nm">Específicos de ${esc(destino)}</span>
        <span class="cnt sk" style="width:38px;height:12px;border-radius:5px;display:inline-block"></span>
        ${svg(I.chevd,"chev")}
      </div>
      <div class="pk-body-wrap">
        <div class="pk-row loading"><span class="sk" style="width:52%"></span><span class="sk" style="width:74%"></span></div>
        <div class="pk-row loading"><span class="sk" style="width:41%"></span><span class="sk" style="width:66%"></span></div>
        <div class="pk-row loading"><span class="sk" style="width:58%"></span><span class="sk" style="width:47%"></span></div>
      </div>
    </div>` : "";

  $main.innerHTML = notices + groups.join("") + skeletonCat;

  if(canWrite && !generating){
    $fab.innerHTML = `<div class="fab"><button class="btn primary block" id="pk-additem">${svg(I.plus)} Agregar ítem</button></div>`;
    document.getElementById("pk-additem").onclick = ()=> sheetAddPackingItem(trip, list);
  } else {
    $fab.innerHTML = "";
  }

  bindPackingRows($main, trip, list, canWrite);

  const closeFresh = document.getElementById("pk-closefresh");
  if(closeFresh) closeFresh.onclick = ()=> render();
  const retry = document.getElementById("pk-retry");
  if(retry) retry.onclick = ()=> runGenerate(trip, list.tipoViaje, list);
}

/* ---------- despachador de estados ---------- */
function renderPacking(trip){
  resetPKIfNeeded(trip.id);
  const list = Store.packingOf(trip.id);
  const hasDates = !!(trip.startDate && trip.endDate);

  if(!list && !hasDates && !PK.pickingType){ renderPackingBlocked(trip); return; }
  if((!list && hasDates) || PK.pickingType){ renderTypeSelector(trip, list); return; }
  renderPackingBoard(trip, list);
}

const $modal = document.getElementById("modal");
function closeSheet(){ $modal.innerHTML = ""; }
function openSheet(title, bodyHtml, footHtml){
  $modal.innerHTML = `
    <div class="scrim" id="scrim">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="sheet-hd">
          <h2>${esc(title)}</h2>
          <button class="iconbtn" id="closeSheet" aria-label="Cerrar">${svg(I.x)}</button>
        </div>
        <div class="sheet-bd">${bodyHtml}</div>
        ${footHtml?`<div class="sheet-ft">${footHtml}</div>`:""}
      </div>
    </div>`;
  document.getElementById("closeSheet").onclick = closeSheet;
  document.getElementById("scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeSheet(); });
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

function toast(msg, err){
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="toast ${err?"err":""}">${esc(msg)}</div>`;
  setTimeout(()=>{ t.innerHTML=""; }, err?4200:2600);
}
const val = id => (document.getElementById(id)?.value || "").trim();

/* ---------- viaje ---------- */
function sheetTrip(trip){
  const t = trip || {id:uid(), hue: Math.floor(Math.random()*360)};
  openSheet(trip?"Editar viaje":"Nuevo viaje", `
    <div class="f req"><label for="t_name">Nombre del viaje</label>
      <input id="t_name" value="${esc(t.name||"")}" placeholder="Vacaciones en el sur" autocomplete="off"></div>
    <div class="f"><label for="t_dest">Destino principal</label>
      <input id="t_dest" value="${esc(t.destination||"")}" placeholder="Bariloche" autocomplete="off">
      <span class="hint">Se usa en la etiqueta de la valija y en el PDF.</span></div>
    <div class="f2">
      <div class="f"><label for="t_from">Salida</label><input id="t_from" type="date" value="${esc(dayKey(t.startDate))}"></div>
      <div class="f"><label for="t_to">Regreso</label><input id="t_to" type="date" value="${esc(dayKey(t.endDate))}"
        ${t.startDate?`min="${esc(addDays(t.startDate,1))}"`:""}></div>
    </div>
    <div class="f"><label for="t_people">Quiénes viajan</label>
      <input id="t_people" value="${esc(t.travelers||"")}" placeholder="Tomás, Ana y Juli" autocomplete="off"></div>
    <div class="f"><label for="t_notes">Notas</label>
      <textarea id="t_notes" placeholder="Presupuesto, ideas, links sueltos...">${esc(t.notes||"")}</textarea></div>
    ${trip?`<hr class="hr"><button class="btn danger block" id="deltrip">${svg(I.trash)} Eliminar este viaje</button>`:""}
  `, `
    <button class="btn ghost" id="cancel">Cancelar</button>
    <button class="btn primary" id="save">Guardar</button>
  `);

  document.getElementById("cancel").onclick = closeSheet;
  // Elegir la salida limita el calendario de regreso ahí mismo: es mejor que el
  // día inválido no se pueda elegir, a explicar después por qué no sirve.
  const fIni = document.getElementById("t_from"), fFin = document.getElementById("t_to");
  if(fIni && fFin) fIni.onchange = ()=>{
    if(!fIni.value){ fFin.removeAttribute("min"); return; }
    fFin.min = addDays(fIni.value, 1);
    if(fFin.value && fFin.value <= fIni.value) fFin.value = "";
  };
  document.getElementById("save").onclick = async ()=>{
    const name = val("t_name");
    if(!name){ toast("Poné un nombre al viaje", true); return; }
    const from = val("t_from"), to = val("t_to");
    if(from && to && to <= from){ toast("El regreso tiene que ser después de la salida", true); return; }
    try{
      await Store.saveTrip({...t, name, destination:val("t_dest"),
        startDate:from, endDate:to, travelers:val("t_people"), notes:val("t_notes"), sample:t.sample||false});
      closeSheet();
      if(!trip) go(`#/trip/${t.id}`);
      toast(trip?"Viaje actualizado":"Viaje creado");
    }catch(e){ toast(writeErr(e), true); }
  };
  const dl = document.getElementById("deltrip");
  if(dl) dl.onclick = async ()=>{
    dl.disabled = true;
    try{ await Store.delTrip(t.id); closeSheet(); go(""); toast("Viaje eliminado"); }
    catch(e){ dl.disabled = false; toast(writeErr(e), true); }
  };
}

function writeErr(e){
  if(e && e.code === "invalid_argument") return "Tenés acceso de sólo lectura a esta valija";
  if(e && e.code === "quota_exceeded") return "La valija llegó a su límite de reservas";
  // Quedó guardado en este teléfono aunque no haya podido sincronizar: decirlo
  // evita que la persona cargue todo de nuevo pensando que se perdió.
  return "Guardado en este dispositivo. No se pudo sincronizar todavía";
}

function sheetItem(trip, item, prefill){
  const it = item || Object.assign({id:uid(), type:"flight"}, prefill||{});

  const fieldsFor = type => {
    const common = `

    const notes = `<div class="f"><label for="i_notes">Notas</label><textarea id="i_notes" placeholder="Lo que no quieras olvidarte">${esc(it.notes||"")}</textarea></div>`;

        <div class="f req"><label for="i_to">Destino (IATA)</label><input id="i_to" class="mono" value="${esc(it.to||"")}" placeholder="MAD" maxlength="4" autocomplete="off" style="text-transform:uppercase"></div>
      </div>
      <div class="f2">
        <div class="f req"><label for="i_start">Sale</label><input id="i_start" type="datetime-local" value="${esc(it.start||"")}"></div>
        <div class="f"><label for="i_end">Llega</label><input id="i_end" type="datetime-local" value="${esc(it.end||"")}"></div>
      </div>
      <div class="f2">
        <div class="f req"><label for="i_provider">Aerolínea</label><input id="i_provider" value="${esc(it.provider||"")}" placeholder="JetSmart" autocomplete="off"></div>
        <div class="f"><label for="i_flight">Nº de vuelo</label><input id="i_flight" class="mono" value="${esc(it.flightNumber||"")}" placeholder="JA 3040" autocomplete="off"></div>
      </div>
      <div class="f req"><label for="i_conf">Código de reserva</label><input id="i_conf" class="mono" value="${esc(it.confirmation||"")}" placeholder="XKD9P2" autocomplete="off" style="text-transform:uppercase"></div>
      <div class="f2">
        <div class="f"><label for="i_seat">Asiento</label><input id="i_seat" class="mono" value="${esc(it.seat||"")}" placeholder="14A" autocomplete="off"></div>
        <div class="f"><label for="i_terminal">Terminal</label><input id="i_terminal" class="mono" value="${esc(it.terminal||"")}" placeholder="T4" autocomplete="off"></div>
      </div>
      <div class="f"><label for="i_gate">Puerta</label><input id="i_gate" class="mono" value="${esc(it.gate||"")}" placeholder="B12" autocomplete="off"></div>
      ${money}${notes}`;

    if(type==="stay") return common + `
      <div class="f2">
        <div class="f req"><label for="i_start">Check-in</label><input id="i_start" type="datetime-local" value="${esc(it.start||"")}"></div>
        <div class="f req"><label for="i_end">Check-out</label><input id="i_end" type="datetime-local" value="${esc(it.end||"")}"></div>
      </div>
      <div class="f req"><label for="i_provider">Alojamiento / plataforma</label><input id="i_provider" value="${esc(it.provider||"")}" placeholder="Booking · Hotel Atocha" autocomplete="off"></div>
      <div class="f req"><label for="i_address">Dirección</label><input id="i_address" value="${esc(it.address||"")}" placeholder="Calle Atocha 123, Madrid" autocomplete="off"></div>
      <div class="f req"><label for="i_conf">Código de reserva</label><input id="i_conf" class="mono" value="${esc(it.confirmation||"")}" autocomplete="off"></div>
      <div class="f"><label for="i_phone">Teléfono</label><input id="i_phone" class="mono" value="${esc(it.phone||"")}" autocomplete="off"></div>
      ${money}${notes}`;

    if(type==="car") return common + `
      <div class="f2">
        <div class="f req"><label for="i_start">Retiro</label><input id="i_start" type="datetime-local" value="${esc(it.start||"")}"></div>
        <div class="f req"><label for="i_end">Devolución</label><input id="i_end" type="datetime-local" value="${esc(it.end||"")}"></div>
      </div>
      <div class="f req"><label for="i_provider">Rentadora</label><input id="i_provider" value="${esc(it.provider||"")}" placeholder="Hertz" autocomplete="off"></div>
      <div class="f req"><label for="i_address">Lugar de retiro</label><input id="i_address" value="${esc(it.address||"")}" placeholder="Aeropuerto de Madrid T4" autocomplete="off"></div>
      <div class="f req"><label for="i_conf">Código de reserva</label><input id="i_conf" class="mono" value="${esc(it.confirmation||"")}" autocomplete="off"></div>
      ${money}${notes}`;

    if(type==="transfer") return common + `
      <div class="f2">
        <div class="f req"><label for="i_from">Desde</label><input id="i_from" value="${esc(it.from||"")}" autocomplete="off"></div>
        <div class="f req"><label for="i_to">Hasta</label><input id="i_to" value="${esc(it.to||"")}" autocomplete="off"></div>

      <div class="f"><label for="i_conf">Código de reserva</label><input id="i_conf" class="mono" value="${esc(it.confirmation||"")}" autocomplete="off"></div>
      ${money}${notes}`;

    if(type==="act") return common + `
      <div class="f2">
        <div class="f req"><label for="i_start">Cuándo</label><input id="i_start" type="datetime-local" value="${esc(it.start||"")}"></div>
        <div class="f"><label for="i_end">Termina</label><input id="i_end" type="datetime-local" value="${esc(it.end||"")}"></div>
      </div>
      <div class="f"><label for="i_address">Dónde</label><input id="i_address" value="${esc(it.address||"")}" autocomplete="off"></div>

      ${money}${notes}`;

    return common + `
      <div class="f"><label for="i_start">Fecha (opcional)</label><input id="i_start" type="datetime-local" value="${esc(it.start||"")}"></div>
      ${notes}`;
  };

  const picker = `<div class="f"><label>Tipo de reserva</label><div class="tp" id="tp">

  </div></div>`;

  openSheet(item?"Editar reserva":"Nueva reserva",
    picker + `<div id="fields">${fieldsFor(it.type)}</div>` +
    (item?`<hr class="hr"><button class="btn danger block" id="delitem">${svg(I.trash)} Eliminar</button>`:""),
    `<button class="btn ghost" id="cancel">Cancelar</button>
     <button class="btn primary" id="save">Guardar</button>`);

  const bind = ()=>{
    document.querySelectorAll("#tp button").forEach(b=>{
      b.onclick = ()=>{
        it.type = b.dataset.t;
        collect();
        document.querySelectorAll("#tp button").forEach(x=> x.setAttribute("aria-pressed", x.dataset.t===it.type));
        document.getElementById("fields").innerHTML = fieldsFor(it.type);
      };
    });
  };
  const collect = ()=>{
    const g = id => document.getElementById(id)?.value?.trim();
    const up = id => (g(id)||"").toUpperCase();
    if(document.getElementById("i_title")!==null){
      it.title = g("i_title"); it.start = g("i_start"); it.end = g("i_end");
      it.provider = g("i_provider"); it.confirmation = up("i_conf");
      it.address = g("i_address"); it.notes = g("i_notes");
      it.cost = g("i_cost"); it.currency = up("i_cur");
      it.seat = up("i_seat"); it.terminal = up("i_terminal"); it.gate = up("i_gate");
      it.flightNumber = up("i_flight"); it.phone = g("i_phone");
      if(it.type==="flight"){ it.from = up("i_from"); it.to = up("i_to"); }
      else { it.from = g("i_from"); it.to = g("i_to"); }
    }
  };
  bind();

  document.getElementById("cancel").onclick = closeSheet;
  document.getElementById("save").onclick = async ()=>{
    collect();
    if(!it.title){ toast("Poné un título", true); return; }
    if(it.start && it.end && it.end < it.start){ toast("La fecha de fin es anterior a la de inicio", true); return; }

      await Store.saveItem(trip.id, it);
      closeSheet(); toast(item?"Reserva actualizada":"Reserva guardada");
    }catch(e){ toast(writeErr(e), true); }
  };
  const di = document.getElementById("delitem");
  if(di) di.onclick = async ()=>{
    di.disabled = true;
    try{ await Store.delItem(trip.id, it.id); closeSheet(); toast("Reserva eliminada"); }
    catch(e){ di.disabled = false; toast(writeErr(e), true); }
  };
}

/* ---------- importador con IA ---------- */
async function sheetImport(trip){
  let sample = null, limits = null;
  try{ sample = await claude.use("sample"); }catch(e){}
  if(sample){ try{ limits = await sample.limits(); }catch(e){} }

  const canImg = !!(limits && limits.images);
  openSheet("Importar reserva", `
    <div class="notice">${svg(I.spark)}
      <div>Pegá el mail de confirmación de Booking, Hertz, JetSmart o quien sea. Lo leo y completo los campos por vos.</div>
    </div>
    ${!sample?`<div class="notice warn">${svg(I.info)}<div>La lectura automática no está disponible en esta vista. Cargá la reserva a mano desde <b>Agregar</b>.</div></div>`:`
      <div class="f"><label for="im_text">Texto de la confirmación</label>
        <textarea id="im_text" class="mono" style="min-height:150px" placeholder="Tu reserva está confirmada&#10;Vuelo JA 3040 · EZE → MAD&#10;12 de octubre, 22:40&#10;Código: XKD9P2"></textarea>
        <span class="hint">Podés pegar varias reservas juntas. Las separo yo.</span>
      </div>
      ${canImg?`
        <div class="f"><label for="im_img">O subí una foto</label>
          <input id="im_img" type="file" accept="${limits.images.mediaTypes.join(",")}" ${limits.images.maxCount>1?"multiple":""}>
          <span class="hint">Tarjeta de embarque, voucher del hotel, el contrato del auto. Hasta ${limits.images.maxCount} ${limits.images.maxCount===1?"imagen":"imágenes"}.</span>
        </div>`:""}
      <div id="im_out"></div>
    `}
  `, sample?`
    <button class="btn ghost" id="cancel">Cancelar</button>
    <button class="btn primary" id="run">${svg(I.spark)} Interpretar</button>`:`
    <button class="btn block" id="cancel">Cerrar</button>`);

  document.getElementById("cancel").onclick = closeSheet;
  if(!sample) return;

  document.getElementById("run").onclick = async ()=>{
    const text = val("im_text");
    const files = document.getElementById("im_img")?.files;
    const hasImg = files && files.length;
    if(!text && !hasImg){ toast("Pegá el texto o subí una foto", true); return; }

    const btn = document.getElementById("run");
    btn.disabled = true;
    btn.innerHTML = `<span class="spin"></span> Leyendo…`;
    const out = document.getElementById("im_out");
    out.innerHTML = `<div class="notice">${svg(I.spark)}<div>Interpretando la reserva…</div></div>`;

    const hoy = new Date().toISOString().slice(0,10);
    const prompt = `Extraés datos de reservas de viaje y devolvés SOLO JSON.

${hasImg ? "Las imágenes adjuntas son comprobantes de viaje (tarjeta de embarque, voucher de hotel, contrato de alquiler de auto). Leelas." : ""}
${text ? `Texto de la confirmación:\n"""\n${text.slice(0,12000)}\n"""` : ""}

Contexto: el viaje se llama "${trip.name||""}"${trip.destination?`, destino ${trip.destination}`:""}${trip.startDate?`, entre ${trip.startDate} y ${trip.endDate||"?"}`:""}. Hoy es ${hoy}.

Devolvé este JSON exacto:
{"items":[{
"type":"flight|stay|car|transfer|act|note",
"title":"texto corto y humano, ej: Buenos Aires → Madrid",
"start":"YYYY-MM-DDTHH:mm o vacío",
"end":"YYYY-MM-DDTHH:mm o vacío",
"from":"IATA de 3 letras si es vuelo, si no ciudad o lugar",
"to":"idem",
"provider":"aerolínea, hotel, plataforma o rentadora",
"flightNumber":"","confirmation":"","seat":"","terminal":"","gate":"",
"address":"","phone":"","cost":"","currency":"","notes":""
}]}

Reglas: un objeto por reserva; ida y vuelta son DOS vuelos separados. Usá 24 horas. Si un dato no aparece, dejá "" (nunca inventes códigos ni horarios). Para alojamiento, start es el check-in y end el check-out. Si el año no figura, deducilo del contexto del viaje.`;

    try{
      const data = await sample.json(hasImg ? prompt : prompt, {
        images: hasImg ? files : undefined,
        modelTier: "complex"
      });
      const found = (data && Array.isArray(data.items)) ? data.items.filter(x=>x && (x.title||x.provider)) : [];
      if(!found.length){
        out.innerHTML = `<div class="notice warn">${svg(I.info)}<div>No pude reconocer ninguna reserva ahí. Probá pegando el mail completo, o cargala a mano.</div></div>`;
        btn.disabled=false; btn.innerHTML = `${svg(I.spark)} Interpretar`;
        return;
      }
      out.innerHTML = `<div class="notice">${svg(I.info)}<div>Encontré ${found.length} ${found.length===1?"reserva":"reservas"}. Revisá antes de guardar.</div></div>
        <div class="stack" style="margin-top:10px">${found.map((f,i)=>`
          <div class="pass"><div class="pass-main" style="cursor:default">
            <span class="pass-icon ${TYPES[f.type]?.cls||"note"}">${svg(TYPES[f.type]?.icon||I.note)}</span>
            <span class="pass-txt">
              <span class="pass-title">${esc(f.title||"Reserva")}</span>
              <span class="pass-when">${esc(TYPES[f.type]?.label||"Nota")}${f.provider?` · ${esc(f.provider)}`:""}${f.start?` · ${esc(fmtDate(f.start))}`:""}</span>
            </span>
          </div></div>`).join("")}</div>`;

      btn.innerHTML = `Guardar ${found.length===1?"la reserva":`las ${found.length}`}`;
      btn.disabled = false;
      btn.onclick = async ()=>{
        btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Guardando…`;
        try{
          for(const f of found){
            const type = TYPES[f.type] ? f.type : "note";
            await Store.saveItem(trip.id, {
              id: uid(), type,
              title:f.title||"", start:f.start||"", end:f.end||"",
              from:(f.from||"").toUpperCase(), to:(f.to||"").toUpperCase(),
              provider:f.provider||"", flightNumber:(f.flightNumber||"").toUpperCase(),
              confirmation:(f.confirmation||"").toUpperCase(), seat:(f.seat||"").toUpperCase(),
              terminal:(f.terminal||"").toUpperCase(), gate:(f.gate||"").toUpperCase(),
              address:f.address||"", phone:f.phone||"", cost:f.cost||"",
              currency:(f.currency||"").toUpperCase(), notes:f.notes||"", source:"import"
            });
          }
          closeSheet();
          toast(`${found.length} ${found.length===1?"reserva agregada":"reservas agregadas"}`);
        }catch(e){ toast(writeErr(e), true); btn.disabled=false; btn.innerHTML="Guardar"; }
      };
    }catch(e){
      const code = e && e.code;
      const msg = code==="not_granted" ? "La lectura automática no está habilitada en esta vista."
        : code==="rate_limited" ? "Demasiados pedidos seguidos. Esperá un momento."
        : code==="images_unavailable" ? "Esta vista no acepta imágenes. Pegá el texto."
        : code==="image_rejected" ? "No pude leer esa imagen. Probá con otra foto o pegá el texto."
        : "No pude interpretar la reserva. Cargala a mano.";
      out.innerHTML = `<div class="notice warn">${svg(I.info)}<div>${esc(msg)}</div></div>`;
      btn.disabled=false; btn.innerHTML = `${svg(I.spark)} Interpretar`;
    }
  };
}

    alerts.length ? `Pendientes (${alerts.length}):` : "Sin pendientes.",

  openSheet("Compartir el viaje", `
    <div class="notice">${svg(I.share)}
      <div>Usá el botón <b>Compartir</b> de Claude, arriba a la derecha de la app. Elegí <b>Can view</b> para que sólo miren, o <b>Can edit</b> para que carguen reservas con vos.</div>

      <span class="hint">Quien lo abra entra derecho a <b>${esc(trip.name||"este viaje")}</b>.</span>
    </div>
    <button class="btn block" id="cpurl">${svg(I.copy)} Copiar link</button>
    <hr class="hr">
    <div class="f"><label for="sh_txt">Resumen para pegar en un chat</label>
      <textarea id="sh_txt" class="mono" style="min-height:130px" readonly>${esc(resumen)}</textarea></div>
    <button class="btn block" id="cptxt">${svg(I.copy)} Copiar resumen</button>
  `, `<button class="btn block" id="cancel">Cerrar</button>`);

  document.getElementById("cancel").onclick = closeSheet;
  const cp = async (text, msg)=>{
    try{ await navigator.clipboard.writeText(text); toast(msg); }
    catch(e){ toast("Copialo a mano desde el campo", true); }
  };
  document.getElementById("cpurl").onclick = ()=> cp(url, "Link copiado");
  document.getElementById("cptxt").onclick = ()=> cp(resumen, "Resumen copiado");
}

/* ---------- valija: detalle de un ítem (estado 11) ---------- */
function sheetPackingItem(trip, list, clave){
  const it = list.items[clave]; if(!it) return;
  const canWrite = Store.canWrite;
  const src = srcChip(it, trip);

  const stateHtml = `
    <div class="f">
      <label>Estado</label>
      <div class="pk-states">
        <button type="button" data-s="pendiente" aria-pressed="${it.estado==="pendiente"}"><span class="pk-state"></span> Pendiente</button>
        <button type="button" data-s="empacado" aria-pressed="${it.estado==="empacado"}"><span class="pk-state">${svg(I.check)}</span> Empacado</button>
        <button type="button" data-s="descartado" aria-pressed="${it.estado==="descartado"}"><span class="pk-state">${svg(I.dash)}</span> Descartado</button>
      </div>
      <span class="hint">Descartar no es lo mismo que dejarlo pendiente: me dice que este ítem no va. Si lo descartás en dos viajes del mismo tipo, dejo de sugerírtelo.</span>
    </div>`;

  const qtyHtml = (it.cantidad!=null) ? `
    <hr class="hr">
    <div class="f">
      <label>Cuántos llevás</label>
      <div class="pk-qty">
        <button type="button" id="pk-qty-minus" aria-label="Uno menos">${svg(I.minus)}</button>
        <span class="v" id="pk-qty-val">${esc(it.cantidad)}</span>
        <button type="button" id="pk-qty-plus" aria-label="Uno más">${svg(I.plus)}</button>
      </div>
    </div>` : "";

  const originHtml = `
    <hr class="hr">
    <div class="f">
      <label>De dónde sale</label>
      <div class="chips" style="margin:2px 0 4px"><span class="${src.cls}">${esc(src.tx)}</span></div>
      <p style="margin:0;font-size:13.5px;line-height:1.5">${esc(it.motivo || "Sin motivo declarado.")}</p>
    </div>`;

  let qty = it.cantidad;
  let estado = it.estado;

  openSheet(it.nombre, stateHtml + qtyHtml + originHtml,
    canWrite ? `<button class="btn ghost" id="cancel">Cancelar</button><button class="btn primary" id="save">Guardar</button>`
             : `<button class="btn block" id="cancel">Cerrar</button>`);

  document.getElementById("cancel").onclick = closeSheet;
  if(!canWrite) return;

  document.querySelectorAll(".pk-states [data-s]").forEach(b=>{
    b.onclick = ()=>{
      estado = b.dataset.s;
      document.querySelectorAll(".pk-states [data-s]").forEach(x=> x.setAttribute("aria-pressed", String(x.dataset.s===estado)));
    };
  });
  const qmin = document.getElementById("pk-qty-minus"), qpl = document.getElementById("pk-qty-plus"), qval = document.getElementById("pk-qty-val");
  if(qmin){
    qmin.onclick = ()=>{ qty = Math.max(0, (qty||0)-1); qval.textContent = qty; };
    qpl.onclick = ()=>{ qty = (qty||0)+1; qval.textContent = qty; };
  }

  document.getElementById("save").onclick = async ()=>{
    const fields = {};
    if(estado !== it.estado){
      fields.estado = estado;
      fields.empacadoEn = estado === "empacado" ? (it.empacadoEn || new Date().toISOString()) : null;
    }
    if(qty !== it.cantidad){
      fields.cantidad = qty; fields.cantidadEditada = true; fields.motivo = "Lo ajustaste vos.";
    }
    if(!Object.keys(fields).length){ closeSheet(); return; }
    const now = new Date().toISOString();
    fields.actualizadoEn = now;
    try{
      await Store.savePackingPatch(trip.id, { items:{ [clave]:fields }, actualizadaEn:now });
      closeSheet();
    }catch(e){ toast(writeErr(e), true); }
  };
}

/* ============================================================
   PDF — resumen de una página, tipo hoja de ruta
   ============================================================ */
async function exportPDF(trip){
  const items = Store.itemsOf(trip.id).slice()
    .sort((a,b)=> String(a.start||"zzz").localeCompare(String(b.start||"zzz")));
  const alerts = tripAlerts(trip, items);

  if(!window.jspdf){ toast("No se pudo cargar el generador de PDF", true); return; }
  toast("Armando el PDF…");

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"a4"});
  const W = 595.28, M = 44;
  let y = 0;

  const INK=[15,27,46], MUT=[84,99,124], ACC=[11,69,196], LINE=[215,222,233], CRIT=[190,50,39];
  const line = (yy)=>{ doc.setDrawColor(...LINE); doc.setLineWidth(.7); doc.line(M,yy,W-M,yy); };
  const page = ()=>{ doc.addPage(); y = M + 10; };
  const need = h => { if(y + h > 800){ page(); } };

  // Cabecera
  doc.setFillColor(...INK); doc.rect(0,0,W,104,"F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(24);
  doc.text(String(trip.name||"Viaje"), M, 50, {maxWidth:W-M*2-90});
  doc.setFont("courier","normal"); doc.setFontSize(10);
  const sub = [fmtRange(trip.startDate,trip.endDate), trip.destination, trip.travelers].filter(Boolean).join("  ·  ");
  doc.text(sub, M, 72, {maxWidth:W-M*2-90});
  doc.setFontSize(8); doc.setTextColor(160,175,200);
  doc.text("VALIJA", W-M, 40, {align:"right"});
  doc.text(`${items.length} reservas`, W-M, 54, {align:"right"});
  y = 136;

  // Pendientes primero: es lo accionable
  if(alerts.length){
    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...CRIT);
    doc.text(`PENDIENTES (${alerts.length})`, M, y); y += 15;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...MUT);
    alerts.slice(0,8).forEach(a=>{
      need(26);
      const t = doc.splitTextToSize(`•  ${a.t} — ${a.d}`, W-M*2);
      doc.text(t, M, y); y += t.length*12 + 2;
    });
    y += 10; line(y); y += 20;
  }

  // Itinerario
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...INK);
  doc.text("ITINERARIO", M, y); y += 16;

  if(!items.length){
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...MUT);
    doc.text("Todavía no hay reservas cargadas.", M, y);
  }

  let lastDay = null;
  items.forEach(it=>{
    need(88);
    const k = dayKey(it.start);
    if(k && k !== lastDay){
      lastDay = k;
      y += 6;
      doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(...ACC);
      doc.text(fmtDateLong(k).toUpperCase(), M, y);
      line(y+5); y += 20;
    }

    const T = TYPES[it.type] || TYPES.note;
    const t1 = fmtTime(it.start), t2 = fmtTime(it.end);

    doc.setFont("courier","normal"); doc.setFontSize(10); doc.setTextColor(...MUT);
    doc.text(t1 || "—:—", M, y);

    doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.setTextColor(...INK);
    doc.text(String(it.title || T.label), M+52, y, {maxWidth:W-M*2-60});

    doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...MUT);
    let meta = T.label.toUpperCase();
    if(it.provider) meta += `  ·  ${it.provider}`;
    if(t2) meta += `  ·  hasta ${t2}`;
    doc.text(meta, M+52, y+13, {maxWidth:W-M*2-60});
    y += 27;

    // talón de datos
    const stub = [];
    if(it.from || it.to) stub.push(["RUTA", `${it.from||"—"} → ${it.to||"—"}`]);
    if(it.flightNumber) stub.push(["VUELO", it.flightNumber]);
    if(it.confirmation) stub.push(["RESERVA", it.confirmation]);
    if(it.seat) stub.push(["ASIENTO", it.seat]);
    if(it.terminal) stub.push(["TERMINAL", it.terminal]);
    if(it.gate) stub.push(["PUERTA", it.gate]);
    if(it.address) stub.push(["DIRECCIÓN", it.address]);
    if(it.phone) stub.push(["TEL", it.phone]);
    if(it.cost) stub.push(["COSTO", `${it.currency||""} ${it.cost}`.trim()]);

    if(stub.length){
      let cx = M+52;
      doc.setFontSize(7);
      stub.forEach(([k2,v])=>{
        const wv = Math.max(doc.getTextWidth(String(v))+6, doc.getTextWidth(k2)+6);
        if(cx + wv > W-M){ cx = M+52; y += 24; need(30); }
        doc.setFont("helvetica","normal"); doc.setTextColor(...MUT);
        doc.text(k2, cx, y);
        doc.setFont("courier","normal"); doc.setFontSize(9); doc.setTextColor(...INK);
        doc.text(String(v).slice(0,42), cx, y+11);
        doc.setFontSize(7);
        cx += wv + 16;
      });
      y += 22;
    }

    const miss = missingFields(it);
    if(miss.length){
      doc.setFont("helvetica","italic"); doc.setFontSize(8); doc.setTextColor(...CRIT);
      doc.text(`Falta: ${miss.map(m=>m[1]).join(", ")}`, M+52, y);
      y += 13;
    }
    y += 10;
  });

  if(trip.notes){
    need(60); y += 6; line(y); y += 20;
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...INK);
    doc.text("NOTAS", M, y); y += 15;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...MUT);
    const t = doc.splitTextToSize(String(trip.notes), W-M*2);
    doc.text(t, M, y);
  }

  // pie en todas las páginas
  const total = doc.getNumberOfPages();
  for(let p=1;p<=total;p++){
    doc.setPage(p);
    doc.setFont("courier","normal"); doc.setFontSize(7.5); doc.setTextColor(...MUT);
    doc.text(`Valija  ·  ${new Date().toLocaleDateString("es-AR")}`, M, 815);
    doc.text(`${p} / ${total}`, W-M, 815, {align:"right"});
  }

  const safe = String(trip.name||"viaje").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase() || "viaje";
  const filename = `valija-${safe}.pdf`;
  const blob = doc.output("blob");

  let dl = null;
  try{ dl = await claude.use("downloads"); }catch(e){}
  if(dl){
    try{
      await dl.save({filename, data:blob});
      toast("PDF guardado");
    }catch(e){
      const c = e && e.code;
      if(c === "declined") return;
      if(c === "rate_limited"){ toast("Esperá un momento y probá de nuevo", true); return; }
      toast("No se pudo guardar el PDF", true);
    }
  } else {
    // sin la capacidad de descarga, imprimir es la salida a PDF del sistema
    toast("Usá Imprimir y elegí Guardar como PDF");
    try{ window.print(); }catch(e){}
  }
}
