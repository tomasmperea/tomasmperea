/* ---------- 01/02: selector de tipo de viaje (también "cambiar el tipo") ---------- */

/* Entrar al selector desde cualquier lado. Se limpia lo marcado a mano para
   que el selector abra mostrando lo que la lista dice HOY, y no lo que alguien
   tocó y canceló en una visita anterior. */
function pkAbrirSelectorDeTipo(){
  PK.pickingType = true; PK.selectedTypes = null; render();
}

function typeSelectorFab(trip, list){
  if(!list){
    return `<div class="fab"><button class="btn primary block" id="pk-build" ${Store.canWrite?"":"disabled"}>${svg(I.spark)} Armar la lista</button></div>`;
  }
  return `<div class="fab"><button class="btn block" id="pk-canceltype">Cancelar</button><button class="btn primary block" id="pk-confirmtype" ${Store.canWrite?"":"disabled"}>${svg(I.spark)} Rehacer la lista</button></div>`;
}

/* Qué le pasa a cada ítem cuando se rehace la lista. No es una promesa: sale
   de leer `mergeLists`, que es quien lo hace. Cada ítem cae en UN solo cajón,
   en este orden, para que los números sumen el total y no se pisen. */
function pkQueSeConserva(list){
  const c = { empacados:0, descartados:0, tuyos:0, sugeridos:0 };
  PackingEngine.itemsArray(list).forEach(it=>{
    if(!it) return;
    if(it.estado === "empacado")        c.empacados++;
    else if(it.estado === "descartado") c.descartados++;
    else if(it.origen === "manual")     c.tuyos++;
    else                                c.sugeridos++;
  });
  return c;
}

function pkKeepHtml(list){
  const c = pkQueSeConserva(list);
  const filas = [
    [c.empacados,   `${c.empacados===1?"empacado":"empacados"} — <b>se ${c.empacados===1?"queda":"quedan"}</b>, y ${c.empacados===1?"sigue":"siguen"} empacado${c.empacados===1?"":"s"}`, false],
    [c.descartados, `${c.descartados===1?"descartado":"descartados"} — <b>se ${c.descartados===1?"queda":"quedan"}</b> descartado${c.descartados===1?"":"s"}, no ${c.descartados===1?"vuelve":"vuelven"}`, false],
    [c.tuyos,       `que agregaste vos — <b>se ${c.tuyos===1?"queda":"quedan"}</b>`, false],
    [c.sugeridos,   `sugerido${c.sugeridos===1?"":"s"} sin marcar — <b>se ${c.sugeridos===1?"recalcula":"recalculan"}</b>`, true]
  ].filter(f=> f[0] > 0);
  if(!filas.length) return "";
  return `<div class="pk-keep">${filas.map(([n,txt,va])=>
    `<div class="pk-keep-row${va?" va":""}"><span class="n">${n}</span><span class="d">${txt}</span></div>`
  ).join("")}</div>`;
}

function renderTypeSelector(trip, list){
  $hdr.innerHTML = packingHeader(trip, null, {info:false});
  bindPackingHeader(trip);

  const items = Store.itemsOf(trip.id);
  const ctx = PackingEngine.tripContext(trip, items, {});
  /* La sugerencia del motor es un string canónico y puede ser "mixto" a secas,
     que quiere decir "no tengo pistas". Eso NO se puede marcar en la grilla:
     `typePartsPickable` lo deja en []. */
  const suggested = ctx.tripType;
  const sugeridas = typePartsPickable(suggested);

  /* Lo marcado. `PK.selectedTypes` es null mientras nadie tocó nada; una vez
     tocado es el array vivo, y puede quedar vacío si se destildan las dos. */
  const marcadas = PK.selectedTypes
    || (list ? typePartsPickable(list.tipoViaje) : sugeridas);
  const lleno = marcadas.length >= TOPE_TIPOS;

  const [, toCode] = routeCodes(trip, items);
  const chips = [
    toCode ? `<span class="chip accent">${esc(toCode)}</span>` : "",
    `<span class="chip">${esc(fmtRange(trip.startDate, trip.endDate))}</span>`,
    `<span class="chip">${ctx.days} ${ctx.days===1?"día":"días"}</span>`,
    trip.travelers ? `<span class="chip">${esc(trip.travelers)}</span>` : ""
  ].filter(Boolean).join("");

  /* Dos cuentas distintas y cada una dice lo suyo:
       · porTipo  — en cuántos viajes tuyos aparece ESTE tipo, solo o combinado.
                    Es lo que dice el número chiquito de cada botón.
       · porCombo — cuántos viajes tuyos son de ESTA misma combinación.
                    Hasta VAL-77a era la muestra entera de `learnFromHistory`;
                    desde VAL-77b el aprendizaje también lee los viajes que
                    comparten una parte, así que es una parte de la muestra.
                    Los avisos de abajo la usan para decir "de esa misma
                    combinación", que sigue siendo cierto. */
  const counts = PK.typeCounts || { porTipo:{}, porCombo:{} };
  const muestraDe = partes => {
    const k = PackingEngine.canonicalTripType(partes);
    return (k && counts.porCombo[k]) || 0;
  };

  /* "Mixto" sale de la grilla: no es un tipo, es la ausencia de uno. Sigue
     existiendo como valor guardado (VAL-77a, decisión 3). */
  const rows = PackingEngine.TRIP_TYPES.filter(t=> t.key !== "mixto").map(t=>{
    const n = counts.porTipo[t.key];
    const pressed = marcadas.indexOf(t.key) >= 0;
    /* Con dos marcadas las demás se APAGAN, no se van: sacar opciones de la
       pantalla es peor que mostrarlas sin poder tocarlas. */
    const apagada = lleno && !pressed;
    return `<button type="button" aria-pressed="${pressed}" ${apagada?`aria-disabled="true"`:""} class="${n?"used":""}" data-t="${t.key}">
      ${svg(I[TYPE_ICON[t.key]])} ${esc(t.label)} <span class="n">${n?`${n} ${n===1?"viaje":"viajes"}`:"—"}</span>
      <span class="pick">${svg(I.check)}</span></button>`;
  }).join("");

  const hint = marcadas.length >= TOPE_TIPOS
    ? `Con dos alcanza. Tocá una de nuevo para sacarla; si el viaje es de tres cosas, elegí las dos que más pesan y el resto lo agregás a mano.`
    : `Tocá una. Si el viaje es de <b>dos cosas</b>, tocá la segunda y sumo las dos listas.`;

  /* El aviso de abajo, uno solo, en este orden:
       · rehacer     — hay lista y hay algo marcado: qué se conserva y qué no
       · divergencia — lo marcado no cubre lo que propuse
       · combinación — dos marcadas
       · propuesta   — una marcada, y es la que propuse
       · sin marcar  — nada marcado: qué va a pasar si igual armás */
  const lblMarcadas = typeLabel(marcadas);
  /* La etiqueta de la sugerencia sale de `sugeridas` —las partes marcables—,
     no de `suggested`, que puede traer "mixto". Si dijera "Mixto", el botón
     "Usar mixto" prometería marcar algo que la grilla no tiene. Las dos ramas
     que la usan sólo corren cuando `sugeridas` no está vacía. */
  const lblSugeridas = typeLabel(sugeridas);
  const motivo = ctx.tripTypeReason || "por el destino y las fechas del viaje.";
  const nMarcadas = muestraDe(marcadas);
  const nSugeridas = muestraDe(sugeridas);
  const divergente = sugeridas.length && !sugeridas.every(p=> marcadas.indexOf(p) >= 0);

  let aviso = "";
  if(list && marcadas.length){
    aviso = `<div class="notice warn">${svg(I.info)}<span class="bd"><b>Rehago la lista con ${esc(lblMarcadas.toLowerCase())}.</b> Nada de lo tuyo se pierde:</span></div>
      ${pkKeepHtml(list)}`;
  } else if(marcadas.length && divergente){
    aviso = `<div class="notice warn">${svg(I.info)}
      <span class="bd">Con <b>${esc(lblMarcadas)}</b> ${nMarcadas ? `tengo ${nMarcadas} ${nMarcadas===1?"viaje tuyo":"viajes tuyos"} de esa misma combinación` : "arranco casi de cero"}. En <b>${esc(lblSugeridas)}</b> ${nSugeridas ? `ya tengo ${nSugeridas}` : "no tengo ninguno"}: ${esc(motivo)}
        <button class="act" id="pk-usesugg">Usar ${esc(lblSugeridas.toLowerCase())}</button></span>
    </div>`;
  } else if(marcadas.length >= TOPE_TIPOS){
    aviso = `<div class="notice">${svg(I.mix)}<span class="bd"><b>${esc(lblMarcadas)}.</b> Sumo las dos listas: entra lo que pide cada una, en la misma valija.${nMarcadas ? ` Ya armaste ${nMarcadas} ${nMarcadas===1?"valija":"valijas"} de esa combinación.` : ""}</span></div>`;
  } else if(marcadas.length){
    aviso = `<div class="notice">${svg(I.spark)}<span class="bd">Te propongo <b>${esc(lblMarcadas)}</b>: ${esc(motivo)}${nMarcadas ? ` Ya usaste ese tipo en ${nMarcadas} ${nMarcadas===1?"viaje":"viajes"} anteriores.` : ""}</span></div>`;
  } else if(sugeridas.length){
    aviso = `<div class="notice">${svg(I.info)}<span class="bd">No marcaste ninguna. Si armás así uso lo que te propongo, <b>${esc(lblSugeridas)}</b>: ${esc(motivo)}</span></div>`;
  } else {
    /* La sugerencia del motor fue "mixto" a secas: no hay pistas. Se dice, con
       el motivo del motor, y no se inventa un tipo. */
    aviso = `<div class="notice warn">${svg(I.info)}<span class="bd">No tengo pistas para proponerte un tipo: ${esc(motivo)} Elegí de qué es el viaje y afino la lista; si no elegís ninguna armo una lista mixta, como hasta ahora.</span></div>`;
  }

  $main.innerHTML = `
    <div class="pk-inputs">${chips}</div>
    ${!list ? `<div class="empty" style="padding:24px 20px">
      <h3>Todavía no armaste la valija</h3>
      <p>Te propongo qué llevar según el destino, las fechas, los días que te quedás y lo que agregaste a mano en viajes del mismo tipo. Todo lo que sugiera lo podés sacar.</p>
    </div>` : ""}
    <div class="f">
      <label>Tipo de viaje</label>
      <div class="tp tp3" id="pk-tp">${rows}</div>
      <span class="hint">${hint}</span>
    </div>
    ${aviso}
  `;

  $fab.innerHTML = typeSelectorFab(trip, list);

  document.querySelectorAll("#pk-tp [data-t]").forEach(b=>{
    b.onclick = ()=>{
      const t = b.dataset.t;
      const cur = marcadas.slice();
      const i = cur.indexOf(t);
      if(i >= 0) cur.splice(i, 1);
      /* El tope también acá, y no sólo en el CSS: `pointer-events:none` frena
         el dedo, no el Enter de un teclado sobre el botón enfocado. */
      else if(cur.length < TOPE_TIPOS) cur.push(t);
      else return;
      PK.selectedTypes = cur;
      render();
    };
  });
  const useSugg = document.getElementById("pk-usesugg");
  if(useSugg) useSugg.onclick = ()=>{ PK.selectedTypes = sugeridas.slice(); render(); };

  /* Sin nada marcado se manda `null` y el motor vuelve a sugerir: el resultado
     guardado es el mismo que antes de esta iteración, y el motivo queda siendo
     el de verdad en vez de "Lo elegiste al generar la lista". */
  const elegido = () => marcadas.length ? PackingEngine.canonicalTripType(marcadas) : null;

  if(!list){
    const build = document.getElementById("pk-build");
    if(build && Store.canWrite){
      build.onclick = ()=>{ const t = elegido(); PK.selectedTypes = null; runGenerate(trip, t, null); };
    }
  } else {
    const cancel = document.getElementById("pk-canceltype");
    const confirm = document.getElementById("pk-confirmtype");
    if(cancel) cancel.onclick = ()=>{ PK.pickingType = false; PK.selectedTypes = null; render(); };
    if(confirm && Store.canWrite){
      confirm.onclick = ()=>{ const t = elegido(); PK.pickingType = false; PK.selectedTypes = null; runGenerate(trip, t, list); };
    }
  }

  if(!PK.typeCounts){
    Store.packingHistory(trip.id).then(hist=>{
      const porTipo = {}, porCombo = {};
      hist.forEach(l=>{
        if(!l || !l.tipoViaje) return;
        const canon = PackingEngine.canonicalTripType(l.tipoViaje);
        if(!canon) return;
        porCombo[canon] = (porCombo[canon]||0)+1;
        typeParts(canon).forEach(p=>{ porTipo[p] = (porTipo[p]||0)+1; });
      });
      PK.typeCounts = { porTipo, porCombo };
      if(PK.tripId===trip.id) render();
    });
  }
}

/* ---------- 04/06/07/08/09/10: la lista, en todos sus estados ---------- */
function renderPackingBoard(trip, list){
  const canWrite = Store.canWrite;
  const generating = PK.generating;
  const cap = list.capaInteligente || {};

  const degradedChip = (!generating && (cap.estado==="no-disponible" || cap.estado==="error"))
    ? `<span class="chip">sin ajuste por destino</span>` : "";
  const readonlyChip = !canWrite ? `<span class="chip soon">sólo lectura</span>` : "";

  $hdr.innerHTML = packingHeader(trip, list)
    + `<div class="hdr-sub">${pkProgHtml(list)}${degradedChip}${readonlyChip}</div>`
    + pkTripLineHtml(trip, list);
  bindPackingHeader(trip, ()=> sheetPackingInfo(trip, list));
  /* El listener se ata en cada render porque `$hdr.innerHTML` se reescribe
     entero: el botón de antes ya no existe, así que no queda nada colgado. */
  const typeBtn = document.getElementById("pk-typebtn");
  if(typeBtn && canWrite) typeBtn.onclick = ()=> pkAbrirSelectorDeTipo();

  const destino = trip.destination || "tu destino";

  // 15/16 · el plan pendiente. Si resolvió con la pantalla ya abierta entra por
  // abajo (dock) y no corre la lista bajo el pulgar; si no, arriba de la lista.
  const planPend = canWrite ? planOfrecible(trip.id) : planDe(trip.id);
  const planDock = (canWrite && planPend && App.planDock) ? planPend : null;
  const planArriba = planDock ? null : planPend;

  // 25 · un solo aviso arriba de la lista, siempre. La regla vive en una sola
  // función para que no se rompa sola cuando aparezca el sexto aviso.
  /* VAL-79 · un viaje que ya tiene un vuelo a otro lado recibe la pregunta
     arriba de la valija, Y el aviso de siempre sigue debajo. La primera
     versión la ponía EN LUGAR del aviso (por la regla 25, un aviso arriba de
     la lista) y las regresiones de VAL-85 y VAL-77b lo volteaban: el aviso de
     lo aprendido desaparecía en un viaje a Mendoza con un vuelo a Bariloche
     hasta que alguien contestara. Lo que se veía antes, se sigue viendo. El
     diseño que aprobó el PM (panel 4) ya mostraba los dos. Sin permiso de
     edición la pregunta no se muestra: no hay cómo contestarla. */
  const dvPend = (canWrite && !generating) ? dvPendienteDeLaValija(trip) : null;
  const notices = generating
    ? `<div class="notice"><span class="spin"></span><span class="bd">Buscando lo específico de ${esc(destino)}…</span></div>`
    : (dvPend ? dvPreguntaHtml(dvPend, true, dvPend.vueloId) : "") + packingNotice(trip, list, planArriba);

  const grouped = PackingEngine.groupByCategory(list, {includeDismissed:true});
  const groups = grouped.map(g=> pkCategoryHtml(g, trip, canWrite, list));
  const destGroupExists = grouped.some(g=>g.key==="destino");

  const skeletonCat = (generating && !destGroupExists) ? `
    <div class="pk-cat" data-open="true">
      <div class="pk-cat-hd">
        <span class="pk-cat-ico">${svg(I.globe)}</span>
        <span class="nm">Específicos de ${esc(destino)}</span>
        <span class="cnt sk" style="width:38px;height:12px;border-radius:5px;display:inline-block"></span>
        ${svg(I.chevd,"chev")}
      </div>
      <div class="pk-body-wrap">
        <div class="pk-row loading"><span class="sk" style="width:52%"></span><span class="sk" style="width:74%"></span></div>
        <div class="pk-row loading"><span class="sk" style="width:41%"></span><span class="sk" style="width:66%"></span></div>
        <div class="pk-row loading"><span class="sk" style="width:58%"></span><span class="sk" style="width:47%"></span></div>
      </div>
    </div>` : "";

  $main.innerHTML = notices + groups.join("") + skeletonCat;
  $main.querySelectorAll("[data-dvop][data-dvvuelo]").forEach(b=>{
    b.onclick = ()=>{ b.disabled = true; dvContestarEnValija(trip, b.dataset.dvvuelo, b.dataset.dvop); };
  });

  if(canWrite && !generating){
    $fab.innerHTML = `<div class="fab"><button class="btn primary block" id="pk-additem">${svg(I.plus)} Agregar ítem</button></div>`;
    document.getElementById("pk-additem").onclick = ()=> sheetAddPackingItem(trip, list);
  } else {
    $fab.innerHTML = "";
  }

  pkRenderDock(trip, planDock);

  bindPackingRows($main, trip, list, canWrite);
  bindPackingNotice($main, trip, list);
  bindPackingNotice($pkdock, trip, list);
  pkObserveNew($main);

  const closeFresh = document.getElementById("pk-closefresh");
  if(closeFresh) closeFresh.onclick = ()=>{ PK.justEnriched = false; render(); };
  const retry = document.getElementById("pk-retry");
  if(retry) retry.onclick = ()=> runGenerate(trip, list.tipoViaje, list);
}

/* ---------- 25 · UN SOLO AVISO ARRIBA DE LA LISTA ----------
   Devuelve el HTML del PRIMER aviso que aplique, en este orden:
     1 · la lista quedó vieja (15/24) o el acuse de aplazada (19)
     2 · sin ajuste por destino (08)
     3 · sumé N cosas (18)                — confirmación de lo recién aplicado
     3b· ajusté la lista al destino (07)  — la misma familia que el 3
     4 · hay N que capaz no necesitás (20)
     5 · valija lista (09)
     5b· esta lista dice "mixto" y no sé de qué dos (VAL-77a)
     6 · sólo lectura, cuando no queda nada más que decir

   El plan va PRIMERO, invirtiendo el orden de la tabla del diseño. El motivo:
   `capaInteligente.estado` vive en el documento guardado, así que el aviso
   degradado no se va nunca hasta que se regenere la lista. Siendo permanente
   y estático, bloquearía para siempre a un aviso puntual y accionable. Entre
   "no pude ajustar la lista al destino" —una advertencia sobre la calidad de
   algo que ya está— y "el viaje cambió y tengo tres cosas para sumarte" —una
   acción concreta con fecha— gana la segunda. El costo, asumido: "Probar de
   nuevo" queda un toque más lejos mientras haya un plan sin resolver, y
   vuelve apenas se aplica o se toca "Ahora no", que además es persistente.

   Lo que no se muestra no se pierde: la hoja 12 lista siempre todo lo
   pendiente, y las marcas en las filas son independientes del aviso. */
function packingNotice(trip, list, plan){
  const canWrite = Store.canWrite;
  const cap = list.capaInteligente || {};
  const c = PackingEngine.packingProgress(list);
  const destino = trip.destination || "tu destino";
  const quitar = pkPropuestasQuitar(list);
  const nq = quitar.length;
  const verQuitarSec = nq
    ? `<button class="act sec" data-pk="verquitar">Y hay <b class="n">${nq}</b> que capaz no necesitás. Verlas</button>`
    : "";

  // 1 · la lista quedó vieja (15), o su variante sin acciones (24)
  if(plan){
    const n = planCuentas(plan).total;
    if(!canWrite){
      const forma = pkFormaAprendida(plan);
      const {suma, saca} = planCuentas(plan);
      const cosas = k => `<b class="n">${k}</b> ${k===1?"cosa":"cosas"}`;
      if(forma === "suma"){
        return `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Por lo que se agregó a mano en otros viajes, hay ${cosas(n)} para sumarle. Las puede sumar quien tenga permiso de edición.</span></div>`;
      }
      if(forma === "saca"){
        return `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Por lo que se descartó en otros viajes, hay ${cosas(n)} para sacarle. Las puede sacar quien tenga permiso de edición.</span></div>`;
      }
      if(forma === "ambas"){
        return `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Por lo que se agregó a mano y se descartó en otros viajes, hay ${cosas(suma)} para sumarle y ${cosas(saca)} para sacarle. Las puede cambiar quien tenga permiso de edición.</span></div>`;
      }
      return `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Quedó vieja: el viaje cambió después de que se armó, y hay <b class="n">${n}</b> ${n===1?"cosa":"cosas"} sin actualizar. Las puede actualizar quien tenga permiso de edición.</span></div>`;
    }
    return `<div class="notice">${svg(I.spark)}<span class="bd">${planAvisoTexto(plan)}
      <span class="acts">
        <button class="act" data-pk="verplan">${planVerQue(plan)}</button>
        <button class="act sec" data-pk="ahorano">Ahora no</button>
      </span></span></div>`;
  }

  // 19 · acuse de "Ahora no", de una sola visita. No queda badge ni insistencia.
  // Ocupa el mismo lugar que el aviso que reemplaza: es la respuesta al gesto
  // que la persona acaba de hacer.
  if(PK.avisoAplazado && canWrite){
    const p = PK.avisoAplazado;
    const n = planCuentas(p).total;
    const r = planReserva(p);
    const soloSaca = planCuentas(p).saca && !planCuentas(p).suma;
    return `<div class="notice">${svg(I.info)}<span class="bd">Listo, no toco nada. ${n===1?`La <b class="n">una</b> cosa`:`Las <b class="n">${n}</b> cosas`}${r?` ${esc(pkDeReserva(r))}`:""} ${soloSaca?"que te propuse sacar quedan":"quedan"} guardadas en <b>De dónde sale esta lista</b>, arriba a la derecha, por si ${soloSaca?"cambiás de idea":"después las querés"}.
      <span class="acts"><button class="act" data-pk="verplan">Verlas igual</button></span></span></div>`;
  }

  // 2 · sin ajuste por destino
  if(cap.estado==="no-disponible" || cap.estado==="error"){
    return `<div class="notice warn">${svg(I.info)}<span class="bd">Armé la lista con las reglas de siempre. No pude ajustarla a ${esc(destino)}, así que puede faltarte algo del lugar.
      ${canWrite?`<button class="act" id="pk-retry">Probar de nuevo</button>`:""}</span></div>`;
  }

  // 3 · sumé N cosas (18). Cerrar la confirmación ES confirmar (§ 4.3).
  if(PK.applied && canWrite && pkItemsNuevos(list).length){
    const n = PK.appliedN;
    /* Y lo que se SACÓ, que hasta la v33 el cartel se callaba. Lo vio el PM en
       su teléfono: un plan de 14 para sumar y 10 para sacar se aplicó, la lista
       pasó de 41 ítems a 44, y el único cartel decía "Sumé 14 cosas". Los 10
       que se fueron no los nombró nadie.

       El toast de `aplicarPlan` no lo cubría porque dispara sólo cuando el plan
       es SÓLO sacar — el caso que yo había probado con el dedo. El mixto, que
       es el más común cuando cambia el destino, quedaba mudo sobre la mitad de
       lo que hizo. Es la misma clase de error que el barrido de textos: arreglé
       la instancia que estaba mirando. */
    const saco = PK.appliedSaca;
    const yTambien = saco ? ` y saqué <b class="n">${saco}</b> que ya no ${saco===1?"correspondía":"correspondían"}` : "";
    return `<div class="notice ok">${svg(I.check2)}<span class="bd">Sumé <b class="n">${n}</b> ${n===1?"cosa":"cosas"}${PK.appliedReserva?` por <b>${esc(PK.appliedReserva)}</b>`:""}${yTambien}. Quedan marcadas hasta que las mires.
      <span class="acts"><button class="act sec" data-pk="vistas">Listo, ya las vi</button>${verQuitarSec}</span></span>
      <button class="x" aria-label="Cerrar" data-pk="vistas">${svg(I.x)}</button></div>`;
  }

  // 3b · ajusté la lista al destino (07). Único texto existente que cambia:
  // cuando la misma pasada además propuso sacar, suma la segunda acción.
  if(PK.justEnriched && cap.estado==="ok"){
    return `<div class="notice ok">${svg(I.spark)}<span class="bd">${esc(cap.nota||"Ajusté la lista al destino.")}
      ${verQuitarSec?`<span class="acts">${verQuitarSec}</span>`:""}</span>
      <button class="x" aria-label="Cerrar" id="pk-closefresh">${svg(I.x)}</button></div>`;
  }

  // 4 · hay N que capaz no necesitás (20). Se cierra por visita, no para
  // siempre: es un localizador, y las marcas siguen en las filas.
  if(nq && !PK.hideRemovals){
    return `<div class="notice warn">${svg(I.ban)}<span class="bd">Hay <b class="n">${nq}</b> ${nq===1?"cosa":"cosas"} de la lista que capaz no necesitás en ${esc(destino)}.
      <button class="act" data-pk="verquitar">Ver ${nq===1?"cuál":"cuáles"}</button></span>
      <button class="x" aria-label="Cerrar" data-pk="cerrarquitar">${svg(I.x)}</button></div>`;
  }

  // 5 · valija lista (09)
  if(c.total>0 && c.pendientes===0){
    const typeLbl = typeLabel(list.tipoViaje).toLowerCase();
    return `<div class="notice ok">${svg(I.check2)}<span class="bd">Valija lista.${c.descartados?` Los ${c.descartados} que descartaste ya quedaron anotados para tu próximo viaje${typeLbl?` de ${typeLbl}`:""}.`:""}</span></div>`;
  }

  /* 5b · VAL-77a · la lista que dice "mixto" y no sabe de qué dos cosas.
     No se adivina: se pregunta, y mientras tanto la lista sigue funcionando
     exactamente igual que antes — "mixto" es un valor válido y matchea las
     mismas reglas.

     POR QUÉ VA ACÁ ABAJO Y NO ARRIBA, que es donde lo puse primero: este
     aviso es PERMANENTE hasta que se cambie el tipo. Arriba tapaba a los
     avisos puntuales de un gesto que la persona acababa de hacer —lo destapó
     `val75-sacar-con-el-dedo`, donde "Sumé 1 y saqué 1" dejó de verse—, que
     es exactamente el motivo por el que el plan se adelantó al degradado.
     Acá abajo no tapa nada accionable, y el chip ámbar del renglón del viaje
     está siempre, que es de donde de verdad se cambia el tipo (VAL-76).

     Y LA CRUZ, que el muestrario no dibujaba: siendo permanente, sin cruz
     sería insistencia. Cerrarlo dura la visita, como el aviso 20. */
  if(canWrite && !PK.hideMixtoAsk && esMixtoSinDefinir(list.tipoViaje)){
    return `<div class="notice warn">${svg(I.info)}<span class="bd">Esta valija dice <b>mixto</b> y no sé de qué dos cosas. Decímelo y afino la lista; mientras tanto sigue funcionando igual.
      <button class="act" data-pk="elegirtipos">Elegir las dos</button></span>
      <button class="x" aria-label="Cerrar" data-pk="cerrarmixto">${svg(I.x)}</button></div>`;
  }

  // 6 · sólo lectura
  if(!canWrite){
    return `<div class="notice">${svg(I.info)}<span class="bd">Estás viendo la valija de este viaje. Para marcar lo tuyo necesitás permiso de edición.</span></div>`;
  }
  return "";
}

/* ---------- 16 · el aviso anclado al pie ----------
   Sólo se reescribe cuando cambia de verdad: #pkdock es la región viva y
   volver a pintarla en cada render la haría anunciarse una y otra vez. */
function pkRenderDock(trip, plan){
  const firma = plan ? `${trip.id}|${planFirma(plan)}` : "";
  if($pkdock.dataset.firma === firma) return;
  $pkdock.dataset.firma = firma;
  $pkdock.innerHTML = plan ? `<div class="pk-dock"><div class="notice">${svg(I.spark)}<span class="bd">${planAvisoTexto(plan)}
    <span class="acts">
      <button class="act" data-pk="verplan">${planVerQue(plan)}</button>
      <button class="act sec" data-pk="ahorano">Ahora no</button>
    </span></span></div></div>` : "";
}

/* ---------- las acciones de los avisos, en cualquiera de sus dos anclajes ---------- */
function bindPackingNotice(root, trip, list){
  if(!root) return;
  root.querySelectorAll("[data-pk]").forEach(b=> b.onclick = ()=>{
    const a = b.dataset.pk;
    const plan = planDe(trip.id) || PK.avisoAplazado;
    if(a==="verplan"){ if(plan) sheetPackingPlan(trip, plan); return; }
    if(a==="ahorano"){ if(plan) aplazarPlan(trip, plan); return; }
    if(a==="vistas"){ pkDarPorVistas(trip); return; }
    if(a==="verquitar"){ sheetPackingRemovals(trip); return; }
    if(a==="cerrarquitar"){ PK.hideRemovals = true; render(); return; }
    if(a==="elegirtipos"){ pkAbrirSelectorDeTipo(); return; }
    if(a==="cerrarmixto"){ PK.hideMixtoAsk = true; render(); return; }
  });
}

/* ---------- despachador de estados ---------- */
function renderPacking(trip){
  resetPKIfNeeded(trip.id);
  const list = Store.packingOf(trip.id);
  const hasDates = !!(trip.startDate && trip.endDate);

  if(!list && !hasDates && !PK.pickingType){ pkRenderDock(trip, null); renderPackingBlocked(trip); return; }
  if((!list && hasDates) || PK.pickingType){ pkRenderDock(trip, null); renderTypeSelector(trip, list); return; }
  // Acá ya hay viaje y hay lista: es el único punto donde se puede saber si la
  // lista quedó vieja sin datos a medio llegar. El propio recálculo se cuida de
  // correr una sola vez por viaje y por sesión.
  recalcularPlanAlEntrar(trip.id);
  renderPackingBoard(trip, list);
}

const $modal = document.getElementById("modal");

function openSheet(title, bodyHtml, footHtml){
  $modal.innerHTML = `
    <div class="scrim" id="scrim">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="sheet-hd">
          <h2>${esc(title)}</h2>
          <button class="iconbtn" id="closeSheet" aria-label="Cerrar">${svg(I.x)}</button>
        </div>
        <div class="sheet-bd">${bodyHtml}</div>
        ${footHtml?`<div class="sheet-ft">${footHtml}</div>`:""}
      </div>
    </div>`;
  document.getElementById("closeSheet").onclick = closeSheet;
  document.getElementById("scrim").addEventListener("click", e=>{ if(e.target.id==="scrim") closeSheet(); });
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

/** Un cartel. Con `alTocar`, se puede tocar y lleva a algún lado.

    Por qué existe la tercera forma: VAL-63 mostraba "Tengo N cosas para sumarte
    a la valija" y ahí se terminaba. El PM lo probó en su teléfono el 19/09 y el
    resultado fue peor que no avisar — el cartel aparecía TARDE, porque
    preguntarle al modelo tarda segundos y él ya se había ido a otra pantalla, y
    encima no llevaba a ningún lado. Un aviso que no sabe dónde estás y que no
    se puede tocar es un callejón.

    El que se puede tocar dura más: 2,6 segundos alcanzan para leer "Reserva
    guardada", no para decidir si te interesa ir a ver algo. */
function toast(msg, err, alTocar){
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="toast ${err?"err":""}${alTocar?" tocable":""}"${alTocar?' role="button" tabindex="0"':""}>${esc(msg)}${alTocar?` <b class="ver">Ver</b>`:""}</div>`;
  if(alTocar){
    const caja = t.firstElementChild;
    const ir = ()=>{ t.innerHTML=""; alTocar(); };
    caja.onclick = ir;
    caja.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); ir(); } };
  }
  /* CADA CARTEL SÓLO SE BORRA A SÍ MISMO.

     Antes el reloj hacía `t.innerHTML=""` sin mirar qué había adentro, así que
     un cartel viejo mataba al que lo había reemplazado. Se veía justo acá: al
     guardar el viaje salía "Viaje actualizado" (2,6 s) y un rato después
     "Tengo N cosas para sumarte" (7 s), pero a los 2,6 s el reloj del primero
     borraba al segundo. El aviso duraba lo que le quedaba al anterior.

     Lo destapó el arnés de VAL-63 al exigir que el cartel se pudiera tocar:
     el texto quedaba registrado —había aparecido— pero el elemento ya no
     estaba. Es un defecto viejo, de cualquier par de carteles seguidos; VAL-63
     sólo lo hizo visible porque es el primer caso donde el segundo importa
     más que el primero. */
  const mio = t.firstElementChild;
  setTimeout(()=>{ if(t.firstElementChild === mio) t.innerHTML=""; }, err?4200:(alTocar?7000:2600));
}
const val = id => (document.getElementById(id)?.value || "").trim();

/* ---------- viaje ---------- */
function sheetTrip(trip){
  const t = trip || {id:uid(), hue: Math.floor(Math.random()*360)};
  openSheet(trip?"Editar viaje":"Nuevo viaje", `
    <div class="f req"><label for="t_name">Nombre del viaje</label>
      <input id="t_name" value="${esc(t.name||"")}" placeholder="Vacaciones en el sur" autocomplete="off"></div>
    <div class="f"><label for="t_dest">Destino principal</label>
      <input id="t_dest" value="${esc(t.destination||"")}" placeholder="Bariloche" autocomplete="off">
      <span class="hint">Se usa en la etiqueta de la valija y en el PDF.</span></div>
    <div class="f2">
      <div class="f"><label for="t_from">Salida</label><input id="t_from" type="date" value="${esc(dayKey(t.startDate))}"></div>
      <div class="f"><label for="t_to">Regreso</label><input id="t_to" type="date" value="${esc(dayKey(t.endDate))}"
        ${t.startDate?`min="${esc(addDays(t.startDate,1))}"`:""}></div>
    </div>
    <div class="f"><label for="t_people">Quiénes viajan</label>
      <input id="t_people" value="${esc(t.travelers||"")}" placeholder="Tomás, Ana y Juli" autocomplete="off"></div>
    <div class="f"><label for="t_notes">Notas</label>
      <textarea id="t_notes" placeholder="Presupuesto, ideas, links sueltos...">${esc(t.notes||"")}</textarea></div>
    ${trip?`<hr class="hr"><button class="btn danger block" id="deltrip">${svg(I.trash)} Eliminar este viaje</button>`:""}
  `, `
    <button class="btn ghost" id="cancel">Cancelar</button>
    <button class="btn primary" id="save">Guardar</button>
  `);

  document.getElementById("cancel").onclick = closeSheet;
  // Elegir la salida limita el calendario de regreso ahí mismo: es mejor que el
  // día inválido no se pueda elegir, a explicar después por qué no sirve.
  const fIni = document.getElementById("t_from"), fFin = document.getElementById("t_to");
  if(fIni && fFin) fIni.onchange = ()=>{
    if(!fIni.value){ fFin.removeAttribute("min"); return; }
    fFin.min = addDays(fIni.value, 1);
    if(fFin.value && fFin.value <= fIni.value) fFin.value = "";
  };
  document.getElementById("save").onclick = async ()=>{
    const name = val("t_name");
    if(!name){ toast("Poné un nombre al viaje", true); return; }
    const from = val("t_from"), to = val("t_to");
    if(from && to && to <= from){ toast("El regreso tiene que ser después de la salida", true); return; }
    const guardado = {...t, name, destination:val("t_dest"),
      startDate:from, endDate:to, travelers:val("t_people"), notes:val("t_notes"), sample:t.sample||false};
    /* VAL-63: ¿este cambio mueve la valija? Se decide ACÁ, antes de guardar,
       porque después de `Store.saveTrip` los valores viejos ya no existen. */
    const mueveLaValija = !!trip && cambioQueMueveLaValija(t, guardado);
    try{
      await Store.saveTrip(guardado);
      closeSheet();
      if(!trip) go(`#/trip/${t.id}`);
      toast(trip?"Viaje actualizado":"Viaje creado");
      /* Y recién acá, con la hoja ya cerrada: `checkPackingPlan` habla con el
         modelo y tarda. Va sin `await` por lo mismo que en la hoja de la
         reserva — el aviso entra cuando resuelve, no traba el guardado.

         Y AVISA. Los otros cuatro disparadores pintan su aviso adentro de la
         pantalla de la valija, que es donde la persona ya está mirando. Acá
         no: acaba de cambiar una fecha desde la pantalla del viaje y se va a
         ir a otro lado. Sin este toast el plan queda esperándola adentro de la
         valija y ella no se entera de que pasó algo — que es exactamente el
         síntoma que VAL-63 vino a arreglar, con otro disfraz.

         Silencio cuando no hay nada que ofrecer: cambiar una fecha y que la
         lista ya esté bien no es una novedad. */
      if(mueveLaValija) checkPackingPlan(guardado).then(plan=>{
        if(!plan || !planCuentas(plan).total) return;
        toast(planAviso(plan), false, ()=> go(`#/trip/${guardado.id}/valija`));
      }).catch(()=>{});
    }catch(e){ toast(writeErr(e), true); }
  };
  const dl = document.getElementById("deltrip");
  if(dl) dl.onclick = async ()=>{
    dl.disabled = true;
    try{ await Store.delTrip(t.id); closeSheet(); go(""); toast("Viaje eliminado"); }
    catch(e){ dl.disabled = false; toast(writeErr(e), true); }
  };
}

/** Traduce un error de escritura de la base a algo que la persona pueda usar.

    `invalid_argument` NO significa "sólo lectura". La base lo devuelve al
    menos por dos motivos distintos: que quien mira no puede escribir, y que
    el documento se pasó del tope de 256 KiB. Este mensaje elegía uno de los
    dos y lo afirmaba.

    Lo encontró la auditoría de VAL-74 el 19/09 siguiendo el hilo de qué vería
    la persona si la lista se pasaba del tope: le habría dicho "tenés acceso de
    sólo lectura" a alguien que es dueño de su propia valija. Una causa
    inventada, que es justo lo que este proyecto tiene prohibido por escrito.

    Ahora dice lo que pasó —no se pudo guardar— y ofrece las dos salidas
    posibles sin decidir cuál es. Si más adelante la base distingue los casos,
    acá es donde se separan. */
function writeErr(e){
  if(e && e.code === "invalid_argument")
    return "No se pudo guardar. Puede ser que estés mirando una valija que no es tuya, o que esto ya no entre por tamaño";
  if(e && e.code === "quota_exceeded") return "La valija llegó a su límite de reservas";
  // Quedó guardado en este teléfono aunque no haya podido sincronizar: decirlo
  // evita que la persona cargue todo de nuevo pensando que se perdió.
  return "Guardado en este dispositivo. No se pudo sincronizar todavía";
}

/* ---------- VAL-80 · la ruta de un vuelo que no trae códigos ----------

   El campo dejó de comer letras (se le sacó el `maxlength="4"`), así que
   ahora "SUECIA" se guarda entero. Lo que no puede pasar es que se guarde
   entero Y EN SILENCIO: la guarda del motor lo va a tratar como pista, no
   como destino, y eso hay que decirlo donde la persona lo escribe.

   NO BLOQUEA EL GUARDADO, y es una decisión, no una omisión: con la guarda
   del motor un `to` que no es código ya funciona —viaja al modelo entero y
   con sus fechas—, así que impedir guardar sería tirar un dato válido para
   cobrarse un formato. Se avisa y se guarda.

   LO QUE EL AVISO NO DICE: que el destino del viaje "sigue siendo el que
   escribiste". Sería falso en cuanto haya otro vuelo del mismo viaje con un
   código de verdad — ése manda y el escrito pasa a contexto. El aviso afirma
   sólo lo que vale siempre: con esto no se puede fijar el destino.

   Las dos pantallas que escriben una ruta preguntan acá: el formulario
   manual (`sheetItem`) y la de revisar lo importado (`renderReview`). El
   aviso al lado del campo es el mismo en las dos; el cartel al guardar es
   sólo de la primera, y eso se decidió leyendo cada pantalla:

     · `sheetItem` CIERRA la hoja al guardar, así que el aviso que estaba al
       lado del campo desaparece justo cuando se confirma. Ahí hace falta el
       cartel, y reemplaza al "Reserva guardada".
     · `renderReview` tiene el botón de guardar en el pie de la MISMA hoja
       donde está la tarjeta: el aviso está a la vista en el momento del
       toque. Y su cierre ya tiene cinco ramas contando documentos adjuntos,
       reservas sin comprobante y vuelos completados; meterle un cartel más
       sería pisar uno de ésos (ver el comentario de `toast`). */
function rutaSinCodigo(from, to){
  const malos = [];
  const mirar = (rotulo, v)=>{
    const s = String(v==null?"":v).trim();
    if(s && !PackingEngine.esCodigoIATA(s)) malos.push({rotulo, valor:s});
  };
  mirar("Origen", from); mirar("Destino", to);
  return malos;
}
/** El aviso largo, el que vive debajo de los campos de la ruta.

    VAL-87: decía "todavía no sé traducir el nombre de una ciudad", y con el
    buscador de aeropuertos eso pasó a ser falso. Ahora dice lo que pasó (lo
    escrito no es un aeropuerto de la lista), qué se hace con eso (va como
    pista) y qué hacer para fijar el destino (elegir una opción). La LÓGICA no
    cambió: `rutaSinCodigo` sigue preguntando lo mismo que la guarda del motor. */
function avisoRutaHtml(from, to){
  const malos = rutaSinCodigo(from, to);
  if(!malos.length) return "";
  const cuales = malos.map(m=>`${m.rotulo} dice <b>${esc(m.valor)}</b>`).join(" y ");
  const uno = malos.length === 1;
  return `<div class="notice warn">${svg(I.info)}<span class="bd">${cuales}, que no ${uno?"es un aeropuerto":"son aeropuertos"}
    de mi lista. Lo guardo tal como está y se lo mando entero a la valija como pista, pero con eso no
    puedo fijar el destino del viaje. Para fijarlo, escribí la ciudad y elegí una de las opciones, o
    escribí el código de tres letras del aeropuerto.</span></div>`;
}
/** La misma cosa en un renglón, para el cartel que sale al guardar. */
function avisoRutaToast(from, to){
  const malos = rutaSinCodigo(from, to);
  if(!malos.length) return "";
  const cuales = malos.map(m=>`«${m.valor}»`).join(" y ");
  return `Guardado. ${cuales} no ${malos.length>1?"son códigos":"es un código"} de aeropuerto de tres letras: ${malos.length>1?"van":"va"} como pista y con eso no puedo fijar el destino del viaje.`;
}

/* ============================================================
   CIUDAD O AEROPUERTO — VAL-87 · el campo de origen y destino del vuelo

   Un solo componente para las DOS pantallas que escriben la ruta de un
   vuelo: el formulario manual (`sheetItem`) y la revisión de lo importado
   (`cardFieldsHtml` y `vueloNuevoCardHtml`). El 17/09 el PM reportó por dos
   gestos y el arreglo cubrió uno; por eso no hay una versión por pantalla.

   Lo que se LEE es la ciudad; lo que se GUARDA es el código. El código vive
   en `data-cod` del campo mientras haya una elección; escribir encima la
   borra (un campo que dice "Bariloch" no puede seguir guardando BRC).

   Qué se guarda de lo que quedó escrito sin tocar ninguna opción lo decide
   UNA función, `apResolver`, y es la tabla del brief:
     · tres letras del dato ("eze")  → el código en mayúsculas, se ve la ciudad
     · tres letras fuera del dato    → el código en mayúsculas, con la línea
                                       "no está en mi lista"
     · cualquier otra cosa           → tal cual, sin mayúsculas forzadas, y el
                                       aviso de VAL-80
     · nada                          → nada
   "Tres letras" es `PackingEngine.esCodigoIATA`: la misma pregunta que hace
   la guarda del motor (VAL-80). Si cada lado tuviera su regla, el campo
   podría guardar como código algo que el motor trata como pista.

   `marcar` y `apListaHtml` son del bloque E de app/parts/aeropuerto-ui.html.
   Adaptado al integrar, y dicho acá para que no parezca un descuido:
     · cada opción lleva `data-cod`, que es lo que se guarda al tocarla;
     · el ícono sale de `I.planeSmall` (es el mismo trazo que PLANE);
     · la lista aparece desde dos caracteres, no desde uno;
     · `apCampoHtml` del muestrario recibía "?texto" para dibujar el estado
       "escribiendo" con el foco pintado a mano. Acá el estado es el del campo
       de verdad, y la función recibe lo GUARDADO más cómo se identifica el
       campo en cada pantalla (`id` en el formulario, `data-f` en la revisión).
   ============================================================ */

/** Marca en el acento las palabras que empiezan con lo escrito. Trabaja
    sobre el texto sin tildes para encontrar, y corta el original para
    mostrar: "cordoba" marca "Córd…" con su tilde. */
function marcar(texto, consulta, norm){
  var ts = norm(consulta).split(" ").filter(Boolean);
  if(!ts.length) return esc(texto);
  return String(texto).split(/(\s+|-)/).map(function(w){
    var n = norm(w), t = ts.filter(function(t){return n.indexOf(t)===0})[0];
    if(!t) return esc(w);
    var k = 0, hasta = 0;            // cuántos caracteres del original cubren t
    while(hasta < w.length && k < t.length){ if(norm(w[hasta])) k++; hasta++; }
    return "<mark>"+esc(w.slice(0,hasta))+"</mark>"+esc(w.slice(hasta));
  }).join("");
}
/** La lista. Función pura: resultados y lo escrito → HTML. */
function apListaHtml(res, consulta, norm){
  var q = String(consulta).trim();
  /* El aviso de "código que no tengo" NO va acá. La primera versión lo
     mostraba cuando lo escrito tenía tres letras y ninguna fila era ese
     código, y salía debajo de Londres con "lon": mientras se escribe, tres
     letras son tanto un código como el comienzo de una ciudad, y la lista
     no puede distinguirlos. Va en el campo, DESPUÉS de dejarlo (apMarcaHtml). */
  if(!res.length){
    return '<div class="ap-lista" role="listbox"><div class="ap-vacio">No encontré un aeropuerto con <b>'+esc(q)+
      '</b>. Si lo dejás así, lo guardo tal cual'+(/^[A-Za-z]{3}$/.test(q) ? ': si es un código, como código; si no, ' : ' y va ')+
      'a la valija como pista.</div></div>';
  }
  return '<ul class="ap-lista" role="listbox">'+res.map(function(a,i){
    var segunda = [a.aeropuerto, a.pais].filter(Boolean);
    return '<li><button type="button" class="ap-op" role="option" aria-selected="'+(i===0)+'" data-cod="'+esc(a.code)+'">'+
      '<span class="ic">'+svg(I.planeSmall)+'</span>'+
      '<span class="tx"><span class="ci">'+marcar(a.ciudad, consulta, norm)+'</span>'+
      '<span class="ae">'+segunda.map(function(s){return marcar(s, consulta, norm)}).join(" · ")+'</span></span>'+
      '<span class="cod">'+esc(a.code)+'</span></button></li>';
  }).join("")+'</ul>';
}

/** Lo que se guarda para un texto, sin que nadie haya elegido nada. Es la
    tabla del brief, y la única que la aplica: la usan el campo al salir, la
    lectura al guardar, la reserva que se abre y lo que devolvió el modelo.
    `aero` es el aeropuerto del dato o null — un código fuera del dato sigue
    siendo un código, y no inventa ciudad. */
function apResolver(texto){
  const t = String(texto==null ? "" : texto).trim();
  if(!t) return {guarda:"", aero:null, codigo:false};
  if(PackingEngine.esCodigoIATA(t)){
    const cod = t.toUpperCase();
    return {guarda:cod, aero:Aeropuertos.porCodigo(cod), codigo:true};
  }
  return {guarda:t, aero:null, codigo:false};
}
/** Lo que se ve en el campo: la ciudad si el código está en el dato; si no,
    lo guardado (el código solo, o el texto como se escribió). */
const apVisible = r => r.aero ? r.aero.ciudad : r.guarda;
/** El sello del código y, si el dato no lo tiene, la línea que lo dice. */
function apMarcaHtml(r){
  if(!r.codigo) return "";
  return `<span class="ap-sello">${esc(r.guarda)}</span>` + (r.aero ? "" :
    `<div class="hint ap-hint">${esc(r.guarda)} no está en mi lista de aeropuertos. Lo guardo como código igual.</div>`);
}
/** El campo, dibujado sobre lo GUARDADO. `opts.id` (formulario manual) o
    `opts.f` (revisión de lo importado) es cómo lo encuentra cada pantalla. */
function apCampoHtml(rotulo, valor, opts){
  const r = apResolver(valor);
  const ident = opts.id ? `id="${esc(opts.id)}"` : `data-f="${esc(opts.f)}" aria-label="${esc(rotulo)}"`;
  return `<div class="f${opts.req?" req":""} ap" data-ap="1">` +
    `<label${opts.id?` for="${esc(opts.id)}"`:""}>${esc(rotulo)}</label>` +
    `<input ${ident} value="${esc(apVisible(r))}"${r.codigo?` data-cod="${esc(r.guarda)}"`:""} placeholder="Ciudad o aeropuerto" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">` +
    apMarcaHtml(r) + `</div>`;
}
/** Lo que el campo guarda AHORA. No depende de que el campo se haya dejado:
    tocar Guardar con "eze" escrito guarda EZE igual que si se hubiera salido. */
function apValor(inp){
  if(!inp) return "";
  return inp.dataset.cod || apResolver(inp.value).guarda;
}
/** Para el aviso de VAL-80: el campo que se está escribiendo no cuenta todavía.
    Mientras se escribe "bari" la lista ya dice qué pasa; el aviso aparece al
    salir del campo, que es cuando la tabla del brief dice qué se guarda. */
function apValorParaAviso(inp){
  return (inp && inp.dataset.editando) ? "" : apValor(inp);
}
/** Lo que va después del campo: sello, línea del código y, si `conLista`, la
    lista. Se rehace entero; el campo en sí no se toca, para no perder el
    foco ni lo que el teclado del teléfono esté componiendo. */
function apRepintar(wrap, conLista){
  const inp = wrap.querySelector("input");
  wrap.querySelectorAll(".ap-sello, .ap-hint, .ap-lista").forEach(n=> n.remove());
  let html = inp.dataset.cod ? apMarcaHtml(apResolver(inp.dataset.cod)) : "";
  if(conLista && Aeropuertos.norm(inp.value).length >= 2)
    html += apListaHtml(Aeropuertos.buscar(inp.value, 5), inp.value, Aeropuertos.norm);
  inp.insertAdjacentHTML("afterend", html);
}
/** Salir del campo sin tocar ninguna opción: se aplica la tabla. */
function apConfirmar(wrap){
  const inp = wrap.querySelector("input");
  if(!inp.dataset.editando && !wrap.querySelector(".ap-lista")) return;   // sólo pasó el foco
  delete inp.dataset.editando;
  if(!inp.dataset.cod){
    /* VAL-92 · decisión del PM (07/10): salir del campo con UNA sola opción en
       la lista la toma. Escribió «aeroparqu», tocó afuera y quedó lo escrito
       con Aeroparque solo en pantalla. Con varias, queda lo escrito: tomar Bari
       en vez de Bariloche sin querer sería peor.
       EXCEPTO tres letras. «toj» trae una sola opción —Tojo Una-Una, en
       Indonesia— y la tabla de VAL-87 dice que tres letras que el dato no
       tiene se guardan como código. Si la opción única ganara, alguien que
       escribió el código de Torrejón terminaría con un vuelo a Indonesia. */
    const ops = wrap.querySelectorAll(".ap-op");
    const r = (ops.length === 1 && !PackingEngine.esCodigoIATA(inp.value))
      ? apResolver(ops[0].dataset.cod) : apResolver(inp.value);
    if(r.codigo){ inp.dataset.cod = r.guarda; inp.value = apVisible(r); }
  }
  apRepintar(wrap, false);
}
/** Tocar una opción. */
function apElegir(wrap, cod){
  const inp = wrap.querySelector("input");
  const r = apResolver(cod);
  if(!r.codigo) return;
  inp.value = apVisible(r);
  inp.dataset.cod = r.guarda;
  delete inp.dataset.editando;
  apRepintar(wrap, false);
  // Con teclado se llega a la opción con Tab, y la opción acaba de borrarse:
  // el foco vuelve al campo en vez de perderse en el documento.
  if(document.activeElement !== inp) inp.focus();
}

/* AL SALIR DEL CAMPO LA LISTA SE CIERRA, Y ESO ACHICA LA HOJA. Si se cierra
   en el mismo instante en que el dedo baja sobre otra cosa —"Sale", el botón
   de adjuntar, la cruz de la tarjeta de abajo—, lo de abajo sube unos 280 px
   antes de que el dedo se levante, y el toque cae sobre otro elemento o en
   ningún lado. Entonces lo que cambia el alto espera a que se suelte el
   botón (el del mouse, o el que el navegador del teléfono simula después
   del toque), y corre recién después del click que ese gesto produce. */
const apPendientes = [];
let apBotonAbajo = false, apReloj = null;
function apVaciar(){
  clearTimeout(apReloj); apReloj = null;
  const fs = apPendientes.splice(0);
  if(fs.length) setTimeout(()=> fs.forEach(f=> f()), 0);
}
function apDespues(fn){
  apPendientes.push(fn);
  if(!apBotonAbajo) apVaciar();
  else if(!apReloj) apReloj = setTimeout(apVaciar, 800);   // un botón que nunca se suelta no deja el campo colgado
}
document.addEventListener("mousedown", ()=>{ apBotonAbajo = true; }, true);
document.addEventListener("mouseup", ()=>{ apBotonAbajo = false; apVaciar(); }, true);

/** Engancha un campo. `alCambiar` repinta el aviso de VAL-80 de la pantalla.
    Los listeners cuelgan del propio campo: cuando la pantalla se redibuja,
    el nodo viejo se va con los suyos y el nuevo se engancha de nuevo. */
function apEnganchar(wrap, alCambiar){
  if(!wrap || wrap.dataset.apVivo) return;
  wrap.dataset.apVivo = "1";
  const inp = wrap.querySelector("input");
  const avisar = ()=>{ if(typeof alCambiar === "function") alCambiar(); };
  inp.addEventListener("input", ()=>{
    delete inp.dataset.cod;            // editar después de elegir borra la elección
    inp.dataset.editando = "1";
    apRepintar(wrap, true);
    avisar();
  });
  /* VAL-92 · Enter elige la opción marcada y las flechas mueven la marca.
     La primera opción ya se dibujaba marcada (`aria-selected`) y el teclado no
     la podía accionar: la marca afirmaba algo que no era cierto.
     Con tres letras que ninguna opción tiene como código («toj»), Enter no
     elige: vale la tabla de VAL-87, igual que al salir del campo. */
  inp.addEventListener("keydown", e=>{
    if(e.isComposing) return;
    const ops = [...wrap.querySelectorAll(".ap-op")];
    if(!ops.length) return;
    const i = Math.max(0, ops.findIndex(b=> b.getAttribute("aria-selected") === "true"));
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      const j = (i + (e.key === "ArrowDown" ? 1 : -1) + ops.length) % ops.length;
      ops.forEach((b, k)=> b.setAttribute("aria-selected", String(k === j)));
      ops[j].scrollIntoView({block:"nearest"});
      return;
    }
    if(e.key === "Enter"){
      const t = inp.value.trim();
      if(PackingEngine.esCodigoIATA(t) && !ops.some(b=> b.dataset.cod === t.toUpperCase())) return;
      e.preventDefault();
      apElegir(wrap, ops[i].dataset.cod);
      avisar();
    }
  });
  // Tocar una opción no le saca el foco al campo: si se lo sacara, la lista
  // se cerraría antes de que llegue el click de la opción.
  wrap.addEventListener("mousedown", e=>{ if(e.target.closest(".ap-op")) e.preventDefault(); });
  wrap.addEventListener("click", e=>{
    const b = e.target.closest(".ap-op");
    if(!b || !wrap.contains(b)) return;
    apElegir(wrap, b.dataset.cod);
    avisar();
  });
  wrap.addEventListener("focusout", e=>{
    if(e.relatedTarget && wrap.contains(e.relatedTarget)) return;   // va a una opción, con Tab
    apDespues(()=>{
      if(!wrap.isConnected || wrap.contains(document.activeElement)) return;
      apConfirmar(wrap);
      avisar();
    });
  });
}

/* ============================================================
   VAL-79 · CUANDO EL VUELO VA A OTRO LADO, LA APP PREGUNTA
   Brief: docs/briefs/destino-del-vuelo.md. Diseño aprobado el 07/10.

   La respuesta se guarda EN EL VUELO —`destinoDecision`— junto con el
   destino al que se contestó —`destinoDecisionPara`—: si después se cambia
   el destino del vuelo, la respuesta vieja no vale para el nuevo y la
   pregunta vuelve. El motor lee "suma" y "escala" en `destinosDelViaje`;
   "cambia" además pasa el destino escrito del viaje a la ciudad del vuelo.
   ============================================================ */
const DV = {CAMBIA:"cambia", SUMA:"suma", ESCALA:"escala"};
/** La respuesta de un vuelo, si es para el destino que tiene ahora. */
function dvRespuesta(v){ return PackingEngine.decisionDelVuelo(v); }   // una sola regla, la del motor
/** ¿Este vuelo va a otro lado que el destino escrito? Devuelve
    {escrito, ciudad, codigo} o null. Las condiciones son las del brief:
    hay destino escrito; el vuelo va a un código del dato; se puede afirmar
    que son lugares distintos (sólo `false` pregunta); y no es la vuelta a casa. */
function dvEvaluar(trip, vuelo, items){
  const escrito = String((trip && trip.destination) || "").trim();
  if(!escrito || !vuelo) return null;
  const to = String(vuelo.to || "").trim();
  if(!PackingEngine.esCodigoIATA(to)) return null;
  const aero = Aeropuertos.porCodigo(to);
  if(!aero) return null;
  /* VAL-79, ronda 2 (PM, 09/10): sólo cuando se puede AFIRMAR que son lugares
     distintos (`false`). La primera versión preguntaba también cuando no se
     sabía (`null`: «Patagonia» con BRC), y el PM lo marcó como fricción. Sin
     saber, la valija sugiere para los dos, que es lo que pasa sin respuesta. */
  if(PackingEngine.coincidenLugares(escrito, to) !== false) return null;
  /* Casa es de donde sale el primer vuelo, por fecha. Sin fechas no hay
     "primero": se pregunta de más, que es el lado seguro. */
  const vuelos = (items || []).filter(f=> f && f.type === "flight" && f.id !== vuelo.id).concat([vuelo])
    .filter(f=> String(f.start || "").trim())
    .sort((a, b)=> String(a.start).localeCompare(String(b.start)));
  const casa = vuelos.length ? String(vuelos[0].from || "").trim() : "";
  if(casa && PackingEngine.coincidenLugares(to, casa) === true) return null;
  return {escrito, ciudad:aero.ciudad, codigo:to.toUpperCase()};
}
function dvPreguntaHtml(p, enValija, vueloId){
  const ops = [
    [DV.CAMBIA, `El viaje ahora es a ${esc(p.ciudad)}`, ""],
    [DV.SUMA, "Voy a los dos lugares", ""],
    [DV.ESCALA, "Es una escala", "no cuenta para la valija"]];
  return `<div class="notice dv-preg" role="group" aria-label="Destino del vuelo">${svg(I.info)}<span class="bd">` +
    `<b class="q">${enValija
      ? `Tenés un vuelo a ${esc(p.ciudad)} y el viaje dice ${esc(p.escrito)}.`
      : `Tu viaje dice ${esc(p.escrito)} y este vuelo va a ${esc(p.ciudad)}.`}</b>` +
    (enValija ? "Mientras no me digas, sugiero para los dos lugares. ¿Qué pasó?" : "¿Qué pasó?") +
    `<span class="dv-ops">${ops.map(([k, tx, nota])=>
      `<button type="button" class="btn sm${nota ? " con-nota" : ""}" data-dvop="${k}"${vueloId ? ` data-dvvuelo="${esc(vueloId)}"` : ""}>${tx}${nota ? `<small>${nota}</small>` : ""}</button>`).join("")}</span>` +
    (enValija ? "" : `<span class="dv-nota">Si no contestás ahora, te lo pregunto en la valija.</span>`) +
    `</span></div>`;
}
/** Lo que la respuesta hizo. "Saca" y "sugiere" se dicen sólo si hay una
    valija armada: sin lista no hay nada que sacar ni que sugerir. */
function dvListoTexto(k, p, hayLista){
  /* "Te va a proponer sacar", no "saca": el plan se propone y lo aplica la
     persona, y lo empacado no se toca (VAL-75). La primera versión decía
     "saca" y la auditoría lo marcó: es lo que el PM lee para decidir. */
  if(k === DV.CAMBIA) return `Listo: el viaje pasa a ser a <b>${esc(p.ciudad)}</b>.` +
    (hayLista ? ` La valija te va a proponer sacar lo que era para ${esc(p.escrito)} y no empacaste.` : "");
  if(k === DV.SUMA) return `Listo: el viaje es a <b>${esc(p.escrito)} y ${esc(p.ciudad)}</b>.` +
    (hayLista ? " La valija sugiere para los dos." : "");
  return "Listo: este vuelo es una <b>escala</b>. No cuenta para la valija.";
}
/** `alGuardar`: en el formulario y al importar, la respuesta se aplica
    recién al tocar Guardar, y la línea lo dice. En la valija se aplica al
    tocar y no hace falta. */
function dvListoHtml(k, p, hayLista, alGuardar){
  return `<div class="notice ok">${svg(I.check)}<span class="bd">${dvListoTexto(k, p, hayLista)}` +
    (alGuardar ? " Se aplica al guardar." : "") + " " +
    `<button type="button" class="act" data-dvop="" style="display:inline;margin:0 0 0 4px">Cambiar</button></span></div>`;
}
/** El primer vuelo del viaje que todavía necesita respuesta, para la valija. */
function dvPendienteDeLaValija(trip){
  const items = Store.itemsOf(trip.id);
  const vuelos = items.filter(f=> f.type === "flight" && !dvRespuesta(f))
    .sort((a, b)=> String(a.start || "").localeCompare(String(b.start || "")));
  for(const f of vuelos){
    const p = dvEvaluar(trip, f, items);
    if(p) return Object.assign(p, {vueloId:f.id});
  }
  return null;
}
/** Contestar desde la valija se aplica al tocar: no hay un Guardar después. */
async function dvContestarEnValija(trip, vueloId, k){
  const items = Store.itemsOf(trip.id);
  const f = items.find(x=> x.id === vueloId);
  if(!f || !k) return;
  const p = dvEvaluar(trip, f, items);
  try{
    await Store.saveItem(trip.id, Object.assign({}, f, {destinoDecision:k, destinoDecisionPara:f.to}));
    const actual = Store.trips.get(trip.id) || trip;
    if(k === DV.CAMBIA && p){
      await Store.saveTrip(Object.assign({}, actual, {destination:p.ciudad}));
      trip.destination = p.ciudad;
    }
    if(p) toast(dvListoTexto(k, p, !!Store.packingOf(trip.id)).replace(/<[^>]+>/g, ""));
    checkPackingPlan(Store.trips.get(trip.id) || trip);
  }catch(e){ toast(writeErr(e), true); }
}
